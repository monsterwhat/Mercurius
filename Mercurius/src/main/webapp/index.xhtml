<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      class="#{ThemeController.currentTheme}">
    
<h:head>
    <title>Inicio de Sesion</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css"/>
    <meta charset="utf-8" name="viewport" content="width=device-width, initial-scale=1"/>
    
    <style>
        body, html {
            height: 100%;
            margin: 0;
        }
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
        }
        .login-panel {
            max-width: 400px;
            width: 100%;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 5px;
        }
        .full-width {
            width: 100%;
        }
        .login-panel button {
            display: block;
            width: 100%;
        }
        @media (max-width: 480px) {
            .login-panel {
                max-width: 100%;
            }
        }
    </style>
</h:head>
    
<h:body>
    <div class="container">
        <h:form rendered="#{not SessionController.isValid()}" >
            <p:panel styleClass="login-panel">
                <p:graphicImage value="/resources/imgs/logo/Mercurius.png" alt="Imagen" rendered="#{SettingsController.logo eq null}"/>
                <p:graphicImage value="#{SettingsController.logo}" alt="Imagen" stream="false" rendered="#{SettingsController.logo != null}"/>

                <p:growl id="growl" showDetail="true" showSummary="false" />
                <h:panelGrid columns="1" styleClass="full-width">
                    <p:inputText id="username" value="#{SessionController.username}" required="true" requiredMessage="El usuario no puede estar vacío" placeholder="Nombre de Usuario" styleClass="full-width"/>
                    <p:password id="password" value="#{SessionController.password}" required="true" requiredMessage="La contraseña no puede estar vacía" placeholder="Contraseña" styleClass="full-width"/>
                </h:panelGrid>
                <p:commandButton value="Iniciar Sesión" action="#{SessionController.executeLogin}" ajax="false" styleClass="ui-button-raised ui-button-success"/>
            </p:panel>
        </h:form>

        <h:form rendered="#{SessionController.isValid()}">
            <p:panel styleClass="box has-text-centered">
                <div class="columns">
                    <div class="column">
                        <h:outputLabel for="message" value="¡Oops! " />
                        <h:outputLabel for="message" value=" ¡Ya iniciaste sesión!" />
                    </div>
                </div>
                <div class="columns buttons">
                    <p:button styleClass="button is-rounded is-success" value="Menú Principal" href="/Mercurius/secured/"/>
                    <p:commandButton styleClass="button is-rounded is-danger" value="Cerrar Sesión" actionListener="#{SessionController.logOut}"/>
                </div>
            </p:panel>
        </h:form>
    </div>
        
    <footer class="footer">
        <div class="columns is-centered">
            <div class="column is-half">
                <div class="container">
                    <a href="https://github.com/monsterwhat/Mercurius">
                    <figure class="image is-128x128">
                            <img src="https://github.com/monsterwhat/Mercurius/raw/Master/Mercurius.png"/>
                    </figure>
                    <p class="title">Mercurius</p>
                    </a>
                </div>
            </div>
        </div>
    </footer>
        
</h:body>

</html>
