<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <h:head>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css"/>
        <meta charset="utf-8" name="viewport" content="width=device-width, initial-scale=1"/>
    </h:head>
    <h:body>
        <h:form id="MainMenu">
            <div class="columns is-mobile buttons">
                <div class="column">
                    <p:commandButton id="FacturacionButton" value="Facturación" styleClass="button is-rounded is-primary is-fullwidth"
                                     icon="pi pi-shopping-cart" rendered="#{SessionController.facturacion}"/>
                    <p:menu overlay="true" trigger="FacturacionButton" my="left top" at="left bottom">
                        <p:submenu label="Facturación">
                            <p:menuitem value="Crear Facturas" icon="pi pi-cart-plus" disabled="true"/>
                        </p:submenu>
                    </p:menu>
                </div>
                <div class="column">
                    <p:commandButton id="InventariosButton" value="Inventarios" 
                                     styleClass="button is-rounded is-info is-fullwidth" 
                                     icon="pi pi-box" rendered="#{SessionController.inventarios}"/>
                    <p:menu overlay="true" trigger="InventariosButton" my="left top" at="left bottom">
                        <p:submenu label="Inventarios">
                            <p:menuitem value="Ver Departamentos" icon="pi pi-truck" action="#{ViewController.selectViewDepartamentos}"/>
                            <p:menuitem value="Ver Familias" icon="pi pi-th-large" action="#{ViewController.selectViewFamilias}"/>
                        </p:submenu>
                        <p:submenu label="Movimientos">
                            <p:menuitem value="Ajustes Actuales" icon="pi pi-check-circle" url="/secured/pages/Inventario/AjustesActuales.xhtml"/>
                            <p:menuitem value="Ajustes Pendientes" icon="pi pi-hourglass" url="/secured/pages/Inventario/AjustesPendientes.xhtml"/>
                            <p:menuitem value="Ajustes Activos" icon="pi pi-check" url="/secured/pages/Inventario/AjustesActivos.xhtml"/>
                            <p:menuitem value="Ajustes Inactivos" icon="pi pi-times" url="/secured/pages/Inventario/AjustesInactivos.xhtml"/>
                        </p:submenu>
                        <p:submenu label="Artículos">
                            <p:menuitem value="Catalogo Actual" icon="pi pi-check-circle" url="/secured/pages/Articulos/catalogoActual.xhtml"/>
                            <p:menuitem value="Catalogo Pendiente" icon="pi pi-hourglass" url="/secured/pages/Articulos/catalogoPendiente.xhtml"/>
                            <p:menuitem value="Artículos Activos" icon="pi pi-check" url="/secured/pages/Articulos/ArticulosActivos.xhtml"/>
                            <p:menuitem value="Artículos Inactivos" icon="pi pi-times" url="/secured/pages/Articulos/ArticulosInactivos.xhtml"/>
                        </p:submenu>
                    </p:menu>
                </div>
                <div class="column">
                    <p:commandButton id="UsuariosButton" value="Usuarios" 
                                     styleClass="button is-rounded is-link is-fullwidth" 
                                     icon="pi pi-user" rendered="#{SessionController.usuarios}"/>
                    <p:menu overlay="true" trigger="UsuariosButton" my="left top" at="left bottom">
                        <p:submenu label="Usuarios">
                            <p:menuitem value="Ver Usuarios" icon="pi pi-users" action="#{ViewController.selectViewUsers}"/>
                            <p:menuitem value="Ver Clientes" icon="pi pi-id-card" action="#{ViewController.selectViewClients}"/>
                        </p:submenu>
                    </p:menu>
                </div>
                <div class="column">
                    <p:commandButton id="TributacionButton" value="Tributación" 
                                     styleClass="button is-rounded is-danger is-fullwidth" 
                                     icon="pi pi-money-bill" rendered="#{SessionController.tributacion}"/>
                    <p:menu overlay="true" trigger="TributacionButton" my="left top" at="left bottom">
                        <p:submenu label="Tributación">
                            <p:menuitem value="Consultas" icon="pi pi-book" disabled="true"/>
                            <p:menuitem value="CaByS" icon="pi pi-book" action="#{ViewController.selectViewCabys}"/>
                            <p:menuitem value="Tipo de Cambio" icon="pi pi-dollar" onclick="PF('dollarValueDialog').show();"/>
                        </p:submenu>
                    </p:menu>
                    <ui:include src="../fragments/Monedas/DollarValueDialog.xhtml" />
                </div>
                <div class="column">
                    <p:commandButton id="RegistrosButton" value="Registros" 
                                     styleClass="button is-rounded is-warning is-fullwidth" 
                                     icon="pi pi-book" rendered="#{SessionController.registros}"/>
                    <p:menu overlay="true" trigger="RegistrosButton" my="left top" at="left bottom" collision="fit">
                        <p:submenu label="Reportes Facturación">
                            <p:menuitem value="Facturación Diaria" icon="pi pi-calendar" disabled="true"/>
                            <p:menuitem value="Facturación de Artículos" icon="pi pi-box" disabled="true"/>
                            <p:menuitem value="Facturas Ingresadas" icon="pi pi-box" action="#{ViewController.selectViewFacturas()}"/>
                        </p:submenu>
                        <p:submenu label="Reportes Inventarios">
                            <p:menuitem value="Articulos Detallados" action="#{ViewController.selectViewArticulosDetallado()}" icon="pi pi-search"/>
                            <p:menuitem value="Departamentos Detallados" action="#{ViewController.selectViewDepartamentosDetallado()}" icon="pi pi-search"/>
                            <p:menuitem value="Familias Detalladas" action="#{ViewController.selectViewFamiliasDetallado()}" icon="pi pi-search"/>
                            <p:menuitem value="Inventarios Detallados" action="#{ViewController.selectViewInventarioDetallado()}" icon="pi pi-search"/>
                            <p:menuitem value="Generar Etiquetas" icon="pi pi-ticket" rendered="false" disabled="true"/>
                        </p:submenu>
                        <p:submenu label="Reportes de Usuarios">
                            <p:menuitem value="Usuarios Detallados" action="#{ViewController.selectViewUsersDetallados()}" icon="pi pi-search"/>
                        </p:submenu>
                    </p:menu>
                </div>
            </div>
        </h:form>
    </h:body>
</ui:composition>
