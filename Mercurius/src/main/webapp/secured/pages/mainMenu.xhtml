<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
   
    <h:body>
        <p:card styleClass="ui-panel ui-widget ui-widget-content ui-corner-all">
            <h:form id="MainMenu">
            <div class="ui-g">
                <div class="ui-g-12 ui-md-3">
                    <p:commandButton id="FacturacionButton" value="Facturación" style="width: 100%"
                                     styleClass="ui-button-rounded ui-button-primary" 
                                     icon="pi pi-shopping-cart" rendered="#{SessionController.facturacion}"/>
                    <p:menu overlay="true" trigger="FacturacionButton" my="left top" at="left bottom">
                        <p:submenu label="Facturación">
                            <p:menuitem value="Crear Facturas" icon="pi pi-cart-plus" disabled="true"/>
                        </p:submenu>
                    </p:menu>
                </div>
                <div class="ui-g-12 ui-md-2">
                    <p:commandButton id="InventariosButton" value="Inventarios" style="width: 100%"
                                     styleClass="ui-button-rounded ui-button-info" 
                                     icon="pi pi-box" rendered="#{SessionController.inventarios}"/>
                    <p:menu overlay="true" trigger="InventariosButton" my="left top" at="left bottom">
                        <p:submenu label="Inventarios">
                            <p:menuitem value="Ver Departamentos" icon="pi pi-truck" url="/secured/pages/Departamentos/index"/>
                            <p:menuitem value="Ver Familias" icon="pi pi-th-large" url="/secured/pages/Familias/index"/>
                        </p:submenu>
                        <p:submenu label="Movimientos">
                            <p:menuitem value="Ajustes Actuales" icon="pi pi-check-circle" url="/secured/pages/Inventario/AjustesActuales"/>
                            <p:menuitem value="Ajustes Pendientes" icon="pi pi-hourglass" url="/secured/pages/Inventario/AjustesPendientes"/>
                            <p:menuitem value="Ajustes Activos" icon="pi pi-check" url="/secured/pages/Inventario/AjustesActivos"/>
                            <p:menuitem value="Ajustes Inactivos" icon="pi pi-times" url="/secured/pages/Inventario/AjustesInactivos"/>
                        </p:submenu>
                        <p:submenu label="Artículos">
                            <p:menuitem value="Catalogo Actual" icon="pi pi-check-circle" url="/secured/pages/Articulos/catalogoActual"/>
                            <p:menuitem value="Catalogo Pendiente" icon="pi pi-hourglass" url="/secured/pages/Articulos/catalogoPendiente"/>
                            <p:menuitem value="Artículos Activos" icon="pi pi-check" url="/secured/pages/Articulos/ArticulosActivos"/>
                            <p:menuitem value="Artículos Inactivos" icon="pi pi-times" url="/secured/pages/Articulos/ArticulosInactivos"/>
                        </p:submenu>
                    </p:menu>
                </div>
                <div class="ui-g-12 ui-md-2">
                    <p:commandButton id="UsuariosButton" value="Usuarios" style="width: 100%"
                                     styleClass="ui-button-rounded ui-button-info" 
                                     icon="pi pi-user" rendered="#{SessionController.usuarios}"/>
                    <p:menu overlay="true" trigger="UsuariosButton" my="left top" at="left bottom">
                        <p:submenu label="Usuarios">
                            <p:menuitem value="Ver Usuarios" icon="pi pi-users" url="/secured/pages/Usuarios/menu.xhtml"/>
                            <p:menuitem value="Ver Clientes" icon="pi pi-id-card" url="/secured/pages/Clientes/index"/>
                        </p:submenu>
                    </p:menu>
                </div>
                <div class="ui-g-12 ui-md-2">
                    <p:commandButton id="TributacionButton" value="Tributación" style="width: 100%"
                                     styleClass="ui-button-rounded ui-button-danger" 
                                     icon="pi pi-money-bill" rendered="#{SessionController.tributacion}"/>
                    <p:menu overlay="true" trigger="TributacionButton" my="left top" at="left bottom">
                        <p:submenu label="Tributación">
                            <p:menuitem value="Consultas" icon="pi pi-book" disabled="true"/>
                            <p:menuitem value="CaByS" icon="pi pi-book" url="/secured/pages/CaByS/index"/>
                            <p:menuitem value="Tipo de Cambio" icon="pi pi-dollar" onclick="PF('dollarValueDialog').show();"/>
                        </p:submenu>
                    </p:menu>
                    <ui:include src="../fragments/Monedas/DollarValueDialog.xhtml" />
                </div>
                <div class="ui-g-12 ui-md-3">
                    <p:commandButton id="RegistrosButton" value="Registros" style="width: 100%"
                                     styleClass="ui-button-rounded ui-button-warning" 
                                     icon="pi pi-book" rendered="#{SessionController.registros}"/>
                    <p:menu overlay="true" trigger="RegistrosButton" my="left top" at="left bottom" collision="fit">
                        <p:submenu label="Reportes Facturación">
                            <p:menuitem value="Facturación Diaria" icon="pi pi-calendar" disabled="true"/>
                            <p:menuitem value="Facturación de Artículos" icon="pi pi-box" disabled="true"/>
                            <p:menuitem value="Facturas Ingresadas" icon="pi pi-box" url="/secured/pages/Recibos/index"/>
                        </p:submenu>
                        <p:submenu label="Reportes Inventarios">
                            <p:menuitem value="Articulos Detallados" icon="pi pi-search"/>
                            <p:menuitem value="Departamentos Detallados" icon="pi pi-search"/>
                            <p:menuitem value="Familias Detalladas" icon="pi pi-search"/>
                            <p:menuitem value="Inventarios Detallados" icon="pi pi-search"/>
                            <p:menuitem value="Generar Etiquetas" icon="pi pi-ticket" rendered="false" disabled="true"/>
                        </p:submenu>
                        <p:submenu label="Reportes de Usuarios">
                            <p:menuitem value="Usuarios Detallados" icon="pi pi-search"/>
                        </p:submenu>
                    </p:menu>
                </div>
            </div>
        </h:form>
        </p:card>
    </h:body>
</ui:composition>
