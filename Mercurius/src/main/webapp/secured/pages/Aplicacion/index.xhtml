<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <h:head>
        <title>Menu Principal de la Aplicacion</title>
        <h:outputStylesheet name="primefaces/primefaces.css"/>
        <h:outputStylesheet name="primefaces/themes/#{ThemeController.currentTheme}/theme.css" />
        <script type="text/javascript">
    </script>
    </h:head>

    <h:body>
        <p:panelGrid columns="1">
            <p:row>
                <p:column>
                    <ui:include src="/secured/fragments/userBar.xhtml" /> 
                </p:column>
            </p:row> 

            <p:growl showDetail="true" showSummary="true" />

            <p:row>
                <p:column>
                    <p:card>
                        <p:panelGrid columns="1">
                            <p:card>
                                <p:steps activeIndex="#{SettingsController.initSteps}">
                                    <p:menuitem value="Perfil" />
                                    <p:menuitem value="Logo" />
                                    <p:menuitem value="Correo" />
                                    <p:menuitem value="Tributacion" />
                                    <p:menuitem value="Confirmacion" />
                                </p:steps>
                            </p:card>
                            <p:column rendered="#{!SettingsController.hasValidProfile}">
                                <p:card>
                                    <h:form rendered="#{!SettingsController.hasValidProfile}">
                                    <h1 style="text-align: center"> Configuracion de Aplicacion </h1>
                                        <p:panel header="Perfil">
                                            <p:panelGrid columns="1">
                                                    <p:messages/>
                                                    <p:growl showDetail="true" showSummary="true" />

                                                    <p:outputLabel value="Nombre del perfil: " for="nombre" style="color: var(--primary-color);"/>
                                                    <p:inputText id="nombre" value="#{SettingsController.currentSettings.nombrePerfil}" required="true"
                                                                style="width: 100%" />
                                                    <p:commandButton value="Submit" actionListener="#{SettingsController.defaultConfig()}" 
                                                                     process="@form" style="width: 100%" styleClass="ui-button-primary rounded-button"/>
                                            </p:panelGrid>
                                        </p:panel>
                                    </h:form>
                                </p:card>
                            </p:column>
                                
                            <p:column rendered="#{SettingsController.hasValidProfile}">
                                <p:card>
                                    <h:form>
                                        <p:wizard flowListener="#{SettingsController.onFlowProcess}" >
                                            <p:tab id="LogoSelect" title="Logo">
                                                <p:panel header="Logo">
                                                    <p:messages/>
                                                    <p:autoUpdate/>
                                                    <h:panelGrid columns="2" style="text-align: center">
                                                        <p:autoUpdate/>
                                                        <p:column rendered="#{SettingsController.currentSettings.logo eq null}">
                                                            <p:outputLabel value="Logo: " style="color: var(--primary-color);"/>
                                                            <p:graphicImage id="Logo" style="align-items: center">
                                                                <p:skeleton height="10em" width="10em"/>
                                                            </p:graphicImage>
                                                        </p:column>
                                                        <p:column rendered="#{!SettingsController.currentSettings.logo eq null}">
                                                            <p:outputLabel value="Logo: " style="color: var(--primary-color);"/>
                                                            <p:graphicImage name="#{SettingsController.currentSettings.logo}" width="250" height="250"
                                                                            id="LogoSelected" style="align-items: center"/>
                                                        </p:column>
                                                        <p:column>
                                                            <h:form enctype="multipart/form-data">
                                                                <p:fileUpload 
                                                                    listener="#{SettingsController.handleLogoUpload}" 
                                                                    mode="simple" fileLimit="1" 
                                                                    dragDropSupport="false"
                                                                    update="messages" auto="true"
                                                                    label="Subir logo"/>
                                                                <p:growl id="messages" showDetail="true"/>
                                                            </h:form>
                                                        </p:column>
                                                    </h:panelGrid>
                                                </p:panel>
                                            </p:tab>
                                            <p:tab id="Correo" title="Correo">
                                                <p:panel header="Correo">
                                                    <p:messages/>
                                                    <h:panelGrid columns="1" style="text-align: center">
                                                        <p:column>
                                                            <div style="text-align: center">
                                                                <p:outputLabel value="Correo Electronico Principal: " for="correo" style="color: var(--primary-color);"/>
                                                                <p:inputText id="correo" value="#{SettingsController.currentSettings.correoElectronico}"
                                                                 required="true" requiredMessage="El nombre no puede estar vacío"
                                                                style="width: 100%"/>
                                                            </div>
                                                            <p:spacer height="1em"/>
                                                            <div style="text-align: center">
                                                                <p:outputLabel value="Contrasena Correo Electronico: " for="correoPass" style="color: var(--primary-color);"/>
                                                                <p:inputText id="correoPass" value="#{SettingsController.currentSettings.contrasenaCorreo}"
                                                                 required="true" requiredMessage="El nombre no puede estar vacío"
                                                                style="width: 100%"/>
                                                            </div>
                                                        </p:column>
                                                    </h:panelGrid>
                                                </p:panel>
                                            </p:tab>
                                            <p:tab id="Tributacion" title="Tributacion">
                                                <p:panel header="Tributacion">
                                                    <h:panelGrid>

                                                    </h:panelGrid>
                                                </p:panel>
                                            </p:tab>
                                            <p:tab id="Confirmacion" title="Confirmacion">
                                                <p:panel header="Confirmacion">
                                                    <h:panelGrid>
                                                        <p:commandButton value="Submit" process="@this"/>
                                                    </h:panelGrid>
                                                </p:panel>
                                            </p:tab>
                                        </p:wizard>
                                    </h:form>
                                </p:card>
                            </p:column>
                        </p:panelGrid>
                    </p:card>
                </p:column>
            </p:row>
        </p:panelGrid>
    </h:body>
</html>
