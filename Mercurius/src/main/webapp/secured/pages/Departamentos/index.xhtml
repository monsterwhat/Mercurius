<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<h:head>
    <title>Menu Principal Departamentos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css"/>
    <meta charset="utf-8" name="viewport" content="width=device-width, initial-scale=1"/>
    <script src="../../../resources/css/style.css"/>
    <h:outputStylesheet name="primefaces/primefaces.css"/>
    <h:outputStylesheet name="primefaces/themes/nova-light/theme.css"/>
    <link rel="stylesheet" href="https://unpkg.com/primeflex@latest/primeflex.css"/>     
    
</h:head>

<h:body>
    <div class="container mt-5">
        <div class="columns">
            <div class="column">
                <div class="box">
                    <ui:include src="/secured/fragments/userBar.xhtml" />
                    
                    <ui:include src="/secured/pages/mainMenu.xhtml" />
                    <ui:include src="/secured/fragments/Departamentos/CrearDepartamentoDialog.xhtml"/>
                    <ui:include src="/secured/fragments/Departamentos/EditDepartamentoDialog.xhtml"/>
                    
                    <p:growl showDetail="true" showSummary="true" />
                    
                    <h:form id="departamentos">
                        
                        <p:dataTable value="#{DepartamentosController.filteredDepartamentos}" var="departamento"  widgetVar="DepartamentosTable"
                                     paginator="true" rows="8" paginatorPosition="bottom" id="DepartamentosTableData"
                                     emptyMessage="No se encontraron departamentos con la critería proporcionada"
                                     globalFilterFunction="#{DepartamentosController.globalFilterFunction}"
                                     filterBy="#{DepartamentosController.filterBy}" reflow="true"
                                     selection="#{DepartamentosController.selectedDepartamento}" rowKey="#{departamento.id}">
                            
                            <p:ajax event="rowSelect" update="@form"/>
                            
                            <f:facet name="header">
                                <p:inputText id="globalFilter" onkeyup="PF('DepartamentosTable').filter()"
                                             placeholder="Búsqueda general de todos los campos" styleClass="input"/>
                            </f:facet>
                            
                            <p:column exportable="false" width="5%"> 
                                <p:chip id="ActiveChip" icon="pi pi-check" styleClass="has-background-success" rendered="#{departamento.status}"/>
                                <p:tooltip for="ActiveChip" value="Activa" position="top"/>

                                <p:chip id="inActiveChip" icon="pi pi-times" styleClass="has-background-danger" rendered="#{!departamento.status}"/>
                                <p:tooltip for="inActiveChip" value="Inactiva" position="top"/>
                            </p:column>
                            
                            <p:column headerText="ID Departamento" visible="false">
                                <h:outputText value="#{departamento.id}"/>
                            </p:column>
                            <p:column headerText="Nombre" sortBy="#{departamento.nombre}">
                                <h:outputText value="#{departamento.nombre}"/>
                            </p:column>
                            
                            <p:column headerText="Acciones" exportable="false" width="10%">
                                <div class="buttons">
                                    <p:commandButton styleClass="button is-rounded is-success" icon="pi pi-pencil"
                                    onclick="PF('EditarDepartamentoDialog').show();" process="@this" update="editDepartamento">
                                        <f:setPropertyActionListener value="#{departamento}" target="#{DepartamentosController.selectedDepartamento}" />
                                    </p:commandButton>
                                    <p:commandButton styleClass="button is-rounded is-warning" icon="pi pi-power-off" update="@form departamentos"
                                    actionListener="#{DepartamentosController.deleteDepartamento()}" process="@this">
                                        <f:setPropertyActionListener value="#{departamento}" target="#{DepartamentosController.selectedDepartamento}" />
                                    </p:commandButton>
                                </div>
                            </p:column>
                        </p:dataTable>
                        
                        <p:commandButton value="Crear Departamento" actionListener="#{ViewController.selectCreateDepartamentos}" 
                                         styleClass="button is-fullwidth is-success is-rounded" onclick="PF('CrearDepartamentoDialog').show();"/>
                    </h:form>
                </div>
            </div>
        </div>
    </div>
</h:body>
</html>
