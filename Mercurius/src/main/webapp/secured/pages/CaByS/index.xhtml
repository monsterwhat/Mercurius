<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<h:head>
    <title>Menu Principal Catalago de Bienes y Servicios</title>
    <meta charset="utf-8" name="viewport" content="width=device-width, initial-scale=1"/>
    <h:outputStylesheet name="primefaces/primefaces.css"/>
    <h:outputStylesheet name="primefaces/themes/#{ThemeController.currentTheme}/theme.css" />
</h:head>

<h:body>
    <p:panelGrid columns="1" >
        <p:row>
            <p:column>
                <ui:include src="/secured/fragments/userBar.xhtml" /> 
            </p:column>
        </p:row> 
        
        <p:growl showDetail="true" showSummary="true" />

        <p:row>
            <p:column>
                <p:card>
                    <h:form id="cabys">
                        <p:panelGrid columns="1">
                                <p:column rendered="#{empty CabysController.catalogo}">
                                    <p:commandButton value="Cargar Catálogo de Bienes y Servicios" icon="pi pi-cloud-download"
                                                process="@this" update="CabysTable" actionListener="#{CabysController.cabysListApi}" 
                                                styleClass="ui-button-danger rounded-button" style="width: 100%"
                                                />
                                </p:column>
                                <p:column style="text-align: center">
                                    <h1>Seleccione las casillas que desee mostrar</h1>
                                </p:column>
                                <p:column style="display: flex; justify-content: center; align-items: center;">
                                    <p:selectManyCheckbox id="ColumnPicker" value="#{ViewController.selectedOptions}"
                                                          widgetVar="blub" >
                                        <p:ajax listener="#{ViewController.selectedOptionsChanged}" update="cabys"/>
                                        <f:selectItem itemLabel="Codigo" itemValue="codigo"/>
                                        <f:selectItem itemLabel="Categoria" itemValue="categoria"/>
                                        <f:selectItem itemLabel="Descripcion" itemValue="descripcion"/>
                                        <f:selectItem itemLabel="Impuesto" itemValue="impuesto"/>
                                    </p:selectManyCheckbox>
                                </p:column>
                                <p:column style="text-align: center">
                                    <p:commandButton value="Exportar Excel" icon="pi pi-file-excel" 
                                                     style="width: 50%" styleClass="ui-button-success rounded-button" ajax="false">
                                        <p:dataExporter type="xlsx" target="CabysTable" fileName="Cabys-Mercurius" />
                                    </p:commandButton>
                                    <p:commandButton value="Exportar PDF" icon="pi pi-file-pdf" 
                                                     style="width: 50%" styleClass="ui-button-warning rounded-button" ajax="false">
                                        <p:dataExporter type="pdf" target="CabysTable" fileName="Cabys-Mercurius" />
                                    </p:commandButton>
                                </p:column>
                            
                        </p:panelGrid>
                    
                        <p:dataTable value="#{CabysController.filteredCabys}" var="cabys"  widgetVar="CabysTable"
                                     paginator="true" rows="10" paginatorPosition="bottom" id="CabysTable" reflow="true"
                                     emptyMessage="No se encontraron bienes ni servicios con la critería proporcionada"
                                     globalFilterFunction="#{CabysController.globalFilterFunction}" draggableColumns="true"
                                     filterBy="#{CabysController.filterBy}" scrollable="true" showGridlines="true" selectionMode="single"
                                     selection="#{CabysController.selectedCabys}" rowKey="#{cabys.codigo}">

                            <f:facet name="header">
                                <p:inputText id="globalFilter" onkeyup="PF('CabysTable').filter()"
                                             placeholder="Búsqueda general de todos los campos" style="color: var(--primary-color); width: 100%"/>
                            </f:facet>

                            <p:column headerText="Código" sortBy="#{cabys.codigo}" rendered="#{not empty ViewController.selectedOptions and ViewController.isSelected('codigo')}">
                                <h:outputText value="#{cabys.codigo}" />
                            </p:column>
                            <p:column headerText="Categoría" sortBy="#{cabys.categorias}" rendered="#{not empty ViewController.selectedOptions and ViewController.isSelected('categoria')}">
                                <h:outputText value="#{cabys.categorias}" />
                            </p:column>
                            <p:column headerText="Descripción Categoría" sortBy="#{cabys.descripcion}" rendered="#{not empty ViewController.selectedOptions and ViewController.isSelected('descripcion')}">
                                <h:outputText value="#{cabys.descripcion}" />
                            </p:column>
                            <p:column headerText="Impuesto" sortBy="#{cabys.impuesto}" rendered="#{not empty ViewController.selectedOptions and ViewController.isSelected('impuesto')}">
                                <h:outputText value="#{cabys.impuesto}" />
                            </p:column>
                            <p:column headerText="Estado" sortBy="#{cabys.estado}" rendered="false">
                                <h:outputText value="#{cabys.estado}" />
                            </p:column>

                        </p:dataTable>
                    </h:form>
                </p:card>
            </p:column>
        </p:row>
    </p:panelGrid>

</h:body>
</html>
