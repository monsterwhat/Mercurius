<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<h:head>
    <title>Catalogo de Ajustes Inactivos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css"/>
    <meta charset="utf-8" name="viewport" content="width=device-width, initial-scale=1"/>
    <script src="../../../resources/css/style.css"/>
    <h:outputStylesheet name="primefaces/primefaces.css"/>
    <h:outputStylesheet name="primefaces/themes/nova-light/theme.css"/>
    <link rel="stylesheet" href="https://unpkg.com/primeflex@latest/primeflex.css"/>     
    
</h:head>

<h:body>
    <div class="container mt-5">
        <div class="columns">
            <div class="column">
                <div class="box">
                    <ui:include src="/secured/fragments/userBar.xhtml" />
                    
                    <ui:include src="/secured/pages/mainMenu.xhtml" />
                    
                    <p:growl showDetail="true" showSummary="true" />
                    
                    <ui:include src="/secured/fragments/Inventario/Activos/verDetallesDeAjuste.xhtml"/>

                    <h:form>
                        
                    
                    <p:dataTable value="#{InventarioController.filteredInventarioInactivo}" var="movimiento"  widgetVar="InventarioInactivoTable"
                                 paginator="true" rows="8" paginatorPosition="bottom" id="InventarioInactivoTableData"
                                 emptyMessage="No se encontraron artículos con la critería proporcionada"
                                 globalFilterFunction="#{InventarioController.globalFilterFunction}"
                                 filterBy="#{InventarioController.filterBy}" reflow="true"
                                 selection="#{InventarioController.selectedInventario}" rowKey="#{movimiento.codigo}">
                        <p:autoUpdate/>


                        <p:ajax event="rowSelect" update="selectedArticulo"/>
                        
                        <f:facet name="header">
                            <p:inputText id="globalFilter" onkeyup="PF('InventarioInactivoTable').filter()"
                                         placeholder="Búsqueda general de todos los campos" styleClass="input"/>
                        </f:facet>

                        <p:column exportable="false">
                            <p:chip id="sinProcesar" icon="pi pi-exclamation-circle" styleClass="has-background-warning" rendered="#{!movimiento.processed}"/>
                            <p:tooltip for="sinProcesar" value="Sin Procesar" position="top"/>                            
                            <p:chip id="inactivo" icon="pi pi-times" styleClass="has-background-danger" rendered="#{!movimiento.status}"/>
                            <p:tooltip for="inactivo" value="Inactiva" position="top"/>
                        </p:column>

                        <p:column headerText="Código" sortBy="#{movimiento.codigo}" visible="false">
                            <h:outputText value="#{movimiento.codigo}"/>
                        </p:column>
                        <p:column headerText="Articulo" sortBy="#{movimiento.articulo.nombre}">
                            <h:outputText value="#{movimiento.articulo.nombre}"/>
                        </p:column>
                        <p:column headerText="Codigo Barra" sortBy="#{movimiento.articulo.codigoBarra}">
                            <h:outputText value="#{movimiento.articulo.codigoBarra}"/>
                        </p:column>
                        <p:column headerText="Cantidad" sortBy="#{movimiento.cantidad}">
                            <h:outputText value="#{movimiento.cantidad}"/>
                        </p:column>
                        <p:column headerText="Fecha" sortBy="#{movimiento.fechaMovimiento}">
                            <h:outputText value="#{movimiento.fechaMovimiento}"/>
                        </p:column>
                        
                        <p:column exportable="false">
                            <div class="buttons">
                                <p:commandButton styleClass="button is-rounded is-info" icon="pi pi-eye" process="@this"
                                                 onclick="PF('AjusteDetailsDialog').show();" update="selectedArticulo">
                                        <f:setPropertyActionListener value="#{movimiento}" target="#{InventarioController.selectedInventario}" />
                                </p:commandButton>
                            </div>
                        </p:column>
                    </p:dataTable>
                        
                    </h:form>
                </div>
            </div>
        </div>
    </div>
</h:body>
</html>
