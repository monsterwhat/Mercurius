<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<h:head>
    <title>Catalogo de Ajustes Activos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css"/>
    <meta charset="utf-8" name="viewport" content="width=device-width, initial-scale=1"/>
    <script src="../../../resources/css/style.css"/>

</h:head>

<h:body>
    <div class="container mt-5">
        <div class="columns">
            <div class="column">
                <div class="box">
                    <div class="columns">
                        <div class="column">
                                <div class="message-body">
                                    <div class="columns is-mobile">
                                        <div class="column is-four-fifths">
                                            <h1 class="title">Bienvenid@, #{SessionController.currentUser.username}!</h1>
                                        </div>
                                        <div class="column">
                                            <p:commandButton styleClass="button is-rounded is-danger is-2" icon="pi pi-sign-out" value="Salir" actionListener="#{SessionController.logOut()}" />
                                        </div>
                                    </div>
                                </div>
                        </div>
                    </div>
                    
                    <ui:include src="/secured/pages/mainMenu.xhtml" />
                    
                    <p:growl showDetail="true" showSummary="true" />
                    
                    <ui:include src="/secured/fragments/Inventario/Activos/verDetallesDeAjuste.xhtml"/>
                    <ui:include src="/secured/fragments/Inventario/Activos/CreateMovimientoDialog.xhtml"/>

                    <h:form>
                        
                    <p:dataTable value="#{InventarioController.filteredInventario}" var="inventario"  widgetVar="InventarioTable"
                                 paginator="true" rows="8" paginatorPosition="bottom" id="InventarioTableData"
                                 emptyMessage="No se encontraron registros de inventario con la critería proporcionada"
                                 globalFilterFunction="#{InventarioController.globalFilterFunction}"
                                 filterBy="#{InventarioController.filterBy}" reflow="true"
                                 selection="#{InventarioController.selectedInventario}" rowKey="#{inventario.codigo}">
                        <p:autoUpdate/>
                        <p:ajax event="rowSelect" update="selectedArticulo"/>

                        <f:facet name="header">
                            <div class="field columns is-mobile">
                                <p:inputText id="globalFilter" onkeyup="PF('InventarioTable').filter()"
                                         placeholder="Búsqueda general de todos los campos" styleClass="input column is-mobile"/>
                            </div>
                        </f:facet>

                        <p:column exportable="false">
                            <p:chip id="unprocessedChip" icon="pi pi-exclamation-circle" styleClass="has-background-warning" rendered="#{!inventario.processed}"/>
                            <p:tooltip for="unprocessedChip" value="Sin Procesar" position="top"/>

                            <p:chip id="processedChip" icon="pi pi-exclamation-circle" styleClass="has-background-success" rendered="#{inventario.processed}"/>
                            <p:tooltip for="processedChip" value="Procesada" position="top"/>

                            <p:chip id="ActiveChip" icon="pi pi-check" styleClass="has-background-success" rendered="#{inventario.status}"/>
                            <p:tooltip for="ActiveChip" value="Activa" position="top"/>

                            <p:chip id="inActiveChip" icon="pi pi-times" styleClass="has-background-danger" rendered="#{!inventario.status}"/>
                            <p:tooltip for="inActiveChip" value="Inactiva" position="top"/>
                        </p:column>

                        <p:column exportable="false">
                            <div class="buttons">
                                <p:commandButton styleClass="button is-rounded is-info" icon="pi pi-eye" process="@this"
                                                 onclick="PF('AjusteDetailsDialog').show();" update="selectedArticulo">
                                        <f:setPropertyActionListener value="#{inventario}" target="#{InventarioController.selectedInventario}" />
                                </p:commandButton>
                            </div>
                        </p:column>

                        <p:column headerText="Código" visible="false">
                            <h:outputText value="#{inventario.codigo}"/>
                        </p:column>
                        <p:column headerText="Artículo" sortBy="#{inventario.articulo.nombre}">
                            <h:outputText value="#{inventario.articulo.nombre}"/>
                        </p:column>
                        <p:column headerText="Cantidad" sortBy="#{inventario.cantidad}">
                            <h:outputText value="#{inventario.cantidad}"/>
                        </p:column>
                        <p:column headerText="Tipo Movimiento" sortBy="#{inventario.tipoMovimiento}">
                            <h:outputText value="#{inventario.tipoMovimiento}"/>
                        </p:column>
                        <p:column headerText="Fecha Movimiento" sortBy="#{inventario.fechaMovimiento}">
                            <h:outputText value="#{inventario.fechaMovimiento}"/>
                        </p:column>
                        <p:column headerText="Notas" visible="false">
                            <h:outputText value="#{inventario.notas}"/>
                        </p:column>
                        <p:column headerText="Usuario" visible="false">
                            <h:outputText value="#{inventario.usuario.username}"/>
                        </p:column>

                        <p:column exportable="false">
                            <p:commandButton styleClass="button is-rounded is-warning" icon="pi pi-trash"
                                    actionListener="#{InventarioController.deleteInventario()}" rendered="#{SessionController.inventarios}" process="@this" update="InventarioTableData">
                                    <f:setPropertyActionListener value="#{inventario}" target="#{InventarioController.selectedInventario}" />
                            </p:commandButton>
                        </p:column>

                    </p:dataTable>

                    <p:commandButton value="Crear Ajuste" onclick="PF('CrearAjusteDialog').show();" update="crearAjuste" styleClass="button is-fullwidth is-success is-rounded"/>
                
                    </h:form>
                </div>
            </div>
        </div>
    </div>
</h:body>
</html>
