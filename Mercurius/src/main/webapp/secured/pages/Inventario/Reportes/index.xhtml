<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<h:head>
    <title>Menu Principal Reportes de Inventario</title>
    <meta charset="utf-8" name="viewport" content="width=device-width, initial-scale=1"/>
    <h:outputStylesheet name="primefaces/primefaces.css"/>
    <h:outputStylesheet name="primefaces/themes/#{ThemeController.currentTheme}/theme.css" />
</h:head>

<h:body>
    <p:growl id="growl" showDetail="true" showSummary="true" />

    <p:panelGrid columns="1">
        <p:column>
            <ui:include src="/secured/fragments/userBar.xhtml" />
        </p:column>
    </p:panelGrid>
                
    <p:panelGrid columns="3">
        <p:card>
            <p:badge value="#{InventarioController.inventarioActivoCount()}" severity="success">
                <i class="pi pi-check-circle" style="font-size: 2rem"/>
            </p:badge>
            <p:tag styleClass="mr-2" severity="success" value="Ajustes Activos" rounded="true"></p:tag>
        </p:card>
        <p:card>
            <p:badge value="#{InventarioController.inventarioPendienteCount()}" severity="warning">
                <i class="pi pi-sync" style="font-size: 2rem"/>
            </p:badge>
            <p:tag styleClass="mr-2" severity="warning" value="Ajustes Pendientes" rounded="true"></p:tag>
        </p:card>
        <p:card>
            <p:badge value="#{InventarioController.inventarioInactivoCount()}" severity="danger">
                <i class="pi pi-times-circle" style="font-size: 2rem" />
            </p:badge>
            <p:tag styleClass="mr-2" severity="danger" value="Ajustes Inactivos" rounded="true"></p:tag>
        </p:card>
    </p:panelGrid>
    
    <p:panelGrid columns="1">
        <p:card>
            <h:form id="AjustesActivos">
                        
                <p:commandButton value="Imprimir" icon="pi pi-print" 
                                 action="#{InventarioController.exportPDF}" ajax="false" styleClass="rounded-button ui-button-help" style="width: 100%"
                            oncomplete="printPDF('#{InventarioController.contextPath}/jakarta.faces.resource/reporteAjustesActivos.pdf')"/>

                <p:dataTable value="#{InventarioController.filteredInventarioDetallado}" var="inventario"  widgetVar="InventarioTable"
                             paginator="true" rows="8" paginatorPosition="bottom" id="InventarioTableData"
                             emptyMessage="No se encontraron registros de inventario con la critería proporcionada"
                             globalFilterFunction="#{InventarioController.globalFilterFunction}"
                             filterBy="#{InventarioController.filterBy}" reflow="true" selectionMode="single"
                             selection="#{InventarioController.selectedInventario}" rowKey="#{inventario.codigo}">
                    <p:autoUpdate/>
                    <p:ajax event="rowSelect" update="selectedArticulo"/>

                    <f:facet name="header">
                        <div class="field columns is-mobile">
                            <p:inputText id="globalFilter" onkeyup="PF('InventarioTable').filter()"
                                     placeholder="Búsqueda general de todos los campos" style="color: var(--primary-color); width: 100%"/>
                        </div>
                    </f:facet>

                    <p:column exportable="false" sortBy="#{inventario.processed}" width="3%">
                        <p:chip id="unprocessedChip" icon="pi pi-exclamation-circle" style="background: var(--yellow-500)" rendered="#{!inventario.processed}"/>
                        <p:tooltip for="unprocessedChip" value="Sin Procesar" position="top"/>

                        <p:chip id="processedChip" icon="pi pi-exclamation-circle" style="background: var(--green-500)" rendered="#{inventario.processed}"/>
                        <p:tooltip for="processedChip" value="Procesada" position="top"/>
                    </p:column>
                    
                    <p:column exportable="false" sortBy="#{inventario.status}" >
                        <p:chip id="ActiveChip" icon="pi pi-check" style="background: var(--green-500)" rendered="#{inventario.status}"/>
                        <p:tooltip for="ActiveChip" value="Activa" position="top"/>

                        <p:chip id="inActiveChip" icon="pi pi-times" style="background: var(--red-500);" rendered="#{!inventario.status}"/>
                        <p:tooltip for="inActiveChip" value="Inactiva" position="top"/>
                    </p:column>

                    <p:column exportable="false">
                        <div class="buttons">
                            <p:commandButton styleClass="rounded-button ui-button-info" icon="pi pi-eye" process="@this"
                                             onclick="PF('AjusteDetailsDialog').show();" update="selectedArticulo">
                                    <f:setPropertyActionListener value="#{inventario}" target="#{InventarioController.selectedInventario}" />
                            </p:commandButton>
                        </div>
                    </p:column>

                    <p:column headerText="Código" visible="false">
                        <h:outputText value="#{inventario.codigo}"/>
                    </p:column>
                    <p:column headerText="Artículo" sortBy="#{inventario.articulo.nombre}">
                        <h:outputText value="#{inventario.articulo.nombre}"/>
                    </p:column>
                    <p:column headerText="Cantidad" sortBy="#{inventario.cantidad}">
                        <h:outputText value="#{inventario.cantidad}"/>
                    </p:column>
                    <p:column headerText="Tipo Movimiento" sortBy="#{inventario.tipoMovimiento}">
                        <h:outputText value="#{inventario.tipoMovimiento}"/>
                    </p:column>
                    <p:column headerText="Fecha Movimiento" sortBy="#{inventario.fechaMovimiento}">
                        <h:outputText value="#{inventario.fechaMovimiento}"/>
                    </p:column>
                    <p:column headerText="Notas" visible="false">
                        <h:outputText value="#{inventario.notas}"/>
                    </p:column>
                    <p:column headerText="Usuario" visible="false">
                        <h:outputText value="#{inventario.usuario.username}"/>
                    </p:column>

                    <p:column exportable="false">
                        <p:commandButton styleClass="rounded-button ui-button-warning" icon="pi pi-power-off"
                                actionListener="#{InventarioController.deleteInventario()}" rendered="#{SessionController.inventarios}" process="@this" update="InventarioTableData">
                                <f:setPropertyActionListener value="#{inventario}" target="#{InventarioController.selectedInventario}" />
                        </p:commandButton>
                    </p:column>

                </p:dataTable>

                <p:commandButton value="Crear Ajuste" onclick="PF('CrearAjusteDialog').show();" 
                                 update="crearAjuste" styleClass="rounded-button ui-button-primary" 
                                 style="width: 100%"/>

                </h:form>
        </p:card>
            
    </p:panelGrid>
    
    <ui:include src="/secured/fragments/Inventario/Activos/verDetallesDeAjuste.xhtml"/>
    <ui:include src="/secured/fragments/Inventario/Activos/CreateMovimientoDialog.xhtml"/>
    
</h:body>
</html>
