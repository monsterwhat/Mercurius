<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<h:head>
    <title>Menu Principal Usuarios</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css"/>
    <meta charset="utf-8" name="viewport" content="width=device-width, initial-scale=1"/>
    <script src="../../../resources/css/style.css"/>

</h:head>

<h:body>
    <div class="container mt-5">
        <div class="columns">
            <div class="column">
                <div class="box">
                    <div class="columns">
                        <div class="column">
                                <div class="message-body">
                                    <div class="columns is-mobile">
                                        <div class="column is-four-fifths">
                                            <h1 class="title">Bienvenid@, #{SessionController.currentUser.username}!</h1>
                                        </div>
                                        <div class="column">
                                            <p:commandButton styleClass="button is-rounded is-danger is-2" icon="pi pi-sign-out" value="Salir" actionListener="#{SessionController.logOut()}" />
                                        </div>
                                    </div>
                                </div>
                        </div>
                    </div>
                    
                    <ui:include src="../../pages/mainMenu.xhtml" />
                    
                    <p:growl id="growl" showDetail="true" showSummary="true" />
                    
                    <h:form id="usuarios">
                        
                    <p:dataTable value="#{UsersController.filteredUsers}" var="user" widgetVar="UsersTable"
                        paginator="true" rows="8" paginatorPosition="bottom" id="UsersTableData"
                        emptyMessage="No se encontraron usuarios con la critería proporcionada"
                        globalFilterFunction="#{UsersController.globalFilterFunction}"
                        filterBy="#{UsersController.filterBy}"
                        selection="#{UsersController.selectedUser}" rowKey="#{user.id}">

                            <f:facet name="header">
                                    <p:inputText id="globalFilter" onkeyup="PF('UsersTable').filter()" styleClass="input"
                                                 placeholder="Búsqueda general de todos los campos" />
                            </f:facet>

                            <p:column headerText="Identificador de perfil" visible="false" sortBy="#{user.id}">
                                <h:outputText value="#{user.id}"/>
                            </p:column>
                            <p:column headerText="Nombre de usuario" sortBy="#{user.username}">
                                <h:outputText value="#{user.username}" />
                            </p:column>
                            <p:column headerText="Contraseña (HASH)" rendered="false">
                                <h:outputText value="#{user.password}" />
                            </p:column>
                            <p:column headerText="Permisos" sortBy="#{user.groupName}">
                                <h:outputText value="#{user.groupName}" />
                            </p:column>
                            <p:column headerText="Activo" visible="false" sortBy="#{user.status}">
                                <h:outputText value="#{user.status}" />
                            </p:column>

                            <p:column headerText="Acciones" width="20%" exportable="false">
                                <div class="buttons has-addons">
                                    <p:commandButton styleClass="button edit-button rounded-button ui-button-success" icon="pi pi-pencil"
                                    actionListener="#{ViewController.selectEditUsers()}" process="@this">
                                        <f:setPropertyActionListener value="#{user}" target="#{UsersController.selectedUser}" />
                                    </p:commandButton>
                                    <p:commandButton styleClass="button ui-button-warning rounded-button" icon="pi pi-trash"
                                    actionListener="#{UsersController.deleteUser()}" process="@this" update="usuarios">
                                        <f:setPropertyActionListener value="#{user}" target="#{UsersController.selectedUser}" />
                                    </p:commandButton>
                                </div>
                            </p:column>
                         </p:dataTable>

                         <p:commandButton value="Crear Usuario" actionListener="#{UsersController.openNewUser}" styleClass="button is-fullwidth is-success is-rounded"/>

                    </h:form>
                </div>
            </div>
        </div>
    </div>
</h:body>
</html>
