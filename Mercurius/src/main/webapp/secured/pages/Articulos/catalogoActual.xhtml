<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<h:head>
    <title>Catalago de Articulos Actuales</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css"/>
    <meta charset="utf-8" name="viewport" content="width=device-width, initial-scale=1"/>
    <script src="../../../resources/css/style.css"/>

</h:head>

<h:body>
    <div class="container mt-5">
        <div class="columns">
            <div class="column">
                <div class="box">
                    <div class="columns">
                        <div class="column">
                                <div class="message-body">
                                    <div class="columns is-mobile">
                                        <div class="column is-four-fifths">
                                            <h1 class="title">Bienvenid@, #{SessionController.currentUser.username}!</h1>
                                        </div>
                                        <div class="column">
                                            <p:commandButton styleClass="button is-rounded is-danger is-2" icon="pi pi-sign-out" value="Salir" actionListener="#{SessionController.logOut()}" />
                                        </div>
                                    </div>
                                </div>
                        </div>
                    </div>
                    
                    <ui:include src="../../pages/mainMenu.xhtml" />
                    
                    <p:growl id="growl" showDetail="true" showSummary="true" />
                    
                    <ui:include src="../../fragments/Articulos/ActivosYProcesados/ArticulosActivosYProcesados.xhtml"/>                    
                    
                </div>
            </div>
        </div>
    </div>
</h:body>
</html>
