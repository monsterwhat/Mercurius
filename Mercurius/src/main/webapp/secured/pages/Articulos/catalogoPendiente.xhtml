<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<h:head>
    <title>Catalago de Articulos Pendientes</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css"/>
    <meta charset="utf-8" name="viewport" content="width=device-width, initial-scale=1"/>
    <script src="../../../resources/css/style.css"/>

</h:head>

<h:body>
    <div class="container mt-5">
        <div class="columns">
            <div class="column">
                <div class="box">
                    <div class="columns">
                        <div class="column">
                                <div class="message-body">
                                    <div class="columns is-mobile">
                                        <div class="column is-four-fifths">
                                            <h1 class="title">Bienvenid@, #{SessionController.currentUser.username}!</h1>
                                        </div>
                                        <div class="column">
                                            <p:commandButton styleClass="button is-rounded is-danger is-2" icon="pi pi-sign-out" value="Salir" actionListener="#{SessionController.logOut()}" />
                                        </div>
                                    </div>
                                </div>
                        </div>
                    </div>
                    
                    <ui:include src="../../pages/mainMenu.xhtml" />
                    
                    <p:growl showDetail="true" showSummary="true" />
                    
                    <ui:include src="/secured/fragments/CaByS/CabysDialogEdit.xhtml"/>  

                    <ui:include src="/secured/fragments/Articulos/PendientesRevision/DialogoRevisionArticulo.xhtml"/>

                    <h:form id="ArticulosPendientes">
                        
                    <p:dataTable value="#{ArticulosController.filteredArticulosSinProcesar}" var="articulo"  widgetVar="ArticulosRevisionTable"
                                 paginator="true" rows="8" paginatorPosition="bottom" id="ArticulosRevisionTable"
                                 emptyMessage="No se encontraron artículos con la critería proporcionada" stripedRows="true"
                                 globalFilterFunction="#{ArticulosController.globalFilterFunction}" reflow="true"
                                 filterBy="#{ArticulosController.filterBy}"
                                 selection="#{ArticulosController.selectedArticulo}" rowKey="#{articulo.codigo}">
                        
                        <p:ajax event="rowSelect" update="RevisionArticuloDialog"/>

                        <f:facet name="header">
                            <p:inputText id="globalFilter" onkeyup="PF('ArticulosRevisionTable').filter()"
                                         placeholder="Búsqueda general de todos los campos" styleClass="input"/>
                        </f:facet>

                        <p:column exportable="false">
                            <div class="buttons">
                                <p:commandButton value="Procesar" styleClass="button is-rounded is-info" process="@this" update="RevisionArticuloDialog"
                                                 icon="pi pi-sync" onclick="PF('RevisionArticuloDialog').show();" >
                                    <f:setPropertyActionListener value="#{articulo}" target="#{ArticulosController.selectedArticulo}" />
                                </p:commandButton>
                            </div>
                        </p:column>

                        <p:column headerText="Código" sortBy="#{articulo.codigo}" visible="false">
                            <h:outputText value="#{articulo.codigo}"/>
                        </p:column>
                        <p:column headerText="Nombre" sortBy="#{articulo.nombre}">
                            <h:outputText value="#{articulo.nombre}"/>
                        </p:column>
                        <p:column headerText="Código de Barra" sortBy="#{articulo.codigoBarra}">
                            <h:outputText value="#{articulo.codigoBarra}"/>
                        </p:column>
                        <p:column headerText="Código Cabys" sortBy="#{articulo.codigoCabys}" visible="false">
                            <h:outputText value="#{articulo.codigoCabys.codigo}"/>
                        </p:column>                            
                        <p:column headerText="Precio Costo Sin IVA" sortBy="#{articulo.precioCostoSinIVA}" visible="false">
                            <h:outputText value="#{articulo.precioCostoSinIVA}"/>
                        </p:column>
                        <p:column headerText="Porcentaje Utilidad" sortBy="#{articulo.porcentajeUtilidad}" visible="false">
                            <h:outputText value="#{articulo.porcentajeUtilidad}"/>
                        </p:column>
                        <p:column headerText="Precio Final" sortBy="#{articulo.precioFinal}" visible="false">
                            <h:outputText value="#{articulo.precioFinal}"/>
                        </p:column>
                        <p:column headerText="Precio Final Con IVA" sortBy="#{articulo.precioCostoConIVA}" visible="false">
                            <h:outputText value="#{articulo.precioCostoConIVA}"/>
                        </p:column>

                    </p:dataTable>
                        
                    </h:form>
                </div>
            </div>
        </div>
    </div>
</h:body>
</html>
