<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<h:head>
    <title>Catalago de Articulos Inactivos</title>
    <meta charset="utf-8" name="viewport" content="width=device-width, initial-scale=1"/>
    <h:outputStylesheet name="primefaces/primefaces.css"/>
    <h:outputStylesheet name="primefaces/themes/#{ThemeController.currentTheme}/theme.css" />
</h:head>

<h:body>
    <p:panelGrid columns="1"  >
        <p:row>
            <p:column>
                <ui:include src="/secured/fragments/userBar.xhtml" /> 
            </p:column>
        </p:row> 
        
        <p:growl showDetail="true" showSummary="true" />

        <p:row>
            <p:column>
                <p:card styleClass="ui-panel ui-widget ui-widget-content ui-corner-all">
                    
                    <h:form id="ArticulosInactivos">
                        
                    <p:card rendered="#{SessionController.registros}" >
                        <p:panelGrid columns="1">
                            <p:column>
                                <p:commandButton value="Imprimir" icon="pi pi-print"
                               action="#{ArticulosController.exportPDF('ArticulosInactivos:ArticulosTableData')}" ajax="false" 
                               styleClass="rounded-button ui-button-primary" style='width: 50%'
                               oncomplete="printPDF('#{ArticulosController.contextPath}/jakarta.faces.resource/reporteArticulosActivos.pdf')"/>
                                <p:commandButton value="Exportar Excel" icon="pi pi-file-excel"
                                    styleClass="rounded-button ui-button-success" style='width: 25%'/>
                                <p:commandButton value="Exportar PDF" icon="pi pi-file-pdf"
                                styleClass="rounded-button ui-button-danger" style='width: 25%'/>
                            </p:column>
                        </p:panelGrid>
                    </p:card>
                        
                    <p:dataTable value="#{ArticulosController.filteredArticulosInactivos}" var="articulo"  widgetVar="ArticulosInactivos"
                                 paginator="true" rows="8" paginatorPosition="bottom" id="ArticulosTableData"
                                 emptyMessage="No se encontraron artículos con la critería proporcionada"
                                 globalFilterFunction="#{ArticulosController.globalFilterFunction}"
                                 filterBy="#{ArticulosController.filterBy}" reflow="true" selectionMode="single"
                                 selection="#{ArticulosController.selectedArticulo}" rowKey="#{articulo.codigo}">

                        <f:facet name="header">
                            <p:inputText id="globalFilter" onkeyup="PF('ArticulosInactivos').filter()"
                                         placeholder="Búsqueda general de todos los campos" style="color: var(--primary-color); width: 100%"/>
                        </f:facet>

                        <p:column>
                            <p:chip id="processedChip" icon="pi pi-exclamation-circle" style="background: var(--green-500)"
                                    rendered="#{articulo.processed}"/>
                            <p:tooltip for="processedChip" value="Procesado" position="top"/>
                            <p:chip id="unprocessedChip" icon="pi pi-exclamation-circle" style="background: var(--yellow-500)"
                                    rendered="#{!articulo.processed}"/>
                            <p:tooltip for="unprocessedChip" value="Sin procesar" position="top"/>
                            <p:chip id="ActiveChip" icon="pi pi-check" style="background: var(--green-500)"
                                    rendered="#{articulo.status}"/>
                            <p:tooltip for="ActiveChip" value="Activo" position="top"/>
                            <p:chip id="InactiveChip" icon="pi pi-times" style="background: var(--red-500);"
                                    rendered="#{!articulo.status}"/>
                            <p:tooltip for="InactiveChip" value="Inactivo" position="top"/>
                        </p:column>

                        <p:column headerText="Código" sortBy="#{articulo.codigo}" visible="false">
                            <h:outputText value="#{articulo.codigo}"/>
                        </p:column>
                        <p:column headerText="Código de Barra" sortBy="#{articulo.codigoBarra}">
                            <h:outputText value="#{articulo.codigoBarra}"/>
                        </p:column>
                        <p:column headerText="Código Cabys" sortBy="#{articulo.codigoCabys}" visible="false">
                            <h:outputText value="#{articulo.codigoCabys.codigo}"/>
                        </p:column>                            
                        <p:column headerText="Nombre" sortBy="#{articulo.nombre}">
                            <h:outputText value="#{articulo.nombre}"/>
                        </p:column>
                        <p:column headerText="Precio Costo Sin IVA" sortBy="#{articulo.precioCostoSinIVA}" visible="false">
                            <h:outputText value="#{articulo.precioCostoSinIVA}"/>
                        </p:column>
                        <p:column headerText="Porcentaje Utilidad" sortBy="#{articulo.porcentajeUtilidad}" visible="false">
                            <h:outputText value="#{articulo.porcentajeUtilidad}"/>
                        </p:column>
                        <p:column headerText="Precio Final" sortBy="#{articulo.precioFinal}" visible="false">
                            <h:outputText value="#{articulo.precioFinal}"/>
                        </p:column>
                        <p:column headerText="Precio Final Con IVA" sortBy="#{articulo.precioCostoConIVA}">
                            <h:outputText value="#{articulo.precioCostoConIVA}"/>
                        </p:column>
                        <p:column headerText="Creador" sortBy="#{articulo.usuario.username}" visible="false">
                            <h:outputText value="#{articulo.usuario.username}"/>
                        </p:column>

                        <p:column headerText="Acciones" exportable="false">
                            <div class="buttons has-addons">
                                <p:commandButton styleClass="rounded-button ui-button-info" onclick="PF('ArticuloDetailsDialog').show();"
                                                 icon="pi pi-eye" process="@this" update="selectedArticulo">
                                    <f:setPropertyActionListener value="#{articulo}" target="#{ArticulosController.selectedArticulo}" />
                                </p:commandButton>
                            </div>
                        </p:column>
                    </p:dataTable>
                        
                    </h:form>
                    
                </p:card>
                
                </p:column>
            </p:row>
        </p:panelGrid>

        <ui:include src="/secured/fragments/Articulos/Inactivos/verDetalles.xhtml"/>

</h:body>
</html>
