<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="jakarta.faces.facelets">

    <h:head>
        <title>Menu Principal Articulos</title>
        <meta charset="utf-8" name="viewport" content="width=device-width, initial-scale=1"/>
        <h:outputStylesheet name="primefaces/primefaces.css"/>
        <h:outputStylesheet name="primefaces/themes/#{ThemeController.currentTheme}/theme.css" />
    </h:head>

    <h:body >
        <ui:include src="/secured/fragments/userBar.xhtml" />

        <p:growl id="growl" showDetail="true" showSummary="true" />

        <p:card class="card">
            <f:facet name="title">
                <p style="text-align: center">Articulos </p> 
            </f:facet>
            
            <p:tabView cache="false" dynamic="true" id="Articulos">
                <p:tab title="Activos">
                    <div class="card">
                        <h:form id="ArticulosActivos">  
                        <p:dataTable value="#{ArticulosController.filteredArticulosActivos}" var="articulo"  widgetVar="ArticulosTable"
                                     paginator="true" rows="8" paginatorPosition="bottom" id="ArticulosTableData"
                                     emptyMessage="No se encontraron artículos con la critería proporcionada"
                                     globalFilterFunction="#{ArticulosController.globalFilterFunction}"
                                     filterBy="#{ArticulosController.filterBy}" reflow="true" selectionMode="single"
                                     selection="#{ArticulosController.selectedArticulo}" rowKey="#{articulo.codigo}">

                            <p:ajax event="rowSelect" update="EditArticuloDialog"/>

                            <f:facet name="header">
                                
                                <p:commandButton value="Imprimir" icon="pi pi-print" action="#{ArticulosController.exportPDF('ArticulosActivos:ArticulosTableData')}" 
                                                     ajax="false" styleClass="rounded-button ui-button-help"  style="width: 50%" rendered="#{SessionController.registros}"
                                                     oncomplete="printPDF('#{ArticulosController.contextPath}/jakarta.faces.resource/reporteArticulosActivos.pdf')"/>
                                  
                                <p:commandButton value="Exportar Excel" icon="pi pi-file-excel" rendered="#{SessionController.registros}"
                                                     styleClass="rounded-button ui-button-success"  style="width: 50%"/>
    
                                <p:spacer height="1em"/>

                                
                                <p:commandButton value="Crear Artículo" actionListener="#{ArticulosController.openNewArticulo()}" process="@this"
                                                 update="@this" styleClass="rounded-button ui-button-primary" style="width: 100%" />

                                <p:spacer height="1em"/>

                                <p:inputText id="globalFilter" onkeyup="PF('ArticulosTable').filter()"
                                             placeholder="Búsqueda general de todos los campos" style="color: var(--primary-color); width: 100%"/>

                            </f:facet>

                            <p:column>
                                <p:chip id="processedChip" icon="pi pi-exclamation-circle" style="background: var(--green-500)"
                                        rendered="#{articulo.processed}"/>
                                <p:tooltip for="processedChip" value="Procesada" position="top"/>
                                <p:chip id="unprocessedChip" icon="pi pi-exclamation-circle" style="background: var(--yellow-500)"
                                        rendered="#{!articulo.processed}"/>
                                <p:tooltip for="unprocessedChip" value="Sin procesar" position="top"/>
                                <p:chip id="ActiveChip" icon="pi pi-check" style="background: var(--green-500)"
                                        rendered="#{articulo.status}"/>
                                <p:tooltip for="ActiveChip" value="Activa" position="top"/>
                                <p:chip id="InactiveChip" icon="pi pi-times" style="background: var(--red-500);"
                                        rendered="#{!articulo.status}"/>
                                <p:tooltip for="InactiveChip" value="Inactiva" position="top"/>
                            </p:column>

                            <p:column headerText="Código" sortBy="#{articulo.codigo}" visible="false">
                                <h:outputText value="#{articulo.codigo}"/>
                            </p:column>
                            <p:column headerText="Código de Barra" sortBy="#{articulo.codigoBarra}">
                                <h:outputText value="#{articulo.codigoBarra}"/>
                            </p:column>
                            <p:column headerText="Código Cabys" sortBy="#{articulo.codigoCabys}">
                                <h:outputText value="#{articulo.codigoCabys.codigo}"/>
                            </p:column>                            
                            <p:column headerText="Nombre" sortBy="#{articulo.nombre}">
                                <h:outputText value="#{articulo.nombre}"/>
                            </p:column>

                            <p:column headerText="Acciones" exportable="false">
                                <div class="buttons">
                                    <p:commandButton styleClass="rounded-button ui-button-success" process="@this" icon="pi pi-pencil"
                                                     onclick="PF('EditArticuloDialog').show();" update="EditArticuloDialog">
                                        <f:setPropertyActionListener value="#{articulo}" target="#{ArticulosController.selectedArticulo}" />
                                    </p:commandButton>
                                    <p:commandButton styleClass="rounded-button ui-button-warning" icon="pi pi-power-off"
                                                     actionListener="#{ArticulosController.deleteArticulo()}" process="@this" update="@this">
                                        <f:setPropertyActionListener value="#{articulo}" target="#{ArticulosController.selectedArticulo}" />
                                    </p:commandButton>
                                </div>
                            </p:column>
                        </p:dataTable> 
                    </h:form>
                    </div> 
                </p:tab>
                <p:tab title="Inactivos" >
                    <div class="card">
                        <h:form id="ArticulosInactivos">   
                        <p:dataTable value="#{ArticulosController.filteredArticulosInactivos}" var="articulo"  widgetVar="ArticulosInactivos"
                                     paginator="true" rows="8" paginatorPosition="bottom" id="ArticulosTableData"
                                     emptyMessage="No se encontraron artículos con la critería proporcionada"
                                     globalFilterFunction="#{ArticulosController.globalFilterFunction}"
                                     filterBy="#{ArticulosController.filterBy}" reflow="true" selectionMode="single"
                                     selection="#{ArticulosController.selectedArticulo}" rowKey="#{articulo.codigo}">

                            <f:facet name="header">
                                <p:commandButton value="Imprimir" icon="pi pi-print" rendered="#{SessionController.registros}"
                                                     action="#{ArticulosController.exportPDF('ArticulosInactivos:ArticulosTableData')}" ajax="false" 
                                                     styleClass="rounded-button ui-button-help" style='width: 100%'
                                                     oncomplete="printPDF('#{ArticulosController.contextPath}/jakarta.faces.resource/reporteArticulosActivos.pdf')"/>
                                    
                                <p:spacer height="1em"/>
                                
                                <p:commandButton value="Exportar Excel" icon="pi pi-file-excel" rendered="#{SessionController.registros}"
                                                     styleClass="rounded-button ui-button-success" style='width: 100%'/>
                                
                                <p:spacer height="1em"/>
                                
                                <p:inputText id="globalFilter" onkeyup="PF('ArticulosInactivos').filter()"
                                             placeholder="Búsqueda general de todos los campos" style="color: var(--primary-color); width: 100%"/>
                            </f:facet>

                            <p:column>
                                <p:chip id="processedChip" icon="pi pi-exclamation-circle" style="background: var(--green-500)"
                                        rendered="#{articulo.processed}"/>
                                <p:tooltip for="processedChip" value="Procesado" position="top"/>
                                <p:chip id="unprocessedChip" icon="pi pi-exclamation-circle" style="background: var(--yellow-500)"
                                        rendered="#{!articulo.processed}"/>
                                <p:tooltip for="unprocessedChip" value="Sin procesar" position="top"/>
                                <p:chip id="ActiveChip" icon="pi pi-check" style="background: var(--green-500)"
                                        rendered="#{articulo.status}"/>
                                <p:tooltip for="ActiveChip" value="Activo" position="top"/>
                                <p:chip id="InactiveChip" icon="pi pi-times" style="background: var(--red-500);"
                                        rendered="#{!articulo.status}"/>
                                <p:tooltip for="InactiveChip" value="Inactivo" position="top"/>
                            </p:column>

                            <p:column headerText="Código" sortBy="#{articulo.codigo}" visible="false">
                                <h:outputText value="#{articulo.codigo}"/>
                            </p:column>
                            <p:column headerText="Código de Barra" sortBy="#{articulo.codigoBarra}">
                                <h:outputText value="#{articulo.codigoBarra}"/>
                            </p:column>
                            <p:column headerText="Código Cabys" sortBy="#{articulo.codigoCabys}" visible="false">
                                <h:outputText value="#{articulo.codigoCabys.codigo}"/>
                            </p:column>                            
                            <p:column headerText="Nombre" sortBy="#{articulo.nombre}">
                                <h:outputText value="#{articulo.nombre}"/>
                            </p:column>
                            <p:column headerText="Creador" sortBy="#{articulo.usuario.username}" visible="false">
                                <h:outputText value="#{articulo.usuario.username}"/>
                            </p:column>

                            <p:column headerText="Acciones" exportable="false">
                                <div class="buttons has-addons">
                                    <p:commandButton styleClass="rounded-button ui-button-info" onclick="PF('ArticuloInactivoDetailsDialog').show();"
                                                     icon="pi pi-eye" process="@this" update="selectedArticuloInactivo">
                                        <f:setPropertyActionListener value="#{articulo}" target="#{ArticulosController.selectedArticulo}" />
                                    </p:commandButton>
                                </div>
                            </p:column>
                        </p:dataTable> 
                    </h:form>
                    </div> 
                </p:tab>
                <p:tab title="Procesados" >
                    <div class="card">
                        <h:form id="catalogoActual"> 
                        <p:dataTable value="#{ArticulosController.filteredArticulosActivosYProcesados}" var="articulo"  widgetVar="ArticulosActivosYProcesados"
                                     paginator="true" rows="8" paginatorPosition="bottom" id="ArticulosTableData"
                                     emptyMessage="No se encontraron artículos con la critería proporcionada"
                                     globalFilterFunction="#{ArticulosController.globalFilterFunction}"
                                     filterBy="#{ArticulosController.filterBy}" reflow="true" selectionMode="single"
                                     selection="#{ArticulosController.selectedArticulo}" rowKey="#{articulo.codigo}">

                            <p:ajax event="rowSelect" update="selectedArticuloActivoYProcesado"/>

                            <f:facet name="header">
                                <p:inputText id="globalFilter" onkeyup="PF('ArticulosActivosYProcesados').filter()"
                                             placeholder="Búsqueda general de todos los campos" style="color: var(--primary-color); width: 100%"/>
                            </f:facet>

                            <p:column>
                                <p:chip id="processedChip" icon="pi pi-exclamation-circle" style="background: var(--green-500)"
                                        rendered="#{articulo.processed}"/>
                                <p:tooltip for="processedChip" value="Procesado" position="top"/>
                                <p:chip id="ActiveChip" icon="pi pi-check" style="background: var(--green-500)"
                                        rendered="#{articulo.status}"/>
                                <p:tooltip for="ActiveChip" value="Activo" position="top"/>
                            </p:column>

                            <p:column headerText="Código" sortBy="#{articulo.codigo}" visible="false">
                                <h:outputText value="#{articulo.codigo}"/>
                            </p:column>
                            <p:column headerText="Código de Barra" sortBy="#{articulo.codigoBarra}">
                                <h:outputText value="#{articulo.codigoBarra}"/>
                            </p:column>
                            <p:column headerText="Código Cabys" sortBy="#{articulo.codigoCabys}" visible="false">
                                <h:outputText value="#{articulo.codigoCabys.codigo}"/>
                            </p:column>                            
                            <p:column headerText="Nombre" sortBy="#{articulo.nombre}">
                                <h:outputText value="#{articulo.nombre}"/>
                            </p:column>
                            <p:column headerText="Creador" sortBy="#{articulo.usuario.username}" visible="false">
                                <h:outputText value="#{articulo.usuario.username}"/>
                            </p:column>
                            <p:column headerText="Stock" sortBy="#{ArticulosController.getStock(articulo)}">
                                <h:outputText value="#{ArticulosController.getStock(articulo)}"/>
                            </p:column>
                            <p:column headerText="Precio" sortBy="#{ArticulosController.getLastPrecioFor(articulo).precioFinal}">
                                <h:outputText value="#{ArticulosController.getLastPrecioFor(articulo).precioFinal}"/>
                            </p:column>

                            <p:column headerText="Acciones" exportable="false">
                                <div class="buttons has-addons">
                                    <p:commandButton styleClass="rounded-button ui-button-info" onclick="PF('ArticuloActivoYProcesadoDetailsDialog').show();"
                                                     icon="pi pi-eye" process="@this" update="selectedArticuloActivoYProcesado">
                                        <f:setPropertyActionListener value="#{articulo}" target="#{ArticulosController.selectedArticulo}" />
                                    </p:commandButton>
                                </div>
                            </p:column>
                        </p:dataTable>    
                    </h:form>
                    </div> 
                </p:tab>
                <p:tab title="Pendientes" >
                    <div class="card">
                        <h:form id="ArticulosPendientes"> 
                        <p:dataTable value="#{ArticulosController.filteredArticulosSinProcesar}" var="articulo"  widgetVar="ArticulosRevisionTable"
                                     paginator="true" rows="8" paginatorPosition="bottom" id="ArticulosRevisionTable"
                                     emptyMessage="No se encontraron artículos con la critería proporcionada" stripedRows="true"
                                     globalFilterFunction="#{ArticulosController.globalFilterFunction}" reflow="true"
                                     filterBy="#{ArticulosController.filterBy}" selectionMode="single"
                                     selection="#{ArticulosController.selectedArticulo}" rowKey="#{articulo.codigo}">

                            <p:ajax event="rowSelect"  update="RevisionArticuloDialog"/>

                            <f:facet name="header">
                                <p:commandButton style="width: 100%" value="Procesado Rapido" actionListener="#{ArticulosController.procesadoRapido}" styleClass="ui-button-primary rounded-button"
                                                 process="@this" update="RevisionArticulosDialog" onclick="PF('RevisionArticulosDialog').show();"/>

                                <p:spacer height="1em"/>

                                <p:inputText id="globalFilter" onkeyup="PF('ArticulosRevisionTable').filter()"
                                             placeholder="Búsqueda general de todos los campos" style="color: var(--primary-color); width: 100%"/>

                            </f:facet>

                            <p:column exportable="false">
                                <div class="buttons">
                                    <p:commandButton value="Procesar" styleClass="rounded-button ui-button-secondary" process="@this" update="RevisionArticuloDialog"
                                                     icon="pi pi-sync" onclick="PF('RevisionArticuloDialog').show();" >
                                        <f:setPropertyActionListener value="#{articulo}" target="#{ArticulosController.selectedArticulo}" />
                                    </p:commandButton>
                                </div>
                            </p:column>

                            <p:column headerText="Código" sortBy="#{articulo.codigo}" visible="false">
                                <h:outputText value="#{articulo.codigo}"/>
                            </p:column>
                            <p:column headerText="Nombre" sortBy="#{articulo.nombre}">
                                <h:outputText value="#{articulo.nombre}"/>
                            </p:column>
                            <p:column headerText="Código de Barra" sortBy="#{articulo.codigoBarra}">
                                <h:outputText value="#{articulo.codigoBarra}"/>
                            </p:column>
                            <p:column headerText="Código Cabys" sortBy="#{articulo.codigoCabys}" visible="false">
                                <h:outputText value="#{articulo.codigoCabys.codigo}"/>
                            </p:column>

                        </p:dataTable>

                    </h:form>
                    </div> 
                </p:tab>
                <p:tab title="Promociones">
                    <div class="card">
                        <h:form id="promociones"> 
                        <p:dataTable value="#{PromocionesController.filteredPromocions}" var="promocion" 
                                     widgetVar="Promociones" paginator="true" rows="8" 
                                     paginatorPosition="bottom" id="PromocionesTableData"
                                     emptyMessage="No se encontraron promociones con la critería proporcionada"
                                     globalFilterFunction="#{PromocionesController.globalFilterFunction}"
                                     filterBy="#{PromocionesController.filterBy}" reflow="true" 
                                     selectionMode="single" selection="#{PromocionesController.selectedPromocion}" 
                                     rowKey="#{promocion.id}">

                            <p:ajax event="rowSelect" update="@this"/>

                            <f:facet name="header">
                                <p:commandButton value="Crear Promocion" actionListener="#{PromocionesController.openNewPromocion()}" process="@this"
                                                 update="@this" styleClass="rounded-button ui-button-primary" style="width: 100%" />

                                <p:spacer height="1em"/>

                                <p:inputText id="globalFilter" onkeyup="PF('Promociones').filter()"
                                             placeholder="Búsqueda general de todos los campos" style="color: var(--primary-color); width: 100%"/>
                            </f:facet>

                            <p:column headerText="Código" sortBy="#{promocion.id}" visible="false">
                                <h:outputText value="#{promocion.id}"/>
                            </p:column>

                            <p:column headerText="Nombre" sortBy="#{promocion.nombre}">
                                <h:outputText value="#{promocion.nombre}"/>
                            </p:column>

                            <p:column headerText="Artículos">
                                <p:commandButton value="Ver Artículos" 
                                                 onclick="PF('articulosDialog').show();"
                                                 process="@this">
                                    <f:setPropertyActionListener value="#{promocion}" 
                                                                 target="#{PromocionesController.selectedPromocion}" />
                                </p:commandButton>
                            </p:column>

                            <p:column headerText="Fecha Inicio">
                                <h:outputText value="#{promocion.fechaInicio}"/>
                            </p:column>

                            <p:column headerText="Fecha Fin">
                                <h:outputText value="#{promocion.fechaFin}"/>
                            </p:column>

                            <p:column headerText="Descuento">
                                <h:outputText value="#{promocion.descuento}"/>
                                <h:outputText value="No Aplica" rendered="#{promocion.descuento eq null}"/>
                            </p:column>

                            <p:column headerText="Creador" sortBy="#{promocion.usuario.username}" visible="true">
                                <h:outputText value="#{promocion.usuario.username}"/>
                            </p:column>

                            <p:column headerText="Estatus" visible="false">
                                <h:outputText value="#{promocion.activa}"/>
                            </p:column>

                            <p:column headerText="Acciones" exportable="false">
                                <div class="buttons">
                                    <p:commandButton styleClass="rounded-button ui-button-success" process="@this" icon="pi pi-pencil"
                                                     actionListener="#{PromocionesController.editPromocion()}" update="EditPromocionDialog">
                                        <f:setPropertyActionListener value="#{promocion}" target="#{PromocionesController.selectedPromocion}" />
                                    </p:commandButton>
                                    <p:commandButton styleClass="rounded-button ui-button-warning" icon="pi pi-power-off"
                                                     actionListener="#{PromocionesController.deletePromocion()}" process="@this" update="@this">
                                        <f:setPropertyActionListener value="#{promocion}" target="#{PromocionesController.selectedPromocion}" />
                                    </p:commandButton>
                                </div>
                            </p:column>

                        </p:dataTable>



                    </h:form>
                    </div> 
                </p:tab> 
            </p:tabView>
        </p:card> 

        <ui:include src="/secured/fragments/CaByS/CabysDialogEdit.xhtml"/>  
        <ui:include src="/secured/fragments/Articulos/PendientesRevision/DialogoRevisionArticulo.xhtml"/>
        <ui:include src="/secured/fragments/Articulos/PendientesRevision/DialogoRevisionArticulos.xhtml"/>
        <ui:include src="/secured/fragments/Articulos/Activos/CreateArticuloDialog.xhtml"/>
        <ui:include src="/secured/fragments/Articulos/Activos/EditArticuloDialog.xhtml"/>
        <ui:include src="/secured/fragments/Articulos/Inactivos/verDetalles.xhtml"/>
        <ui:include src="/secured/fragments/Articulos/ActivosYProcesados/verDetalles.xhtml"/>

        <ui:include src="/secured/fragments/Articulos/Promociones/CreatePromocionDialog.xhtml"/>
        <ui:include src="/secured/fragments/Articulos/Promociones/EditPromocionDialog.xhtml"/>

        <!-- Dialog for displaying articulosCarrito -->
        <p:dialog header="Artículos de Promoción" widgetVar="articulosDialog" modal="true" fitViewport="true" 
                  responsive="true" dynamic="true" cache="false" closable="true" closeOnEscape="true" appendTo="@(body)">
            <h:form>
                <p:dataTable value="#{PromocionesController.selectedPromocion.articulosCarrito}" 
                             var="articuloCarrito" reflow="true" style="width:100%;">
                    <p:column headerText="Nombre Artículo">
                        <h:outputText value="#{articuloCarrito.articulo.nombre}"/>
                    </p:column>
                    <p:column headerText="Cantidad">
                        <h:outputText value="#{articuloCarrito.cantidad}"/>
                    </p:column>
                    <p:column headerText="Precio Regular">
                        <h:outputText value="#{articuloCarrito.articulo.lastPrecio.precioFinal}"/>
                    </p:column>

                </p:dataTable>
            </h:form>
        </p:dialog>

    </h:body>
</html>
