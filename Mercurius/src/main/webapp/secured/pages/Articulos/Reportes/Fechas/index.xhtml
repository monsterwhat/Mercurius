<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:f="jakarta.faces.core"
      class="#{ThemeController.currentTheme}">

    <h:head>
        <title>Reportes de Movimientos por Fechas</title>
        <meta charset="utf-8" name="viewport" content="width=device-width, initial-scale=1"/> 
        <script>
            PrimeFaces.locales['es'] = {
                monthNames: ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'],
                monthNamesShort: ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'],
                dayNames: ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'],
                dayNamesShort: ['Dom', 'Lun', 'Mar', 'Mie', 'Jue', 'Vie', 'Sab'],
                dayNamesMin: ['D', 'L', 'M', 'X', 'J', 'V', 'S'],
                weekHeader: 'Semana',
                firstDay: 1,
                isRTL: false,
                showMonthAfterYear: false,
                yearSuffix: '',
                timeOnlyTitle: 'Sólo hora',
                timeText: 'Tiempo',
                hourText: 'Hora',
                minuteText: 'Minuto',
                secondText: 'Segundo',
                millisecondText: 'Milisegundo',
                ampm: false,
                month: 'Mes',
                week: 'Semana',
                day: 'Día',
                allDayText: 'Todo el día',
                today: 'Hoy',
                now: 'Ahora',
                clear: 'Limpiar',
                aria: {
                    close: 'Cerrar',
                    previous: 'Anterior',
                    next: 'Siguiente',
                }
            };
        </script>
    </h:head>

    <h:body >

        <ui:include src="/secured/fragments/userBar.xhtml" />

        <section class="section">

            <div class="columns is-multiline has-text-centered">
                <div class="column is-full">
                    <p class="title is-3">Reporte de Movimientos de Inventario</p> 
                </div>
                <div class="column">  
                    <div class="card">
                        <p:outputPanel id="grid">
                            <h:form rendered="#{!reportesDiariosController.status}">
                                <p:growl showDetail="true" showSummary="true" />
                                <p:messages/>

                                <p:card title="Seleccione el usuario y las fechas a consultar" style="width: 50%; display: inline-block; text-align: left;">
                                    <h:panelGrid columns="2" style="text-align: center; width: 100%">
                                        <p:selectOneMenu id="selectOneMenu" label="Seleccionar Usuarios" style="width: 100%"
                                                         value="#{reportesDiariosController.usuarioSelecionadoId}">
                                            <f:selectItems value="#{reportesDiariosController.usuarios}" itemValue="#{usuarios.id}" var="usuarios" itemLabel="#{usuarios.username}"/>
                                        </p:selectOneMenu>

                                        <p:datePicker id="datePicker" value="#{reportesDiariosController.range}" readonlyInput="true" selectionMode="range" showButtonBar="true" locale="es" 
                                                      monthNavigator="true" yearNavigator="true" showWeek="true" style="width: 100%"/>
                                    </h:panelGrid>
                                    <p:spacer height="1em"/>
                                    <h:panelGroup>
                                        <p:commandButton value="Cargar Reportes" actionListener="#{reportesDiariosController.cargar()}"
                                                         update="grid" style="width: 100%" styleClass="ui-button-primary rounded-button"/>
                                    </h:panelGroup>
                                </p:card>
                            </h:form> 

                            <h:form rendered="#{reportesDiariosController.status}">
                                <p:commandButton value="Exportar Excel" icon="pi pi-file-excel" 
                                                 style="width: 100%" styleClass="ui-button-success rounded-button" ajax="false">
                                    <p:dataExporter type="xlsx" target="reportes" fileName="Reportes-Mercurius" />
                                </p:commandButton> 
                                <p:spacer height="1em"/>
                                <p:dataTable id="reportes" showGridlines="true"  stripedRows="true" value="#{reportesDiariosController.movimientos}" reflow="true" var="movimiento">
                                    <p:column headerText="Fecha" sortBy="#{movimiento.fechaMovimiento}">
                                        <h:outputText value="#{movimiento.fechaMovimiento}"/>
                                    </p:column>
                                    <p:column headerText="Cod.Barra" sortBy="#{movimiento.articulo.codigoBarra}">
                                        <h:outputText value="#{movimiento.articulo.codigoBarra}"/>
                                    </p:column> 
                                    <p:column headerText="Articulo" sortBy="#{movimiento.articulo.nombre}">
                                        <h:outputText value="#{movimiento.articulo.nombre}"/>
                                    </p:column> 
                                    <p:column headerText="Cantidad" sortBy="#{movimiento.cantidad}">
                                        <h:outputText value="#{movimiento.cantidad}"/>
                                    </p:column>
                                    <p:column headerText="Usuario" sortBy="#{movimiento.usuario.username}">
                                        <h:outputText value="#{movimiento.usuario.username}"/>
                                    </p:column>
                                    <p:column headerText="Tipo" sortBy="#{movimiento.tipoMovimiento}">
                                        <h:outputText value="#{movimiento.tipoMovimiento}"/>
                                    </p:column>
                                    <p:column headerText="Detalles" sortBy="#{movimiento.notas}">
                                        <h:outputText value="#{movimiento.notas}"/>
                                    </p:column>
                                </p:dataTable>
                            </h:form> 
                        </p:outputPanel>
                    </div>
                </div>
            </div>
        </section>
 
        <ui:include src="/secured/fragments/Inventario/Activos/verDetallesDeAjuste.xhtml"/>
        <ui:include src="/secured/fragments/Inventario/Upload/subirFacturas.xhtml"/>

    </h:body>
</html>
