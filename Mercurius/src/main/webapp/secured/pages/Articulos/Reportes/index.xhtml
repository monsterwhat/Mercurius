<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<h:head>
    <title>Menu Principal Reportes de Articulos</title>
    <meta charset="utf-8" name="viewport" content="width=device-width, initial-scale=1"/>
    <h:outputStylesheet name="primefaces/primefaces.css"/>
    <h:outputStylesheet name="primefaces/themes/#{ThemeController.currentTheme}/theme.css" />
</h:head>

<h:body>
    <p:growl id="growl" showDetail="true" showSummary="true" />

    <p:panelGrid columns="1">
        <p:column>
            <ui:include src="/secured/fragments/userBar.xhtml" />
        </p:column>
    </p:panelGrid>
                
    <p:panelGrid columns="3">
        <p:card>
            <p:badge value="#{ArticulosController.articulosActivosCount()}" severity="success">
                <i class="pi pi-check-circle" style="font-size: 2rem"/>
            </p:badge>
            <p:tag styleClass="mr-2" severity="success" value="Articulos Activos" rounded="true"></p:tag>
        </p:card>
        <p:card>
            <p:badge value="#{ArticulosController.articulosPendientesCount()}" severity="warning">
                <i class="pi pi-sync" style="font-size: 2rem"/>
            </p:badge>
            <p:tag styleClass="mr-2" severity="warning" value="Articulos Pendientes" rounded="true"></p:tag>
        </p:card>
        <p:card>
            <p:badge value="#{ArticulosController.articulosInactivosCount()}" severity="danger">
                <i class="pi pi-times-circle" style="font-size: 2rem" />
            </p:badge>
            <p:tag styleClass="mr-2" severity="danger" value="Articulos Inactivos" rounded="true"></p:tag>
        </p:card>
    </p:panelGrid>
    
    <p:panelGrid columns="1">
        <p:card>
            <h:form id="Articulos">
                <p:card rendered="#{SessionController.registros}" >
                    <p:panelGrid columns="1">
                        <p:column>
                            <p:commandButton value="Imprimir" icon="pi pi-print" action="#{ArticulosController.exportPDF('Articulos:ArticulosTableData')}" 
                                             ajax="false" styleClass="rounded-button ui-button-primary"  style="width: 50%"
                            oncomplete="printPDF('#{ArticulosController.contextPath}/jakarta.faces.resource/reporteArticulos.pdf')"/>
                            <p:commandButton value="Exportar Excel" icon="pi pi-file-excel"
                                styleClass="rounded-button ui-button-success"  style="width: 50%"/>
                        </p:column>
                    </p:panelGrid>
                </p:card>

                <p:dataTable value="#{ArticulosController.filteredArticulosFull}" var="articulo"  widgetVar="ArticulosTable"
                             paginator="true" rows="8" paginatorPosition="bottom" id="ArticulosTableData"
                             emptyMessage="No se encontraron artículos con la critería proporcionada"
                             globalFilterFunction="#{ArticulosController.globalFilterFunction}"
                             filterBy="#{ArticulosController.filterBy}" reflow="true" selectionMode="single"
                             selection="#{ArticulosController.selectedArticulo}" rowKey="#{articulo.codigo}">

                    <p:ajax event="rowSelect" update="EditArticuloDialog"/>

                    <f:facet name="header">
                        <p:inputText id="globalFilter" onkeyup="PF('ArticulosTable').filter()"
                                     placeholder="Búsqueda general de todos los campos" style="color: var(--primary-color); width: 100%"/>
                    </f:facet>

                    <p:column>
                        <p:chip id="processedChip" icon="pi pi-exclamation-circle" style="background: var(--green-500)"
                                rendered="#{articulo.processed}"/>
                        <p:tooltip for="processedChip" value="Procesada" position="top"/>
                        <p:chip id="unprocessedChip" icon="pi pi-exclamation-circle" style="background: var(--yellow-500)"
                                rendered="#{!articulo.processed}"/>
                        <p:tooltip for="unprocessedChip" value="Sin procesar" position="top"/>
                        <p:chip id="ActiveChip" icon="pi pi-check" style="background: var(--green-500)"
                                rendered="#{articulo.status}"/>
                        <p:tooltip for="ActiveChip" value="Activa" position="top"/>
                        <p:chip id="InactiveChip" icon="pi pi-times" style="background: var(--red-500);"
                                rendered="#{!articulo.status}"/>
                        <p:tooltip for="InactiveChip" value="Inactiva" position="top"/>
                    </p:column>

                    <p:column headerText="Código" sortBy="#{articulo.codigo}" visible="false">
                        <h:outputText value="#{articulo.codigo}"/>
                    </p:column>
                    <p:column headerText="Código de Barra" sortBy="#{articulo.codigoBarra}">
                        <h:outputText value="#{articulo.codigoBarra}"/>
                    </p:column>
                    <p:column headerText="Código Cabys" sortBy="#{articulo.codigoCabys}">
                        <h:outputText value="#{articulo.codigoCabys.codigo}"/>
                    </p:column>                            
                    <p:column headerText="Nombre" sortBy="#{articulo.nombre}">
                        <h:outputText value="#{articulo.nombre}"/>
                    </p:column>
                    <p:column headerText="Precio Costo Sin IVA" sortBy="#{articulo.lastPrecio.precioCostoSinIVA}" visible="false">
                        <h:outputText value="#{articulo.lastPrecio.precioCostoSinIVA}"/>
                    </p:column>
                    <p:column headerText="Porcentaje Utilidad" sortBy="#{articulo.lastPrecio.porcentajeUtilidad}" visible="false">
                        <h:outputText value="#{articulo.lastPrecio.porcentajeUtilidad}"/>
                    </p:column>
                    <p:column headerText="Precio Final" sortBy="#{articulo.lastPrecio.precioConUtilidad}" visible="false">
                        <h:outputText value="#{articulo.lastPrecio.precioConUtilidad}"/>
                    </p:column>
                    <p:column headerText="Precio Final Con IVA" sortBy="#{articulo.lastPrecio.precioFinal}">
                        <h:outputText value="#{articulo.lastPrecio.precioFinal}"/>
                    </p:column>

                    <p:column headerText="Acciones" exportable="false">
                        <div class="buttons">
                            <p:commandButton styleClass="rounded-button ui-button-success" process="@this" icon="pi pi-pencil"
                                onclick="PF('EditArticuloDialog').show();" update="EditArticuloDialog">
                                <f:setPropertyActionListener value="#{articulo}" target="#{ArticulosController.selectedArticulo}" />
                            </p:commandButton>
                            <p:commandButton styleClass="rounded-button ui-button-info" onclick="PF('ArticuloDetailsDialog').show();"
                                             icon="pi pi-eye" process="@this" update="selectedArticulo">
                                <f:setPropertyActionListener value="#{articulo}" target="#{ArticulosController.selectedArticulo}" />
                            </p:commandButton>
                            <p:commandButton styleClass="rounded-button ui-button-warning" icon="pi pi-power-off"
                            actionListener="#{ArticulosController.deleteArticulo()}" process="@this" update="@this">
                                <f:setPropertyActionListener value="#{articulo}" target="#{ArticulosController.selectedArticulo}" />
                            </p:commandButton>
                        </div>
                    </p:column>
                </p:dataTable>

                <p:commandButton value="Crear Artículo" actionListener="#{ArticulosController.openNewArticulo()}" process="@this"
                update="@this" styleClass="rounded-button ui-button-primary" style="width: 100%" />

                </h:form>
        </p:card>
            
    </p:panelGrid>
    
    <ui:include src="/secured/fragments/Articulos/Reportes/CreateArticuloDialog.xhtml"/>
    <ui:include src="/secured/fragments/Articulos/Reportes/EditArticuloDialog.xhtml"/>
    <ui:include src="/secured/fragments/Articulos/Reportes/verDetalles.xhtml"/>

    
</h:body>
</html>
