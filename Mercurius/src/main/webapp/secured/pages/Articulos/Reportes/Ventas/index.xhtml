<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:f="jakarta.faces.core">

<h:head>
    <title>Reportes de Ventas por Fechas</title>
    <meta charset="utf-8" name="viewport" content="width=device-width, initial-scale=1"/>
    <h:outputStylesheet name="primefaces/primefaces.css"/>
    <h:outputStylesheet name="primefaces/themes/#{ThemeController.currentTheme}/theme.css" />
    <script>
        PrimeFaces.locales['es'] = {
            monthNames: ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'],
            monthNamesShort: ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'],
            dayNames: ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'],
            dayNamesShort: ['Dom', 'Lun', 'Mar', 'Mie', 'Jue', 'Vie', 'Sab'],
            dayNamesMin: ['D', 'L', 'M', 'X', 'J', 'V', 'S'],
            weekHeader: 'Semana',
            firstDay: 1,
            isRTL: false,
            showMonthAfterYear: false,
            yearSuffix: '',
            timeOnlyTitle: 'Sólo hora',
            timeText: 'Tiempo',
            hourText: 'Hora',
            minuteText: 'Minuto',
            secondText: 'Segundo',
            millisecondText: 'Milisegundo',
            ampm: false,
            month: 'Mes',
            week: 'Semana',
            day: 'Día',
            allDayText: 'Todo el día',
            today: 'Hoy',
            now: 'Ahora',
            clear: 'Limpiar',
            aria: {
               close: 'Cerrar',
               previous: 'Anterior',
               next: 'Siguiente',
           }
        };
</script>
</h:head>

<h:body>
    <p:panelGrid columns="1" id="grid">
        <p:row>
            <p:column>
                <ui:include src="/secured/fragments/userBar.xhtml" /> 
            </p:column>
        </p:row>        
        
        <p:row>
            <p:column rendered="#{!reportesDiariosController.status}">
                <h:form>
                    <p:growl showDetail="true" showSummary="true" />
                    <p:messages/>
                    <p:card style="text-align: center;" title="Reporte de ventas de Articulos x Cajero">
                        <p:card title="Seleccione el usuario y las fechas a consultar" style="width: 50%; display: inline-block; text-align: left;">
                            <h:panelGrid columns="2" style="text-align: center; width: 100%">
                                <p:selectOneMenu id="selectOneMenu" label="Seleccionar Usuarios" style="width: 100%"
                                                     value="#{reportesDiariosController.usuarioSelecionadoId}">
                                    <f:selectItems value="#{reportesDiariosController.usuarios}" itemValue="#{usuarios.id}" var="usuarios" itemLabel="#{usuarios.username}"/>
                                </p:selectOneMenu>

                                <p:datePicker id="datePicker" value="#{reportesDiariosController.range}" readonlyInput="true" selectionMode="range" showButtonBar="true" locale="es" 
                                              monthNavigator="true" yearNavigator="true" showWeek="true" style="width: 100%"/>
                            </h:panelGrid>
                                <p:spacer height="1em"/>
                            <h:panelGroup>
                                <p:commandButton value="Cargar Reportes" actionListener="#{reportesDiariosController.cargarVentasPorCajero()}"
                                                 update="grid" style="width: 100%" styleClass="ui-button-primary rounded-button"/>
                            </h:panelGroup>
                        </p:card>
                    </p:card>
                </h:form>
                
            </p:column>
            <p:column rendered="#{reportesDiariosController.status}">
                <h:form>
                    <p:card style="text-align: center;" title="Reporte de ventas de Articulos x Cajero">
                    <p:commandButton value="Exportar Excel" icon="pi pi-file-excel" 
                                style="width: 100%" styleClass="ui-button-success rounded-button" ajax="false">
                    <p:dataExporter type="xlsx" target="reportes" fileName="Reportes-Mercurius" />
                   </p:commandButton>
                    <p:commandButton value="Imprimir" icon="pi pi-file-excel" actionListener="#{reportesDiariosController.imprimirReporteVentasXCajero()}"
                                    style="width: 100%" styleClass="ui-button-success rounded-button" ajax="false">
                    </p:commandButton>
                    <p:spacer height="1em"/>
                    <p:dataTable id="reportes" showGridlines="true"  stripedRows="true" value="#{reportesDiariosController.lineasDetalle}" reflow="true" var="detalles">
                            <f:facet name="header">
                                <p:outputLabel  value="Reportes de #{reportesDiariosController.getFecha(0)} hasta #{reportesDiariosController.getFecha(1)}"/>
                            </f:facet>
                        
                            <p:column headerText="Nombre">
                                <h:outputText value="#{detalles.detalle}"/>
                            </p:column>
                            <p:column headerText="Cantidad">
                                <h:outputText value="#{detalles.cantidad}"/>
                            </p:column>                            
                            <p:column headerText="Precio">
                                <h:outputText value="#{detalles.montoTotalLinea}"/>
                            </p:column>
                        
                            <f:facet name="footer">
                            <p:outputLabel  value="Total #{reportesDiariosController.totalReporteVentasXCajero()}"/>
                            </f:facet>
                        </p:dataTable>
                    </p:card>
                </h:form>
                
            </p:column>
        </p:row>
    </p:panelGrid>
            
</h:body>
</html>
