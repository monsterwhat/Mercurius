<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<h:head>
    <title>Catalago de Articulos Activos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css"/>
    <meta charset="utf-8" name="viewport" content="width=device-width, initial-scale=1"/>
    <script src="../../../resources/css/style.css"/>
    <script src="/resources/js/functions.js"/>
    <h:outputStylesheet name="primefaces/primefaces.css"/>
    <h:outputStylesheet name="primefaces/themes/nova-light/theme.css"/>
    <link rel="stylesheet" href="https://unpkg.com/primeflex@latest/primeflex.css"/>     
    
</h:head>

<h:body>
    <div class="container mt-5">
        <div class="columns">
            <div class="column">
                <div class="box">
                    <ui:include src="/secured/fragments/userBar.xhtml" />
                    
                    <ui:include src="../../pages/mainMenu.xhtml" />
                    
                    <p:growl showDetail="true" showSummary="true" />
                    
                    <ui:include src="/secured/fragments/Articulos/Activos/CreateArticuloDialog.xhtml"/>
                    <ui:include src="/secured/fragments/Articulos/Activos/EditArticuloDialog.xhtml"/>

                    <h:form id="ArticulosActivos">
                        
                    <p:panel styleClass="box" rendered="#{SessionController.registros}" >
                        <div class="columns">
                            <div class="column is-half">
                                <p:commandButton value="Imprimir" icon="pi pi-print" action="#{ArticulosController.exportPDF('ArticulosActivos:ArticulosTableData')}" 
                                                 ajax="false" styleClass="button is-rounded is-fullwidth"
                                oncomplete="printPDF('#{ArticulosController.contextPath}/jakarta.faces.resource/reporteArticulosActivos.pdf')"/>
                            </div>
                            <div class="column">
                                <p:commandButton value="Exportar Excel" icon="pi pi-file-excel"
                                    styleClass="button is-rounded is-success is-light is-fullwidth"/>
                            </div>
                            <div class="column">
                                <p:commandButton value="Exportar PDF" icon="pi pi-file-pdf"
                                styleClass="button is-rounded is-danger is-light is-fullwidth"/>
                            </div>
                        </div>
                    </p:panel>

                    <p:dataTable value="#{ArticulosController.filteredArticulosActivos}" var="articulo"  widgetVar="ArticulosTable"
                                 paginator="true" rows="8" paginatorPosition="bottom" id="ArticulosTableData"
                                 emptyMessage="No se encontraron artículos con la critería proporcionada"
                                 globalFilterFunction="#{ArticulosController.globalFilterFunction}"
                                 filterBy="#{ArticulosController.filterBy}" reflow="true"
                                 selection="#{ArticulosController.selectedArticulo}" rowKey="#{articulo.codigo}">

                        <p:ajax event="rowSelect" update="EditArticuloDialog"/>

                        <f:facet name="header">
                            <p:inputText id="globalFilter" onkeyup="PF('ArticulosTable').filter()"
                                         placeholder="Búsqueda general de todos los campos" styleClass="input"/>
                        </f:facet>

                        <p:column>
                            <p:chip id="processedChip" icon="pi pi-exclamation-circle" styleClass="has-background-success"
                                    rendered="#{articulo.processed}"/>
                            <p:tooltip for="processedChip" value="Procesada" position="top"/>
                            <p:chip id="unprocessedChip" icon="pi pi-exclamation-circle" styleClass="has-background-warning"
                                    rendered="#{!articulo.processed}"/>
                            <p:tooltip for="unprocessedChip" value="Sin procesar" position="top"/>
                            <p:chip id="ActiveChip" icon="pi pi-check" styleClass="has-background-success" 
                                    rendered="#{articulo.status}"/>
                            <p:tooltip for="ActiveChip" value="Activa" position="top"/>
                            <p:chip id="InactiveChip" icon="pi pi-times" styleClass="has-background-danger" 
                                    rendered="#{!articulo.status}"/>
                            <p:tooltip for="InactiveChip" value="Inactiva" position="top"/>
                        </p:column>

                        <p:column headerText="Código" sortBy="#{articulo.codigo}" visible="false">
                            <h:outputText value="#{articulo.codigo}"/>
                        </p:column>
                        <p:column headerText="Código de Barra" sortBy="#{articulo.codigoBarra}">
                            <h:outputText value="#{articulo.codigoBarra}"/>
                        </p:column>
                        <p:column headerText="Código Cabys" sortBy="#{articulo.codigoCabys}">
                            <h:outputText value="#{articulo.codigoCabys.codigo}"/>
                        </p:column>                            
                        <p:column headerText="Nombre" sortBy="#{articulo.nombre}">
                            <h:outputText value="#{articulo.nombre}"/>
                        </p:column>
                        <p:column headerText="Precio Costo Sin IVA" sortBy="#{articulo.precioCostoSinIVA}" visible="false">
                            <h:outputText value="#{articulo.precioCostoSinIVA}"/>
                        </p:column>
                        <p:column headerText="Porcentaje Utilidad" sortBy="#{articulo.porcentajeUtilidad}" visible="false">
                            <h:outputText value="#{articulo.porcentajeUtilidad}"/>
                        </p:column>
                        <p:column headerText="Precio Final" sortBy="#{articulo.precioFinal}" visible="false">
                            <h:outputText value="#{articulo.precioFinal}"/>
                        </p:column>
                        <p:column headerText="Precio Final Con IVA" sortBy="#{articulo.precioCostoConIVA}">
                            <h:outputText value="#{articulo.precioCostoConIVA}"/>
                        </p:column>

                        <p:column headerText="Acciones" exportable="false">
                            <div class="buttons">
                                <p:commandButton styleClass="button is-rounded is-success" process="@this" icon="pi pi-pencil"
                                    onclick="PF('EditArticuloDialog').show();" update="EditArticuloDialog">
                                    <f:setPropertyActionListener value="#{articulo}" target="#{ArticulosController.selectedArticulo}" />
                                </p:commandButton>
                                <p:commandButton styleClass="button is-rounded is-warning" icon="pi pi-trash"
                                actionListener="#{ArticulosController.deleteArticulo()}" process="@this" update="@this">
                                    <f:setPropertyActionListener value="#{articulo}" target="#{ArticulosController.selectedArticulo}" />
                                </p:commandButton>
                            </div>
                        </p:column>
                    </p:dataTable>
                    
                    <p:commandButton value="Crear Artículo" actionListener="#{ViewController.selectCreateArticulos}" process="@this"
                    update="@this" styleClass="button is-fullwidth is-success is-rounded" />
                    
                    
                    </h:form>
                </div>
            </div>
        </div>
    </div>
</h:body>
</html>
