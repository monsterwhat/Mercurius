<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<h:head>
    <title>Menu Principal Clientes</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css"/>
    <meta charset="utf-8" name="viewport" content="width=device-width, initial-scale=1"/>
    <script src="../../../resources/css/style.css"/>
</h:head>

<h:body>
    <div class="container mt-5">
        <div class="columns">
            <div class="column">
                <div class="box">
                    <div class="columns">
                        <div class="column">
                                <div class="message-body">
                                    <div class="columns is-mobile">
                                        <div class="column is-four-fifths">
                                            <h1 class="title">Bienvenid@, #{SessionController.currentUser.username}!</h1>
                                        </div>
                                        <div class="column">
                                            <p:commandButton styleClass="button is-rounded is-danger is-2" icon="pi pi-sign-out" value="Salir" actionListener="#{SessionController.logOut()}" />
                                        </div>
                                    </div>
                                </div>
                        </div>
                    </div>
                    
                    <ui:include src="../../pages/mainMenu.xhtml" />
                    
                    <p:growl showDetail="true" showSummary="true" />
                    
                    <ui:include src="/secured/fragments/Clients/CrearClientesDialog.xhtml" />
                    <ui:include src="/secured/fragments/Clients/EditClientesDialog.xhtml" />
                    
                    
                    <h:form id="clientes">
                        
                        <p:toolbar rendered="#{SessionController.admin}">
                            <p:toolbarGroup align="right">
                                <p:commandButton value="Exportar Excel" icon="pi pi-file-excel" styleClass="ui-button-help" ajax="false">
                                    <p:dataExporter type="xlsx" target="ClientsTableData" fileName="Clientes-Mercurius-Excel" />
                                </p:commandButton>
                                <p:commandButton value="Exportar PDF" icon="pi pi-file-pdf" styleClass="ui-button-help" ajax="false">
                                    <p:dataExporter type="pdf" target="ClientsTableData" fileName="Clientes-Mercurius-PDF" />
                                </p:commandButton>
                            </p:toolbarGroup>
                        </p:toolbar>
                        
                        <p:dataTable value="#{ClientsController.filteredClients}" var="client"  widgetVar="ClientsTableData"
                                     paginator="true" rows="8" paginatorPosition="bottom" id="ClientsTableData"
                                     emptyMessage="No se encontraron clientes con la critería proporcionada"
                                     globalFilterFunction="#{ClientsController.globalFilterFunction}"
                                     filterBy="#{ClientsController.filterBy}" reflow="true"
                                     selection="#{ClientsController.selectedClient}" rowKey="#{client.code}">
                            
                            <p:ajax event="rowSelect" update="EditarClienteDialog"/>
                            
                            <f:facet name="header">
                                <p:inputText id="globalFilter" onkeyup="PF('ClientsTableData').filter()"
                                             placeholder="Búsqueda general de todos los campos" styleClass="input"/>
                            </f:facet>
                                          
                            <p:column exportable="false">
                                <p:chip id="activo" icon="pi pi-exclamation-circle" styleClass="has-background-success" rendered="#{client.status}"/>
                                <p:tooltip for="activo" value="Activo" position="top"/>                            
                                <p:chip id="inactivo" icon="pi pi-times" styleClass="has-background-danger" rendered="#{!client.status}"/>
                                <p:tooltip for="inactivo" value="Inactivo" position="top"/>
                            </p:column>
                            
                            <p:column headerText="ID Cliente" visible="false">
                                <h:outputText value="#{client.code}"/>
                            </p:column>
                            <p:column headerText="Nombre" sortBy="#{client.name}">
                                <h:outputText value="#{client.name}"/>
                            </p:column>
                            <p:column headerText="Dirección" sortBy="#{client.address}">
                                <h:outputText value="#{client.address}" />
                            </p:column>
                            <p:column headerText="Correo" sortBy="#{client.email}">
                                <h:outputText value="#{client.email}" />
                            </p:column>
                            <p:column headerText="Nacimiento" sortBy="#{client.birthDate}" visible="false">
                                <h:outputText value="#{client.birthDate}" />
                            </p:column>
                            <p:column headerText="Tipo de Cédula" sortBy="#{client.idType}" visible="false">
                                <h:outputText value="#{client.idType}" />
                            </p:column>
                            <p:column headerText="Número de Cédula" sortBy="#{client.idNumber}">
                                <h:outputText value="#{client.idNumber}" />
                            </p:column>
                            <p:column headerText="Descuento" sortBy="#{client.discount}" visible="false">
                                <h:outputText value="#{client.discount}" />
                            </p:column>
                            <p:column headerText="Número de Teléfono" sortBy="#{client.phoneNumber}">
                                <h:outputText value="#{client.phoneNumber}" />
                            </p:column>
                            <p:column headerText="Tributador" sortBy="#{client.taxpayer}">
                                <h:outputText value="#{client.taxpayer}" />
                            </p:column>
                            <p:column headerText="Código de Zona" sortBy="#{client.zoneCode}">
                                <h:outputText value="#{client.zoneCode}" />
                            </p:column>
                            <p:column headerText="Estado" visible="false" sortBy="#{client.status}">
                                <h:outputText value="#{client.status}" />
                            </p:column>                            
                            <p:column headerText="Acciones" exportable="false">
                                <div class="buttons">
                                    <p:commandButton styleClass="button is-rounded is-success" icon="pi pi-pencil"
                                      process="@this" onclick="PF('EditarClienteDialog').show();">
                                        <f:setPropertyActionListener value="#{client}" target="#{ClientsController.selectedClient}" />
                                    </p:commandButton>
                                    <p:commandButton styleClass="button is-rounded is-warning" icon="pi pi-power-off"
                                    actionListener="#{ClientsController.toggleClient()}" process="@this" update="clientes">
                                        <f:setPropertyActionListener value="#{client}" target="#{ClientsController.selectedClient}" />
                                    </p:commandButton>
                                </div>
                            </p:column>
                        </p:dataTable>
                        <p:commandButton value="Crear Cliente" onclick="PF('CrearClienteDialog').show();" actionListener="#{ClientsController.openNewClient}" styleClass="button is-fullwidth is-success is-rounded"/>
                
                    </h:form>
                </div>
            </div>
        </div>
    </div>
</h:body>
</html>
