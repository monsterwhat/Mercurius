<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <h:head>
        <title>Menu Principal Facturas Emitidas</title>
        <meta charset="utf-8" name="viewport" content="width=device-width, initial-scale=1"/>
        <h:outputStylesheet name="primefaces/primefaces.css"/>
        <h:outputStylesheet name="primefaces/themes/#{ThemeController.currentTheme}/theme.css" />
    </h:head>

    <h:body> 

        <ui:include src="/secured/fragments/userBar.xhtml" /> 

        <p:growl showDetail="true" showSummary="true" />

        <p:card style="text-align: center" title="Facturas Emitidas">
            <h:form id="recibos">
                <div class="ui-g">
                    <p:commandButton value="Exportar Excel" icon="pi pi-file-excel" styleClass="rounded-button ui-button-success" 
                                     style='width: 100%' ajax="false">
                        <p:dataExporter type="xlsx" target="FacturasTableData" fileName="Facturas-Mercurius-Excel" />
                    </p:commandButton>
                </div>
                <p:growl showDetail="true" showSummary="true" />

                <p:dataTable value="#{ComprobantesEmitidosController.filteredComprobantesEmitidos}" var="factura" widgetVar="FacturasTableData"
                             paginator="true" rows="10" paginatorPosition="bottom" id="FacturasTableData"
                             emptyMessage="No se encontraron registros de factura con la critería proporcionada"
                             globalFilterFunction="#{ComprobantesEmitidosController.globalFilterFunction}" lazy="false"
                             filterBy="#{ComprobantesEmitidosController.filterBy}" reflow="true" selectionMode="single"
                             selection="#{ComprobantesEmitidosController.selectedComprobanteEmitido}" rowKey="#{factura.id}">

                    <p:ajax event="rowSelect" update="recibos selectedComprobanteEmitidoDetallado"/>
                    <p:ajax event="rowUnselect" update="recibos selectedComprobanteEmitidoDetallado" />
                    <p:ajax event="toggleSelect" update="recibos selectedComprobanteEmitidoDetallado" />

                    <p:autoUpdate/>

                    <f:facet name="header">

                        <p:inputText id="globalFilter" onkeyup="PF('FacturasTableData').filter()"
                                     placeholder="Búsqueda general de todos los campos" style="color: var(--primary-color); width: 100%"/>
                    </f:facet>

                    <p:column exportable="false" selectionMode="single"/>

                    <p:column headerText="Código" visible="false" >
                        <h:outputText value="#{factura.id}"/>
                    </p:column>
                    <p:column headerText="Numero Consecutivo" sortBy="#{factura.encabezado.numeroConsecutivo}">
                        <h:outputText value="#{factura.encabezado.numeroConsecutivo}"/>
                    </p:column>
                    <p:column headerText="Fecha" sortBy="#{factura.encabezado.fechaEmision}">
                        <h:outputText value="#{factura.encabezado.fechaEmision}"/>
                    </p:column>
                    <p:column headerText="Emisor: " sortBy="#{factura.user.username}">
                        <h:outputText value="#{factura.user.username}"/>
                    </p:column>
                    <p:column headerText="Condicion Venta" sortBy="#{factura.encabezado.condicionVenta}">
                        <h:outputText value="#{factura.encabezado.condicionVenta}"/>
                    </p:column>

                    <p:column headerText="Acciones" width="6%" exportable="false">
                        <p:commandButton id="buttonSee" styleClass="rounded-button ui-button-info" process="@this"
                                         icon="pi pi-eye" onclick="PF('selectedComprobanteEmitidoDetallado').show(); PF('selectedComprobanteEmitidoDetallado').toggleMaximize();" >
                            <f:setPropertyActionListener value="#{factura}" target="#{ComprobantesEmitidosController.selectedComprobanteEmitido}" />
                        </p:commandButton>

                        <p:commandButton id="buttonToggle" styleClass="rounded-button ui-button-danger" icon="pi pi-power-off"
                                         actionListener="#{ComprobantesEmitidosController.toggleFactura()}" process="@this" update="@this recibos FacturasTableData">
                            <f:setPropertyActionListener value="#{factura}" target="#{ComprobantesEmitidosController.selectedComprobanteEmitido}" />
                        </p:commandButton>
                    </p:column>
                </p:dataTable>
            </h:form>
        </p:card>

        <ui:include src="/secured/fragments/Inventario/Activos/verDetallesDeAjuste.xhtml"/>
        <ui:include src="/secured/fragments/Facturas/Reportes/verDetallesFactura.xhtml"/>

    </h:body>
</html>
