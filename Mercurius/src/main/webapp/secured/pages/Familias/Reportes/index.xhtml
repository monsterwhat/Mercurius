<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<h:head>
    <title>Menu Principal Reportes de Familia</title>
    <meta charset="utf-8" name="viewport" content="width=device-width, initial-scale=1"/>
    <h:outputStylesheet name="primefaces/primefaces.css"/>
    <h:outputStylesheet name="primefaces/themes/#{ThemeController.currentTheme}/theme.css" />
</h:head>

<h:body>
    <p:growl id="growl" showDetail="true" showSummary="true" />

    <p:panelGrid columns="1">
        <p:column>
            <ui:include src="/secured/fragments/userBar.xhtml" />
        </p:column>
    </p:panelGrid>
                
    <p:panelGrid columns="2">
        <p:card>
            <p:badge value="#{FamiliasController.familiasActivasCount()}" severity="success">
                <i class="pi pi-check-circle" style="font-size: 2rem"/>
            </p:badge>
            <p:tag styleClass="mr-2" severity="success" value="Familias Activas" rounded="true"></p:tag>
        </p:card>
        <p:card>
            <p:badge value="#{FamiliasController.familiasInactivasCount()}" severity="danger">
                <i class="pi pi-times-circle" style="font-size: 2rem" />
            </p:badge>
            <p:tag styleClass="mr-2" severity="danger" value="Familias Inactivas" rounded="true"></p:tag>
        </p:card>
    </p:panelGrid>
    
    <p:panelGrid columns="1">
        <p:card title="Menu General de Familias" style="text-align: center">
            <h:form id="familias">
                <p:dataTable value="#{FamiliasController.filteredFamilias}" var="familia"  widgetVar="FamiliasTable"
                                 paginator="true" rows="8" paginatorPosition="bottom" id="FamiliasTableData"
                                 emptyMessage="No se encontraron familias con la critería proporcionada"
                                 globalFilterFunction="#{FamiliasController.globalFilterFunction}"
                                 filterBy="#{FamiliasController.filterBy}" reflow="true" selectionMode="single"
                                 selection="#{FamiliasController.selectedFamilia}" rowKey="#{familia.id}">

                    <p:ajax event="rowSelect" update="@form"/>

                        <f:facet name="header">
                            <p:inputText id="globalFilter" onkeyup="PF('FamiliasTable').filter()"
                                         placeholder="Búsqueda general de todos los campos" style="color: var(--primary-color); width: 100%"/>
                        </f:facet>

                        <p:column exportable="false">
                            <p:chip id="ActiveChip" icon="pi pi-check" style="background: var(--green-500)" rendered="#{familia.status}"/>
                            <p:tooltip for="ActiveChip" value="Activa" position="top"/>

                            <p:chip id="inActiveChip" icon="pi pi-times" style="background: var(--red-500);" rendered="#{!familia.status}"/>
                            <p:tooltip for="inActiveChip" value="Inactiva" position="top"/>
                        </p:column>

                        <p:column headerText="ID Familia" visible="false">
                            <h:outputText value="#{familia.id}"/>
                        </p:column>
                        <p:column headerText="Nombre" sortBy="#{familia.nombre}">
                            <h:outputText value="#{familia.nombre}"/>
                        </p:column>

                        <p:column headerText="Acciones" exportable="false" width="10%">
                            <div class="buttons">
                                <p:commandButton styleClass="rounded-button ui-button-success" icon="pi pi-pencil" update="editFamilia"
                                                 onclick="PF('EditarFamiliaDialog').show();" process="@this">
                                    <f:setPropertyActionListener value="#{familia}" target="#{FamiliasController.selectedFamilia}" />
                                </p:commandButton>
                                <p:commandButton styleClass="rounded-button ui-button-warning" icon="pi pi-power-off"
                                actionListener="#{FamiliasController.deleteFamilia()}" process="@this" update="familias">
                                    <f:setPropertyActionListener value="#{familia}" target="#{FamiliasController.selectedFamilia}" />
                                </p:commandButton>
                            </div>
                        </p:column>
                    </p:dataTable>
                    <!-- Adjust the button action -->
                    <p:commandButton value="Crear Familia" actionListener="#{FamiliasController.openNewFamilia}"
                                     styleClass="rounded-button ui-button-primary" style="width: 100%"
                                     onclick="PF('CrearFamiliaDialog').show();"/>

                </h:form>
        </p:card>
            
    </p:panelGrid>
    
    <ui:include src="/secured/fragments/Familias/CreateFamiliaDialog.xhtml"/>

    <ui:include src="/secured/fragments/Familias/EditFamiliasDialog.xhtml"/>
    
</h:body>
</html>
