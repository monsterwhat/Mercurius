<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<h:head>
    <title>Menu Principal Familias</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css"/>
    <meta charset="utf-8" name="viewport" content="width=device-width, initial-scale=1"/>
    <script src="../../../resources/css/style.css"/>

</h:head>

<h:body>
    <div class="container mt-5">
        <div class="columns">
            <div class="column">
                <div class="box">
                    <div class="columns">
                        <div class="column">
                                <div class="message-body">
                                    <div class="columns is-mobile">
                                        <div class="column is-four-fifths">
                                            <h1 class="title">Bienvenid@, #{SessionController.currentUser.username}!</h1>
                                        </div>
                                        <div class="column">
                                            <p:commandButton styleClass="button is-rounded is-danger is-2" icon="pi pi-sign-out" value="Salir" actionListener="#{SessionController.logOut()}" />
                                        </div>
                                    </div>
                                </div>
                        </div>
                    </div>
                    
                    <ui:include src="/secured/pages/mainMenu.xhtml" />
                    
                    <ui:include src="/secured/fragments/Familias/CreateFamiliaDialog.xhtml"/>
                    
                    <ui:include src="/secured/fragments/Familias/EditFamiliasDialog.xhtml"/>
                    
                    <p:growl showDetail="true" showSummary="true" />
                    
                    <h:form id="familias">
                        
                    <p:dataTable value="#{FamiliasController.filteredFamilias}" var="familia"  widgetVar="FamiliasTable"
                                     paginator="true" rows="8" paginatorPosition="bottom" id="FamiliasTableData"
                                     emptyMessage="No se encontraron familias con la critería proporcionada"
                                     globalFilterFunction="#{FamiliasController.globalFilterFunction}"
                                     filterBy="#{FamiliasController.filterBy}" reflow="true"
                                     selection="#{FamiliasController.selectedFamilia}" rowKey="#{familia.id}">
                            
                            <f:facet name="header">
                                <p:inputText id="globalFilter" onkeyup="PF('FamiliasTable').filter()"
                                             placeholder="Búsqueda general de todos los campos" styleClass="input"/>
                            </f:facet>
                        
                            <p:ajax event="rowSelect" update="@form"/>
                        
                            <p:column exportable="false">
                                <p:chip id="ActiveChip" icon="pi pi-check" styleClass="has-background-success" rendered="#{familia.status}"/>
                                <p:tooltip for="ActiveChip" value="Activa" position="top"/>

                                <p:chip id="inActiveChip" icon="pi pi-times" styleClass="has-background-danger" rendered="#{!familia.status}"/>
                                <p:tooltip for="inActiveChip" value="Inactiva" position="top"/>
                            </p:column>
                            
                            <p:column headerText="ID Familia" visible="false">
                                <h:outputText value="#{familia.id}"/>
                            </p:column>
                            <p:column headerText="Nombre" sortBy="#{familia.nombre}">
                                <h:outputText value="#{familia.nombre}"/>
                            </p:column>
                            
                            <p:column headerText="Acciones" exportable="false" width="10%">
                                <div class="buttons">
                                    <p:commandButton styleClass="button is-rounded is-success" icon="pi pi-pencil" 
                                                     onclick="PF('EditarFamiliaDialog').show();" process="@this">
                                        <f:setPropertyActionListener value="#{familia}" target="#{FamiliasController.selectedFamilia}" />
                                    </p:commandButton>
                                    <p:commandButton styleClass="button is-rounded is-warning" icon="pi pi-power-off"
                                    actionListener="#{FamiliasController.deleteFamilia()}" process="@this" update="familias">
                                        <f:setPropertyActionListener value="#{familia}" target="#{FamiliasController.selectedFamilia}" />
                                    </p:commandButton>
                                </div>
                            </p:column>
                        </p:dataTable>
                        <!-- Adjust the button action -->
                        <p:commandButton value="Crear Familia" actionListener="#{ViewController.selectCreateFamilias}"
                                         styleClass="button is-fullwidth is-success is-rounded" 
                                         onclick="PF('CrearFamiliaDialog').show();"/>
                    
                    </h:form>
                </div>
            </div>
        </div>
    </div>
</h:body>
</html>
