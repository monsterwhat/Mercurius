<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<h:head>
    <title>Menu Principal</title>
    <script src="../../../resources/js/functions.js"/>
    <h:outputStylesheet name="primefaces/primefaces.css"/>
    <h:outputStylesheet name="primefaces/themes/#{ThemeController.currentTheme}/theme.css" />
</h:head>

<h:body>
    <p:card class="ui-panel ui-widget ui-widget-content ui-corner-all p-4 shadow-2 border-round">
        <div class="ui-g ui-align-center ui-mb-2">
            <div class="ui-g-12">
                <div class="ui-panel ui-widget ui-widget-content ui-corner-all p-4 shadow-2 border-round">
                    <ui:include src="/secured/fragments/userBar.xhtml" />
                    <p:spacer height="10"/>

                    <ui:include src="./pages/mainMenu.xhtml" />
                    <p:growl showDetail="true" showSummary="true" />
                </div>
            </div>
        </div>
    </p:card>
</h:body>
</html>
