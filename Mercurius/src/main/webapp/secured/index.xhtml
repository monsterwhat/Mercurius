<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<h:head>
    <title>Menu Principal</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css"/>
    <meta charset="utf-8" name="viewport" content="width=device-width, initial-scale=1"/>
    <script src="../../../resources/js/functions.js"/>
    <script src="../resources/css/style.css"/>

</h:head>

<h:body>
    <div class="container mt-5">
        <div class="columns">
            <div class="column">
                <div class="box">
                    <div class="columns">
                        <div class="column">
                            <article class="message is-info">
                                <div class="message-body">
                                    <div class="columns is-mobile">
                                        <div class="column is-four-fifths">
                                            <h1 class="title">Bienvenid@, #{SessionController.currentUser.username}!</h1>
                                        </div>
                                        <div class="column">
                                            <p:commandButton styleClass="button is-rounded is-danger is-2" icon="pi pi-sign-out" value="Salir" actionListener="#{SessionController.logOut()}" />
                                        </div>
                                    </div>
                                </div>
                            </article>
                        </div>
                    </div>
                    
                    <ui:include src="./fragments/mainMenu.xhtml" />
                    
                    <p:growl id="growl" showDetail="true" showSummary="true" />
                    
                    <p:outputPanel id="dynamicContent">
                        <ui:fragment rendered="#{ViewController.selectedOption eq 'viewUsers'}" >
                            <ui:include src="./fragments/Users/UsersTable.xhtml" />
                        </ui:fragment>
                        <ui:fragment rendered="#{ViewController.selectedOption eq 'viewUsersDetallados'}" >
                            <ui:include src="./fragments/Users/Detallados/UsersTableDetallado.xhtml" />
                        </ui:fragment>
                        <ui:fragment rendered="#{ViewController.selectedOption eq 'editUsers'}">
                            <ui:include src="./fragments/Users/EditUsers.xhtml" />
                        </ui:fragment>
                        <ui:fragment rendered="#{ViewController.selectedOption eq 'createUsers'}">
                            <ui:include src="./fragments/Users/CreateUsers.xhtml" />
                        </ui:fragment>
                        <ui:fragment rendered="#{ViewController.selectedOption eq 'viewClients'}">
                            <ui:include src="./fragments/Clients/ClientsTable.xhtml" />
                        </ui:fragment>
                        <ui:fragment rendered="#{ViewController.selectedOption eq 'editClients'}">
                            <ui:include src="./fragments/Clients/EditClients.xhtml" />
                        </ui:fragment>                        
                        <ui:fragment rendered="#{ViewController.selectedOption eq 'createClients'}">
                            <ui:include src="./fragments/Clients/CreateClients.xhtml" />
                        </ui:fragment>
                        <ui:fragment rendered="#{ViewController.selectedOption eq 'viewArticulos'}">
                            <ui:include src="./fragments/Articulos/ArticulosTable.xhtml" />
                        </ui:fragment>
                        <ui:fragment rendered="#{ViewController.selectedOption eq 'viewArticulosDetallado'}">
                            <ui:include src="./fragments/Articulos/Detallados/ArticulosTableDetallada.xhtml" />
                        </ui:fragment>
                        <ui:fragment rendered="#{ViewController.selectedOption eq 'editArticulos'}">
                            <ui:include src="./fragments/Articulos/EditArticulo.xhtml" />
                        </ui:fragment>                        
                        <ui:fragment rendered="#{ViewController.selectedOption eq 'createArticulos'}">
                            <ui:include src="./fragments/Articulos/CreateArticulos.xhtml" />
                        </ui:fragment>
                        <ui:fragment rendered="#{ViewController.selectedOption eq 'viewDepartamentos'}">
                            <ui:include src="./fragments/Departamentos/DepartamentosTable.xhtml" />
                        </ui:fragment>
                        <ui:fragment rendered="#{ViewController.selectedOption eq 'viewDepartamentosDetallado'}">
                            <ui:include src="./fragments/Departamentos/Detallados/DepartamentosTableDetallada.xhtml" />
                        </ui:fragment>
                        <ui:fragment rendered="#{ViewController.selectedOption eq 'editDepartamentos'}">
                            <ui:include src="./fragments/Departamentos/EditDepartamento.xhtml" />
                        </ui:fragment>                        
                        <ui:fragment rendered="#{ViewController.selectedOption eq 'createDepartamentos'}">
                            <ui:include src="./fragments/Departamentos/CreateDepartamento.xhtml" />
                        </ui:fragment>
                        <ui:fragment rendered="#{ViewController.selectedOption eq 'viewFamilias'}">
                            <ui:include src="./fragments/Familias/FamiliasTable.xhtml" />
                        </ui:fragment>
                        <ui:fragment rendered="#{ViewController.selectedOption eq 'viewFamiliasDetallado'}">
                            <ui:include src="./fragments/Familias/Detallados/FamiliasTableDetallada.xhtml" />
                        </ui:fragment>                        
                        <ui:fragment rendered="#{ViewController.selectedOption eq 'editFamilias'}">
                            <ui:include src="./fragments/Familias/EditFamilias.xhtml" />
                        </ui:fragment>                        
                        <ui:fragment rendered="#{ViewController.selectedOption eq 'createFamilias'}">
                            <ui:include src="./fragments/Familias/CreateFamilias.xhtml" />
                        </ui:fragment>
                        <ui:fragment rendered="#{ViewController.selectedOption eq 'viewInventarios'}">
                            <ui:include src="./fragments/Inventario/InventariosTable.xhtml"/>
                        </ui:fragment>
                        <ui:fragment rendered="#{ViewController.selectedOption eq 'viewInventariosDetallado'}">
                            <ui:include src="./fragments/Inventario/Detallados/InventariosTableDetallada.xhtml"/>
                        </ui:fragment>
                        <ui:fragment rendered="#{ViewController.selectedOption eq 'editInventarios'}">
                            <ui:include src="./fragments/Inventario/EditMovimientoInventario.xhtml" />
                        </ui:fragment>                        
                        <ui:fragment rendered="#{ViewController.selectedOption eq 'createInventarios'}">
                            <ui:include src="./fragments/Inventario/CreateMovimientoInventario.xhtml" />
                        </ui:fragment>
                        <ui:fragment rendered="#{ViewController.selectedOption eq 'viewCabys'}">
                            <ui:include src="./fragments/CaByS/CabysTable.xhtml" />
                        </ui:fragment>
                    </p:outputPanel>
                </div>
            </div>
        </div>
    </div>
    
</h:body>
</html>
