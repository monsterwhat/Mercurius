<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="jakarta.faces.facelets">

        <p:dialog header="Informacion de Articulo" widgetVar="ArticuloDetailsDialog" 
                  responsive="true" id="ArticuloDetailsDialog" modal="true">
        <p:outputPanel rendered="#{not empty ArticulosController.selectedArticulo}">
            <p:card>
                <p:dataTable id="selectedArticulo" clientCache="true" stripedRows="true"
                             lazy="true" var="articulo" reflow="true"
                             value="#{ArticulosController.selectedArticulo}">
                    <p:column headerText="Código" visible="false">
                        <h:outputText value="#{articulo.nombre}"/>
                    </p:column>
                    <p:column headerText="Código Barra">
                        <h:outputText value="#{articulo.codigoBarra}" />
                    </p:column>
                    <p:column headerText="Nombre">
                        <h:outputText value="#{articulo.nombre}" />
                    </p:column>
                    <p:column headerText="Unidad Medida">
                        <h:outputText value="#{articulo.unidadMedida}" />
                    </p:column>
                    <p:column headerText="Unidad Medida Comercial">
                        <h:outputText value="#{articulo.unidadMedidaComercial}" />
                    </p:column>
                    <p:column headerText="Departamento">
                        <h:outputText value="#{articulo.departamento.nombre}" />
                    </p:column>
                    <p:column headerText="Familia">
                        <h:outputText value="#{articulo.familia.nombre}" />
                    </p:column>
                    <p:column headerText="Precio Costo">
                        <h:outputText value="#{articulo.lastPrecio.precioCostoSinIVA}" />
                    </p:column>
                    <p:column headerText="Utilidad">
                        <h:outputText value="#{articulo.lastPrecio.porcentajeUtilidad}" />
                    </p:column>
                    <p:column headerText="Precio Sin Iva">
                        <h:outputText value="#{articulo.lastPrecio.precioConUtilidad}" />
                    </p:column>
                    <p:column headerText="Precio Final">
                        <h:outputText value="#{articulo.lastPrecio.precioFinal}" />
                    </p:column>
                    <p:column headerText="Creador">
                        <h:outputText value="#{articulo.usuario.username}" />
                    </p:column>
                </p:dataTable>
            </p:card>
        </p:outputPanel>
    </p:dialog>

</ui:composition>
