<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <h:head>
        <title>Crear Artículo</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css"/>
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
        <script src="../../../resources/js/functions.js"/>
    </h:head>
    
    <h:body>
        <div class="box">
            <div class="columns is-centered">
                <div class="column">
                    <p:commandButton value="Volver a la lista de artículos" icon="pi pi-arrow-left"
                                     styleClass="button is-inverted is-fullwidth is-warning is-rounded"
                                     immediate="true" action="#{ViewController.selectViewArticulos}"
                                     update="dynamicContent"/>
                    <h:form id="createArticulos">
                        <br/>
                        <p:panel header="Crear un nuevo artículo" styleClass="panel">
                            <p:growl id="growl" showDetail="true" showSummary="false"/>
                            
                            <!-- Input for article name -->
                            <p:messages showDetail="true" for="name" showSummary="false" closable="true" />
                            <div class="field is-horizontal">
                                <div class="field-label is-normal">
                                    <label class="label" for="name">Nombre:</label>
                                </div>
                                <div class="field-body">
                                    <div class="field">
                                        <p:inputText id="name" value="#{ArticulosController.newArticulo.nombre}"
                                                     required="true" requiredMessage="El nombre no puede estar vacío"
                                                     styleClass="input is-fullwidth" onkeydown="return focusNext(event, 'codigoCabysInput')"/>
                                    </div>
                                </div>
                            </div>

                            <!-- Input for Código CABYS -->
                            <p:messages showDetail="true" for="codigoCabys" showSummary="false" closable="true" />
                            <div class="field is-horizontal">
                                <div class="field-label is-normal">
                                    <label class="label" for="codigoCabys">Código CABYS:</label>
                                </div>
                                <div class="field-body is-flex">
                                    <p:commandButton value="Seleccionar" styleClass="button"
                                                     onclick="PF('codigoCabysDialog').show();"/> 
                                    <!-- Container for selected option -->
                                    <div class="selected-option is-flex">
                                        <p:outputLabel value="#{ArticulosController.newArticulo.codigoCabys.codigo} - #{ArticulosController.newArticulo.codigoCabys.descripcion}"
                                                       styleClass="label"/>
                                    </div>
                                    <!-- Should probably insert the dialog here -->
                                    <ui:include src="../CaByS/CabysDialog.xhtml"/>  
                                </div>
                            </div>


                            <!-- Input for Departamento -->
                            <p:messages showDetail="true" for="departamento" showSummary="false" closable="true" />
                            <div class="field is-horizontal">
                                <div class="field-label is-normal">
                                    <label class="label" for="departamento">Departamento:</label>
                                </div>
                                <div class="field-body columns is-mobile">
                                    <div class="column">
                                        <p:selectOneMenu id="departamentoSelect" value="#{ArticulosController.departamentoID}"
                                                         required="true" requiredMessage="El Departamento no puede estar vacío"
                                                         styleClass="input" widgetVar="departamentoSelect">
                                            <f:selectItem itemLabel="Seleccionar Departamento" itemValue="" />
                                            <f:selectItems value="#{ArticulosController.departamentoOptions}" var="departamento"
                                                           itemLabel="#{departamento.nombre}" itemValue="#{departamento.id}" />
                                        </p:selectOneMenu>
                                    </div>
                                </div>
                            </div>

                            <!-- Input for Familia -->
                            <p:messages showDetail="true" for="familia" showSummary="false" closable="true" />
                            <div class="field is-horizontal">
                                <div class="field-label is-normal">
                                    <label class="label" for="familia">Familia:</label>
                                </div>
                                <div class="field-body columns is-mobile">
                                    <div class="column">
                                        <p:selectOneMenu id="familiaSelect" value="#{ArticulosController.familiaID}"
                                                         required="true" requiredMessage="La Familia no puede estar vacía"
                                                         styleClass="input" widgetVar="familiaSelect">
                                            <f:selectItem itemLabel="Seleccionar Familia" itemValue="" />
                                            <f:selectItems value="#{ArticulosController.familiaOptions}" var="familia"
                                                           itemLabel="#{familia.nombre}" itemValue="#{familia.id}" />
                                        </p:selectOneMenu>
                                    </div>
                                </div>
                            </div>

                            <!-- Input for Precio Costo sin IVA -->
                            <p:messages showDetail="true" for="precioCostoSinIVA" showSummary="false" closable="true" />
                            <div class="field is-horizontal">
                                <div class="field-label is-normal">
                                    <label class="label" for="precioCostoSinIVA">Precio Costo sin IVA:</label>
                                </div>
                                <div class="field-body">
                                    <div class="field">
                                        <p:inputText id="precioCostoSinIVA" value="#{ArticulosController.newArticulo.precioCostoSinIVA}"
                                                     required="true" requiredMessage="El Precio Costo sin IVA no puede estar vacío"
                                                     styleClass="input is-fullwidth">
                                            <p:ajax event="change" listener="#{ArticulosController.calcularPrecioConUtilidad()}"
                                                    update="precioCostoSinIVA precioFinal precioFinalConIVA" process="@this"/>
                                        </p:inputText>
                                    </div>
                                </div>
                            </div>
                            
                            <!-- Input for Porcentaje de Utilidad -->
                            <p:messages showDetail="true" for="porcentajeUtilidad" showSummary="false" closable="true" />
                            <div class="field is-horizontal">
                                <div class="field-label is-normal">
                                    <label class="label" for="porcentajeUtilidad">Porcentaje de Utilidad:</label>
                                </div>
                                <div class="field-body">
                                    <div class="field">
                                        <p:inputText id="porcentajeUtilidad" value="#{ArticulosController.newArticulo.porcentajeUtilidad}"
                                                     required="true" requiredMessage="El Porcentaje de Utilidad no puede estar vacío"
                                                     styleClass="input is-fullwidth" onkeyup="calculatePrecioFinal()">
                                                    <p:ajax event="change" listener="#{ArticulosController.calcularPrecioConUtilidad()}" update="precioCostoSinIVA precioFinal precioFinalConIVA" />
                                        </p:inputText>
                                    </div>
                                </div>
                            </div>
                            
                            <!-- Input for Precio Final -->
                            <p:messages showDetail="true" for="precioFinal" showSummary="false" closable="true" />
                            <div class="field is-horizontal">
                                <div class="field-label is-normal">
                                    <label class="label" for="precioFinal">Precio Final:</label>
                                </div> 
                                <div class="field-body">
                                    <div class="field">
                                        <p:outputLabel id="precioFinal" value="#{ArticulosController.newArticulo.precioFinal}"/>
                                    </div>
                                </div>
                            </div>
                            
                            <!-- Input for Precio Final con IVA -->
                            <p:messages showDetail="true" for="precioFinalConIVA" showSummary="false" closable="true"/>
                            <div class="field is-horizontal">
                                <div class="field-label is-normal">
                                    <label class="label" for="precioFinalConIVA">Precio Final con IVA:</label>
                                </div>
                                <div class="field-body">
                                    <div class="field">
                                        <p:outputLabel id="precioFinalConIVA" value="#{ArticulosController.newArticulo.precioCostoConIVA}"/>
                                    </div>
                                </div>
                            </div>
                            
                        </p:panel>
                        <br/>
                        <!-- Button to create article -->
                        <p:commandButton value="Crear Artículo" styleClass="button is-fullwidth is-rounded is-success"
                                         action="#{ArticulosController.createArticulo}" update="dynamicContent createArticulos"/>
                    </h:form>
                </div>
            </div>
        </div>
    </h:body>

</ui:composition>
