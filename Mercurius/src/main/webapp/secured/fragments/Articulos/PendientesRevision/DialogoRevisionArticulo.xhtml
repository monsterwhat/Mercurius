<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
    
    <!-- Dialog for Revision de Articulo -->
    <p:dialog header="Revision de Articulo #{ArticulosController.selectedArticulo.nombre}" widgetVar="RevisionArticuloDialog" modal="true"
              fitViewport="true" responsive="true" dynamic="true" cache="false">
        <p:outputPanel id="RevisionArticuloDialog" rendered="#{not empty ArticulosController.selectedArticulo}">
            <h:form>
                <p:panelGrid columns="1" layout="flex">
                    <p:panel header="Revisar Artículo: #{ArticulosController.selectedArticulo.nombre}" >
                        <p:growl showDetail="true" showSummary="false"/>
                        <p:column>
                            <p:messages for="name" showSummary="false" showDetail="true" closable="true" />
                                <p:outputLabel class="label" for="name" style="color: var(--primary-color);" >Nombre:</p:outputLabel>
                                <p:inputText id="name" value="#{ArticulosController.selectedArticulo.nombre}"
                                                 required="true" requiredMessage="El nombre no puede estar vacío"
                                                 style="width: 100%"/>
                        </p:column>
                        <p:spacer height="1em"/>
                        <p:column>
                            <p:messages showDetail="true" for="codigoBarra" showSummary="false" closable="true" />
                            <label class="label" for="codigoBarra" style="color: var(--primary-color);">Codigo de Barra:</label>
                            <p:inputText id="codigoBarra" value="#{ArticulosController.selectedArticulo.codigoBarra}"
                                required="true" requiredMessage="El codigo de barra no puede estar vacío"
                                style="width: 100%">
                            </p:inputText>
                        </p:column>
                        <p:spacer height="1em"/>
                        <p:column>
                            <p:messages showDetail="true" for="recomendacionCabys" showSummary="false" closable="true" />
                            <label class="label" for="recomendacionCabys" style="color: var(--primary-color);">Recomendacion Cabys:</label>
                            <p:card>
                                <p:outputLabel id="recomendacionCabys" value="#{ArticulosController.selectedArticulo.recomendacionCabys}"/>
                            </p:card>    
                        </p:column>
                        <p:spacer height="1em"/>
                        <p:column>
                            <p:messages showDetail="true" for="codigoCabys" showSummary="false" closable="true" />
                            <label class="label" for="codigoCabys" style="color: var(--primary-color);">Código CABYS:</label>
                            <p:commandButton value="Seleccionar" id="selectCabysEdit" styleClass="ui-button-primary rounded-button" style="width: 100%"
                                    onclick="PF('codigoCabysDialogEdit').show();" update="@this">
                                    <p:autoUpdate/>
                                </p:commandButton>
                            <p:spacer height="1em"/>
                                <p:card class="selected-option is-flex">
                                    <p:outputLabel value="#{ArticulosController.selectedArticulo.codigoCabys.codigo} - #{ArticulosController.selectedArticulo.codigoCabys.descripcion} - #{ArticulosController.selectedArticulo.codigoCabys.impuesto} %"
                                                   style="color: var(--primary-color);">
                                        <p:autoUpdate/>
                                    </p:outputLabel>
                                </p:card>
                        </p:column>
                        <p:spacer height="1em"/>
                        <p:column>
                            <p:messages showDetail="true" for="unidadMedida" showSummary="false" closable="true" />
                            <label class="label" for="unidadMedida" style="color: var(--primary-color);">Unidad de Medida:</label>
                            <p:selectOneMenu id="unidadMedida" value="#{ArticulosController.selectedArticulo.unidadMedida}"
                                            style="width: 100%">
                                <p:ajax listener="#{ArticulosController.selectedUnidadMedidaChanged}"/>
                                <f:selectItem itemLabel="Unid" itemValue="Unid"/>
                                <f:selectItem itemLabel="Otros" itemValue="Otros"/>
                                <f:selectItem itemLabel="g" itemValue="g"/>
                            </p:selectOneMenu>
                        </p:column>
                        <p:spacer height="1em"/>
                        <p:column>
                            <p:messages showDetail="true" for="unidadMedidaComercial" showSummary="false" closable="true" />
                                <label class="label" for="unidadMedidaComercial" style="color: var(--primary-color);">Unidad de Medida Comercial:</label>
                                    <p:selectOneMenu id="unidadMedidaComercial" value="#{ArticulosController.selectedArticulo.unidadMedidaComercial}"
                                                   style="width: 100%" >
                                        <p:ajax listener="#{ArticulosController.selectedUnidadMedidaComercialChanged}"/>
                                        <f:selectItem itemLabel="Botella" itemValue="BOT"/>
                                        <f:selectItem itemLabel="Lata" itemValue="LT"/>
                                        <f:selectItem itemLabel="SixPack" itemValue="ST"/>
                                        <f:selectItem itemLabel="Pieza" itemValue="Pieza"/>
                                        <f:selectItem itemLabel="Unidad" itemValue="Unid"/>
                                        <f:selectItem itemLabel="Generico" itemValue=""/>
                                    </p:selectOneMenu>
                        </p:column>
                        <p:spacer height="1em"/>
                        <p:column>
                            <p:messages showDetail="true" for="departamento" showSummary="false" closable="true" />
                                <label class="label" for="departamento" style="color: var(--primary-color);">Departamento:</label>
                                    <p:selectOneMenu id="departamento" value="#{ArticulosController.departamentoID}"
                                                     required="true" requiredMessage="El Departamento no puede estar vacío"
                                                     widgetVar="departamento" style="width: 100%">
                                        <f:selectItem itemLabel="#{ArticulosController.selectedArticulo.departamento.nombre}" itemValue="#{ArticulosController.selectedArticulo.departamento.id}" />
                                        <f:selectItems value="#{ArticulosController.departamentoOptions}" var="departamento"
                                                       itemLabel="#{departamento.nombre}" itemValue="#{departamento.id}" />

                                    </p:selectOneMenu>
                        </p:column>
                        <p:spacer height="1em"/>
                        <p:column>
                            <p:messages showDetail="true" for="familia" showSummary="false" closable="true" />
                                <label class="label" for="familia" style="color: var(--primary-color);">Familia:</label>
                                    <p:selectOneMenu id="familia" value="#{ArticulosController.familiaID}"
                                                     required="true" requiredMessage="La Familia no puede estar vacía"
                                                     widgetVar="familia" style="width: 100%">
                                        <f:selectItem itemLabel="Seleccionar Familia" itemValue="" />
                                        <f:selectItems value="#{ArticulosController.familiaOptions}" var="familia"
                                                       itemLabel="#{familia.nombre}" itemValue="#{familia.id}" />

                                    </p:selectOneMenu>
                        </p:column>
                        
                        <p:spacer height="1em"/>

                            <p:column>
                                <p:messages showDetail="true" for="precioCostoSinIVA" showSummary="false" closable="true" />
                                    <label class="label" for="precioCostoSinIVA" style="color: var(--primary-color);">Precio Costo sin IVA:</label>
                                        <p:inputText id="precioCostoSinIVA" type="number" value="#{ArticulosController.lastPrecio.precioCostoSinIVA}"
                                                     required="true" requiredMessage="El Precio Costo sin IVA no puede estar vacío"
                                                     style="width: 100%">
                                            <p:ajax event="change" listener="#{ArticulosController.calcularPrecioConUtilidadEdit(ArticulosController.lastPrecio)}"
                                                    update="precioCostoSinIVA precioConUtilidad precioFinal" process="@this"/>
                                        </p:inputText>
                            </p:column>
                            <p:spacer height="1em"/>
                            <p:column>
                                <p:messages showDetail="true" for="porcentajeUtilidad" showSummary="false" closable="true" />
                                    <label class="label" for="porcentajeUtilidad" style="color: var(--primary-color);">Porcentaje de Utilidad:</label>
                                        <p:inputText id="porcentajeUtilidad" type="number" value="#{ArticulosController.lastPrecio.porcentajeUtilidad}"
                                                     required="true" requiredMessage="El Porcentaje de Utilidad no puede estar vacío"
                                                     style="width: 100%">
                                                    <p:ajax event="change" listener="#{ArticulosController.calcularPrecioConUtilidadEdit(ArticulosController.lastPrecio)}"
                                                            update="precioCostoSinIVA precioConUtilidad precioFinal"/>
                                        </p:inputText>
                            </p:column>
                            <p:spacer height="1em"/>
                            <p:column>
                                <p:messages showDetail="true" for="precioConUtilidad" showSummary="false" closable="true" />
                                <label class="label" for="precioConUtilidad" style="color: var(--primary-color);">Precio Final:</label>
                                <p:card>
                                    <p:outputLabel id="precioConUtilidad" value="#{ArticulosController.lastPrecio.precioConUtilidad}"/>
                                </p:card>
                            </p:column>
                            <p:spacer height="1em"/>
                            <p:column>
                                <p:messages showDetail="true" for="precioFinal" showSummary="false" closable="true"/>
                                <label class="label" for="precioFinal" style="color: var(--primary-color);">Precio Final con IVA:</label>
                                <p:card>
                                    <p:outputLabel id="precioFinal" value="#{ArticulosController.lastPrecio.precioFinal}">
                                        <p:autoUpdate/>
                                    </p:outputLabel>
                                </p:card>
                            </p:column>
                        <p:spacer height="2em"/>
                        
                        <p:column>
                            <p:commandButton value="Actualizar datos" update="@form ArticulosPendientes" process="@form"
                                                     action="#{ArticulosController.updateArticuloRevision}"
                                                     styleClass="rounded-button ui-button-primary" style="width: 100%" />
                        </p:column>
                    </p:panel>
                </p:panelGrid>
            </h:form>
        </p:outputPanel>
    </p:dialog>
</ui:composition>
