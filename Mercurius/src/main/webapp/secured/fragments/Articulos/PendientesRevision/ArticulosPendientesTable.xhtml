<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <h:head>
        <title>Artículos</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css"/>
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
    </h:head>
    
    <h:body>
        <div class="box">
            <div class="columns is-centered">
                <div class="column">
                    <p:commandButton value="Volver al menú principal" icon="pi pi-home" actionListener="#{ViewController.selectNone}" styleClass="button is-fullwidth is-inverted is-warning is-rounded"/>
                    <br/>
                    <h:form id="articulosRevisionTable">
                        
                        <p:toolbar>
                            <p:toolbarGroup align="right">
                                <p:commandButton value="Exportar Excel" icon="pi pi-file-excel" styleClass="ui-button-help" ajax="false">
                                    <p:dataExporter type="xlsx" target="ArticulosRevisionTableData" fileName="Articulos-Mercurius-Excel" />
                                </p:commandButton>
                                <p:commandButton value="Exportar PDF" icon="pi pi-file-pdf" styleClass="ui-button-help" ajax="false">
                                    <p:dataExporter type="pdf" target="ArticulosRevisionTableData" fileName="Articulos-Mercurius-PDF" />
                                </p:commandButton>
                            </p:toolbarGroup>
                        </p:toolbar>
                        
                        <p:dataTable value="#{ArticulosController.filteredArticulos}" var="articulo"  widgetVar="ArticulosRevisionTable"
                                     paginator="true" rows="8" paginatorPosition="bottom" id="ArticulosRevisionTableData"
                                     emptyMessage="No se encontraron artículos con la critería proporcionada"
                                     globalFilterFunction="#{ArticulosController.globalFilterFunction}"
                                     filterBy="#{ArticulosController.filterBy}" liveScroll="true" touchable="true"
                                     selection="#{ArticulosController.selectedArticulo}" rowKey="#{articulo.codigo}">
                            
                            <f:facet name="header">
                                <p:inputText id="globalFilter" onkeyup="PF('ArticulosRevisionTable').filter()"
                                             placeholder="Búsqueda general de todos los campos" styleClass="input"/>
                            </f:facet>
                            
                            <p:column width="5%">
                                <p:chip icon="pi pi-exclamation-circle" styleClass="has-background-warning" rendered="#{!articulo.processed}"/>
                                <p:chip icon="pi pi-check" styleClass="has-background-success" rendered="#{articulo.status}"/>
                            </p:column>
                            
                            <p:column headerText="Código" sortBy="#{articulo.codigo}" visible="false">
                                <h:outputText value="#{articulo.codigo}"/>
                            </p:column>
                            <p:column headerText="Código de Barra" sortBy="#{articulo.codigoBarra}">
                                <h:outputText value="#{articulo.codigoBarra}"/>
                            </p:column>
                            <p:column headerText="Código Cabys" sortBy="#{articulo.codigoCabys}">
                                <h:outputText value="#{articulo.codigoCabys.codigo}"/>
                            </p:column>                            
                            <p:column headerText="Nombre" sortBy="#{articulo.nombre}">
                                <h:outputText value="#{articulo.nombre}"/>
                            </p:column>
                            <p:column headerText="Precio Costo Sin IVA" sortBy="#{articulo.precioCostoSinIVA}" visible="false">
                                <h:outputText value="#{articulo.precioCostoSinIVA}"/>
                            </p:column>
                            <p:column headerText="Porcentaje Utilidad" sortBy="#{articulo.porcentajeUtilidad}" visible="false">
                                <h:outputText value="#{articulo.porcentajeUtilidad}"/>
                            </p:column>
                            <p:column headerText="Precio Final" sortBy="#{articulo.precioFinal}" visible="false">
                                <h:outputText value="#{articulo.precioFinal}"/>
                            </p:column>
                            <p:column headerText="Precio Final Con IVA" sortBy="#{articulo.precioCostoConIVA}" width="10%">
                                <h:outputText value="#{articulo.precioCostoConIVA}"/>
                            </p:column>
                            <p:column headerText="Stock" width="6%">
                                <h:outputText value="#{ArticulosController.getStock(articulo)}"/>
                            </p:column>
                            
                            <p:column headerText="Acciones" exportable="false">
                                <div class="buttons has-addons">
                                    <p:commandButton styleClass="button edit-button rounded-button ui-button-success" icon="pi pi-pencil"
                                    actionListener="#{ViewController.selectEditArticulos()}" process="@this">
                                        <f:setPropertyActionListener value="#{articulo}" target="#{ArticulosController.selectedArticulo}" />
                                    </p:commandButton>
                                    <p:commandButton styleClass="button ui-button-warning rounded-button" icon="pi pi-trash"
                                    actionListener="#{ArticulosController.deleteArticulo()}" process="@this" update="dynamicContent articulosRevisionTable">
                                        <f:setPropertyActionListener value="#{articulo}" target="#{ArticulosController.selectedArticulo}" />
                                    </p:commandButton>
                                </div>
                            </p:column>
                        </p:dataTable>
                        <p:commandButton value="Crear Artículo" actionListener="#{ViewController.selectCreateArticulos}"
                                         update="dynamicContent createArticulos" styleClass="button is-fullwidth is-success is-rounded"
                                         />
                    </h:form>
                </div>
            </div>
        </div>
    </h:body>

</ui:composition>
