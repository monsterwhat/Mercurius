<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
    
    <h:head>
        <script>
            function copyToClipboard(text) {
                // Create a temporary textarea element
                const textarea = document.createElement('textarea');
                // Set its value to the provided text
                textarea.value = text;
                // Make the textarea non-editable
                textarea.setAttribute('readonly', '');
                // Hide the textarea to avoid interfering with the page layout
                textarea.style.position = 'absolute';
                textarea.style.left = '-9999px';
                // Append the textarea to the document
                document.body.appendChild(textarea);
                // Select the text within the textarea
                textarea.select();
                // Copy the selected text to the clipboard
                document.execCommand('copy');
                // Remove the textarea from the document
                document.body.removeChild(textarea);
            }
        </script>
    </h:head>

    <!-- Dialog for Revision de Articulo -->
    <p:dialog header="Revision de Articulo #{ArticulosController.selectedArticulo.nombre}" widgetVar="RevisionArticulosDialog" modal="true"
              fitViewport="true" responsive="true" dynamic="true" cache="false" >
        <p:outputPanel id="RevisionArticulosDialog" rendered="#{not empty ArticulosController.selectedArticulo}">
            <h:form>
                <p:panelGrid columns="1" layout="flex">
                    <p:panel header="Revisar Artículo: #{ArticulosController.selectedArticulo.nombre}" >
                        <p:growl showDetail="true" showSummary="false"/>
                        <p:column>
                            <p:messages for="nameR" showSummary="false" showDetail="true" closable="true" />
                                <p:outputLabel class="label" for="nameR" style="color: var(--primary-color);" >Nombre:</p:outputLabel>
                                <p:inputText id="nameR" value="#{ArticulosController.selectedArticulo.nombre}"
                                                 required="true" requiredMessage="El nombre no puede estar vacío"
                                                 style="width: 100%"/>
                        </p:column>
                        <p:spacer height="1em"/>
                        <p:column>
                            <p:messages showDetail="true" for="codigoBarraR" showSummary="false" closable="true" />
                            <label class="label" for="codigoBarraR" style="color: var(--primary-color);">Codigo de Barra:</label>
                            <p:inputText id="codigoBarraR" value="#{ArticulosController.selectedArticulo.codigoBarra}"
                                required="true" requiredMessage="El codigo de barra no puede estar vacío"
                                style="width: 100%">
                            </p:inputText>
                        </p:column>
                        <p:spacer height="1em"/>
                        <p:column>
                            <p:messages showDetail="true" for="recomendacionCabysR" showSummary="false" closable="true" />
                            <label class="label" for="recomendacionCabysR" style="color: var(--primary-color);">Recomendacion Cabys:</label>
                            <div onclick="copyToClipboard(#{ArticulosController.selectedArticulo.recomendacionCabys})" style="cursor: pointer;">
                                <p:card>
                                    <p:outputLabel id="recomendacionCabysR" value="#{ArticulosController.selectedArticulo.recomendacionCabys}"/>
                                </p:card>
                            </div>
                        </p:column>
                        <p:spacer height="1em"/>
                        <p:column>
                            <p:messages showDetail="true" for="codigoCabysR" showSummary="false" closable="true" />
                            <label class="label" for="codigoCabysR" style="color: var(--primary-color);">Código CABYS:</label>
                            <p:commandButton value="Seleccionar" id="selectCabysEdit" styleClass="ui-button-primary rounded-button" style="width: 100%"
                                             onclick="PF('codigoCabysDialogEdit').show();" >
                                    <p:autoUpdate/>
                                </p:commandButton>
                            <p:spacer height="1em"/>
                                <p:card class="selected-option is-flex">
                                    <p:outputLabel value="#{ArticulosController.selectedArticulo.codigoCabys.codigo} - #{ArticulosController.selectedArticulo.codigoCabys.descripcion} - #{ArticulosController.selectedArticulo.codigoCabys.impuesto} %"
                                                   style="color: var(--primary-color);">
                                        <p:autoUpdate/>
                                    </p:outputLabel>
                                </p:card>
                        </p:column>
                        <p:spacer height="1em"/>
                        <p:column>
                            <p:messages showDetail="true" for="unidadMedidaR" showSummary="false" closable="true" />
                            <label class="label" for="unidadMedidaR" style="color: var(--primary-color);">Unidad de Medida:</label>
                            <p:selectOneMenu id="unidadMedidaR" value="#{ArticulosController.selectedArticulo.unidadMedida}"
                                            style="width: 100%">
                                <p:ajax listener="#{ArticulosController.selectedUnidadMedidaChanged}"/>
                                <f:selectItem itemLabel="Unid" itemValue="Unid"/>
                                <f:selectItem itemLabel="Otros" itemValue="Otros"/>
                                <f:selectItem itemLabel="g" itemValue="g"/>
                            </p:selectOneMenu>
                        </p:column>
                        <p:spacer height="1em"/>
                        <p:column>
                            <p:messages showDetail="true" for="unidadMedidaRComercial" showSummary="false" closable="true" />
                                <label class="label" for="unidadMedidaRComercial" style="color: var(--primary-color);">Unidad de Medida Comercial:</label>
                                    <p:selectOneMenu id="unidadMedidaRComercial" value="#{ArticulosController.selectedArticulo.unidadMedidaComercial}"
                                                   style="width: 100%" >
                                        <p:ajax listener="#{ArticulosController.selectedUnidadMedidaComercialChanged}"/>
                                        <f:selectItem itemLabel="Botella" itemValue="BOT"/>
                                        <f:selectItem itemLabel="Lata" itemValue="LT"/>
                                        <f:selectItem itemLabel="SixPack" itemValue="ST"/>
                                        <f:selectItem itemLabel="Pieza" itemValue="Pieza"/>
                                        <f:selectItem itemLabel="Unidad" itemValue="Unid"/>
                                        <f:selectItem itemLabel="Generico" itemValue=""/>
                                    </p:selectOneMenu>
                        </p:column>
                        <p:spacer height="1em"/>
                        <p:column>
                            <p:messages showDetail="true" for="departamentoR" showSummary="false" closable="true" />
                                <label class="label" for="departamentoR" style="color: var(--primary-color);">Departamento:</label>
                                    <p:selectOneMenu id="departamentoR" value="#{ArticulosController.departamentoID}"
                                                     required="true" requiredMessage="El Departamento no puede estar vacío"
                                                     widgetVar="departamentoR" style="width: 100%">
                                        <f:selectItem itemLabel="#{ArticulosController.selectedArticulo.departamento.nombre}" itemValue="#{ArticulosController.selectedArticulo.departamento.id}" />
                                        <f:selectItems value="#{ArticulosController.departamentoOptions}" var="departamento"
                                                       itemLabel="#{departamento.nombre}" itemValue="#{departamento.id}" />

                                    </p:selectOneMenu>
                        </p:column>
                        <p:spacer height="1em"/>
                        <p:column>
                            <p:messages showDetail="true" for="familiaR" showSummary="false" closable="true" />
                                <label class="label" for="familiaR" style="color: var(--primary-color);">Familia:</label>
                                    <p:selectOneMenu id="familiaR" value="#{ArticulosController.familiaID}"
                                                     required="true" requiredMessage="La Familia no puede estar vacía"
                                                     widgetVar="familiaR" style="width: 100%">
                                        <f:selectItem itemLabel="Seleccionar Familia" itemValue="" />
                                        
                                        <f:selectItems value="#{ArticulosController.familiaOptions}" var="familia"
                                                       itemLabel="#{familia.nombre}" itemValue="#{familia.id}" />

                                    </p:selectOneMenu>
                        </p:column>
                        <p:spacer height="1em"/>

                            <p:column>
                                <p:messages showDetail="true" for="precioCostoSinIVAR" showSummary="false" closable="true" />
                                    <label class="label" for="precioCostoSinIVAR" style="color: var(--primary-color);">Precio Costo sin IVA:</label>
                                        <p:inputText id="precioCostoSinIVAR" type="number" value="#{ArticulosController.lastPrecio.precioCostoSinIVA}"
                                                     required="true" requiredMessage="El Precio Costo sin IVA no puede estar vacío"
                                                     style="width: 100%">
                                            <p:ajax event="change" listener="#{ArticulosController.calcularPrecioConUtilidadEdit(ArticulosController.lastPrecio)}"
                                                    update="precioCostoSinIVAR precioConUtilidadR precioConUtilidadRConIVA" process="@this"/>
                                        </p:inputText>
                            </p:column>
                            <p:spacer height="1em"/>
                            <p:column>
                                <p:messages showDetail="true" for="porcentajeUtilidadR" showSummary="false" closable="true" />
                                    <label class="label" for="porcentajeUtilidadR" style="color: var(--primary-color);">Porcentaje de Utilidad:</label>
                                    <p:inputNumber id="porcentajeUtilidadR" decimalPlaces="0" minValue="0"  value="#{ArticulosController.lastPrecio.porcentajeUtilidad}"
                                                     required="true" requiredMessage="El Porcentaje de Utilidad no puede estar vacío"
                                                     style="width: 100%">
                                                    <p:ajax event="change" listener="#{ArticulosController.calcularPrecioConUtilidadEdit(ArticulosController.lastPrecio)}"
                                                            update="precioCostoSinIVAR precioConUtilidadR precioConUtilidadRConIVA"/>
                                        </p:inputNumber>
                            </p:column>
                            <p:spacer height="1em"/>
                            <p:column>
                                <p:messages showDetail="true" for="precioConUtilidadR" showSummary="false" closable="true" />
                                <label class="label" for="precioConUtilidadR" style="color: var(--primary-color);">Precio Final:</label>
                                <p:card>
                                    <p:outputLabel id="precioConUtilidadR" value="#{ArticulosController.lastPrecio.precioConUtilidad}"/>
                                </p:card>
                            </p:column>
                            <p:spacer height="1em"/>
                            <p:column>
                                <p:messages showDetail="true" for="precioConUtilidadRConIVA" showSummary="false" closable="true"/>
                                <label class="label" for="precioConUtilidadRConIVA" style="color: var(--primary-color);">Precio Final con IVA:</label>
                                <p:card>
                                    <p:outputLabel id="precioConUtilidadRConIVA" value="#{ArticulosController.lastPrecio.precioFinal}">
                                        <p:autoUpdate/>
                                    </p:outputLabel>
                                </p:card>
                            </p:column>
                        <p:spacer height="2em"/>
                        
                        <p:column>
                            <p:commandButton value="Salvar -> Siguiente" update="@form Articulos:ArticulosPendientes" process="@form"
                                                     action="#{ArticulosController.updateArticulosRevision}"
                                                     styleClass="rounded-button ui-button-primary" style="width: 100%" />
                        </p:column>

                    </p:panel>
                </p:panelGrid>
            </h:form>
        </p:outputPanel>
    </p:dialog>
</ui:composition>
