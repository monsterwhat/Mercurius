<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <h:head>
        <title>Artículos</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css"/>
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1"/>

        <style>
            .inactive-row {
                background-color: #999999 !important;
                color: #ffffff !important;
            }
        </style>
    </h:head>
    
    <h:body>
        <div class="box">
            <div class="columns is-centered">
                <div class="column">
                    <p:commandButton value="Volver al menú principal" icon="pi pi-home" actionListener="#{ViewController.selectNone}" update="dynamicContent" styleClass="button is-fullwidth is-inverted is-warning is-rounded"/>
                    <br/>
                    <h:form id="ArticulosTableDetallado">
                        
                        <p:toolbar>
                            <p:toolbarGroup align="right">
                                <p:commandButton value="Exportar Excel" icon="pi pi-file-excel" styleClass="ui-button-help" ajax="false">
                                    <p:dataExporter type="xlsx" target="ArticulosTableData" fileName="Articulos-Mercurius-Excel" />
                                </p:commandButton>
                                <p:commandButton value="Exportar PDF" icon="pi pi-file-pdf" styleClass="ui-button-help" ajax="false">
                                    <p:dataExporter type="pdf" target="ArticulosTableData" fileName="Articulos-Mercurius-PDF" />
                                </p:commandButton>
                            </p:toolbarGroup>
                        </p:toolbar>
                        
                        <p:dataTable value="#{ArticulosController.filteredArticulosDetallado}" var="articulo"  widgetVar="ArticulosTableDetallado"
                                     paginator="true" rows="8" paginatorPosition="bottom" id="ArticulosTableData"
                                     emptyMessage="No se encontraron artículos con la critería proporcionada"
                                     rowStyleClass="#{articulo.status == 'false' ? 'inactive-row' : null}"
                                     globalFilterFunction="#{ArticulosController.globalFilterFunction}"
                                     filterBy="#{ArticulosController.filterBy}" reflow="true" 
                                     selection="#{ArticulosController.selectedArticulo}" rowKey="#{articulo.codigo}">
                            
                            <f:facet name="header">
                                <p:inputText id="globalFilter" onkeyup="PF('ArticulosTableDetallado').filter()"
                                             placeholder="Búsqueda general de todos los campos" styleClass="input"/>
                            </f:facet>
                            
                            <p:column width="5%">
                                <p:chip id="processedChip" icon="pi pi-exclamation-circle" styleClass="has-background-success"
                                        rendered="#{articulo.processed}"/>
                                <p:tooltip for="processedChip" value="Procesada" position="top"/>
                                <p:chip id="unprocessedChip" icon="pi pi-exclamation-circle" styleClass="has-background-warning"
                                        rendered="#{!articulo.processed}"/>
                                <p:tooltip for="unprocessedChip" value="Sin procesar" position="top"/>
                                <p:chip id="ActiveChip" icon="pi pi-check" styleClass="has-background-success" 
                                        rendered="#{articulo.status}"/>
                                <p:tooltip for="ActiveChip" value="Activa" position="top"/>
                                <p:chip id="InactiveChip" icon="pi pi-times" styleClass="has-background-danger" 
                                        rendered="#{!articulo.status}"/>
                                <p:tooltip for="InactiveChip" value="Inactiva" position="top"/>
                            </p:column>
                            
                            <p:column headerText="Código" sortBy="#{articulo.codigo}" visible="false">
                                <h:outputText value="#{articulo.codigo}"/>
                            </p:column>
                            <p:column headerText="Código de Barra" sortBy="#{articulo.codigoBarra}">
                                <h:outputText value="#{articulo.codigoBarra}"/>
                            </p:column>
                            <p:column headerText="Código Cabys" sortBy="#{articulo.codigoCabys}">
                                <h:outputText value="#{articulo.codigoCabys.codigo}"/>
                            </p:column>                            
                            <p:column headerText="Nombre" sortBy="#{articulo.nombre}">
                                <h:outputText value="#{articulo.nombre}"/>
                            </p:column>
                            <p:column headerText="Precio Costo Sin IVA" sortBy="#{articulo.precioCostoSinIVA}">
                                <h:outputText value="#{articulo.precioCostoSinIVA}"/>
                            </p:column>
                            <p:column headerText="Porcentaje Utilidad" sortBy="#{articulo.porcentajeUtilidad}">
                                <h:outputText value="#{articulo.porcentajeUtilidad}"/>
                            </p:column>
                            <p:column headerText="Precio Final" sortBy="#{articulo.precioFinal}">
                                <h:outputText value="#{articulo.precioFinal}"/>
                            </p:column>
                            <p:column headerText="Precio Final Con IVA" sortBy="#{articulo.precioCostoConIVA}">
                                <h:outputText value="#{articulo.precioCostoConIVA}"/>
                            </p:column>
                            <p:column headerText="Creador" sortBy="#{articulo.usuario.username}">
                                <h:outputText value="#{articulo.usuario.username}"/>
                            </p:column>
                            <p:column headerText="Activo" sortBy="#{articulo.status}" visible="false">
                                <h:outputText value="#{articulo.status}"/>
                            </p:column>
                            
                            <p:column headerText="Acciones" exportable="false">
                                <div class="buttons has-addons">
                                    <p:commandButton styleClass="button edit-button rounded-button ui-button-success" icon="pi pi-pencil"
                                    actionListener="#{ViewController.selectEditArticulos()}" process="@this" update="dynamicContent">
                                        <f:setPropertyActionListener value="#{articulo}" target="#{ArticulosController.selectedArticulo}" />
                                    </p:commandButton>
                                    <p:commandButton styleClass="button ui-button-warning rounded-button" icon="pi pi-trash"
                                    actionListener="#{ArticulosController.deleteArticulo()}" process="@this" update="dynamicContent ArticulosTableDetallado">
                                        <f:setPropertyActionListener value="#{articulo}" target="#{ArticulosController.selectedArticulo}" />
                                    </p:commandButton>
                                </div>
                            </p:column>
                        </p:dataTable>
                        <p:commandButton value="Crear Artículo" actionListener="#{ViewController.selectCreateArticulos}"
                                         update="dynamicContent" styleClass="button is-fullwidth is-success is-rounded"
                                         />
                    </h:form>
                </div>
            </div>
        </div>
    </h:body>

</ui:composition>
