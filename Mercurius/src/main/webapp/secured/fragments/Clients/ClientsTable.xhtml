<ui:composition xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<h:head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css"/>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
</h:head>
    
<h:body>
    <div class="box">
        <div class="columns is-centered">
            <div class="column">
                <p:commandButton value="Back to Main Menu" icon="pi pi-home" actionListener="#{ViewController.selectMenu}" update="dynamicContent" styleClass="button is-fullwidth is-warning is-rounded"/>
                <br/>
                <h:form id="clientsTable">
                    <p:dataTable value="#{ClientsController.clientsList()}" var="client" 
                                 paginator="true" rows="8" paginatorPosition="bottom" 
                                 selection="#{ClientsController.selectedClient}" rowKey="#{client.code}">
                        <!-- Define your columns here -->
                        <p:column headerText="Client ID" visible="false">
                            <h:outputText value="#{client.code}"/>
                        </p:column>
                        <p:column headerText="Name">
                            <h:outputText value="#{client.name}" />
                        </p:column>
                        <p:column headerText="Address">
                            <h:outputText value="#{client.address}" />
                        </p:column>
                        <p:column headerText="Email">
                            <h:outputText value="#{client.email}" />
                        </p:column>
                        <p:column headerText="Birth Date">
                            <h:outputText value="#{client.birthDate}" />
                        </p:column>
                        <p:column headerText="ID Type">
                            <h:outputText value="#{client.idType}" />
                        </p:column>
                        <p:column headerText="ID Number">
                            <h:outputText value="#{client.idNumber}" />
                        </p:column>
                        <p:column headerText="Discount">
                            <h:outputText value="#{client.discount}" />
                        </p:column>
                        <p:column headerText="Phone Number">
                            <h:outputText value="#{client.phoneNumber}" />
                        </p:column>
                        <p:column headerText="Taxpayer">
                            <h:outputText value="#{client.taxpayer}" />
                        </p:column>
                        <p:column headerText="Zone Code">
                            <h:outputText value="#{client.zoneCode}" />
                        </p:column>
                        <p:column headerText="Actions" width="20%">
                            <div class="buttons has-addons">
                                <p:commandButton styleClass="button edit-button rounded-button ui-button-success" icon="pi pi-pencil"
                                actionListener="#{ViewController.selectEditClient()}" process="@this" update="dynamicContent">
                                    <f:setPropertyActionListener value="#{client}" target="#{ClientsController.selectedClient}" />
                                </p:commandButton>
                                <p:commandButton styleClass="button ui-button-warning rounded-button" icon="pi pi-trash"
                                actionListener="#{ClientsController.deleteClient()}" process="@this" update="dynamicContent clientsTable">
                                    <f:setPropertyActionListener value="#{client}" target="#{ClientsController.selectedClient}" />
                                </p:commandButton>
                            </div>
                        </p:column>
                    </p:dataTable>
                    <p:commandButton value="Create Client" actionListener="#{ViewController.selectCreateClients}" update="dynamicContent" styleClass="button is-fullwidth is-success is-rounded"/>
                </h:form>
            </div>
        </div>
    </div>
</h:body>

</ui:composition>
