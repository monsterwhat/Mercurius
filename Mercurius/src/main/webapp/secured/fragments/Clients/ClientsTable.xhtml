<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <h:head>
        <title>Clientes</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css"/>
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
        <style>
            .inactive-row {
                background-color: #999999 !important;
                color: #ffffff !important;
            }
        </style>
    </h:head>
    
    <h:body>
        <div class="box">
            <div class="columns is-centered">
                <div class="column">
                    <p:commandButton value="Volver al menú principal" icon="pi pi-home" actionListener="#{ViewController.selectNone}" update="dynamicContent" styleClass="button is-fullwidth is-inverted is-warning is-rounded"/>
                    <br/>                        
                        <p:toolbar>
                            <p:toolbarGroup align="right">
                                <p:commandButton value="Exportar Excel" icon="pi pi-file-excel" styleClass="ui-button-help" ajax="false">
                                    <p:dataExporter type="xlsx" target="ClientsTableData" fileName="Clientes-Mercurius-Excel" />
                                </p:commandButton>
                                <p:commandButton value="Exportar PDF" icon="pi pi-file-pdf" styleClass="ui-button-help" ajax="false">
                                    <p:dataExporter type="pdf" target="ClientsTableData" fileName="Clientes-Mercurius-PDF" />
                                </p:commandButton>
                            </p:toolbarGroup>
                        </p:toolbar>
                        
                        
                        <p:dataTable value="#{ClientsController.filteredClients}" var="client"  widgetVar="ClientsTable"
                                     paginator="true" rows="8" paginatorPosition="bottom" id="ClientsTableData"
                                     emptyMessage="No se encontraron clientes con la critería proporcionada"
                                     globalFilterFunction="#{ClientsController.globalFilterFunction}"
                                     rowStyleClass="#{client.status == 'false' ? 'inactive-row' : null}"
                                     filterBy="#{ClientsController.filterBy}"
                                     selection="#{ClientsController.selectedClient}" rowKey="#{client.code}">
                            
                            <f:facet name="header">
                                <p:inputText id="globalFilter" onkeyup="PF('ClientsTable').filter()"
                                             placeholder="Búsqueda general de todos los campos" styleClass="input"/>
                            </f:facet>
                            
                            <p:column headerText="ID Cliente" visible="false">
                                <h:outputText value="#{client.code}"/>
                            </p:column>
                            <p:column headerText="Nombre" sortBy="#{client.name}">
                                <h:outputText value="#{client.name}"/>
                            </p:column>
                            <p:column headerText="Dirección" sortBy="#{client.direccion}">
                                <h:outputText value="#{client.address}" />
                            </p:column>
                            <p:column headerText="Correo" sortBy="#{client.email}">
                                <h:outputText value="#{client.email}" />
                            </p:column>
                            <p:column headerText="Nacimiento" sortBy="#{client.birthDate}">
                                <h:outputText value="#{client.birthDate}" />
                            </p:column>
                            <p:column headerText="Tipo de Cédula" sortBy="#{client.idType}">
                                <h:outputText value="#{client.idType}" />
                            </p:column>
                            <p:column headerText="Número de Cédula" sortBy="#{client.idNumber}">
                                <h:outputText value="#{client.idNumber}" />
                            </p:column>
                            <p:column headerText="Descuento" sortBy="#{client.discount}">
                                <h:outputText value="#{client.discount}" />
                            </p:column>
                            <p:column headerText="Número de Teléfono" sortBy="#{client.phoneNumber}">
                                <h:outputText value="#{client.phoneNumber}" />
                            </p:column>
                            <p:column headerText="Tributador" sortBy="#{client.taxpayer}">
                                <h:outputText value="#{client.taxpayer}" />
                            </p:column>
                            <p:column headerText="Código de Zona" sortBy="#{client.zoneCode}">
                                <h:outputText value="#{client.zoneCode}" />
                            </p:column>
                            <p:column headerText="Estado" visible="false" sortBy="#{client.status}">
                                <h:outputText value="#{client.status}" />
                            </p:column>                            
                            <p:column headerText="Acciones">
                                <div class="buttons has-addons">
                                    <p:commandButton styleClass="button edit-button rounded-button ui-button-success" icon="pi pi-pencil"
                                    actionListener="#{ViewController.selectEditClients()}" process="@this" update="dynamicContent">
                                        <f:setPropertyActionListener value="#{client}" target="#{ClientsController.selectedClient}" />
                                    </p:commandButton>
                                    <p:commandButton styleClass="button ui-button-warning rounded-button" icon="pi pi-trash"
                                    actionListener="#{ClientsController.deleteClient()}" process="@this" update="dynamicContent clientsTable">
                                        <f:setPropertyActionListener value="#{client}" target="#{ClientsController.selectedClient}" />
                                    </p:commandButton>
                                </div>
                            </p:column>
                        </p:dataTable>
                        <p:commandButton value="Crear Cliente" actionListener="#{ViewController.selectCreateClients}" update="dynamicContent" styleClass="button is-fullwidth is-success is-rounded"/>
                </div>
            </div>
        </div>
    </h:body>

</ui:composition>
