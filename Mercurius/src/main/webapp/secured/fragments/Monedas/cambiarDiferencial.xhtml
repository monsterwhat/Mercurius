<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
                    
    <h:body>
        
        <p:dialog header="Diferencia de cambio" dynamic="true" widgetVar="diferencial" modal="true" closable="false">
            <h:form id="diferencial">
                <p:inputText id="diferencia" type="number" value="#{SettingsController.currentSettings.diferenciaCambio}" />
                <p:commandButton value="Salvar" actionListener="#{SettingsController.saveCambio}" 
                                 onsuccess="PF('diferencial').hide();" process="@form" update="@this"/>
                <p:commandButton value="Cancelar" onclick="PF('diferencial').hide();" type="button" />
            </h:form>
        </p:dialog>
        
    </h:body>
    
</ui:composition>
