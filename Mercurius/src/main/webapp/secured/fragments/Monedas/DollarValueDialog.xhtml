<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <h:head>
        <title>Tipo Cambio</title>
        <meta charset="utf-8" name="viewport" content="width=device-width, initial-scale=1"/>
    </h:head>
    
    <h:body>
        <!-- Dialog for Tipo Cambio Dolares -->
        <p:dialog header="Tipo de Cambio USD" widgetVar="dollarValueDialog" id="dollarValueDialog"
                  fitViewport="true" blockScroll="true" responsive="true" 
                    modal="true" >
        
            <p:card>
                <p:dataTable value="#{TipoCambioController.cambioActual}" id="dollarValueTable" 
                             widgetVar="dollarValueTable" var="cambio" reflow="true">
                    
                <p:column headerText="Fecha">
                    <h:outputText value="#{cambio.fecha}"/>
                </p:column>
                    
                <p:column headerText="Compra">
                    <h:outputText value="#{cambio.valorCompra}"/>
                </p:column>
                    
                <p:column headerText="Venta">
                    <h:outputText value="#{cambio.valorVenta}"/>
                </p:column>
                    
                </p:dataTable>
                
                <br/>
                
                <p:dataTable value="#{TipoCambioController.cambioActual}" id="dollarTable"
                             widgetVar="dollarTable" var="cambio" reflow="true">
                    
                <p:column headerText="1$">
                    <h:outputText value="#{cambio.valorCompra}"/>
                </p:column>
                    
                <p:column headerText="5$">
                    <h:outputText value="#{cambio.valorCompra*5}"/>
                </p:column>
                    
                <p:column headerText="10$">
                    <h:outputText value="#{cambio.valorCompra*10}"/>
                </p:column>
                    
                <p:column headerText="20$">
                    <h:outputText value="#{cambio.valorCompra*20}"/>
                </p:column>    
                    
                <p:column headerText="50$">
                    <h:outputText value="#{cambio.valorCompra*50}"/>
                </p:column>   
                    
                    
                </p:dataTable>
                <br/>
                
                <p:commandButton icon="pi pi-refresh" value="Recargar" styleClass="rounded-button ui-button-warning" style="width: 50%"
                        actionListener="#{TipoCambioController.recargar()}" update="dollarValueTable dollarTable"/>
                <p:commandButton value="Ok" styleClass="rounded-button ui-button-primary" style="width: 50%"
                        onsuccess="PF('dollarValueDialog').hide();" immediate="true"
                        />
            </p:card> 
            
        </p:dialog>
    </h:body>

</ui:composition>
