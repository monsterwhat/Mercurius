<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
    
    <p:dialog header="Crear Reporte Programado" widgetVar="CrearReporteDialog" 
        fitViewport="true" responsive="true" id="CrearReporteDialog" modal="true">
        <p:outputPanel rendered="#{not empty reportesProgramadosController.newReporte}">
            <h:form>
                <p:panelGrid columns="1">
                    <p:panel header="Crear una nuevo reporte programado">
                        <p:growl showDetail="true" showSummary="false"/>
                        
                        <p:messages showDetail="true" for="name" showSummary="false" closable="true" />
                        <label class="label" for="name" style="color: var(--primary-color); text-align: center">Nombre:</label>
                        <p:inputText id="name" value="#{reportesProgramadosController.newReporte.perfil}" style="width: 100%"
                                     required="true" requiredMessage="El nombre no puede estar vacío"
                                     />
                        
                        <!-- NEEDS -->
                        <!-- NEEDS TIPO (STRING LIST) -->
                        <!-- NEEDS Reportes (String list) -->
                        <!-- NEEDS Correos (String list)-->
                        <!-- NEEDS Status -->
                        
                        <p:spacer height="1em"/>
                        <p:commandButton value="Crear Reporte Programado" process="@form" styleClass="rounded-button ui-button-primary"
                                        update="@form Reportes" style="width: 100%"
                                        action="#{reportesProgramadosController.createReporteDialog}"/>
                    </p:panel>
                </p:panelGrid>
            </h:form>
        </p:outputPanel> 
    </p:dialog>
</ui:composition>
