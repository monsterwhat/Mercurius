<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <h:head>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css"/>
        <meta charset="utf-8" name="viewport" content="width=device-width, initial-scale=1"/>
    </h:head>
    <h:body>
        <h:form id="MainMenu">
            <div class="columns is-mobile buttons">
                <div class="column">
                    <p:commandButton id="FacturacionButton" value="Facturación" styleClass="button is-rounded is-primary is-fullwidth" icon="pi pi-shopping-cart"/>
                    <p:menu overlay="true" trigger="FacturacionButton" my="left top" at="left bottom">
                        <p:submenu label="Facturación">
                            <p:menuitem value="Crear Facturas" icon="pi pi-cart-plus" disabled="true"/>
                            <p:menuitem value="Tipo de Cambio" icon="pi pi-dollar" disabled="true"/>
                        </p:submenu>
                    </p:menu>
                </div>
                <div class="column">
                    <p:commandButton id="InventariosButton" value="Inventarios" styleClass="button is-rounded is-info is-fullwidth" icon="pi pi-box"/>
                    <p:menu overlay="true" trigger="InventariosButton" my="left top" at="left bottom">
                        <p:submenu label="Inventarios">
                            <p:menuitem value="Ver Artículos" icon="pi pi-eye" disabled="true"/>
                            <p:menuitem value="Ver Familias" icon="pi pi-th-large" disabled="true"/>
                            <p:menuitem value="Ajustar Inventario" icon="pi pi-pencil" disabled="true"/>
                        </p:submenu>
                    </p:menu>
                </div>
                <div class="column">
                    <p:commandButton id="UsuariosButton" value="Usuarios" styleClass="button is-rounded is-link is-fullwidth" icon="pi pi-user"/>
                    <p:menu overlay="true" trigger="UsuariosButton" my="left top" at="left bottom">
                        <p:submenu label="Usuarios">
                            <p:menuitem value="Ver Usuarios" icon="pi pi-users" action="#{ViewController.selectViewUsers}" update="dynamicContent"/>
                            <p:menuitem value="Ver Clientes" icon="pi pi-id-card" action="#{ViewController.selectViewClients}" update="dynamicContent"/>
                        </p:submenu>
                    </p:menu>
                </div>
                <div class="column">
                    <p:commandButton id="TributacionButton" value="Tributación" styleClass="button is-rounded is-danger is-fullwidth" icon="pi pi-money-bill"/>
                    <p:menu overlay="true" trigger="TributacionButton" my="left top" at="left bottom">
                        <p:submenu label="Tributación">
                            <p:menuitem value="Consultas" icon="pi pi-book" disabled="true"/>
                            <p:menuitem value="CaByS" icon="pi pi-book" action="#{ViewController.selectViewCabys}" update="dynamicContent" disabled="false"/>
                        </p:submenu>
                    </p:menu>
                </div>
                <div class="column">
                    <p:commandButton id="RegistrosButton" value="Registros" styleClass="button is-rounded is-warning is-fullwidth" icon="pi pi-book"/>
                    <p:menu overlay="true" trigger="RegistrosButton" my="left top" at="left bottom" collision="fit">
                        <p:submenu label="Reportes Facturación">
                            <p:menuitem value="Facturación Diaria" icon="pi pi-calendar" disabled="true"/>
                            <p:menuitem value="Facturación de Artículos" icon="pi pi-box" disabled="true"/>
                        </p:submenu>
                        <p:submenu label="Reportes Inventarios">
                            <p:menuitem value="Inventario Detallado" icon="pi pi-search" disabled="true"/>
                            <p:menuitem value="Precios Detallados" icon="pi pi-search" disabled="true"/>
                            <p:menuitem value="Familias Detalladas" icon="pi pi-search" disabled="true"/>
                            <p:menuitem value="Ajustes Detallados" icon="pi pi-search" disabled="true"/>
                            <p:menuitem value="Generar Etiquetas" icon="pi pi-ticket" disabled="true"/>
                        </p:submenu>
                    </p:menu>
                </div>
            </div>
        </h:form>
    </h:body>
</ui:composition>
