<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <h:head>
        <title>Inventario</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css"/>
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
        <style>
            .inactive-row {
                background-color: #999999 !important;
                color: #ffffff !important;
            }
        </style>
    </h:head>
    
    <h:body>
        <div class="box">
            <div class="columns is-centered">
                <div class="column">
                    <p:commandButton value="Volver al menú principal" icon="pi pi-home" actionListener="#{ViewController.selectNone}" update="dynamicContent" styleClass="button is-fullwidth is-inverted is-warning is-rounded"/>
                    <br/>
                        
                        <p:toolbar class="is-clearfix">
                            <p:toolbarGroup align="right">
                                <p:commandButton value="Exportar Excel" icon="pi pi-file-excel" styleClass="ui-button-help button is-primary" ajax="false">
                                    <!-- Adjust the target and file name -->
                                    <p:dataExporter type="xlsx" target="InventarioTableData" fileName="Inventario-Mercurius-Excel" />
                                </p:commandButton>
                                <p:commandButton value="Exportar PDF" icon="pi pi-file-pdf" styleClass="ui-button-help button is-primary" ajax="false">
                                    <!-- Adjust the target and file name -->
                                    <p:dataExporter type="pdf" target="InventarioTableData" fileName="Inventario-Mercurius-PDF" />
                                </p:commandButton>
                            </p:toolbarGroup>
                        </p:toolbar>
                        
                        <!-- Adjust the controller and filtered data -->
                        <p:dataTable value="#{InventarioController.filteredInventarioDetallado}" var="inventario"  widgetVar="InventarioTable"
                                     paginator="true" rows="8" paginatorPosition="bottom" id="InventarioTableData"
                                     emptyMessage="No se encontraron registros de inventario con la critería proporcionada"
                                     rowStyleClass="#{inventario.status == 'false' ? 'inactive-row' : null}"
                                     globalFilterFunction="#{InventarioController.globalFilterFunction}"
                                     filterBy="#{InventarioController.filterBy}"
                                     selection="#{InventarioController.selectedInventario}" rowKey="#{inventario.codigo}">
                            
                            <p:ajax event="rowSelect" update="inventarioTableDetallado"/>
                            
                            <f:facet name="header">
                                <div class="field columns">
                                    <p:inputText id="globalFilter" onkeyup="PF('InventarioTable').filter()"
                                             placeholder="Búsqueda general de todos los campos" styleClass="input column"/>
                                    <p:commandButton value="Ver Detalles" styleClass="button is-2 is-rounded" icon="pi pi-eye"
                                                     onclick="PF('AjusteDetailsDialog').show();" >
                                    <f:setPropertyActionListener value="#{inventario}" target="#{InventarioController.selectedInventario}" />
                                    </p:commandButton>
                                    <ui:include src="../../Inventario/verDetallesDeAjuste.xhtml"/>
                                </div>
                                
                            </f:facet>
                            
                            <p:column headerText="Código" width="4%">
                                <h:outputText value="#{inventario.codigo}"/>
                            </p:column>
                            <p:column headerText="Artículo">
                                <h:outputText value="#{inventario.articulo.nombre}"/>
                            </p:column>
                            <p:column headerText="Cantidad" width="6%">
                                <h:outputText value="#{inventario.cantidad}"/>
                            </p:column>
                            <p:column headerText="Tipo Movimiento" width="9%">
                                <h:outputText value="#{inventario.tipoMovimiento}"/>
                            </p:column>
                            <p:column headerText="Fecha Movimiento">
                                <h:outputText value="#{inventario.fechaMovimiento}"/>
                            </p:column>
                            <p:column headerText="Notas" visible="false">
                                <h:outputText value="#{inventario.notas}"/>
                            </p:column>
                            <p:column headerText="Usuario" width="8%">
                                <h:outputText value="#{inventario.usuario.username}"/>
                            </p:column>
                            <p:column width="4%">
                                <p:chip icon="pi pi-exclamation-triangle" styleClass="has-background-warning" rendered="#{!inventario.processed}"/>
                            </p:column>
                            <p:column width="4%">
                                <p:chip icon="pi pi-check" styleClass="has-background-success" rendered="#{inventario.status}"/>
                            </p:column>

                            
                            <p:column headerText="Acciones" rendered="false">
                                <div class="has-addons">
                                    <p:commandButton styleClass="button edit-button rounded-button ui-button-success" icon="pi pi-pencil"
                                        actionListener="#{ViewController.selectEditInventario()}" process="@this" update="dynamicContent">
                                        <f:setPropertyActionListener value="#{inventario}" target="#{InventarioController.selectedInventario}" />
                                    </p:commandButton>
                                    <p:commandButton styleClass="button ui-button-warning rounded-button" icon="pi pi-trash"
                                        actionListener="#{InventarioController.deleteInventario()}" process="@this" update="dynamicContent inventarioTableDetallado">
                                        <f:setPropertyActionListener value="#{inventario}" target="#{InventarioController.selectedInventario}" />
                                    </p:commandButton>
                                </div>
                            </p:column>
                        </p:dataTable>
                        <!-- Adjust the button action -->
                        <p:commandButton value="Crear Ajuste" actionListener="#{ViewController.selectCreateInventario}" update="dynamicContent" styleClass="button is-fullwidth is-success is-rounded"/>
                </div>
            </div>
        </div>
    </h:body>

</ui:composition>
