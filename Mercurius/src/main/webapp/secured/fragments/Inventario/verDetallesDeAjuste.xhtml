<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <h:head>
        <title>Detalles Ajuste</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css"/>
        <meta charset="utf-8" name="viewport" content="width=device-width, initial-scale=1"/>
    </h:head>
    
    <h:body>
        <!-- Dialog for Informacion de Ajuste -->
        <p:dialog header="Informacion de Ajuste" widgetVar="AjusteDetailsDialog" 
                  fitViewport="true" responsive="true" id="AjusteDetailsDialog"
        modal="true" resizable="false" draggable="false" style="height: 400px; overflow-y: auto;">
        <p:outputPanel rendered="#{not empty InventarioController.selectedInventario}">
            <div class="box">
                <p:dataTable id="selectedArticulo" var="item" value="#{InventarioController.selectedInventario}">
                    <p:column headerText="Código" visible="false">
                        <h:outputText value="#{item.codigo}" />
                    </p:column>
                    <p:column headerText="Código Barra">
                        <h:outputText value="#{item.articulo.codigoBarra}" />
                    </p:column>
                    <p:column headerText="Nombre">
                        <h:outputText value="#{item.articulo.nombre}" />
                    </p:column>
                    <p:column headerText="Precio Costo">
                        <h:outputText value="#{item.articulo.precioCostoSinIVA}" />
                    </p:column>
                    <p:column headerText="Utilidad">
                        <h:outputText value="#{item.articulo.porcentajeUtilidad}" />
                    </p:column>
                    <p:column headerText="Precio Sin Iva">
                        <h:outputText value="#{item.articulo.precioFinal}" />
                    </p:column>
                    <p:column headerText="Precio Final">
                        <h:outputText value="#{item.articulo.precioCostoConIVA}" />
                    </p:column>
                    <p:column headerText="Cantidad">
                        <h:outputText value="#{item.cantidad}" />
                    </p:column>
                    <p:column headerText="Tipo Movimiento">
                        <h:outputText value="#{item.tipoMovimiento}" />
                    </p:column>
                    <p:column headerText="Fecha Movimiento">
                        <h:outputText value="#{item.fechaMovimiento}" />
                    </p:column>
                    <p:column headerText="Notas">
                        <h:outputText value="#{item.notas}" />
                    </p:column>
                    <p:column headerText="Usuario">
                        <h:outputText value="#{item.usuario.username}" />
                    </p:column>
                </p:dataTable>
            </div>
                
            <div class="columns buttons">
                <div class="column is-2">
                    <p:commandButton value="Procesar" styleClass="button is-fullwidth is-rounded is-success" icon="pi pi-sync"
                            actionListener="#{ViewController.selectSyncInventario}" rendered="#{SessionController.inventarios}"
                            process="@this" update="dynamicContent" immediate="true">
                            <f:setPropertyActionListener value="#{inventario}" target="#{InventarioController.selectedInventario}" />
                            <p:resetInput target="InventarioTableData"/>
                    </p:commandButton>                
                </div>
                <div class="column is-fullwidth">
                    <p:commandButton styleClass="button is-fullwidth is-warning" value="Editar"/>
                </div>
            </div>
                
        </p:outputPanel>
        
    </p:dialog>
    </h:body>

</ui:composition>
