
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <h:head>
        <title>Inventario</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css"/>
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
    </h:head>
    
    <h:body>
        <p:dialog header="Subir Facturas" widgetVar="facturasUpload" position="center"
          fitViewport="true" width="800" height="500" responsive="true" draggable="false">
            <h:form id="upload">
                <div class="box">
                    <p:growl id="messages" showDetail="true" keepAlive="true"/>
                    <div class="columns">
                        <p:fileUpload value="#{uploadController.file}" mode="advanced"
                                      multiple="true" update="messages uploadedFiles" styleClass="column"
                                    sizeLimit="100000" fileLimit="5" allowTypes="/(\.|\/)(xml)$/" 
                                    invalidFileMessage="Tipo de archivo invalido"
                                    listener="#{uploadController.handleFileUpload}"
                                    fileLimitMessage="Se alcanzo el limite de facturas por peticion" 
                                    invalidSizeMessage="El archivo es muy grande"/>                                
                    </div>
                    <div class="column">
                        <p:dataTable id="uploadedFiles" value="#{facturasController.files}" widgetVar="uploadedFiles" var="file">
                            <p:column headerText="Nombre:">
                                <h:outputText value="#{file.fileName}"/>
                            </p:column>
                        </p:dataTable>
                    </div>
                </div>
            </h:form>
                <div class="column has-text-centered">
                    <p:commandButton value="Procesar Facturas" actionListener="#{facturasController.processFacturas}"
                                     styleClass="button" update="upload:uploadedFiles dynamicContent facturaTable"/>
                </div>
        </p:dialog>
    </h:body>

</ui:composition>
