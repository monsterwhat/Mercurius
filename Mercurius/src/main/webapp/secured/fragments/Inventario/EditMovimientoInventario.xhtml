<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <h:head>
        <title>Editar Inventario</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css"/>
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
    </h:head>
    
    <h:body>
        <div class="box">
            <div class="columns is-centered">
                <div class="column">
                    <p:commandButton value="Volver a lista de inventarios" icon="pi pi-backward"
                                     styleClass="button is-inverted is-fullwidth is-warning is-rounded"
                                     immediate="true" action="#{ViewController.selectViewInventario()}"
                                     update="dynamicContent" />
                    <h:form id="editInventarioForm" rendered="#{not empty InventarioController.selectedInventario}">
                        <br/>
                        <p:panel header="Editar Inventario: #{InventarioController.selectedInventario.codigo}">
                            <p:growl id="growl" showDetail="true" showSummary="false"/>
                            
                            <!-- Input for article -->
                            <div class="field is-horizontal">
                                <div class="field-label is-normal">
                                    <label class="label">Artículo:</label>
                                </div>
                                <div class="field-body">
                                    <div class="field">
                                        <p:inputText value="#{InventarioController.selectedInventario.articulo.nombre}" 
                                                     styleClass="input is-fullwidth" disabled="true" />
                                    </div>
                                </div>
                            </div>
                            
                            <!-- Input for quantity -->
                            <p:messages for="cantidad" showSummary="false" showDetail="true" closable="true" />
                            <div class="field is-horizontal">
                                <div class="field-label is-normal">
                                    <label class="label" for="cantidad">Cantidad:</label>
                                </div>
                                <div class="field-body">
                                    <div class="field">
                                        <p:inputText id="cantidad" value="#{InventarioController.selectedInventario.cantidad}"
                                                     required="true" requiredMessage="La cantidad no puede estar vacía"
                                                     styleClass="input is-fullwidth"/>
                                    </div>
                                </div>
                            </div>
                            
                            <!-- Add more fields for inventory attributes if needed -->
                            
                            <div class="field is-horizontal">
                                <div class="field-body">
                                    <div class="field">
                                        <p:commandButton value="Actualizar datos" styleClass="button is-fullwidth is-success is-rounded"
                                                         action="#{InventarioController.updateInventario}" update="dynamicContent" />
                                    </div>
                                </div>
                            </div>
                        </p:panel>
                    </h:form>
                </div>
            </div>
        </div>
    </h:body>
</ui:composition>
