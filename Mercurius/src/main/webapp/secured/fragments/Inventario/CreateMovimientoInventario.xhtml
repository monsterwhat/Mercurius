<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <h:head>
        <title>Crear Inventario</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css"/>
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
    </h:head>
    
    <h:body>
        <div class="box">
            <div class="columns is-centered">
                <div class="column">
                    <p:commandButton value="Volver a lista de inventarios" icon="pi pi-arrow-left"
                                     styleClass="button is-inverted is-fullwidth is-warning is-rounded"
                                     immediate="true" action="#{ViewController.selectViewInventario}"
                                     update="dynamicContent"/>
                    <h:form id="createInventario">
                        <br/>
                        <p:panel header="Crear un Ajuste de Inventario">
                            <p:growl id="growl" showDetail="true" showSummary="false"/>
                            
                            <!-- Input for article -->
                            <p:messages showDetail="true" for="article" showSummary="false" closable="true" />
                            <div class="field is-horizontal">
                                <div class="field-label is-normal">
                                    <label class="label" for="article">Artículo:</label>
                                </div>
                                <div class="field-body">
                                    <div class="field">
                                        <p:selectOneMenu id="article" value="#{InventarioController.articuloID}"
                                                         required="true" requiredMessage="El artículo es obligatorio"
                                                         styleClass="input" widgetVar="articuloSelect">
                                            <f:selectItem itemLabel="Seleccionar Articulo" itemValue="" />
                                            <f:selectItems value="#{InventarioController.articuloOptions}" var="articulo"
                                                           itemLabel="#{articulo.nombre}" itemValue="#{articulo.codigo}"/>
                                        </p:selectOneMenu>
                                    </div>
                                </div>
                            </div>
                            
                            <!-- Input for quantity -->
                            <p:messages showDetail="true" for="cantidad" showSummary="false" closable="true" />
                            <div class="field is-horizontal">
                                <div class="field-label is-normal">
                                    <label class="label" for="cantidad">Cantidad:</label>
                                </div>
                                <div class="field-body">
                                    <div class="field">
                                        <p:inputText id="cantidad" type="number" value="#{InventarioController.newInventario.cantidad}"
                                                     required="true" requiredMessage="La cantidad es obligatoria"
                                                     styleClass="input is-fullwidth"/>
                                    </div>
                                </div>
                            </div>
                            
                            <!-- Input for type -->
                            <p:messages showDetail="true" for="tipo" showSummary="false" closable="true" />
                            <div class="field is-horizontal">
                                <div class="field-label is-normal">
                                    <label class="label" for="tipo">Tipo:</label>
                                </div>
                                <div class="field-body">
                                    <div class="field">
                                        <p:selectOneMenu id="tipo" value="#{InventarioController.newInventario.tipoMovimiento}"
                                                        required="true" requiredMessage="El tipo es obligatorio"
                                                        styleClass="input">
                                            <f:selectItem itemLabel="-- Seleccionar --" itemValue=""/>
                                            <f:selectItem itemLabel="Entrada de Inventario" itemValue="Entrada de Inventario"/>
                                            <f:selectItem itemLabel="Ajuste de Inventario" itemValue="Ajuste de Inventario"/>
                                            <f:selectItem itemLabel="Option 3" itemValue="Option 3"/>
                                        </p:selectOneMenu>
                                    </div>
                                </div>
                            </div>
                            
                            <!-- Input for notes -->
                            <p:messages showDetail="true" for="notas" showSummary="false" closable="true" />
                            <div class="field is-horizontal">
                                <div class="field-label is-normal">
                                    <label class="label" for="notas">Notas:</label>
                                </div>
                                <div class="field-body">
                                    <div class="field">
                                        <p:inputTextarea id="notas" value="#{InventarioController.newInventario.notas}"
                                                         rows="4" styleClass="textarea is-fullwidth"/>
                                    </div>
                                </div>
                            </div>
                            
                            <!-- Add more fields for inventory attributes if needed -->
                            
                        </p:panel>
                        <br/>
                        <!-- Button to create inventory -->
                        <p:commandButton value="Crear Ajuste" styleClass="button is-fullwidth is-rounded is-success"
                                         action="#{InventarioController.createInventario}" update="dynamicContent inventarioTable createInventario"/>
                    </h:form>
                </div>
            </div>
        </div>
    </h:body>

</ui:composition>
