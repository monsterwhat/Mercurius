<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <h:head>
        <title>Articulo</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css"/>
        <meta charset="utf-8" name="viewport" content="width=device-width, initial-scale=1"/>
    </h:head>
    
    <h:body>
        <!-- Dialog for Articulo -->
        <p:dialog header="Seleccionar Articulo" widgetVar="ArticuloRevisionDialog" fitViewport="true" blockScroll="true"
         resizable="false" draggable="false" style="height: 400px; overflow-y: auto;">
                        
            <p:dataTable value="#{ArticulosController.filteredArticulosActivosYProcesados}" var="articulo" widgetVar="ArticuloTable"
                         paginator="true" rows="8" paginatorPosition="bottom" id="ArticuloTable" reflow="true"
                        emptyMessage="No se encontraron bienes ni servicios con la critería proporcionada"
                        globalFilterFunction="#{ArticulosController.globalFilterFunction}"
                        filterBy="#{ArticulosController.filterBy}" showGridlines="true"
                        selection="#{InventarioController.selectedArticulo}" rowKey="#{articulo.codigo}">

                <f:facet name="header">
                    <p:inputText id="globalFilter" onkeyup="PF('ArticuloTable').filter()"
                                 placeholder="#{InventarioController.selectedInventario.articulo.nombre}" styleClass="input"/>
                </f:facet>

               <p:column selectionMode="single" style="width: 3%" />
               <p:column headerText="Nombre" sortBy="#{articulo.nombre}">
                   <h:outputText value="#{articulo.nombre}" />
               </p:column>

            </p:dataTable>
        
                <p:commandButton value="Seleccionar" styleClass="button is-fullwidth" action="#{InventarioController.articuloSelectedEdit()}" 
                                 onclick="PF('ArticuloRevisionDialog').hide();" immediate="true"
                         />
            
        </p:dialog>
    </h:body>

</ui:composition>
