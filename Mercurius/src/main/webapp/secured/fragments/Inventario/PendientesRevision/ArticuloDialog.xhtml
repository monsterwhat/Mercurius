<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

        <p:dialog header="Seleccionar Articulo" widgetVar="ArticuloRevisionDialog" fitViewport="true">
            <h:form>
                <p:dataTable value="#{ArticulosController.filteredArticulosActivosYProcesados}" var="articulo" widgetVar="ArticuloTable"
                             paginator="true" rows="8" paginatorPosition="bottom" id="ArticuloTable" reflow="true"
                            emptyMessage="No se encontraron bienes ni servicios con la critería proporcionada"
                            globalFilterFunction="#{ArticulosController.globalFilterFunction}"
                            filterBy="#{ArticulosController.filterBy}" showGridlines="true"
                            selection="#{InventarioController.selectedArticulo}" rowKey="#{articulo.codigo}">

                    <p:autoUpdate/>
                    
                    <f:facet name="header">
                        <p:inputText id="globalFilter" onkeyup="PF('ArticuloTable').filter()"
                                     placeholder="#{InventarioController.selectedInventario.articulo.nombre}" styleClass="input"/>
                    </f:facet>

                   <p:column selectionMode="single" style="width: 3%" />
                    <p:column headerText="Nombre" sortBy="#{articulo.nombre}">
                        <h:outputText value="#{articulo.nombre}" />
                    </p:column>

                </p:dataTable>
        
                <p:commandButton value="Seleccionar" styleClass="button is-fullwidth" action="#{InventarioController.articuloSelectedEditDialog()}" 
                                 process="@form" update="@form"
                         />
            </h:form>
        </p:dialog>
</ui:composition>
