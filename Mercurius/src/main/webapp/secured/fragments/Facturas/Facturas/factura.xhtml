<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
    
    <p:dialog widgetVar="CrearFacturaDialog" closable="false" 
        fitViewport="true" responsive="true" id="CrearFacturaDialog" modal="true">
        <p:outputPanel rendered="#{not empty ClientsController.newClient}" layout="flex">
            <h:form id="createFactura">
                <p:panel header="Crear Factura - #{SessionController.currentUser.username}" >
                    <p:growl showDetail="true" showSummary="false"/>
                        <p:card>
                            <p:panelGrid columns="2" layout="flex">
                                <p:column>
                                    <!-- Tipo Factura -->
                                    <div class="ui-inputgroup">
                                        <p:selectOneMenu id="group" >
                                            <f:selectItem itemLabel="Tipo Contado" itemValue="contado"/>
                                            <f:selectItems/>
                                        </p:selectOneMenu>
                                    <!-- Cliente -->
                                        <span class="ui-inputgroup">
                                            <p:inputText placeholder="Cliente" onkeydown="if (event.keyCode === 13) { event.preventDefault(); document.getElementById('CrearFacturaDialog:createFactura:cantidad').focus(); }"/>
                                            <p:commandButton icon="pi pi-address-book" styleClass="ui-button-warning"/>
                                        </span>
                                    </div>
                                </p:column>
                                <p:column>
                                    <div class="ui-inputgroup">
                                        <!-- Cantidad -->
                                        <div class="ui-input-icon-left">
                                            <i class="pi pi-hashtag" />
                                            <p:inputText id="cantidad" placeholder="Cantidad" onkeydown="if (event.keyCode === 13) { event.preventDefault();  }"/>
                                        </div>
                                        <!-- CodigoBarra (Ingreso articulo) -->
                                        <div class="ui-inputgroup">
                                            <p:inputText placeholder="Codigo de Barra" onkeydown="if (event.keyCode === 13) { event.preventDefault(); }" />
                                            <p:commandButton icon="pi pi-barcode" styleClass="ui-button-warning"/>
                                        </div>
                                    </div>
                                </p:column>
                            </p:panelGrid>

                                <p:dataTable var="carrito" value="#{facturasController.carritoCompras}" reflow="true" 
                                             showGridlines="true" stripedRows="true" emptyMessage="No hay articulos."
                                         scrollable="true" scrollHeight="250">
                                <p:autoUpdate/>
                                <p:column>
                                    
                                </p:column>
                            </p:dataTable>

                        </p:card>
                        
                        <p:column>
                            <!--Total-->
                            <p:card>

                            </p:card>
                        </p:column>
                            
                        
                    <p:commandButton style="width: 100%" styleClass="ui-button-secondary" icon="pi pi-times"  value="Cancelar"
                                 actionListener="#{facturasController.cancel()}" process="@form" update="@this"
                                 onclick="PF('CrearFacturaDialog').hide();"/>
                </p:panel>
            </h:form>
        </p:outputPanel>           
    </p:dialog>
</ui:composition>
