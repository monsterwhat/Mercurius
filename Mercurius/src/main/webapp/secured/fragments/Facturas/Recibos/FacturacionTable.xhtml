
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <h:head>
        <title>Factura</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css"/>
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
    </h:head>
    
    <h:body>
        <div class="box">
            <div class="columns is-centered">
                <div class="column">
                    <p:commandButton value="Volver al menú principal" icon="pi pi-home" actionListener="#{ViewController.selectNone}" update="dynamicContent" styleClass="button is-fullwidth is-inverted is-warning is-rounded"/>
                    <br/>
                    <h:form id="facturaTable">
                        <div class="columns is-mobile">
                                <div class="column">
                                    <p:commandButton icon="pi pi-upload" onclick="PF('facturasUpload').show();" value="Subir Factura" styleClass="button is-fullwidth"/>                            
                                </div>

                                <div class="column buttons">
                                    <p:commandButton value="Exportar Excel" icon="pi pi-file-excel" styleClass="button is-warning" ajax="false">
                                        <p:dataExporter type="xlsx" target="FacturasTableData" fileName="Facturas-Mercurius-Excel" />
                                    </p:commandButton>
                                    <p:commandButton value="Exportar PDF" icon="pi pi-file-pdf" styleClass="button is-warning" ajax="false">
                                        <p:dataExporter type="pdf" target="FacturasTableData" fileName="Facturas-Mercurius-PDF" />
                                    </p:commandButton>
                                </div>
                        </div>
                        <ui:include src="../../Inventario/Upload/subirFacturas.xhtml"/>


                        <p:dataTable value="#{facturasController.filteredFacturas}" var="factura" widgetVar="FacturasTable"
                                     paginator="true" rows="8" paginatorPosition="bottom" id="FacturasTableData"
                                     emptyMessage="No se encontraron registros de factura con la critería proporcionada"
                                     globalFilterFunction="#{facturasController.globalFilterFunction}"
                                     filterBy="#{facturasController.filterBy}"
                                     selection="#{facturasController.selectedFactura}" rowKey="#{factura.id}">
                            
                            <p:ajax event="rowSelect" update="lineasDetalleTable"/>
                            
                            <f:facet name="header">
                                <div class="field columns is-mobile">
                                    <p:inputText id="globalFilter" onkeyup="PF('FacturasTable').filter()"
                                             placeholder="Búsqueda general de todos los campos" styleClass="input column"/>

                                    <ui:include src="../../Facturas/Recibos/verDetallesFactura.xhtml"/>
                                </div>
                            </f:facet>
                            
                            <p:column headerText="Código" visible="false" >
                                <h:outputText value="#{factura.id}"/>
                            </p:column>
                            <p:column headerText="Numero Consecutivo" >
                                <h:outputText value="#{factura.numeroConsecutivo}"/>
                            </p:column>
                            <p:column headerText="Fecha" >
                                <h:outputText value="#{factura.fechaEmision}"/>
                            </p:column>
                            <p:column headerText="Emisor: " >
                                <h:outputText value="#{factura.emisor.nombre}"/>
                            </p:column>
                            <p:column headerText="Condicion Venta" >
                                <h:outputText value="#{factura.condicionVenta}"/>
                            </p:column>
                            <p:column headerText="Plazo Credito" >
                                <h:outputText value="#{factura.plazoCredito}"/>
                            </p:column>
                            <p:column headerText="Medio Pago" >
                                <h:outputText value="#{factura.medioPago}"/>
                            </p:column>
                            
                            <p:column headerText="Acciones" exportable="false">
                                <div class="buttons">
                                    <p:commandButton styleClass="button is-1 is-rounded is-mobile" process="@this" update="lineasDetalleTable"
                                                     icon="pi pi-sync" onclick="PF('selectedFacturaDetallado').show(); PF('selectedFacturaDetallado').toggleMaximize();" >
                                    <f:setPropertyActionListener value="#{factura}" target="#{facturasController.selectedFactura}" />
                                    </p:commandButton>
                                    <p:commandButton styleClass="button ui-button-warning rounded-button" icon="pi pi-trash"
                                        actionListener="#{facturasController.deleteFactura()}" process="@this" update="dynamicContent facturaTable">
                                        <f:setPropertyActionListener value="#{factura}" target="#{facturasController.selectedFactura}" />
                                    </p:commandButton>
                                </div>
                            </p:column>
                        </p:dataTable>
                    </h:form>
                </div>
            </div>
        </div>
    </h:body>

</ui:composition>
