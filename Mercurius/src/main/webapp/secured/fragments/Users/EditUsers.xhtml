<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <h:head>
        <title>Editar Usuarios</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css"/>
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
    </h:head>
    
    <h:body>
        <div class="box">
            <div class="columns is-centered">
                <div class="column">
                    <p:commandButton value="Volver a lista de usuarios" icon="pi pi-backward" styleClass="button is-fullwidth is-inverted is-warning is-rounded" immediate="true" action="#{ViewController.selectViewUsers()}" update="dynamicContent" />
                    <h:form id="editProfileForm" rendered="#{not empty ProfilesController.selectedProfile}">
                        <br/>
                        <p:panel header="Editar Usuario: #{ProfilesController.selectedProfile.username}">
                            <p:growl id="growl" showDetail="true" showSummary="false"/>
                            
                            <p:messages for="username" showSummary="false" showDetail="true" closable="true" />
                            <div class="field is-horizontal">
                                <div class="field-label is-normal">
                                    <label class="label" for="username">Nombre de usuario:</label>
                                </div>
                                <div class="field-body">
                                    <div class="field">
                                        <p:inputText id="username" value="#{ProfilesController.selectedProfile.username}" required="true" requiredMessage="El nombre de usuario no puede estar vacío" styleClass="input is-fullwidth"/>
                                    </div>
                                </div>
                            </div>
                            
                            <p:messages for="groupName" showSummary="false" showDetail="true" closable="true" />
                            <div class="field is-horizontal">
                                <div class="field-label is-normal">
                                    <label class="label" for="groupName">Grupo:</label>
                                </div>
                                <div class="field-body">
                                    <div class="field">
                                        <p:inputText id="groupName" value="#{ProfilesController.selectedProfile.groupName}" required="true" requiredMessage="El grupo no puede estar vacío" styleClass="input is-fullwidth"/>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="field is-horizontal">
                                <div class="field-body">
                                    <div class="field">
                                        <p:commandButton value="Actualizar datos" styleClass="button is-fullwidth is-success is-rounded" action="#{ProfilesController.updateProfile}" update="dynamicContent" />
                                    </div>
                                </div>
                            </div>
                        </p:panel>
                    </h:form>
                </div>
            </div>
        </div>
    </h:body>
    
</ui:composition>
