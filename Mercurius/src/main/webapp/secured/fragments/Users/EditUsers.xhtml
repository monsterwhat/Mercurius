<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <h:head>
        <title>Editar Usuarios</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css"/>
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
    </h:head>
    
    <h:body>
        <div class="box">
            <div class="columns is-centered">
                <div class="column">
                    <p:commandButton value="Volver a lista de usuarios" icon="pi pi-backward" styleClass="button is-fullwidth is-inverted is-warning is-rounded" immediate="true" action="#{ViewController.selectViewUsers()}" update="dynamicContent" />
                    <h:form id="editUserForm" rendered="#{not empty UsersController.selectedUser}">
                        <br/>
                        <p:panel header="Editar Usuario: #{UsersController.selectedUser.username}">
                            <p:growl id="growl" showDetail="true" showSummary="false">
                                <p:autoUpdate/>
                            </p:growl>
                            
                            <p:messages for="username" showSummary="false" showDetail="true" closable="true" />
                            <div class="field is-horizontal">
                                <div class="field-label is-normal">
                                    <label class="label" for="username">Nombre de usuario:</label>
                                </div>
                                <div class="field-body">
                                    <div class="field">
                                        <p:inputText id="username" value="#{UsersController.selectedUser.username}" required="true" requiredMessage="El nombre de usuario no puede estar vacío" styleClass="input is-fullwidth"/>
                                    </div>
                                </div>
                            </div>
                            
                            <!-- Input for groupName -->
                            <p:messages showDetail="true" for="groupName" showSummary="false" closable="true" />
                            <div class="field is-horizontal">
                                <div class="field-label is-normal">
                                    <label class="label" for="groupName">Permisos:</label>
                                </div>
                                <div class="field-body">
                                    <div class="field">
                                        <p:selectManyCheckbox id="groupName" value="#{UsersController.selectedPuestos}"
                                                        required="true" requiredMessage="El nombre de grupo no puede estar vacío"
                                                        styleClass="input is-fullwidth">
                                            <p:ajax listener="#{UsersController.selectedOptionsUpdateChanged}"/>
                                            <f:selectItem itemLabel="Administrativo" itemValue="admin" rendered="#{SessionController.admin}"/>
                                            <f:selectItem itemLabel="Facturacion" itemValue="facturacion"/>
                                            <f:selectItem itemLabel="Inventarios" itemValue="inventario"/>
                                            <f:selectItem itemLabel="Usuarios" itemValue="usuario"/>
                                            <f:selectItem itemLabel="Tributacion" itemValue="tributacion"/>
                                            <f:selectItem itemLabel="Registros" itemValue="registro"/>
                                        </p:selectManyCheckbox>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="field is-horizontal">
                                <div class="field-body">
                                    <div class="field">
                                        <p:commandButton value="Actualizar datos" styleClass="button is-fullwidth is-success is-rounded" action="#{UsersController.updateUser}" update="dynamicContent" />
                                    </div>
                                </div>
                            </div>
                        </p:panel>
                    </h:form>
                </div>
            </div>
        </div>
    </h:body>
    
</ui:composition>
