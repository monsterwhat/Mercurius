<ui:composition xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<h:head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css"/>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
</h:head>
    
<h:body>
    <div class="box">
        <div class="columns is-centered">
            <div class="column">
                <p:commandButton value="Volver a lista de usuarios" icon="pi pi-arrow-left" styleClass="button is-fullwidth is-inverted is-warning is-rounded" immediate="true" action="#{ViewController.selectViewUsers()}" update="dynamicContent" />
                <h:form>
                    <br/>
                    <p:panel header="Crear un nuevo usuario">
                        <p:growl id="growl" showDetail="true" showSummary="false"/>
                        
                        <p:messages showDetail="true" for="username" showSummary="false" closable="true" />
                        <div class="field is-horizontal">
                            <div class="field-label is-normal">
                                <label class="label" for="username">Nombre de usuario:</label>
                            </div>
                            <div class="field-body">
                                <div class="field">
                                    <p:inputText id="username" value="#{ProfilesController.newProfile.username}" required="true" requiredMessage="El nombre de usuario no puede estar vacío" styleClass="input is-fullwidth"/>
                                </div>
                            </div>
                        </div>
                        
                        <p:messages showDetail="true" for="password" showSummary="false" closable="true" />
                        <div class="field is-horizontal">
                            <div class="field-label is-normal">
                                <label class="label" for="password">Contraseña:</label>
                            </div>
                            <div class="field-body">
                                <div class="field">
                                    <p:password id="password" value="#{ProfilesController.newProfile.password}" required="true" requiredMessage="La contraseña no puede estar vacía" styleClass="input is-fullwidth"/>
                                </div>
                            </div>
                        </div>

                        <p:messages showDetail="true" for="groupName" showSummary="false" closable="true" />
                        <div class="field is-horizontal">
                            <div class="field-label is-normal">
                                <label class="label" for="groupName">Grupo:</label>
                            </div>
                            <div class="field-body">
                                <div class="field">
                                    <p:inputText id="groupName" value="#{ProfilesController.newProfile.groupName}" required="true" requiredMessage="El nombre de grupo no puede estar vacío" styleClass="input is-fullwidth"/>
                                </div>
                            </div>
                        </div>
                    </p:panel>
                    <br/>
                    <p:commandButton value="Crear Usuario" styleClass="button is-fullwidth is-rounded is-success" action="#{ProfilesController.createProfile}" update="dynamicContent"/>
                </h:form>
            </div>
        </div>
    </div>
</h:body>


    
</ui:composition>
