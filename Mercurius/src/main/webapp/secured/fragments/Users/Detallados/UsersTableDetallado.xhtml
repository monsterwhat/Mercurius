<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <h:head>
        <title>Usuarios</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css"/>
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
        <style>
            .inactive-row {
                background-color: #999999 !important;
                color: #ffffff !important;
            }
        </style>
    </h:head>
    
    <h:body>
        <div class="box">
            <div class="columns is-centered">
                <div class="column">
                    <p:commandButton value="Volver al menú principal" icon="pi pi-home" actionListener="#{ViewController.selectNone}" update="dynamicContent" styleClass="button is-fullwidth is-inverted is-warning is-rounded"/>
                    <br/>
                    <h:form id="usersTableDetallado">
                        
                        <p:toolbar>
                            <p:toolbarGroup align="right">
                                <p:commandButton value="Exportar Excel" icon="pi pi-file-excel" styleClass="ui-button-help" ajax="false">
                                    <p:dataExporter type="xlsx" target="UsersTableData" fileName="Usuarios-Mercurius-Excel" />
                                </p:commandButton>
                                <p:commandButton value="Exportar PDF" icon="pi pi-file-pdf" styleClass="ui-button-help" ajax="false">
                                    <p:dataExporter type="pdf" target="UsersTableData" fileName="Usuarios-Mercurius-PDF" />
                                </p:commandButton>
                            </p:toolbarGroup>
                        </p:toolbar>
                        
                        <p:dataTable value="#{UsersController.filteredUsersDetallado}" var="user" widgetVar="UsersTable"
                                     paginator="true" rows="8" paginatorPosition="bottom" id="UsersTableData"
                                     emptyMessage="No se encontraron usuarios con la critería proporcionada"
                                     rowStyleClass="#{user.status == 'false' ? 'inactive-row' : null}"
                                     globalFilterFunction="#{UsersController.globalFilterFunction}"
                                     filterBy="#{UsersController.filterBy}"
                                     selection="#{UsersController.selectedUser}" rowKey="#{user.id}">
                            
                            <f:facet name="header">
                                    <p:inputText id="globalFilter" onkeyup="PF('UsersTable').filter()" styleClass="input"
                                                 placeholder="Búsqueda general de todos los campos" />
                            </f:facet>
    
                            <p:column headerText="Identificador de perfil" sortBy="#{user.id}">
                                <h:outputText value="#{user.id}"/>
                            </p:column>
                            <p:column headerText="Nombre de usuario" sortBy="#{user.username}">
                                <h:outputText value="#{user.username}" />
                            </p:column>
                            <p:column headerText="Nombre del grupo" sortBy="#{user.groupName}">
                                <h:outputText value="#{user.groupName}" />
                            </p:column>
                            <p:column headerText="Activo" visible="false" sortBy="#{user.status}">
                                <h:outputText value="#{user.status}" />
                            </p:column>
                            
                            <p:column headerText="Acciones" width="20%" exportable="false">
                                <div class="buttons has-addons">
                                    <p:commandButton styleClass="button edit-button rounded-button ui-button-success" icon="pi pi-pencil"
                                    actionListener="#{ViewController.selectEditUsers()}" process="@this" update="dynamicContent">
                                        <f:setPropertyActionListener value="#{user}" target="#{UsersController.selectedUser}" />
                                    </p:commandButton>
                                    <p:commandButton styleClass="button ui-button-warning rounded-button" icon="pi pi-trash"
                                    actionListener="#{UsersController.deleteUser()}" process="@this" update="dynamicContent usersTable">
                                        <f:setPropertyActionListener value="#{user}" target="#{UsersController.selectedUser}" />
                                    </p:commandButton>
                                </div>
                            </p:column>
                        </p:dataTable>
                        <p:commandButton value="Crear Usuario" actionListener="#{ViewController.selectCreateUsers()}" update="dynamicContent" styleClass="button is-fullwidth is-success is-rounded"/>
                    </h:form>
                </div>
            </div>
        </div>
    </h:body>


</ui:composition>
