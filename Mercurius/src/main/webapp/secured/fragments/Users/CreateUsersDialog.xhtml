<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
    <p:dialog header="Crear Usuario" widgetVar="CrearUsuarioDialog" 
        fitViewport="true" responsive="true" id="CrearUsuarioDialog" modal="true">
        <p:outputPanel rendered="#{not empty UsersController.newUser}">
            <h:form>
                <p:panelGrid columns="1" layout="flex">
                    <p:panel header="Crear un nuevo usuario">
                        <p:growl id="growl" showDetail="true" showSummary="false">
                            <p:autoUpdate/>
                        </p:growl>
                        <p:column>
                            <p:messages showDetail="true" for="username" showSummary="false" closable="true">
                                <p:autoUpdate/>
                            </p:messages>
                            <label class="label" for="username" style="color: var(--primary-color);">Nombre de usuario:</label>
                            <p:inputText id="username" value="#{UsersController.newUser.username}" style="width: 100%"
                            required="true" requiredMessage="El nombre de usuario no puede estar vacío"/>
                        </p:column>
                        <p:spacer height="1em"/>
                        <p:column>
                            <p:messages showDetail="true" for="password" showSummary="false" closable="true" >
                                <p:autoUpdate/>
                            </p:messages>
                                <label class="label" for="password" style="color: var(--primary-color);">Contraseña:</label>
                                <p:password id="password" value="#{UsersController.newUser.password}" style="width: 100%"
                                                required="true" requiredMessage="La contraseña no puede estar vacía"/>
                        </p:column>
                        <p:spacer height="1em"/>
                        <p:card>
                            <p:messages showDetail="true" for="groupName" showSummary="false" closable="true">
                                <p:autoUpdate/>
                            </p:messages>
                                <label class="label" for="groupName" style="color: var(--primary-color);">Permisos:</label>
                                <p:selectManyCheckbox id="groupName" value="#{UsersController.selectedPuestos}" layout="responsive"
                                                    required="true" requiredMessage="Los permisos no pueden estar vacíos" columns="1"
                                                    >
                                        <p:ajax listener="#{UsersController.selectedOptionsChanged}"/>
                                        <f:selectItem itemLabel="Administrativo" itemValue="admin" rendered="#{SessionController.admin}"/>
                                        <f:selectItem itemLabel="Facturacion" itemValue="facturacion" rendered="#{SessionController.usuarios}"/>
                                        <f:selectItem itemLabel="Inventarios" itemValue="inventario" rendered="#{SessionController.usuarios}"/>
                                        <f:selectItem itemLabel="Usuarios" itemValue="usuario" rendered="#{SessionController.usuarios}"/>
                                        <f:selectItem itemLabel="Tributacion" itemValue="tributacion" rendered="#{SessionController.usuarios}"/>
                                        <f:selectItem itemLabel="Registros" itemValue="registro" rendered="#{SessionController.usuarios}"/>
                                </p:selectManyCheckbox>
                        </p:card>
                        <p:spacer height="1em"/>
                        <p:column>
                            <p:commandButton value="Crear Usuario" action="#{UsersController.createUser}" update="usuarios"
                                             styleClass="rounded-button ui-button-primary" style="width: 100%" resetValues="true"/>
                        </p:column>

                    </p:panel>
                </p:panelGrid>
            </h:form>
        </p:outputPanel>
    </p:dialog>
</ui:composition>
