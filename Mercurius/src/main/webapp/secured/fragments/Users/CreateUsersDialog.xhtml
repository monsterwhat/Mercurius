<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
    <p:dialog header="Crear Usuario" widgetVar="CrearUsuarioDialog" 
        fitViewport="true" responsive="true" id="CrearUsuarioDialog" modal="true">
        <p:outputPanel rendered="#{not empty UsersController.newUser}">
        
            <h:form>
                <p:panel header="Crear un nuevo usuario">
                    <p:growl id="growl" showDetail="true" showSummary="false">
                        <p:autoUpdate/>
                    </p:growl>

                    <p:messages showDetail="true" for="username" showSummary="false" closable="true" />
                    <div class="field is-horizontal">
                        <div class="field-label is-normal">
                            <label class="label" for="username">Nombre de usuario:</label>
                        </div>
                        <div class="field-body">
                            <div class="field">
                                <p:inputText id="username" value="#{UsersController.newUser.username}" required="true" requiredMessage="El nombre de usuario no puede estar vacío" styleClass="input is-fullwidth"/>
                            </div>
                        </div>
                    </div>

                    <p:messages showDetail="true" for="password" showSummary="false" closable="true" />
                    <div class="field is-horizontal">
                        <div class="field-label is-normal">
                            <label class="label" for="password">Contraseña:</label>
                        </div>
                        <div class="field-body">
                            <div class="field">
                                <p:password id="password" value="#{UsersController.newUser.password}" required="true" requiredMessage="La contraseña no puede estar vacía" styleClass="input is-fullwidth"/>
                            </div>
                        </div>
                    </div>

                    <!-- Input for groupName -->
                    <p:messages showDetail="true" for="groupName" showSummary="false" closable="true" />
                    <div class="field is-horizontal">
                        <div class="field-label is-normal">
                            <label class="label" for="groupName">Permisos:</label>
                        </div>
                        <div class="field-body">
                            <div class="field">
                                <p:selectManyCheckbox id="groupName" value="#{UsersController.selectedPuestos}"
                                                required="true" requiredMessage="El nombre de grupo no puede estar vacío"
                                                styleClass="input is-fullwidth">
                                    <p:ajax listener="#{UsersController.selectedOptionsChanged}"/>
                                    <f:selectItem itemLabel="Administrativo" itemValue="admin" rendered="#{SessionController.admin}"/>
                                    <f:selectItem itemLabel="Facturacion" itemValue="facturacion"/>
                                    <f:selectItem itemLabel="Inventarios" itemValue="inventario"/>
                                    <f:selectItem itemLabel="Usuarios" itemValue="usuario"/>
                                    <f:selectItem itemLabel="Tributacion" itemValue="tributacion"/>
                                    <f:selectItem itemLabel="Registros" itemValue="registro"/>
                                </p:selectManyCheckbox>
                            </div>
                        </div>
                    </div>

                </p:panel>
                <br/>
                <p:commandButton value="Crear Usuario" styleClass="button is-fullwidth is-rounded is-success" action="#{UsersController.createUser}" update="usuarios"/>
            </h:form>
            
        </p:outputPanel>
    </p:dialog>
</ui:composition>
