<ui:composition xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<h:head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css"/>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
</h:head>
    
<h:body>
    <div class="box">
        <div class="columns is-centered">
            <div class="column">
                <p:commandButton value="Volver al menú principal" icon="pi pi-home" actionListener="#{ViewController.selectNone}" update="dynamicContent" styleClass="button is-fullwidth is-inverted is-warning is-rounded"/>
                <br/>
                <h:form id="profilesTable">                
                    <p:dataTable value="#{ProfilesController.filteredProfiles}" var="profile" widgetVar="UsersTable"
                                 paginator="true" rows="8" paginatorPosition="bottom" 
                                 emptyMessage="No se encontraron usuarios con la criteria proporcionada"
                                 globalFilterFunction="#{ProfilesController.globalFilterFunction}"
                                 filterBy="#{ProfilesController.filterBy}"
                                 selection="#{ProfilesController.selectedProfile}" rowKey="#{profile.id}">
                        
                        <f:facet name="header">
                                <p:inputText id="globalFilter" onkeyup="PF('UsersTable').filter()" styleClass="input"
                                             placeholder="Busqueda general de todos los campos" />
                        </f:facet>

                        <!-- Define your columns here -->
                        <p:column headerText="Identificador de perfil" visible="false" sortBy="#{profile.id}">
                            <h:outputText value="#{profile.id}"/>
                        </p:column>
                        <p:column headerText="Nombre de usuario" sortBy="#{profile.username}">
                            <h:outputText value="#{profile.username}" />
                        </p:column>
                        <p:column headerText="Contraseña (HASH)">
                            <h:outputText value="#{profile.password}" />
                        </p:column>
                        <p:column headerText="Nombre del grupo" sortBy="#{profile.groupName}">
                            <h:outputText value="#{profile.groupName}" />
                        </p:column>
                        <p:column headerText="Acciones" width="20%">
                            <div class="buttons has-addons">
                                <p:commandButton styleClass="button edit-button rounded-button ui-button-success" icon="pi pi-pencil"
                                actionListener="#{ViewController.selectEditUsers()}" process="@this" update="dynamicContent">
                                    <f:setPropertyActionListener value="#{profile}" target="#{ProfilesController.selectedProfile}" />
                                </p:commandButton>
                                <p:commandButton styleClass="button ui-button-warning rounded-button" icon="pi pi-trash"
                                actionListener="#{ProfilesController.deleteProfile()}" process="@this" update="dynamicContent profilesTable">
                                    <f:setPropertyActionListener value="#{profile}" target="#{ProfilesController.selectedProfile}" />
                                </p:commandButton>
                            </div>
                        </p:column>
                    </p:dataTable>
                    <p:commandButton value="Crear Usuario" actionListener="#{ViewController.selectCreateUsers()}" update="dynamicContent" styleClass="button is-fullwidth is-success is-rounded"/>
                </h:form>
            </div>
        </div>
    </div>
</h:body>


</ui:composition>
