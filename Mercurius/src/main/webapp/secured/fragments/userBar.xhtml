<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <div class="columns">
        <div class="column">
            <article class="notification">
                    <div class="columns">
                        <div class="column is-fullwidth">
                            <h1 class="title">Bienvenid@, #{SessionController.currentUser.username}!</h1>
                        </div>
                        <div class="column is-2">
                            <p:commandButton styleClass="button is-rounded is-danger is-2" icon="pi pi-user" 
                                             value="Perfil" oncomplete="PF('userSettingsDialog').show()" />
                        </div>
                    </div>
            </article>
        </div>
    </div>
    
    <p:dialog header="Menu de Usuario" widgetVar="userSettingsDialog" modal="true"
              fitViewport="true" responsive="true">
        <h:form id="userSettingsForm" class="ui-g">
            <p:growl showDetail="true" showSummary="true" />
            <div class="box" style="width: 100%">
                <div class="ui-g-12 ui-md-4">
                    <h:outputText value="Nombre de usuario:" />
                </div>
                <div class="ui-g-12 ui-md-4">
                    <h:outputText value="#{SessionController.currentUser.username}" />
                </div>
                <div class="ui-g-12 ui-md-4">
                    <p:commandButton value="Cambiar" oncomplete="PF('nameDialog').show()" 
                                      style="width: 100%; border-radius: 2em;" 
                                      actionListener="#{SessionController.openUsername()}"/>
                </div>
                <div class="ui-g-12 ui-md-4">
                <h:outputText value="Correo Electronico:" />
                </div>
                <div class="ui-g-12 ui-md-4">
                    <h:outputText value="#{SessionController.currentUser.email}" />
                </div>
                <div class="ui-g-12 ui-md-4">
                    <p:commandButton value="Cambiar" oncomplete="PF('emailDialog').show()"
                                     style="width: 100% ; border-radius: 2em;"
                                     actionListener="#{SessionController.openEmail()}"/>
                </div>
            </div>
            <div class="box" style="width: 100%">
                <div class="ui-g-12">
                <p:commandButton value="Cambiar Contrasena" oncomplete="PF('passwordDialog').show()" 
                                 style="width: 100%; border-radius: 2em;"
                                 actionListener="#{SessionController.openPassword()}"/>
                </div>
            </div>
            
            
            <div class="ui-g-12">
                <p:commandButton value="Cerrar Session" class="button is-danger" style="width: 100%; border-radius: 2em;" 
                         icon="pi pi-power-off" actionListener="#{SessionController.logOut()}"/>
            </div>

        </h:form>
    </p:dialog>
    
    <!-- Dialog for changing Name -->
    <p:dialog header="Cambiar Nombre de Usuario" widgetVar="nameDialog" modal="true" 
              fitViewport="true" responsive="true">
        <h:form class="ui-g">
            <p:growl showDetail="true" showSummary="true" />
            <div class="box" style="width: 100%">
                <p:inputText value="#{SessionController.newUsername}" required="true" requiredMessage="El nombre de usuario no puede estar vacio"/>
                <p:commandButton value="Guardar" action="#{SessionController.changeName}" process="@this" update=":userSettingsForm @this" oncomplete="PF('nameDialog').hide()" />
            </div>
        </h:form>
    </p:dialog>

    <!-- Dialog for changing Email -->
    <p:dialog header="Cambiar correo electronico" widgetVar="emailDialog" modal="true"
              fitViewport="true" responsive="true">
        <h:form class="ui-g">
            <p:growl showDetail="true" showSummary="true" />
            <div class="box" style="width: 100%">
                <p:inputText value="#{SessionController.newEmail}" required="true" requiredMessage="El correo electronico no puede estar vacio"/>
                <p:commandButton value="Guardar" action="#{userSettingsBean.changeEmail}" process="@this" update=":userSettingsForm @this" oncomplete="PF('emailDialog').hide()" />
            </div>
        </h:form>
    </p:dialog>
    
    <!-- Dialog for changing Password -->
    <p:dialog header="Change Password" widgetVar="passwordDialog" modal="true"
              fitViewport="true" responsive="true" styleClass="p-fluid">
        <h:form>
            <p:growl showDetail="true" showSummary="true" />
            <div class="grid formgrid">
                <div class="field col-12">
                    <p:outputLabel for="currentPassword" value="Current Password:" class="p-d-block"/>
                    <p:inputText id="currentPassword" value="#{SessionController.currentPassword}" required="true"
                                 class="p-d-block w-full"/>
                </div>
                <div class="field col-12">
                    <p:outputLabel for="newPassword" value="New Password:" class="p-d-block"/>
                    <p:inputText id="newPassword" value="#{SessionController.newPassword}" required="true"
                                 class="p-d-block w-full"/>
                </div>
                <div class="field col-12">
                    <p:outputLabel for="confirmPassword" value="Confirm New Password:" class="p-d-block"/>
                    <p:inputText id="confirmPassword" value="#{SessionController.confirmPassword}" required="true"
                                 class="p-d-block w-full"/>
                </div>
                <div class="col-12 text-right">
                    <p:commandButton value="Save" action="#{SessionController.changePassword}" update=":userSettingsForm" oncomplete="PF('passwordDialog').hide()" />
                </div>
            </div>
        </h:form>
    </p:dialog>

    
</ui:composition>
