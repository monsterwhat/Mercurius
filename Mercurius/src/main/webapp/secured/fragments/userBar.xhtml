<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="jakarta.faces.facelets">

    <h:head>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/primeicons/primeicons.css"/>
        <link rel="apple-touch-icon" href="#{resource['favicon/apple-touch-icon.png']}"/>
        <link rel="icon" type="image/x-icon" href="#{resource['favicon/favicon-32x32.png']}"/>
        <link rel="icon" type="image/x-icon" href="#{resource['favicon/favicon-16x16.png']}"/>
        <link rel="icon" type="image/x-icon" href="#{resource['favicon/favicon.ico']}"/>
    </h:head>
    
    <h:form id="MainMenu">
        <p:panel>
            
                <h:outputScript>
                    function handleKeyPress(event) {
                        if (event.key === 'F5') {
                            event.preventDefault();
                            
                            PF('CrearFacturaDialog').show();
                        }
                    }
                    document.addEventListener('keydown', handleKeyPress);
                </h:outputScript>

                <h1 style="color: var(--primary-color); text-align: center;">Bienvenid@, #{SessionController.currentUser.username}!</h1>
            
                <p:toolbar>
                    
                    <p:toolbarGroup align="left">
                        
                        <p:graphicImage rendered="#{SettingsController.logo eq null}" value="/resources/imgs/logo/Mercurius.png" height="100px" width="100px"/>
                        <p:graphicImage rendered="#{SettingsController.logo != null}" value="#{SettingsController.logo}" stream="false" height="100px" width="100px" />
                        
                        <p:spacer width="1em"/>
                        
                        <p:column rendered="#{SessionController.facturacion}">
                        <p:commandButton id="FacturacionButton" value="Facturación" style="flex: 1; width: 100%;"
                                     styleClass="rounded-button ui-button-primary" 
                                     icon="pi pi-receipt"/>
                        <p:menu overlay="true" trigger="FacturacionButton" my="left top" at="left bottom">
                            <p:submenu label="Facturación">
                                <p:menuitem value="Crear Facturas" icon="pi pi-cart-plus" actionListener="#{facturasController.openNewFactura}" onclick="PF('CrearFacturaDialog').show();"/>
                            </p:submenu>
                        </p:menu>
                        <ui:include src="/secured/fragments/Facturas/Facturas/factura.xhtml"/>
                        </p:column>

                        <p:column rendered="#{SessionController.inventarios}">
                            <p:commandButton id="ArticulosButton" value="Articulos" style="flex: 1; width: 100%;"
                                             styleClass="rounded-button ui-button-success" 
                                             icon="pi pi-box" />
                            <p:menu overlay="true" trigger="ArticulosButton" my="left top" at="left bottom">
                                <p:submenu label="Categorias">
                                    <p:menuitem value="Ver Departamentos" icon="pi pi-truck" url="/Mercurius/secured/pages/Departamentos/"/>
                                    <p:menuitem value="Ver Familias" icon="pi pi-th-large" url="/Mercurius/secured/pages/Familias/"/>
                                </p:submenu>
                                <p:submenu label="Artículos">
                                    <p:menuitem value="Catalogo Actual" icon="pi pi-check-circle" url="/Mercurius/secured/pages/Articulos/catalogoActual"/>
                                    <p:menuitem value="Catalogo Pendiente" icon="pi pi-hourglass" url="/Mercurius/secured/pages/Articulos/catalogoPendiente"/>
                                    <p:menuitem value="Artículos Activos" icon="pi pi-check" url="/Mercurius/secured/pages/Articulos/ArticulosActivos"/>
                                    <p:menuitem value="Artículos Inactivos" icon="pi pi-times" url="/Mercurius/secured/pages/Articulos/ArticulosInactivos"/>
                                </p:submenu>
                            </p:menu>
                        </p:column>

                        <p:column rendered="#{SessionController.inventarios}">
                            <p:commandButton id="InventariosButton" value="Inventarios" style="flex: 1; width: 100%;"
                                             styleClass="rounded-button ui-button-info" 
                                             icon="pi pi-warehouse" />
                            <p:menu overlay="true" trigger="InventariosButton" my="left top" at="left bottom">
                                <p:submenu label="Movimientos">
                                    <p:menuitem value="Ajustes Actuales" icon="pi pi-check-circle" url="/Mercurius/secured/pages/Inventario/AjustesActuales"/>
                                    <p:menuitem value="Ajustes Pendientes" icon="pi pi-hourglass" url="/Mercurius/secured/pages/Inventario/AjustesPendientes"/>
                                    <p:menuitem value="Ajustes Activos" icon="pi pi-check" url="/Mercurius/secured/pages/Inventario/AjustesActivos"/>
                                    <p:menuitem value="Ajustes Inactivos" icon="pi pi-times" url="/Mercurius/secured/pages/Inventario/AjustesInactivos"/>
                                </p:submenu>
                                <p:submenu label="Historico Precios">
                                    <p:menuitem value="Articulos" icon="pi pi-chart-bar" url="/Mercurius/secured/pages/Inventario/Precios"/>
                                </p:submenu>
                            </p:menu>
                        </p:column>

                        <p:column rendered="#{SessionController.usuarios}">
                            <p:commandButton id="UsuariosButton" value="Usuarios" style="flex: 1; width: 100%;"
                                             styleClass="rounded-button ui-button-help" 
                                             icon="pi pi-user" />
                            <p:menu overlay="true" trigger="UsuariosButton" my="left top" at="left bottom">
                                <p:submenu label="Usuarios">
                                    <p:menuitem value="Ver Usuarios" icon="pi pi-users" url="/Mercurius/secured/pages/Usuarios/menu.xhtml"/>
                                    <p:menuitem value="Ver Clientes" icon="pi pi-id-card" url="/Mercurius/secured/pages/Clientes/"/>
                                </p:submenu>
                            </p:menu>
                        </p:column>

                        <p:column rendered="#{SessionController.tributacion}">
                            <p:commandButton id="TributacionButton" value="Tributación" style="flex: 1; width: 100%;"
                                             styleClass="rounded-button ui-button-danger" 
                                             icon="pi pi-money-bill" />
                            <p:menu overlay="true" trigger="TributacionButton" my="left top" at="left bottom">
                                <p:submenu label="Tributación">
                                    <p:menuitem value="Consultas" icon="pi pi-book" disabled="true"/>
                                    <p:menuitem value="CaByS" icon="pi pi-book" url="/Mercurius/secured/pages/CaByS/"/>
                                    <p:menuitem value="Tipo de Cambio" icon="pi pi-dollar" onclick="PF('dollarValueDialog').show();"/>
                                </p:submenu>
                            </p:menu>
                            <ui:include src="../fragments/Monedas/DollarValueDialog.xhtml" />
                        </p:column>

                        <p:column rendered="#{SessionController.registros}">
                            <p:commandButton id="RegistrosButton" value="Registros" style="flex: 1; width: 100%;"
                                             styleClass="rounded-button ui-button-warning" 
                                             icon="pi pi-book"/>
                            <p:menu overlay="true" trigger="RegistrosButton" my="left top" at="left bottom" collision="fit">
                                <p:submenu label="Reportes Facturación">
                                    <p:menuitem value="Movimientos" icon="pi pi-calendar" url="/Mercurius/secured/pages/Articulos/Reportes/Fechas/"/>
                                    <p:menuitem value="Facturación de Artículos" icon="pi pi-box" disabled="true"/>
                                </p:submenu>
                                <p:submenu label="Recibos">
                                    <p:menuitem value="Todas las Facturas" icon="pi pi-book" url="/Mercurius/secured/pages/Recibos/"/>
                                    <p:menuitem value="Facturas Pendientes" icon="pi pi-calendar-clock" url="/Mercurius/secured/pages/Recibos/Pendientes/"/>
                                    <p:menuitem value="Facturas Vencidas" icon="pi pi-calendar-times" url="/Mercurius/secured/pages/Recibos/Vencidos/"/>
                                </p:submenu>
                                <p:submenu label="Reportes Inventarios">
                                    <p:menuitem value="Articulos" icon="pi pi-box"  url="/Mercurius/secured/pages/Articulos/Reportes/"/>
                                    <p:menuitem value="Departamentos" icon="pi pi-truck" url="/Mercurius/secured/pages/Departamentos/Reportes/"/>
                                    <p:menuitem value="Familias" icon="pi pi-users" url="/Mercurius/secured/pages/Familias/Reportes/"/>
                                    <p:menuitem value="Inventarios" icon="pi pi-warehouse" url="/Mercurius/secured/pages/Inventario/Reportes/"/>
                                    <p:menuitem value="Generar Etiquetas" icon="pi pi-ticket" disabled="true"/>
                                </p:submenu>
                                <p:submenu label="Reportes de Usuarios">
                                    <p:menuitem value="Usuarios Detallados" icon="pi pi-user-plus"  url="/Mercurius/secured/pages/Usuarios/Reportes/"/>
                                </p:submenu>
                            </p:menu>
                        </p:column>

                        <p:column rendered="#{SessionController.admin}">
                            <p:commandButton id="SettingsButton" value="Ajustes" style="flex: 1; width: 100%;"
                                             styleClass="rounded-button ui-button-secondary" 
                                             icon="pi pi-cog"/>
                            <p:menu overlay="true" trigger="SettingsButton" my="left top" at="left bottom" collision="fit">
                                <p:submenu label="Ajustes de impresion">
                                    <p:menuitem value="Menu de Impresoras" icon="pi pi-print" url="/Mercurius/secured/pages/Impresoras/"/>
                                </p:submenu>
                                <p:submenu label="Ajustes de Correos">
                                    <p:menuitem value="Menu de Reportes" icon="pi pi-at"  url="/Mercurius/secured/pages/Correos/Reportes"/>
                                </p:submenu>
                                <p:submenu label="Ajustes de Aplicacion">
                                    <p:menuitem value="Menu de Aplicacion" icon="pi pi-crown"  url="/Mercurius/secured/pages/Aplicacion/"/>
                                </p:submenu>
                            </p:menu>
                        </p:column>
                        
                    </p:toolbarGroup>
                    
                    <p:toolbarGroup align="right">
                        <p:commandButton styleClass="rounded-button ui-button-secondary" 
                                         icon="pi pi-user" label="Menu"
                                         value="Perfil" oncomplete="PF('userSettingsDialog').show()" />
                    </p:toolbarGroup>

                </p:toolbar>
        </p:panel>
    </h:form>

    
    <p:dialog header="Menu de Usuario" widgetVar="userSettingsDialog" modal="true"
              fitViewport="true" responsive="true" dynamic="true">
        <h:form id="userSettingsForm" >
            <p:growl showDetail="true" showSummary="true" />
                <p:card>
                    <p:panelGrid columns="3" layout="flex">
                        <p:outputPanel styleClass="ui-text-align-center">
                            <h:outputText value="Nombre de usuario:"/>
                        </p:outputPanel>
                        <p:outputPanel styleClass="ui-text-align-center">
                            <h:outputText value="#{SessionController.currentUser.username}"/>
                        </p:outputPanel>
                        <p:outputPanel>
                            <p:commandButton icon="pi pi-pencil" oncomplete="PF('nameDialog').show()" 
                                             styleClass="rounded-button ui-button-help"
                                             actionListener="#{SessionController.openUsername()}"/>
                        </p:outputPanel>

                        <p:outputPanel styleClass="ui-text-align-center">
                            <h:outputText value="Correo Electronico:"/>
                        </p:outputPanel>
                        <p:outputPanel styleClass="ui-text-align-center">
                            <h:outputText value="#{SessionController.currentUser.email}"/>
                        </p:outputPanel>
                        <p:outputPanel styleClass="ui-text-align-center">
                            <p:commandButton icon="pi pi-pencil" oncomplete="PF('emailDialog').show()"
                                             styleClass="rounded-button ui-button-help"
                                             actionListener="#{SessionController.openEmail()}"/>
                        </p:outputPanel>
                    </p:panelGrid>
                </p:card>
            
                <p:card>
                    <p:commandButton icon="pi pi-heart-fill" value="Cambiar Estilo Visual" onclick="PF('themeDialog').show()" 
                                 styleClass="rounded-button ui-button-info" style="width: 100%;"/>
                    <p:spacer height="10"/>
                    <p:commandButton icon="pi pi-key" value="Cambiar Contrasena" oncomplete="PF('passwordDialog').show()" 
                             styleClass="rounded-button ui-button-help" style="width: 100%;"
                             actionListener="#{SessionController.openPassword()}"/> 
                    <p:spacer height="10"/>
                    <p:commandButton value="Cerrar Session" styleClass="rounded-button ui-button-danger" 
                     icon="pi pi-power-off" actionListener="#{SessionController.logOut()}" style="width: 100%;" />
                </p:card>
            
        </h:form>
    </p:dialog>
    
    <p:dialog header="Cambiar Tema" widgetVar="themeDialog" dynamic="true" modal="true">
        <h:form>
            <p:panelGrid columns="2" layout="flex">
                <h:outputText value="Seleccionar Tema:" />
                <p:selectOneMenu value="#{ThemeController.selectedTheme}">
                    <f:selectItem itemLabel="Saga" itemValue="saga" />
                    <f:selectItem itemLabel="Vela" itemValue="vela" />
                    <f:selectItem itemLabel="Arya" itemValue="arya" />
                    <f:selectItem itemLabel="Luna Amber" itemValue="luna-amber" />
                    <f:selectItem itemLabel="Luna Blue" itemValue="luna-blue" />
                    <f:selectItem itemLabel="Luna Green" itemValue="luna-green" />
                    <f:selectItem itemLabel="Luna Pink" itemValue="luna-pink" />
                    <f:selectItem itemLabel="Nova Colored" itemValue="nova-colored" />
                    <f:selectItem itemLabel="Nova Dark" itemValue="nova-dark" />
                    <f:selectItem itemLabel="Nova Light" itemValue="nova-light" />
                </p:selectOneMenu>
            </p:panelGrid>
                <br/>
            <p:commandButton value="Seleccionar" actionListener="#{ThemeController.updateTheme()}"
                             styleClass="rounded-button ui-button-info" style="width: 100%;" />
        </h:form>
    </p:dialog>
    
    <!-- Dialog for changing Name -->
    <p:dialog header="Cambiar Nombre de Usuario" dynamic="true" widgetVar="nameDialog" modal="true" 
              fitViewport="true" responsive="true">
        <h:form class="ui-g p-4">
            <p:growl showDetail="true" showSummary="true" />
            <div class="ui-panel ui-widget ui-widget-content ui-corner-all p-4 shadow-2 border-round ui-g-12">
                <p:inputText value="#{SessionController.newUsername}" required="true" requiredMessage="El nombre de usuario no puede estar vacio"/>
                <p:commandButton value="Guardar" action="#{SessionController.changeName}" process="@this" update=":userSettingsForm @this" oncomplete="PF('nameDialog').hide()" />
            </div>
        </h:form>
    </p:dialog>

    <!-- Dialog for changing Email -->
    <p:dialog header="Cambiar correo electronico" dynamic="true"  widgetVar="emailDialog" modal="true"
              fitViewport="true" responsive="true">
        <h:form class="ui-g p-4">
            <p:growl showDetail="true" showSummary="true" />
            <div class="ui-panel ui-widget ui-widget-content ui-corner-all p-4 shadow-2 border-round ui-g-12">
                <p:inputText value="#{SessionController.newEmail}" required="true" requiredMessage="El correo electronico no puede estar vacio"/>
                <p:commandButton value="Guardar" action="#{userSettingsBean.changeEmail}" process="@this" update=":userSettingsForm @this" oncomplete="PF('emailDialog').hide()" />
            </div>
        </h:form>
    </p:dialog>
    
    <!-- Dialog for changing Password -->
    <p:dialog header="Change Password" dynamic="true" widgetVar="passwordDialog" modal="true"
              fitViewport="true" responsive="true">
        <h:form>
            <p:growl showDetail="true" showSummary="true" />
            <p:panelGrid columns="1" layout="flex">
                <p:outputPanel>
                    <p:outputLabel for="currentPassword" value="Contrasena actual:" style="width: 100%"/>
                    <p:inputText id="currentPassword" value="#{SessionController.currentPassword}"
                                 required="true" style="width: 100%"
                                 />
                </p:outputPanel>
                <p:outputPanel >
                    <p:outputLabel for="newPassword" value="Nueva Contrasena:" style="width: 100%"/>
                    <p:inputText id="newPassword" value="#{SessionController.newPassword}"
                                 required="true" style="width: 100%"
                                 />
                </p:outputPanel>
                <p:outputPanel  >
                    <p:outputLabel for="confirmPassword" value="Confimar nueva contrasena:" style="width: 100%"/>
                    <p:inputText id="confirmPassword" value="#{SessionController.confirmPassword}"
                                 required="true" style="width: 100%"
                                 />
                </p:outputPanel>
                <p:outputPanel >
                    <p:commandButton value="Guardar" action="#{SessionController.changePassword}" update=":userSettingsForm" 
                                     oncomplete="PF('passwordDialog').hide()" style="width: 100%"/>
                </p:outputPanel>
            </p:panelGrid>            
        </h:form>
    </p:dialog>

</ui:composition>
