<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
    <p:dialog header="Crear Departamento" widgetVar="CrearDepartamentoDialog" 
        fitViewport="true" responsive="true" id="CrearDepartamentoDialog" modal="true">
        <p:outputPanel rendered="#{not empty DepartamentosController.newDepartamento}">
            <h:form>
                <p:panel header="Crear un nuevo departamento">
                    <p:messages showDetail="true" for="name" showSummary="false" closable="true" />
                    <div class="field is-horizontal">
                        <div class="field-label is-normal">
                            <label class="label" for="name">Nombre:</label>
                        </div>
                        <div class="field-body">
                            <div class="field">
                                <p:inputText id="name" value="#{DepartamentosController.newDepartamento.nombre}"
                                             required="true" requiredMessage="El nombre no puede estar vacío"
                                             />
                            </div>
                        </div>
                    </div>
                </p:panel>
                <br/>
                <p:commandButton value="Crear Departamento" process="@form" update="@form departamentos"
                                 action="#{DepartamentosController.createDepartamento}"/>
            </h:form>
        </p:outputPanel>
    </p:dialog>
</ui:composition>
