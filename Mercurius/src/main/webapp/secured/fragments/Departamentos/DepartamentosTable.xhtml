<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <h:head>
        <title>Departamentos</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css"/>
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
    </h:head>
    
    <h:body>
        <div class="box">
            <div class="columns is-centered">
                <div class="column">
                    <p:commandButton value="Volver al menú principal" icon="pi pi-home" actionListener="#{ViewController.selectNone}" update="dynamicContent" styleClass="button is-fullwidth is-inverted is-warning is-rounded"/>
                    <br/>
                        <p:dataTable value="#{DepartamentosController.filteredDepartamentos}" var="departamento"  widgetVar="DepartamentosTable"
                                     paginator="true" rows="8" paginatorPosition="bottom" id="DepartamentosTableData"
                                     emptyMessage="No se encontraron departamentos con la critería proporcionada"
                                     globalFilterFunction="#{DepartamentosController.globalFilterFunction}"
                                     filterBy="#{DepartamentosController.filterBy}" reflow="true"
                                     selection="#{DepartamentosController.selectedDepartamento}" rowKey="#{departamento.id}">
                            
                            <f:facet name="header">
                                <p:inputText id="globalFilter" onkeyup="PF('DepartamentosTable').filter()"
                                             placeholder="Búsqueda general de todos los campos" styleClass="input"/>
                            </f:facet>
                            
                            <p:column headerText="ID Departamento" visible="false">
                                <h:outputText value="#{departamento.id}"/>
                            </p:column>
                            <p:column headerText="Nombre" sortBy="#{departamento.nombre}">
                                <h:outputText value="#{departamento.nombre}"/>
                            </p:column>
                            
                            <p:column headerText="Acciones" exportable="false" width="10%">
                                <div class="buttons">
                                    <p:commandButton styleClass="button is-rounded is-success" icon="pi pi-pencil"
                                    actionListener="#{ViewController.selectEditDepartamentos()}" process="@this" update="dynamicContent">
                                        <f:setPropertyActionListener value="#{departamento}" target="#{DepartamentosController.selectedDepartamento}" />
                                    </p:commandButton>
                                    <p:commandButton styleClass="button is-rounded is-warning" icon="pi pi-trash"
                                    actionListener="#{DepartamentosController.deleteDepartamento()}" process="@this" update="dynamicContent departamentosTable">
                                        <f:setPropertyActionListener value="#{departamento}" target="#{DepartamentosController.selectedDepartamento}" />
                                    </p:commandButton>
                                </div>
                            </p:column>
                        </p:dataTable>
                        <p:commandButton value="Crear Departamento" actionListener="#{ViewController.selectCreateDepartamentos}" update="dynamicContent" styleClass="button is-fullwidth is-success is-rounded"/>
                </div>
            </div>
        </div>
    </h:body>

</ui:composition>
