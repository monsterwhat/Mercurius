<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <h:head>
        <title>Crear Departamento</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css"/>
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
    </h:head>
    
    <h:body>
        <div class="box">
            <div class="columns is-centered">
                <div class="column">
                    <p:commandButton value="Volver a la lista de departamentos" icon="pi pi-arrow-left"
                                     styleClass="button is-inverted is-fullwidth is-warning is-rounded"
                                     immediate="true" action="#{ViewController.selectViewDepartamentos}"
                                     update="dynamicContent"/>
                    <h:form id="createDepartamentos">
                        <br/>
                        <p:panel header="Crear un nuevo departamento">
                            <p:growl id="growl" showDetail="true" showSummary="false"/>
                            
                            <!-- Input for department name -->
                            <p:messages showDetail="true" for="name" showSummary="false" closable="true" />
                            <div class="field is-horizontal">
                                <div class="field-label is-normal">
                                    <label class="label" for="name">Nombre:</label>
                                </div>
                                <div class="field-body">
                                    <div class="field">
                                        <p:inputText id="name" value="#{DepartamentosController.newDepartamento.nombre}"
                                                     required="true" requiredMessage="El nombre no puede estar vacío"
                                                     styleClass="input is-fullwidth"/>
                                    </div>
                                </div>
                            </div>
                            
                            <!-- Add more fields for department attributes if needed -->
                            
                        </p:panel>
                        <br/>
                        <!-- Button to create department -->
                        <p:commandButton value="Crear Departamento" styleClass="button is-fullwidth is-rounded is-success"
                                         action="#{DepartamentosController.createDepartamento}" update="dynamicContent"/>
                    </h:form>
                </div>
            </div>
        </div>
    </h:body>

</ui:composition>
