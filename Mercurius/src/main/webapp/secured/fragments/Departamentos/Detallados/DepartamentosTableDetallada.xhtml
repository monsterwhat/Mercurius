<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <h:head>
        <title>Departamentos</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css"/>
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
        <style>
            .inactive-row {
                background-color: #999999 !important;
                color: #ffffff !important;
            }
        </style>
    </h:head>
    
    <h:body>
        <div class="box">
            <div class="columns is-centered">
                <div class="column">
                    <p:commandButton value="Volver al menú principal" icon="pi pi-home" actionListener="#{ViewController.selectNone}" update="dynamicContent" styleClass="button is-fullwidth is-inverted is-warning is-rounded"/>
                    <br/>
                    <h:form id="departamentosTableDetallado">
                        
                        <p:toolbar>
                            <p:toolbarGroup align="right">
                                <p:commandButton value="Exportar Excel" icon="pi pi-file-excel" styleClass="ui-button-help" ajax="false">
                                    <p:dataExporter type="xlsx" target="DepartamentosTableData" fileName="Departamentos-Mercurius-Excel" />
                                </p:commandButton>
                                <p:commandButton value="Exportar PDF" icon="pi pi-file-pdf" styleClass="ui-button-help" ajax="false">
                                    <p:dataExporter type="pdf" target="DepartamentosTableData" fileName="Departamentos-Mercurius-PDF" />
                                </p:commandButton>
                            </p:toolbarGroup>
                        </p:toolbar>
                        
                        <p:dataTable value="#{DepartamentosController.filteredDepartamentosDetallados}" var="departamento"  widgetVar="DepartamentosTable"
                                     paginator="true" rows="8" paginatorPosition="bottom" id="DepartamentosTableData"
                                     rowStyleClass="#{departamento.status == 'false' ? 'inactive-row' : null}"
                                     emptyMessage="No se encontraron departamentos con la critería proporcionada"
                                     globalFilterFunction="#{DepartamentosController.globalFilterFunction}"
                                     filterBy="#{DepartamentosController.filterBy}"
                                     selection="#{DepartamentosController.selectedDepartamento}" rowKey="#{departamento.id}">
                            
                            <f:facet name="header">
                                <p:inputText id="globalFilter" onkeyup="PF('DepartamentosTable').filter()"
                                             placeholder="Búsqueda general de todos los campos" styleClass="input"/>
                            </f:facet>
                            
                            <p:column headerText="ID Departamento" sortBy="#{departamento.id}">
                                <h:outputText value="#{departamento.id}"/>
                            </p:column>
                            <p:column headerText="Nombre" sortBy="#{departamento.nombre}">
                                <h:outputText value="#{departamento.nombre}"/>
                            </p:column>
                            <p:column headerText="Activo" visible="false" sortBy="#{departamento.status}">
                                <h:outputText value="#{departamento.status}"/>
                            </p:column>
                            <p:column headerText="Creado por:" sortBy="#{departamento.usuario.username}">
                                <h:outputText value="#{departamento.usuario.username}"/>
                            </p:column>
                            <!-- Add more columns as needed -->
                            
                            <p:column headerText="Acciones">
                                <div class="buttons has-addons">
                                    <p:commandButton styleClass="button edit-button rounded-button ui-button-success" icon="pi pi-pencil"
                                    actionListener="#{ViewController.selectEditDepartamentos()}" process="@this" update="dynamicContent">
                                        <f:setPropertyActionListener value="#{departamento}" target="#{DepartamentosController.selectedDepartamento}" />
                                    </p:commandButton>
                                    <p:commandButton styleClass="button ui-button-warning rounded-button" icon="pi pi-trash"
                                    actionListener="#{DepartamentosController.deleteDepartamento()}" process="@this" update="dynamicContent departamentosTable">
                                        <f:setPropertyActionListener value="#{departamento}" target="#{DepartamentosController.selectedDepartamento}" />
                                    </p:commandButton>
                                </div>
                            </p:column>
                        </p:dataTable>
                        <p:commandButton value="Crear Departamento" actionListener="#{ViewController.selectCreateDepartamentos}" update="dynamicContent" styleClass="button is-fullwidth is-success is-rounded"/>
                    </h:form>
                </div>
            </div>
        </div>
    </h:body>

</ui:composition>
