<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
    <p:dialog header="Editar Departamento" widgetVar="EditarDepartamentoDialog" 
        fitViewport="true" responsive="true" id="EditarDepartamentoDialog" modal="true">
        <p:outputPanel rendered="#{not empty DepartamentosController.selectedDepartamento}">
            <h:form id="editDepartamento">
                <p:panel header="Editar Departamento: #{DepartamentosController.selectedDepartamento.nombre}">
                    <p:growl id="growl" showDetail="true" showSummary="false"/>

                    <p:messages for="name" showSummary="false" showDetail="true" closable="true" />
                    <div class="field is-horizontal">
                        <div class="field-label is-normal">
                            <label class="label" for="name">Nombre:</label>
                        </div>
                        <div class="field-body">
                            <div class="field">
                                <p:inputText id="name" value="#{DepartamentosController.selectedDepartamento.nombre}"
                                             required="true" requiredMessage="El nombre no puede estar vacío"
                                             />
                            </div>
                        </div>
                    </div>

                    <div class="field is-horizontal">
                        <div class="field-body">
                            <div class="field">
                                <p:commandButton value="Actualizar datos"
                                                 action="#{DepartamentosController.updateDepartamento}" update="departamentos" />
                            </div>
                        </div>
                    </div>
                </p:panel>
            </h:form>
        
        </p:outputPanel>
    </p:dialog>
</ui:composition>
