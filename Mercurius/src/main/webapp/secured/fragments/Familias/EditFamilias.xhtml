<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <h:head>
        <title>Editar Familia</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css"/>
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
    </h:head>
    
    <h:body>
        <div class="box">
            <div class="columns is-centered">
                <div class="column">
                    <p:commandButton value="Volver a lista de familias" icon="pi pi-backward"
                                     styleClass="button is-inverted is-fullwidth is-warning is-rounded"
                                     immediate="true" action="#{ViewController.selectViewFamilias()}"
                                     update="dynamicContent" />
                    <h:form id="editFamiliaForm" rendered="#{not empty FamiliasController.selectedFamilia}">
                        <br/>
                        <p:panel header="Editar Familia: #{FamiliasController.selectedFamilia.nombre}">
                            <p:growl id="growl" showDetail="true" showSummary="false"/>
                            
                            <!-- Input for family name -->
                            <p:messages for="name" showSummary="false" showDetail="true" closable="true" />
                            <div class="field is-horizontal">
                                <div class="field-label is-normal">
                                    <label class="label" for="name">Nombre:</label>
                                </div>
                                <div class="field-body">
                                    <div class="field">
                                        <p:inputText id="name" value="#{FamiliasController.selectedFamilia.nombre}"
                                                     required="true" requiredMessage="El nombre no puede estar vacío"
                                                     styleClass="input is-fullwidth"/>
                                    </div>
                                </div>
                            </div>
                            
                            <!-- Add more fields for family attributes if needed -->
                            
                            <div class="field is-horizontal">
                                <div class="field-body">
                                    <div class="field">
                                        <p:commandButton value="Actualizar datos" styleClass="button is-fullwidth is-success is-rounded"
                                                         action="#{FamiliasController.updateFamilia}" update="dynamicContent" />
                                    </div>
                                </div>
                            </div>
                        </p:panel>
                    </h:form>
                </div>
            </div>
        </div>
    </h:body>
</ui:composition>
