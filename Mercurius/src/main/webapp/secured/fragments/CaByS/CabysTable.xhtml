<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <h:head>
        <title>CaByS</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css"/>
        <meta charset="utf-8" name="viewport" content="width=device-width, initial-scale=1"/>
    </h:head>
    
    <h:body>
        <div class="box">
            <div class="columns is-centered">
                <div class="column">
                    <p:commandButton value="Volver al menú principal" icon="pi pi-home" actionListener="#{ViewController.selectNone}" update="dynamicContent" styleClass="button is-fullwidth is-inverted is-warning is-rounded"/>
                    <br/>
                    <h:form id="cabysTableForm">
                        <p:growl id="growl"/>
                        <p:toolbar>
                            <p:toolbarGroup align="left">
                                <p:commandButton value="Cargar Catálogo de Bienes y Servicios" icon="pi pi-cloud-download"
                                                 process="@this" update="CabysTable" 
                                                 actionListener="#{CabysController.cabysListApi}" />
                            </p:toolbarGroup>
                            <p:toolbarGroup align="right">
                                <p:commandButton value="Exportar Excel" icon="pi pi-file-excel" styleClass="ui-button-help" ajax="false">
                                    <p:dataExporter type="xlsx" target="CabysTable" fileName="Cabys-Mercurius" />
                                </p:commandButton>
                                <p:commandButton value="Exportar PDF" icon="pi pi-file-pdf" styleClass="ui-button-help" ajax="false">
                                    <p:dataExporter type="pdf" target="CabysTable" fileName="Cabys-Mercurius" />
                                </p:commandButton>
                            </p:toolbarGroup>
                        </p:toolbar>
                        
                        <p:dataTable value="#{CabysController.filteredCabys}" var="cabys"  widgetVar="CabysTable"
                                     paginator="true" rows="8" paginatorPosition="bottom" id="CabysTable"
                                     emptyMessage="No se encontraron bienes ni servicios con la critería proporcionada"
                                     globalFilterFunction="#{CabysController.globalFilterFunction}"
                                     filterBy="#{CabysController.filterBy}" 
                                     selection="#{CabysController.selectedCabys}" rowKey="#{cabys.codigo}">
                            
                            <f:facet name="header">
                                <p:inputText id="globalFilter" onkeyup="PF('CabysTable').filter()"
                                             placeholder="Búsqueda general de todos los campos" styleClass="input"/>
                            </f:facet>
                            
                            <p:column headerText="Código" sortBy="#{cabys.codigo}">
                                <h:outputText value="#{cabys.codigo}" />
                            </p:column>
                            <p:column headerText="Descripción Categoría">
                                <h:outputText value="#{cabys.descripcion}" />
                            </p:column>
                             <p:column headerText="Categoría">
                                <h:outputText value="#{cabys.categorias}" />
                            </p:column>
                            <p:column headerText="Impuesto" sortBy="#{cabys.impuesto}">
                                <h:outputText value="#{cabys.impuesto}" />
                            </p:column>
                            <p:column headerText="Estado" sortBy="#{cabys.estado}" visible="false">
                                <h:outputText value="#{cabys.estado}" />
                            </p:column>

                        </p:dataTable>
                    </h:form>
                </div>
            </div>
        </div>
    </h:body>

</ui:composition>
