<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <h:head>
        <title>CaByS</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css"/>
        <meta charset="utf-8" name="viewport" content="width=device-width, initial-scale=1"/>
    </h:head>
    
    <h:body>
            <!-- Dialog for Código CABYS -->
            <p:dialog header="Seleccionar Código CABYS" widgetVar="codigoCabysDialog" responsive="true" fitViewport="true">
                <p:outputPanel rendered="#{not empty CabysController.articulos}">
                <h:form>
                        
                <p:dataTable value="#{CabysController.filteredCabys}" var="cabys"  widgetVar="UpdateCabysTable"
                    paginator="true" rows="5" paginatorPosition="bottom" id="UpdateCabysTable"
                    emptyMessage="No se encontraron bienes ni servicios con la critería proporcionada"
                    globalFilterFunction="#{CabysController.globalFilterFunction}"
                    filterBy="#{CabysController.filterBy}" showGridlines="true" reflow="true"
                    selection="#{CabysController.selectedCabys}" rowKey="#{cabys.codigo}">

                <f:facet name="header">
                    <p:inputText id="globalFilter" onkeyup="PF('UpdateCabysTable').filter()"
                                 placeholder="#{ArticulosController.selectedArticulo.recomendacionCabys}" styleClass="input"/>
                </f:facet>

                <p:column selectionMode="single" style="width: 3%" />
                <p:column headerText="Código" sortBy="#{cabys.codigo}">
                    <h:outputText value="#{cabys.codigo}" />
                </p:column>
                <p:column headerText="Descripción Categoría" sortBy="#{cabys.descripcion}">
                    <h:outputText value="#{cabys.descripcion}" />
                </p:column>
                <p:column headerText="Impuesto" sortBy="#{cabys.impuesto}">
                    <h:outputText value="#{cabys.impuesto}" />
                </p:column>
                <p:column headerText="Estado" sortBy="#{cabys.estado}" rendered="false">
                    <h:outputText value="#{cabys.estado}" />
                </p:column>

                </p:dataTable>
        
                <p:commandButton value="Seleccionar" process="@form" styleClass="button is-fullwidth" action="#{CabysController.selectCabysEdit}" 
                                 onsuccess="PF('codigoCabysDialog').hide();"/>

                </h:form>
            </p:outputPanel>
        </p:dialog>
    </h:body>

</ui:composition>
