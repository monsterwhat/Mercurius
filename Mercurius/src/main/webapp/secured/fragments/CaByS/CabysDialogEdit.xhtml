<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
    
    <h:body>
            <!-- Dialog for Código CABYS -->
            <p:dialog header="Seleccionar Código CABYS" widgetVar="codigoCabysDialogEdit"
                      responsive="true" fitViewport="true" modal="true" >
                <p:outputPanel rendered="#{not empty CabysController.catalogo}" layout="flex">
                    <h:form>
                        <p:dataTable value="#{CabysController.filteredCabys}" var="cabys" widgetVar="UpdateCabysTableEdit"
                            paginator="true" rows="5" paginatorPosition="bottom" id="UpdateCabysTableEdit"
                            emptyMessage="No se encontraron bienes ni servicios con la critería proporcionada"
                            globalFilterFunction="#{CabysController.globalFilterFunction}"
                            filterBy="#{CabysController.filterBy}" showGridlines="true" reflow="true"
                            selection="#{CabysController.selectedCabys}" rowKey="#{cabys.codigo}">

                        <f:facet name="header">
                            <p:inputText id="globalFilter" onkeyup="PF('UpdateCabysTableEdit').filter()" style="color: var(--primary-color); width: 100%"
                                         placeholder="Búsqueda general de todos los campos"/>
                        </f:facet>

                        <p:column selectionBox="true" style="width: 3%" />
                        <p:column headerText="Código" sortBy="#{cabys.codigo}">
                            <h:outputText value="#{cabys.codigo}" />
                        </p:column>
                        <p:column headerText="Descripción Categoría" sortBy="#{cabys.descripcion}">
                            <h:outputText value="#{cabys.descripcion}" />
                        </p:column>
                        <p:column headerText="Impuesto" sortBy="#{cabys.impuesto}">
                            <h:outputText value="#{cabys.impuesto}" />
                        </p:column>
                        <p:column headerText="Estado" sortBy="#{cabys.estado}" rendered="false">
                            <h:outputText value="#{cabys.estado}" />
                        </p:column>

                        </p:dataTable>

                        <p:commandButton value="Seleccionar" process="@form" update="@form" action="#{CabysController.selectCabysEdit}" 
                                 onclick="PF('codigoCabysDialogEdit').hide();" style="width: 100%"/>
                    </h:form>
            </p:outputPanel>
        </p:dialog>
    </h:body>
</ui:composition>
