<!DOCTYPE html >
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
    
    <h:head>
        <title>Facelet Title</title>
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css"/>
    </h:head>
    
    <h:body>
        <section class="hero is-warning is-fullheight">
            <div class="hero-body"> 
                <div class="container">
                    <div class="columns is-centered">
                        <div class="column is-5-tablet is-4-desktop is-3-widescreen ">
                            <h:form class="box" rendered="#{not SessionController.isValid()}">
                                <p:growl id="growl" showDetail="true" />    
                                <div class="field">
                                    <label for="email" class="label">Email</label>
                                    <p:inputText class="input is-rounded is-dark" type="email" placeholder="Email" id="email" required="true"
                                                 value="#{SessionController.username}"/>
                                </div>
                                <div class="field">
                                    <label for="password" class="label">Password</label>
                                    <p:inputText class="input is-rounded is-dark" type="password" placeholder="Password" id="password" required="true"
                                                 value="#{SessionController.password}"/>
                                </div>
                                <div class="field">
                                    <p:commandButton value="Ingresar" class="button is-success is-rounded"
                                                     action="#{SessionController.executeLogin}" ajax="false"/>
                                </div>
                            </h:form>
                        </div>
                    </div>
                </div>
            </div>
        </section>
            
    <footer class="footer">
        <div class="content has-text-centered">
            <p>
                <strong>Bulma</strong> by <a href="https://jgthms.com">Jeremy Thomas</a>. The source code is licensed
                <a href="http://opensource.org/licenses/mit-license.php">MIT</a>. The website content
                is licensed <a href="http://creativecommons.org/licenses/by-nc-sa/4.0/">CC BY NC SA 4.0</a>.
            </p>
        </div>
    </footer>
            
    </h:body>
    
    
    
</html>
