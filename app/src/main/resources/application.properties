# Quarkus Configuration for Mercurius

# HTTP Configuration
quarkus.http.root-path=/Mercurius
quarkus.http.port=8081

# Database Configuration
quarkus.datasource.db-kind=postgresql
# Database Configuration (override via env variables)
quarkus.datasource.username=${DB_USERNAME:mercurius}
quarkus.datasource.password=${DB_PASSWORD:Mercurius@1!}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5433/mercurius}

# Hibernate ORM Configuration
# SCHEMA MANAGEMENT: Hibernate 'update' is the ONLY mechanism in this project.
# There is no Flyway, no Liquibase, and deliberately no db/migration directory.
#
# A db/migration/ folder with five Flyway-style scripts used to sit here. It was
# dead code: quarkus-flyway was never a dependency, so the scripts never ran on
# any profile. Everything they described was already in the JPA entities
# (Clientes.provincia/canton/distrito, Cabys.impuesto as String, TipoCambio as
# BigDecimal(18,5), ConfiguracionMargen, Articulos.tipoRefrigeracion,
# ConfiguracionAplicacion.authSessionKey), so 'update' had already created those
# structures and the scripts could never do anything on top. They were removed
# rather than left to imply a migration history that does not exist.
#
# KNOWN TRADE-OFF of 'update': Hibernate mutates the live schema at boot. It
# creates missing tables/columns and never drops anything, so schema changes are
# not reviewable, not ordered, and not reversible, and two instances booting
# against one database race on DDL. Acceptable while this is a single-node
# inventory install. Adopting Flyway (with baseline-on-migrate for existing
# databases) is the upgrade path if that changes.
quarkus.hibernate-orm.schema-management.strategy=update
quarkus.hibernate-orm.log.sql=false
  
# Logging Configuration (quarkus + file handler for audit persistence - replaces Alertas DB table)
quarkus.log.level=INFO
quarkus.log.category."org.hibernate".level=WARN
quarkus.log.category."io.quarkus".level=INFO
# File log replaces in-house Alertas table: persistent audit trail at logs/mercurius.log
quarkus.log.file.enable=true
quarkus.log.file.path=logs/mercurius.log
quarkus.log.file.level=INFO
quarkus.log.file.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n
quarkus.log.file.rotation.max-file-size=10M
# No backup cap (Quarkus has no unlimited sentinel; 100000 is effectively
# unbounded) — age purge is handled by ProgramadorTareas.purgarLogsAntiguos (4 years).
quarkus.log.file.rotation.max-backup-index=100000
quarkus.log.file.rotation.file-suffix=.yyyy-MM-dd
quarkus.log.file.rotation.rotate-on-boot=true
# Keep console for dev
quarkus.log.console.enable=true
quarkus.log.console.level=INFO
# Audit category at INFO to ensure registrarAlerta replacements are persisted
quarkus.log.category."Services".level=INFO
quarkus.log.category."Controllers".level=INFO
  
# Application Configuration
quarkus.application.name=Mercurius
quarkus.application.version=1.0-SNAPSHOT

# Java 25 compatibility
net.bytebuddy.experimental=true
quarkus.http.limits.max-body-size=100M
quarkus.http.limits.max-form-attribute-size=100M

# Email Configuration (for future use)
# quarkus.mailer.host=smtp.gmail.com
