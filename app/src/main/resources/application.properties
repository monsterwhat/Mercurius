# quarkus.mailer.username=your-email@gmail.com
# quarkus.mailer.password=your-app-password
# quarkus.mailer.start-tls=true

# Scheduler Configuration
quarkus.scheduler.enabled=true

# Performance Configuration
quarkus.datasource.jdbc.max-size=20
quarkus.datasource.jdbc.min-size=5
quarkus.hibernate-orm.jdbc.statement-fetch-size=50
  
# JVM Memory Configuration (for production)
quarkus.jvm.args=-Xms512m -Xmx2g -XX:ReservedCodeCacheSize=256m -XX:+UseG1GC

# Java 25 compatibility
net.bytebuddy.experimental=true

# Completely disable dev UI
quarkus.dev-ui.enabled=false 
  
# Uber JAR Configuration 
quarkus.package.jar.enabled=true
quarkus.package.jar.type=uber-jar

# Hacienda Configuration
# Callback URL for async notification from TRIBU-CR (optional)
# Set to your public endpoint that can receive POST notifications from Hacienda
# e.g., https://your-server.com/Mercurius/api/hacienda/callback
# hacienda.callback.url=${HACIENDA_CALLBACK_URL:}

# Hacienda Encryption Key: DB-managed via AppSettings.haciendaEncryptionKey (auto-generated on first boot)
# No env var required; see HaciendaCertificateService.initializeEncryptionKey() and AppSettingsService.getOrCreateHaciendaEncryptionKey()

# Mercatus Marketplace Configuration
# JWT secret key (256-bit minimum, set via environment variable)
mercatus.jwt.secret=${MERCATUS_JWT_SECRET:changeme-this-is-not-a-secure-key-in-production-256bits!!}
mercatus.jwt.expiry-minutes=15
mercatus.jwt.refresh-expiry-days=7

# Hacienda /recepcion polling budget (HaciendaApiService.submitAndWait).
# POST /recepcion answers 202, so the terminal state is obtained by polling
# GET /recepcion/{clave}. This sleep happens while the caller
# (ComprobanteService.crearComprobante) holds a @Transactional and a
# PESSIMISTIC_WRITE lock on the invoice-number row, so every millisecond here
# blocks concurrent sales. Defaults give a ~12 s worst case; a send that misses
# the window is not lost — the signed document stays in the EnvioFueraLinea
# outbox and the 48 h batch transmits it under Art. 21 ¶3.
mercatus.hacienda.poll.intentos=8
mercatus.hacienda.poll.intervalo-ms=1500

# CORS Configuration for Mercatus (React SPA)
quarkus.http.cors=true
quarkus.http.cors.origins=${MERCATUS_CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.exposed-headers=Authorization
quarkus.http.cors.access-control-max-age=86400

# Cache Configuration (Caffeine)
quarkus.cache.caffeine.analytics-dashboard.initial-capacity=10
quarkus.cache.caffeine.analytics-dashboard.maximum-size=100
quarkus.cache.caffeine.analytics-dashboard.expire-after-write=5M

quarkus.cache.caffeine.analytics-sales.initial-capacity=10
quarkus.cache.caffeine.analytics-sales.maximum-size=50
quarkus.cache.caffeine.analytics-sales.expire-after-write=10M

quarkus.cache.caffeine.analytics-seasonality.initial-capacity=5
quarkus.cache.caffeine.analytics-seasonality.maximum-size=30
quarkus.cache.caffeine.analytics-seasonality.expire-after-write=60M

quarkus.cache.caffeine.analytics-products.initial-capacity=5
quarkus.cache.caffeine.analytics-products.maximum-size=20
quarkus.cache.caffeine.analytics-products.expire-after-write=5M

quarkus.cache.caffeine.analytics-forecast.initial-capacity=5
quarkus.cache.caffeine.analytics-forecast.maximum-size=20
quarkus.cache.caffeine.analytics-forecast.expire-after-write=30M

# OpenAPI/Swagger Configuration
quarkus.smallrye-openapi.info-title=Mercurius Public REST API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=Public REST API for Mercatus marketplace and Accounting integrations

# =============================================================
# TEST PROFILE (%test) — local PostgreSQL test database (T2).
# NO Docker on this machine, so Dev Services MUST stay disabled;
# tests boot against the dedicated mercurius_test database on the
# local PostgreSQL instance (port 5433). None of these keys affect
# %dev or %prod runs.
# =============================================================
%test.quarkus.datasource.devservices.enabled=false
%test.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5433/mercurius_test
%test.quarkus.datasource.username=${TEST_DB_USERNAME:mercurius}
%test.quarkus.datasource.password=${TEST_DB_PASSWORD:Mercurius@1!}
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%test.quarkus.hibernate-orm.sql-load-script=import-test.sql
# Scheduled jobs (backup hourly cron -> findOrCreateCurrent, mail polling,
# Hacienda checks...) must not commit rows behind the tests' backs while
# @TestTransaction scenarios assert on table contents. Test JVMs only.
%test.quarkus.scheduler.enabled=false
%test.quarkus.http.test-port=8081
# El log de archivo (audit trail) rota logs\mercurius.log en cada arranque; en
# corridas de prueba el handle queda tomado y LogManager aborta la JVM con
# "Failed to move file". La auditoría importa en %dev/%prod, no en pruebas.
%test.quarkus.log.file.enable=false
%test.quarkus.log.file.rotation.rotate-on-boot=false

# =============================================================
# AUTHENTICATION (T13) — Quarkus form-based cookie auth + permission
# policies for the NEW Qute/HTMX app surface.
#
# ACTIVATED by T14 (Qute login page at /login now exists).
#
# CONTEXT-PATH NOTE (T14): form login/error/landing pages are emitted as
# redirect targets verbatim (scheme://authority + configured value), so they
# MUST include the quarkus.http.root-path=/Mercurius prefix to stay inside the
# application router (anything outside it 404s). Permission policy paths, in
# contrast, ARE matched relative to the root path (ImmutablePathMatcher is
# built with rootPath), so they stay unprefixed below.
#
# LEGACY SAFETY: legacy JSF paths (/secured/*, *.xhtml) are deliberately
# NOT listed in any policy below, so they stay governed exclusively by
# the existing web.xml security-constraints. The path lists do not
# overlap them (no /secured prefix, no *.xhtml suffix patterns).
# =============================================================
quarkus.http.auth.form.enabled=true
quarkus.http.auth.form.login-page=/Mercurius/login
quarkus.http.auth.form.landing-page=/Mercurius/app
quarkus.http.auth.form.error-page=/Mercurius/login?error
quarkus.http.auth.form.cookie-same-site=strict
quarkus.http.auth.form.http-only-cookie=true

# Credential-guess throttling (Utils.IntentosDeCredencial). Applies to the two
# endpoints that verify a BCrypt hash for a caller-supplied identity:
# POST /api/app/auth/supervisor-authorize and PUT /api/app/users/{id}/password.
# Counted per account AND per source address, so neither one target nor one
# caller spraying many targets can exceed the budget. A successful verification
# clears both counters.
# State is per instance (Caffeine); behind N nodes the effective limit is per
# node. Raising these weakens the password-guessing defence.
mercurius.auth.intentos.max=5
mercurius.auth.intentos.ventana-minutos=15
mercurius.auth.intentos.bloqueo-minutos=15
# Session cookie encryption key — DB-managed via AppSettings.authSessionKey + DbSessionKeyConfigSource (auto-generated on first boot)
# Fallback below is only for %dev/%test before DB migration runs; %prod uses DB key (no env required)
quarkus.http.auth.session.encryption-key=${AUTH_SESSION_KEY:dev-only-32bytes-minimum-key-change-me!}
# Permission policy paths: EMPIRICAL (Sep 2026) — unauthenticated requests to
# /Mercurius/static/* were 303-redirected to the login page, so the unprefixed
# forms below do NOT match static assets on this Quarkus version despite the
# relative-matching note above. Both prefixed and unprefixed forms are listed:
# whichever matching semantics applies, login + static stay public. Widening
# permit here is safe (login page + static assets only, never /app or /api).
# ORDER MATTERS: first matching entry wins, so the public permit list MUST
# precede the secured authenticated list.
#
# LOGIN-ORIGIN (login CSRF) needs no permission entry: POST /j_security_check
# is served by the form mechanism outside permission evaluation entirely (a
# custom HttpSecurityPolicy was tried and verified never to run for it), so the
# check lives in Controllers.filters.LoginOrigenMechanism, an
# HttpAuthenticationMechanism decorator that fails cross-origin logins before
# the form mechanism mints a session. Do NOT add a permission for
# j_security_check expecting a policy to gate it — it will silently never run.
# Static-asset subtrees are enumerated explicitly (bundle, css, favicon,
# imgs incl. imgs/logo, js) because single-segment wildcards do not reliably
# cover nested paths on this Quarkus version (empirical: /static/* alone left
# /static/bundle/* intercepted by form auth). Both unprefixed and
# /Mercurius-prefixed forms are listed to cover either matching semantic.
#
# REDIRECT TRAPS (T-fix): "/" and "/app" EXACTLY are permitted so the 303
# redirect resources (RootRedirectResource / AppEntryResource) actually run and
# answer 303 instead of being pre-empted by the form-auth 302 challenge. They
# only ever answer seeOther — no data is served — and the real surface stays
# secured: /app/* and /api/app/* remain authenticated, so an anonymous visitor
# is bounced to /login by the secured policy (with the redirect-location
# cookie, i.e. the same bounce-back the login journey tests assert).
# "/api/app/auth/logout" is permitted for the same reason: an anonymous logout
# is a documented harmless no-op 303, not a challenge. It invalidates nothing
# (no session exists) and the authenticated logout keeps working.
#
# SELF-CHECKED 401 ENDPOINTS (T-fix): these three verify the SecurityIdentity
# THEMSELVES and answer the documented ApiResponse envelope
# (ApiResponse.error("UNAUTHENTICATED")) instead of redirecting. Carving them
# out of the blanket /api/app/* policy lets that self-check run, which is what
# the 401 contract requires:
#   /api/app/auth/me      -> AppAuthResource.me()  (isAnonymous -> 401 envelope)
#   /api/app/pos/cart     -> PosResource.cart()      (currentUsername()==null -> 401)
#   /api/app/pos/cart-panel -> PosResource cart-panel (same guard, HTML fragment)
# The three self-checked endpoints below are NOT in the secured API list, so
# their own guard decides: AppAuthResource.me(), PosResource.cart() and the
# cart-panel fragment all answer 401 with the ApiResponse envelope instead of
# redirecting an API caller to an HTML login page. Every OTHER /api/app/* sub-API
# stays in the secured policy, so @RolesAllowed data endpoints (e.g.
# /api/app/cabys) keep challenging anonymous callers with the form redirect —
# the browser contract RoleMatrixTest pins. Both contracts hold because they
# apply to DIFFERENT endpoints, not because one test was rewritten.
quarkus.http.auth.permission.public.paths=/login,/static/*,/resources/*,/static/bundle/*,/resources/css/*,/resources/favicon/*,/resources/imgs/*,/resources/imgs/logo/*,/resources/js/*,/api/app/auth/logout,/api/app/auth/me,/api/app/pos/cart,/api/app/pos/cart-panel,/,/app,/app/,/Mercurius,/Mercurius/,/Mercurius/app,/Mercurius/app/,/Mercurius/api/app/auth/logout,/Mercurius/api/app/auth/me,/Mercurius/api/app/pos/cart,/Mercurius/api/app/pos/cart-panel,/Mercurius/login,/Mercurius/static/*,/Mercurius/resources/*,/Mercurius/static/bundle/*,/Mercurius/resources/css/*,/Mercurius/resources/favicon/*,/Mercurius/resources/imgs/*,/Mercurius/resources/imgs/logo/*,/Mercurius/resources/js/*
quarkus.http.auth.permission.public.policy=permit
# API SUB-APIS ENUMERADAS (T-fix) — el blanket /api/app/* se elimina.
# Antes, cualquier ruta bajo /api/app/* quedaba cubierta, incluidas las que NO
# existen: un /api/app/desconocido devolvía el challenge 302 del login en vez de
# un 404 JSON, y un cliente de API no puede interpretar ese redirect.
#
# Ahora la policy enumera las sub-APIs REALES (extraídas de los @Path de
# Controllers/Api/App), cada una en sus formas exacta y con subruta, más las
# variantes prefijadas con /Mercurius. Contraste: default-deny. Una ruta API
# nueva que se olvide aquí NO queda expuesta — worst case degradan de 302 a
# 403/401, porque @RolesAllowed y los auto-chequeos siguen aplicándose en el
# recurso. Por eso ExportResource lleva su propio @RolesAllowed("registro"):
# antes dependía exclusivamente de este blanket.
#
# /app/* (la superficie de páginas) sigue como authenticated, sin cambios.
quarkus.http.auth.permission.secured.paths=/app/*,/Mercurius/app/*,/api/app/articulos,/api/app/articulos/*,/api/app/auth,/api/app/auth/*,/api/app/cabys,/api/app/cabys/*,/api/app/caja,/api/app/caja/*,/api/app/categorias,/api/app/categorias/*,/api/app/clientes,/api/app/clientes/*,/api/app/devoluciones,/api/app/devoluciones/*,/api/app/email-templates,/api/app/email-templates/*,/api/app/etiquetas,/api/app/etiquetas/*,/api/app/export,/api/app/export/*,/api/app/facturas-recibidas,/api/app/facturas-recibidas/*,/api/app/inventario,/api/app/inventario/*,/api/app/lotes,/api/app/lotes/*,/api/app/loyalty,/api/app/loyalty/*,/api/app/ordenes,/api/app/ordenes/*,/api/app/perfil,/api/app/perfil/*,/api/app/pos,/api/app/pos/*,/api/app/recibos,/api/app/recibos/*,/api/app/reportes-programados,/api/app/reportes-programados/*,/api/app/settings,/api/app/settings/*,/api/app/settings/margen,/api/app/settings/margen/*,/api/app/shrinkage,/api/app/shrinkage/*,/api/app/stock-alert-config,/api/app/stock-alert-config/*,/api/app/tributacion,/api/app/tributacion/*,/api/app/users,/api/app/users/*,/Mercurius/api/app/articulos,/Mercurius/api/app/articulos/*,/Mercurius/api/app/auth,/Mercurius/api/app/auth/*,/Mercurius/api/app/cabys,/Mercurius/api/app/cabys/*,/Mercurius/api/app/caja,/Mercurius/api/app/caja/*,/Mercurius/api/app/categorias,/Mercurius/api/app/categorias/*,/Mercurius/api/app/clientes,/Mercurius/api/app/clientes/*,/Mercurius/api/app/devoluciones,/Mercurius/api/app/devoluciones/*,/Mercurius/api/app/email-templates,/Mercurius/api/app/email-templates/*,/Mercurius/api/app/etiquetas,/Mercurius/api/app/etiquetas/*,/Mercurius/api/app/export,/Mercurius/api/app/export/*,/Mercurius/api/app/facturas-recibidas,/Mercurius/api/app/facturas-recibidas/*,/Mercurius/api/app/inventario,/Mercurius/api/app/inventario/*,/Mercurius/api/app/lotes,/Mercurius/api/app/lotes/*,/Mercurius/api/app/loyalty,/Mercurius/api/app/loyalty/*,/Mercurius/api/app/ordenes,/Mercurius/api/app/ordenes/*,/Mercurius/api/app/perfil,/Mercurius/api/app/perfil/*,/Mercurius/api/app/pos,/Mercurius/api/app/pos/*,/Mercurius/api/app/recibos,/Mercurius/api/app/recibos/*,/Mercurius/api/app/reportes-programados,/Mercurius/api/app/reportes-programados/*,/Mercurius/api/app/settings,/Mercurius/api/app/settings/*,/Mercurius/api/app/settings/margen,/Mercurius/api/app/settings/margen/*,/Mercurius/api/app/shrinkage,/Mercurius/api/app/shrinkage/*,/Mercurius/api/app/stock-alert-config,/Mercurius/api/app/stock-alert-config/*,/Mercurius/api/app/tributacion,/Mercurius/api/app/tributacion/*,/Mercurius/api/app/users,/Mercurius/api/app/users/*
quarkus.http.auth.permission.secured.policy=authenticated
# %test note: T15 auth tests authenticate via @TestSecurity, which bypasses
# form auth entirely; no %test overrides of these keys are needed.

# =============================================================
# %prod HARDENING (T40) — fail fast if required secrets missing.
# Global fallbacks above keep %dev/%test ergonomic; %prod overrides below
# have NO defaults so the app aborts at boot when env vars are absent.
# DB-managed keys (authSessionKey, haciendaEncryptionKey) are NOT listed here — they are auto-generated on first boot.
# =============================================================
%prod.quarkus.datasource.username=${DB_USERNAME}
%prod.quarkus.datasource.password=${DB_PASSWORD}
%prod.quarkus.datasource.jdbc.url=${DB_URL}
%prod.mercatus.jwt.secret=${MERCATUS_JWT_SECRET}
%prod.quarkus.http.cors.origins=${MERCATUS_CORS_ORIGINS}