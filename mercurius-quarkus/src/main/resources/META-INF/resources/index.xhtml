<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      class="#{ThemeController.currentTheme}">
    
<h:head>
    <title>Inicio de Sesion</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.3/css/bulma.min.css"/>
    <meta charset="utf-8" name="viewport" content="width=device-width, initial-scale=1"/> 
    <link rel="stylesheet" href="/Mercurius/resources/css/style.css"/>  
    <link rel="stylesheet" href="/Mercurius/resources/css/base-theme.css"/> 
    <link rel="stylesheet" href="/Mercurius/resources/css/button-stack.css"/> 
    <link rel="stylesheet" href="/Mercurius/resources/css/datatable.css"/> 
    <link rel="stylesheet" href="/Mercurius/resources/css/dialog.css"/>
    <link rel="stylesheet" href="/Mercurius/resources/css/form-elements.css"/>
    <link rel="stylesheet" href="/Mercurius/resources/css/tabs.css"/>
    <link rel="stylesheet" href="/Mercurius/resources/css/timeline.css"/> 
</h:head>
    
<h:body>
    <div class="section">
        <div class="card">
            <h:form rendered="#{not SessionController.isValid()}" >

                    <div class="columns is-centered is-mobile">
                        <div class="column is-one-third-desktop is-half-tablet is-half-mobile">
                            <p:outputPanel rendered="#{SettingsController.currentSettings.nombrePerfil eq null}">
                                <p class="title has-text-centered">Mercurius</p>
                            </p:outputPanel>
                            <p:outputPanel rendered="#{SettingsController.currentSettings.nombrePerfil != null}">
                                <p class="title has-text-centered">#{SettingsController.currentSettings.nombrePerfil}</p>
                            </p:outputPanel>

                            <p:graphicImage value="/resources/imgs/logo/Mercurius.png" alt="Imagen" rendered="#{SettingsController.logo eq null}"/>
                            <p:graphicImage value="#{SettingsController.logo}" alt="Imagen" stream="false" rendered="#{SettingsController.logo != null}"/>
                        </div>
                    </div>
                    <div class="columns is-centered is-mobile">
                        <div class="column is-one-third-desktop is-half-tablet is-half-mobile">
                            <p:growl id="growl" showDetail="true" showSummary="false" />
                            <div class="columns is-multiline">
                                <div class="column is-full">
                                    <p:inputText id="username" value="#{SessionController.username}" required="true" requiredMessage="El usuario no puede estar vacío" placeholder="Nombre de Usuario" class="input"/>
                                </div>
                                <div class="column is-full">
                                    <p:password id="password" value="#{SessionController.password}" required="true" requiredMessage="La contraseña no puede estar vacía" placeholder="Contraseña" class="input"/>
                                </div>
                                <div class="column is-full">
                                    <p:commandLink action="#{SessionController.executeLogin}" ajax="false" class="button is-success is-fullwidth">Iniciar Sesión</p:commandLink>
                                </div>
                            </div> 
                        </div>
                    </div>   
            </h:form>

            <h:form rendered="#{SessionController.isValid()}">
                <div class="card">
                    <div class="columns is-multiline is-centered is-mobile">
                        <div class="column is-full">
                            <h:outputLabel for="message" value="¡Oops! " />
                            <h:outputLabel for="message" value=" ¡Ya iniciaste sesión!" />
                        </div>
                        <div class="column is-full">
                            <p:button styleClass="button is-rounded is-success" value="Menú Principal" href="/Mercurius/secured/index.xhtml"/>
                        <p:commandButton styleClass="button is-rounded is-danger" value="Cerrar Sesión" actionListener="#{SessionController.logOut}"/>
                        </div>
                    </div>
                </div> 
            </h:form>
        </div>
    </div>
        
    <footer class="footer">
        <div class="content has-text-centered">
            <div class="columns is-centered is-mobile">
                <div class="column"> 
                    <a href="https://github.com/monsterwhat/Mercurius">
                    <figure class="image is-128x128 is-inline-block">
                            <img src="https://github.com/monsterwhat/Mercurius/raw/Master/Mercurius.png"/>
                    </figure>
                    <p class="title">Mercurius</p>
                    </a> 
                </div>
            </div>
        </div> 
    </footer>
        
</h:body>

</html>
