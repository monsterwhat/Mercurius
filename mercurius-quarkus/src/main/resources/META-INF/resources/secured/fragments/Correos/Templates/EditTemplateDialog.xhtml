<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
    
    <p:dialog header="Editar Plantilla de Correo" widgetVar="EditarTemplateDialog" dynamic="true" cache="false" 
              fitViewport="true" responsive="true" id="EditarTemplateDialog" modal="true" width="800">
        <p:outputPanel rendered="#{not empty emailTemplateController.selectedTemplate}">
            <h:form id="editTemplateForm">
                <p:panel header="Editar Plantilla: #{emailTemplateController.selectedTemplate.nombre}" style="width: 100%;">
                    <p:growl showDetail="true" showSummary="false"/>
                    <div class="columns is-multiline">
                        <div class="column is-half">
                            <p:messages showDetail="true" for="edit-tpl-name" showSummary="false" closable="true" />
                            <label class="label" for="edit-tpl-name" style="color: var(--primary-color);">Nombre:</label>
                            <p:inputText id="edit-tpl-name" value="#{emailTemplateController.selectedTemplate.nombre}" style="width: 100%"
                                         required="true" requiredMessage="El nombre no puede estar vacio"/>
                        </div>

                        <div class="column is-half">
                            <p:messages showDetail="true" for="edit-tpl-tipo" showSummary="false" closable="true" />
                            <label class="label" for="edit-tpl-tipo" style="color: var(--primary-color);">Tipo:</label>
                            <p:selectOneMenu id="edit-tpl-tipo" value="#{emailTemplateController.selectedTemplate.tipo}" style="width: 100%">
                                <f:selectItems value="#{emailTemplateController.tipoOptions}" />
                            </p:selectOneMenu>
                        </div>

                        <div class="column is-full">
                            <p:messages showDetail="true" for="edit-tpl-asunto" showSummary="false" closable="true" />
                            <label class="label" for="edit-tpl-asunto" style="color: var(--primary-color);">Asunto por defecto:</label>
                            <p:inputText id="edit-tpl-asunto" value="#{emailTemplateController.selectedTemplate.asunto}" style="width: 100%" />
                        </div>

                        <div class="column is-full">
                            <p:messages showDetail="true" for="edit-tpl-cuerpo" showSummary="false" closable="true" />
                            <label class="label" for="edit-tpl-cuerpo" style="color: var(--primary-color);">Cuerpo HTML:</label>
                            <p:inputTextarea id="edit-tpl-cuerpo" value="#{emailTemplateController.selectedTemplate.cuerpoHtml}" 
                                             style="width: 100%; font-family: monospace; min-height: 300px;"
                                             autoResize="false" />
                        </div>

                        <div class="column is-full">
                            <div class="notification is-info is-light">
                                <p><strong>Placeholders disponibles:</strong></p>
                                <p style="font-family: monospace; font-size: 0.9em;">
                                    {{nombre}} - Nombre del reporte &#160;|&#160;
                                    {{fecha}} - Fecha actual &#160;|&#160;
                                    {{total}} - Total de registros &#160;|&#160;
                                    {{tabla}} - Tabla de datos &#160;|&#160;
                                    {{mensaje}} - Mensaje descriptivo &#160;|&#160;
                                    {{_empresa}} - Nombre de la empresa
                                </p>
                            </div>
                        </div>
                    </div>

                    <div class="buttons" style="margin-top: 1rem;">
                        <p:commandButton value="Actualizar Plantilla" process="@form" styleClass="rounded-button ui-button-primary"
                                         update="@form Templates" style="width: 100%"
                                         action="#{emailTemplateController.updateTemplate}"/>
                    </div>
                </p:panel>
            </h:form>
        </p:outputPanel> 
    </p:dialog>
</ui:composition>
