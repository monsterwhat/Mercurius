
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <h:body>
        <div class="box">
            <div class="columns is-centered">
                <div class="column">
                    <p:commandButton value="Volver al menú principal" icon="pi pi-home" actionListener="#{ViewController.selectNone}" update="dynamicContent" styleClass="button is-fullwidth is-inverted is-warning is-rounded"/>
                    <br/>
                        <div class="columns is-mobile">
                                <div class="column">
                                    <p:commandButton icon="pi pi-upload" onclick="PF('facturasUpload').show();" value="Subir Factura" styleClass="button is-fullwidth"/>                            
                                </div>

                                <div class="column buttons">
                                    <p:commandButton value="Exportar Excel" icon="pi pi-file-excel" styleClass="button is-warning" ajax="false">
                                        <p:dataExporter type="xlsx" target="FacturasTableData" fileName="Facturas-Mercurius-Excel" />
                                    </p:commandButton>
                                    <p:commandButton value="Exportar PDF" icon="pi pi-file-pdf" styleClass="button is-warning" ajax="false">
                                        <p:dataExporter type="pdf" target="FacturasTableData" fileName="Facturas-Mercurius-PDF" />
                                    </p:commandButton>
                                </div>
                        </div>
                        <ui:include src="../../Inventario/Upload/subirFacturas.xhtml"/>

                        <p:dataTable value="#{facturasController.filteredFacturasDetallados}" var="factura" widgetVar="FacturasTableData"
                                     paginator="true" rows="8" paginatorPosition="bottom" id="FacturasTableData"
                                     emptyMessage="No se encontraron registros de factura con la critería proporcionada"
                                     globalFilterFunction="#{facturasController.globalFilterFunction}"
                                     filterBy="#{facturasController.filterBy}" reflow="true" 
                                     selection="#{facturasController.selectedFactura}" rowKey="#{factura.id}">
                            <p:ajax event="rowSelect" update="buttonSync buttonSee buttonDelete"/>
                            <p:ajax event="toggleSelect" update="buttonSync buttonSee buttonDelete"/>
                            
                            <f:facet name="header">
                                <div class="field columns is-mobile">
                                    <p:inputText id="globalFilter" onkeyup="PF('FacturasTableData').filter()"
                                             placeholder="Búsqueda general de todos los campos" styleClass="input column"/>

                                    <ui:include src="../../Facturas/Recibos/verDetallesFactura.xhtml"/>
                                </div>
                            </f:facet>
                            
                            <p:column headerText="Código" visible="false" >
                                <h:outputText value="#{factura.id}"/>
                            </p:column>
                            <p:column headerText="Numero Consecutivo" >
                                <h:outputText value="#{factura.encabezado.numeroConsecutivo}"/>
                            </p:column>
                            <p:column headerText="Fecha" >
                                <h:outputText value="#{factura.encabezado.fechaEmision}"/>
                            </p:column>
                            <p:column headerText="Emisor: " >
                                <h:outputText value="#{factura.encabezado.emisor.nombre}"/>
                            </p:column>
                            <p:column headerText="Condicion Venta" >
                                <h:outputText value="#{factura.encabezado.condicionVenta}"/>
                            </p:column>
                            <p:column headerText="Plazo Credito" >
                                <h:outputText value="#{factura.encabezado.plazoCredito}"/>
                            </p:column>
                            <p:column headerText="Medio Pago" >
                                <h:outputText value="#{factura.encabezado.medioPago}"/>
                            </p:column>
                            
                             <p:column headerText="Acciones" width="25%" exportable="false">
                                 <div class="buttons">
                                     <p:commandButton id="buttonSync" styleClass="button is-success is-1 is-rounded is-mobile" disabled="#{factura.status}" process="@this"
                                                      icon="pi pi-sync" actionListener="#{facturasController.processSelectedFactura()}" update="FacturasTableData">
                                                     <f:setPropertyActionListener value="#{factura}" target="#{facturasController.selectedFactura}"/>
                                     </p:commandButton>
                                     
                                     <p:commandButton id="buttonAccept" styleClass="button is-info is-1 is-rounded is-mobile" process="@this"
                                                      icon="pi pi-check-circle" actionListener="#{facturasController.aceptarFacturaRecibida()}" update="FacturasTableData growl">
                                                     <f:setPropertyActionListener value="#{factura}" target="#{facturasController.selectedFactura}" />
                                                     <p:tooltip value="Aceptar (Mensaje Receptor)"/>
                                     </p:commandButton>
                                     
                                     <p:commandButton id="buttonReject" styleClass="button is-danger is-1 is-rounded is-mobile" process="@this"
                                                      icon="pi pi-times-circle" actionListener="#{facturasController.rechazarFacturaRecibida()}" update="FacturasTableData growl">
                                                     <f:setPropertyActionListener value="#{factura}" target="#{facturasController.selectedFactura}" />
                                                     <p:tooltip value="Rechazar (Mensaje Receptor)"/>
                                     </p:commandButton>
                                     
                                     <p:commandButton id="buttonSee" styleClass="button is-1 is-rounded is-mobile" process="@this" update="lineasDetalleTable"
                                                      icon="pi pi-eye" onclick="PF('selectedFacturaDetallado').show(); PF('selectedFacturaDetallado').toggleMaximize();" >
                                                     <f:setPropertyActionListener value="#{factura}" target="#{facturasController.selectedFactura}" />
                                     </p:commandButton>
                                     
                                     <p:commandButton id="buttonDelete" styleClass="button ui-button-warning rounded-button" icon="pi pi-trash"
                                                     actionListener="#{facturasController.deleteFactura()}" process="@this" update="dynamicContent facturaTable">
                                                     <f:setPropertyActionListener value="#{factura}" target="#{facturasController.selectedFactura}" />
                                     </p:commandButton>
                                 </div>
                             </p:column>
                        </p:dataTable>
                </div>
            </div>
        </div>
    </h:body>

</ui:composition>
