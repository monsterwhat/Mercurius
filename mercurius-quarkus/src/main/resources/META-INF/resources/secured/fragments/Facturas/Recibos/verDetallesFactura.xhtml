<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <p:dialog rendered="#{not empty facturasController.selectedFactura}" widgetVar="selectedFacturaDetallado" id="selectedFacturaDetallado" width="100%"
              fitViewport="true" responsive="true" maximizable="true" dynamic="true" cache="false" modal="true">

        <h:form>
            <p:outputPanel rendered="#{facturasController.selectedFactura.prevalidationErrors != null}" styleClass="notification is-warning is-light" style="margin-bottom: 1rem;">
                <p><strong><i class="pi pi-exclamation-triangle"></i> Advertencias de validación:</strong></p>
                <p style="white-space: pre-wrap; font-size: 0.9em;">#{facturasController.selectedFactura.prevalidationErrors}</p>
            </p:outputPanel>

            <p:card styleClass="has-text-centered" title="Resumen Factura">
                <p:dataTable var="Servicios" reflow="true" value="#{facturasController.selectedFactura.resumen}" >
                    <p:column styleClass="has-text-centered" headerText="Total Servicios Gravados">
                        <h:outputText value="#{resumen.totalServGravados}"/>
                    </p:column>
                    <p:column styleClass="has-text-centered" headerText="Total Servicios Exentos">
                        <h:outputText value="#{resumen.totalServExentos}"/>
                    </p:column>
                    <p:column styleClass="has-text-centered" headerText="Total Servicios Exonerados">
                        <h:outputText value="#{resumen.totalServExonerado}"/>
                    </p:column>
                </p:dataTable>
                <p:dataTable var="Mercancias" reflow="true" value="#{facturasController.selectedFactura.resumen}">
                    <p:column styleClass="has-text-centered" headerText="Total Mercancias Gravadas">
                        <h:outputText value="#{facturasController.selectedFactura.resumen.totalMercanciasGravadas}"/>
                    </p:column>
                    <p:column styleClass="has-text-centered" headerText="Total Mercancias Exentas">
                        <h:outputText value="#{facturasController.selectedFactura.resumen.totalMercanciasExentas}"/>
                    </p:column>
                    <p:column styleClass="has-text-centered" headerText="Total Mercancias Exoneradas">
                        <h:outputText value="#{facturasController.selectedFactura.resumen.totalMercExonerada}"/>
                    </p:column>
                </p:dataTable>
                <p:dataTable var="Resumen" reflow="true" value="#{facturasController.selectedFactura.resumen}">
                    <p:column styleClass="has-text-centered" headerText="Total Gravado">
                        <h:outputText value="#{facturasController.selectedFactura.resumen.totalGravado}"/>
                    </p:column>
                    <p:column styleClass="has-text-centered" headerText="Total Exento">
                        <h:outputText value="#{facturasController.selectedFactura.resumen.totalExento}"/>
                    </p:column>
                    <p:column styleClass="has-text-centered" headerText="Total Exonerado">
                        <h:outputText value="#{facturasController.selectedFactura.resumen.totalExonerado}"/>
                    </p:column>
                    <p:column styleClass="has-text-centered" headerText="Total Venta">
                        <h:outputText value="#{facturasController.selectedFactura.resumen.totalVenta}"/>
                    </p:column>
                    <p:column styleClass="has-text-centered" headerText="Total Descuentos">
                        <h:outputText value="#{facturasController.selectedFactura.resumen.totalDescuentos}"/>
                    </p:column>
                    <p:column styleClass="has-text-centered" headerText="Total Venta Neta">
                        <h:outputText value="#{facturasController.selectedFactura.resumen.totalVentaNeta}"/>
                    </p:column>
                    <p:column styleClass="has-text-centered" headerText="Total Impuesto">
                        <h:outputText value="#{facturasController.selectedFactura.resumen.totalImpuesto}"/>
                    </p:column>
                    <p:column styleClass="has-text-centered" headerText="Total IVA Devuelto">
                        <h:outputText value="#{facturasController.selectedFactura.resumen.totalIVADevuelto}"/>
                    </p:column>
                    <p:column styleClass="has-text-centered" headerText="Total Otros Cargos">
                        <h:outputText value="#{facturasController.selectedFactura.resumen.totalOtrosCargos}"/>
                    </p:column>
                    <p:column styleClass="has-text-centered" headerText="Total Comprobante">
                        <h:outputText value="#{facturasController.selectedFactura.resumen.totalComprobante}"/> 
                    </p:column>
                </p:dataTable>
            </p:card>
            
            <br/>
            
            <p:card styleClass="has-text-centered" title="Articulos">
                <p:dataTable value="#{facturasController.selectedFactura.detalles.lineasDetalle}" 
                             var="linea" id="lineasDetalleTable" reflow="true"
                     rendered="#{facturasController.selectedFactura != null and facturasController.selectedFactura.detalles != null}">
                    <p:autoUpdate/>

                    <p:column styleClass="has-text-centered" headerText="Nombre">
                        <h:outputText value="#{linea.detalle}"/>
                    </p:column>
                    <p:column styleClass="has-text-centered" headerText="Cantidad">
                        <h:outputText value="#{linea.cantidad}"/>
                    </p:column>
                    <p:column styleClass="has-text-centered" headerText="Unidad de Medida">
                        <h:outputText value="#{linea.unidadMedida}"/>
                    </p:column>
                    <p:column styleClass="has-text-centered" headerText="Unidad de Medida Comercial">
                        <h:outputText value="#{linea.unidadMedidaComercial}"/>
                    </p:column>
                    <p:column styleClass="has-text-centered" headerText="Precio Unitario">
                        <h:outputText value="#{linea.precioUnitario}"/>
                    </p:column>
                    <p:column styleClass="has-text-centered" headerText="Monto Total">
                        <h:outputText value="#{linea.montoTotal}"/>
                    </p:column>
                    <p:column styleClass="has-text-centered" headerText="Descuentos">
                        <p:dataTable value="#{linea.descuentos}" emptyMessage="N/A" var="descuento" reflow="true">
                            <p:column headerText="Monto">
                                <h:outputText value="#{descuento.montoDescuento}"/>
                            </p:column>
                        </p:dataTable>
                    </p:column>
                    <p:column styleClass="has-text-centered" headerText="Subtotal">
                        <h:outputText value="#{linea.subTotal}"/>
                    </p:column>
                    <p:column styleClass="has-text-centered" headerText="Impuesto">
                        <p:dataTable value="#{linea.impuestos}" emptyMessage="N/A" var="impuesto" reflow="true">
                            <p:column headerText="Monto">
                                <h:outputText value="#{impuesto.monto}"/>
                            </p:column>
                        </p:dataTable>
                    </p:column>
                    <p:column styleClass="has-text-centered" headerText="Monto total Linea">
                        <h:outputText value="#{linea.montoTotalLinea}"/>
                    </p:column>
                </p:dataTable>
            </p:card>
        </h:form>
    </p:dialog>
</ui:composition>
