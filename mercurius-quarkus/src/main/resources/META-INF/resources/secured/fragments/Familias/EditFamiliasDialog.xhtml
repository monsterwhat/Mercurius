<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
    
    <p:dialog header="Editar Familia" widgetVar="EditarFamiliaDialog" dynamic="true" cache="false" 
        fitViewport="true" responsive="true" id="EditarFamiliaDialog" modal="true">
        <p:outputPanel rendered="#{not empty FamiliasController.selectedFamilia}">
            <h:form id="editFamilia">
                <p:panelGrid columns="1">
                    <p:panel header="Editar Familia: #{FamiliasController.selectedFamilia.nombre}">
                        <p:growl id="growl" showDetail="true" showSummary="false"/>

                        <p:messages for="name" showSummary="false" showDetail="true" closable="true" />
                        <label class="label" for="name" style="color: var(--primary-color); text-align: center">Nombre:</label>
                        <p:inputText id="name" value="#{FamiliasController.selectedFamilia.nombre}" 
                            required="true" requiredMessage="El nombre no puede estar vacío" style="width: 100%"
                        />
                        <p:spacer height="1em"/>
                        <p:commandButton value="Actualizar datos" process="@form" styleClass="button is-primary is-rounded is-fullwidth"
                                         icon="pi pi-check"
                                         update="@form Categorias:familias" 
                                         action="#{FamiliasController.updateFamiliaDialog}"/>
                               
                    </p:panel>
                </p:panelGrid>
            </h:form>
        </p:outputPanel>
    </p:dialog>
</ui:composition>
