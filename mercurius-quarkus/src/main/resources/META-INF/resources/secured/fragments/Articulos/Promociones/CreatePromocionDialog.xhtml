<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <h:head>
        <style>
            .promocion-dialog {
                max-width: 90vw;
                width: 900px;
            }

            .promocion-header {
                background: linear-gradient(135deg, var(--bulma-success) 0%, var(--bulma-primary) 100%);
                color: white;
                padding: 1rem;
                border-radius: 0.5rem 0.5rem 0 0;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }

            .promocion-content {
                padding: 1.5rem;
                background: var(--bulma-white);
            }

            .field-section {
                margin-bottom: 1.5rem;
            }

            .field-section-title {
                font-weight: 600;
                color: var(--bulma-primary);
                margin-bottom: 1rem;
                display: flex;
                align-items: center;
                gap: 0.5rem;
            }

            .field-group {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 1rem;
                margin-bottom: 1rem;
            }

            .field-group-single {
                margin-bottom: 1rem;
            }

            .price-preview {
                background: var(--bulma-light);
                border-radius: 0.5rem;
                padding: 1rem;
                margin-top: 1rem;
                border-left: 4px solid var(--bulma-success);
            }

            .required-field:after {
                content: " *";
                color: var(--bulma-danger);
                font-weight: bold;
            }

            .action-buttons {
                display: flex;
                gap: 1rem;
                justify-content: center;
                margin-top: 2rem;
                padding-top: 1.5rem;
                border-top: 1px solid var(--bulma-light);
            }

            .total-section {
                background: linear-gradient(135deg, var(--bulma-success-light) 0%, var(--bulma-primary-light) 100%);
                border-radius: 0.5rem;
                padding: 1rem;
                text-align: center;
                margin: 1rem 0;
            }

            .total-label {
                font-size: 0.875rem;
                color: var(--bulma-text);
                margin-bottom: 0.25rem;
            }

            .total-value {
                font-size: 1.5rem;
                font-weight: 700;
                color: var(--bulma-success-dark);
            }

            @media (max-width: 768px) {
                .promocion-dialog {
                    max-width: 95vw;
                    width: 100%;
                }

                .field-group {
                    grid-template-columns: 1fr;
                }

                .action-buttons {
                    flex-direction: column;
                }
            }
        </style>
    </h:head>

    <!-- Dialog for Crear Promocion -->
    <p:dialog header="Crear Promoción" modal="true" fitViewport="true" dynamic="true"
              widgetVar="CrearPromocionDialog" cache="false" responsive="true"
              styleClass="promocion-dialog">

        <div class="promocion-header">
            <div>
                <h3 class="title is-5 has-text-white">Nueva Promoción</h3>
            </div>
        </div>

        <div class="promocion-content">
            <p:outputPanel id="CrearPromocionDialog" rendered="#{not empty PromocionesController.newPromocion}">
                <h:form id="createPromocion">
                    <p:growl showDetail="true" showSummary="true"/>

                    <!-- Nombre Section -->
                    <div class="field-section">
                        <h4 class="field-section-title">
                            <i class="pi pi-tag"></i>
                            Información de la Promoción
                        </h4>

                        <div class="field-group-single">
                            <label class="label required-field" for="newName">Nombre de la Promoción:</label>
                            <p:inputText id="newName" value="#{PromocionesController.newPromocion.nombre}"
                                         required="true" requiredMessage="El nombre no puede estar vacío"
                                         styleClass="input" style="width: 100%"
                                         placeholder="Ej: Promoción Semana Santa"/>
                        </div>
                    </div>

                    <!-- Artículos Section -->
                    <div class="field-section">
                        <h4 class="field-section-title">
                            <i class="pi pi-shopping-cart"></i>
                            Artículos en la Promoción
                        </h4>

                        <p:dataTable id="articuloTable" var="articulo" 
                                     rowKey="#{articulo.articulo.codigo}" 
                                     value="#{PromocionesController.lista}"  
                                     selectionMode="single" 
                                     selection="#{PromocionesController.selectedArticuloCarrito}" 
                                     emptyMessage="No hay artículos en la promoción"
                                     styleClass="articulos-table"
                                     reflow="true">

                            <p:column headerText="Código" visible="false">
                                <h:outputText value="#{articulo.articulo.codigo}"/>
                            </p:column> 
                            <p:column headerText="Artículo">
                                <h:outputText value="#{articulo.articulo.nombre}" style="font-weight: 500;"/>
                            </p:column>
                            <p:column headerText="Cantidad" style="width: 100px; text-align: center;">
                                <h:outputText value="#{articulo.cantidad}"/>
                            </p:column>
                            <p:column headerText="Precio Unitario" style="width: 120px; text-align: right;">
                                <h:outputText value="#{articulo.articulo.lastPrecio.precioFinal}">
                                    <f:convertNumber pattern="₡#,##0.00"/>
                                </h:outputText>
                            </p:column>
                            <p:column headerText="Subtotal" style="width: 120px; text-align: right;">
                                <h:outputText value="#{articulo.totalArticulo}" style="font-weight: 600; color: var(--bulma-primary);">
                                    <f:convertNumber pattern="₡#,##0.00"/>
                                </h:outputText>
                            </p:column>
                            <p:column style="width: 60px; text-align: center;"> 
                                <p:commandButton icon="pi pi-times" styleClass="ui-button-danger rounded-button" 
                                                 immediate="true"
                                                 process="@this"
                                                 update="articuloTable" 
                                                 actionListener="#{PromocionesController.removeSelectedItemFromPromociones}">
                                    <f:setPropertyActionListener value="#{articulo.articulo}" 
                                                                 target="#{PromocionesController.selectedArticulo}" />
                                </p:commandButton>  
                            </p:column>
                            <p:autoUpdate/>
                        </p:dataTable> 

                        <div class="mt-3">
                            <p:commandLink value="Agregar Producto" process="articuloSelect" 
                                           styleClass="button is-primary is-rounded"
                                           onclick="PF('ArticuloRevisionDialog').show();" />
                        </div>

                        <!-- Totales -->
                        <div class="total-section">
                            <div class="total-label">Total Sin IVA</div>
                            <div class="total-value">
                                <h:outputText value="#{PromocionesController.totalListaConUtilidad()}">
                                    <f:convertNumber pattern="₡#,##0.00"/>
                                </h:outputText>
                            </div>
                        </div>
                    </div>

                    <!-- Descuento Section -->
                    <div class="field-section">
                        <h4 class="field-section-title">
                            <i class="pi pi-percentage"></i>
                            Descuento
                        </h4>

                        <div class="field-group">
                            <div class="field">
                                <label class="label required-field" for="newDescuento">Porcentaje de Descuento (%):</label>
                                <p:inputText id="newDescuento" type="number" 
                                             value="#{PromocionesController.newPromocion.descuento}"
                                             required="true" 
                                             requiredMessage="El porcentaje de descuento no puede estar vacío"
                                             styleClass="input" style="width: 100%">
                                    <p:ajax event="change" update="total articuloTable"/>
                                </p:inputText>
                            </div>

                            <div class="field">
                                <label class="label required-field" for="newCodigoDescuento">Tipo de Descuento (Nota 20):</label>
                                <p:selectOneMenu id="newCodigoDescuento" 
                                                 value="#{PromocionesController.newPromocion.codigoDescuento}"
                                                 styleClass="input" style="width: 100%">
                                    <f:selectItem itemLabel="Seleccione un tipo" itemValue="" noSelectionOption="true"/>
                                    <f:selectItems value="#{PromocionesController.tiposDescuento}" 
                                                   var="tipo" 
                                                   itemLabel="#{tipo.codigo} - #{tipo.descripcion}" 
                                                   itemValue="#{tipo.codigo}"/>
                                </p:selectOneMenu>
                            </div>

                            <div class="field">
                                <label class="label" for="newCantidad">Cantidad Limitada:</label>
                                <p:inputText id="newCantidad" type="number" 
                                             value="#{PromocionesController.selectedPromocion.cantidad}"
                                             required="true" 
                                             requiredMessage="La cantidad no puede estar vacía"
                                             styleClass="input" style="width: 100%"
                                             placeholder="-1 para ilimitadas"/>
                                <p class="help">Ingrese -1 para cantidades ilimitadas</p>
                            </div>
                        </div>

                        <!-- Total con descuento -->
                        <div class="price-preview">
                            <div class="total-label">Total con Descuento e IVA</div>
                            <div class="total-value">
                                <h:outputText id="total" value="#{PromocionesController.createTotalDescuentoEIVAText()}"/>
                            </div>
                            <p:autoUpdate/>
                        </div>
                    </div>

                    <!-- Fechas Section -->
                    <div class="field-section">
                        <h4 class="field-section-title">
                            <i class="pi pi-calendar"></i>
                            Período de la Promoción
                        </h4>

                        <div class="field-group-single">
                            <label class="label" for="datePicker">Seleccionar Fechas:</label>
                            <p:datePicker id="datePicker" 
                                          value="#{PromocionesController.fechasPromocion}" 
                                          readonlyInput="true"
                                          selectionMode="range" 
                                          style="width: 100%"
                                          showIcon="true"
                                          placeholder="Seleccione rango de fechas"/>
                        </div>
                    </div>

                    <!-- Action Buttons -->
                    <div class="action-buttons">
                        <p:commandButton value="Crear Promoción" 
                                         update="@form Articulos:promociones" 
                                         process="@form"
                                         action="#{PromocionesController.createPromocionByDialog()}" 
                                         styleClass="button is-primary is-medium"
                                         icon="pi pi-check"/>
                        
                        <button type="button" class="button is-light is-medium" 
                                onclick="PF('CrearPromocionDialog').hide()">
                            <i class="pi pi-times"></i>
                            <span>Cancelar</span>
                        </button>
                    </div>

                </h:form>
            </p:outputPanel>
        </div>
    </p:dialog>

    <p:dialog header="Seleccionar Artículo" dynamic="true" widgetVar="ArticuloRevisionDialog" 
              fitViewport="true" modal="true" responsive="true" styleClass="promocion-dialog">
        <h:form id="articuloSelect">

            <p:card style="margin-bottom: 1rem;">
                <p:dataTable value="#{ArticulosController.filteredArticulosActivosYProcesados}" 
                             var="articulo" widgetVar="ArticuloTable"
                             paginator="true" rows="5" paginatorPosition="bottom" 
                             id="ArticuloTable" reflow="true"
                             emptyMessage="No se encontraron artículos" 
                             clientCache="true"
                             globalFilterFunction="#{ArticulosController.globalFilterFunction}" 
                             size="small"
                             filterBy="#{ArticulosController.filterBy}" 
                             showGridlines="true"
                             selection="#{PromocionesController.selectedArticulo}" 
                             rowKey="#{articulo.codigo}">

                    <f:facet name="header">
                        <p:inputText id="globalFilter" onkeyup="PF('ArticuloTable').filter()" 
                                     style="width: 100%" 
                                     placeholder="Buscar artículo..." />
                    </f:facet>

                    <p:column style="width: 3%" />
                    <p:column headerText="Nombre" sortBy="#{articulo.nombre}">
                        <h:outputText value="#{articulo.nombre}" />
                    </p:column>
                    <p:column headerText="Precio" style="width: 100px; text-align: right;">
                        <h:outputText value="#{articulo.lastPrecio.precioFinal}">
                            <f:convertNumber pattern="₡#,##0.00"/>
                        </h:outputText>
                    </p:column>

                </p:dataTable>
            </p:card>

            <p:card style="margin-bottom: 1rem;">
                <div class="field-group-single">
                    <label class="label" for="cantidadArticulo">Cantidad de Artículos:</label>
                    <p:inputNumber id="cantidadArticulo" style="width: 100%" 
                                   value="#{PromocionesController.cantidad}"
                                   minValue="1" decimalPlaces="0"/>
                </div>
            </p:card>

            <div class="action-buttons" style="border-top: none; padding-top: 0;">
                <p:commandButton value="Seleccionar" styleClass="button is-primary is-medium" 
                                 icon="pi pi-check"
                                 action="#{PromocionesController.articuloSelectedDialog()}" 
                                 process="articuloSelect" 
                                 update="articuloSelect :CrearPromocionDialog"/>
                
                <button type="button" class="button is-light is-medium" 
                        onclick="PF('ArticuloRevisionDialog').hide()">
                    <i class="pi pi-times"></i>
                    <span>Cancelar</span>
                </button>
            </div>
        </h:form>
    </p:dialog>

</ui:composition>
