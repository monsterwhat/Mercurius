<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <ui:include src="/secured/fragments/CaByS/CabysDialog.xhtml"/>  

    <!-- Dialog for Crear Articulo -->
    <p:dialog header="Crear Articulo" modal="true" dynamic="true" cache="false" 
              widgetVar="CrearArticuloDialog" fitViewport="true" responsive="true">                   
        <p:outputPanel id="CrearArticuloDialog" rendered="#{not empty ArticulosController.newArticulo}">
            <h:form>
                <section class="section">
                    <p class="title has-text-centered has-text-link">Crear Artículo:</p>

                    <p:growl showDetail="true" showSummary="false"/>

                    <div class="columns is-multiline">

                        <div class="column is-full">
                            <p:messages showDetail="true" for="newName" showSummary="false" closable="true" />
                            <label class="label has-text-link" for="newName">Nombre:</label>
                            <p:inputText id="newName" value="#{ArticulosController.newArticulo.nombre}"
                                         required="true" requiredMessage="El nombre no puede estar vacío"
                                         style="width: 100%"/>
                        </div> 

                        <div class="column is-full">
                            <p:messages showDetail="true" for="newCodigoBarra" showSummary="false" closable="true" />
                            <label class="label has-text-link" for="newCodigoBarra">Codigo de Barra:</label>
                            <p:inputText id="newCodigoBarra" value="#{ArticulosController.newArticulo.codigoBarra}"
                                         required="true" requiredMessage="El codigo de barra no puede estar vacío"
                                         style="width: 100%">
                            </p:inputText>
                        </div> 

                        <div class="column is-full">
                            <p:messages showDetail="true" for="newCodigoCabys" showSummary="false" closable="true" />
                            <label class="label has-text-link" for="newCodigoCabys">Código CABYS:</label>
                            <p:commandLink value="Seleccionar" id="selectCabysCreate" styleClass="button is-rounded is-link is-fullwidth"  
                                             onclick="PF('codigoCabysDialogCreate').show();">
                                <p:autoUpdate/>
                            </p:commandLink>
                            <p:spacer height="1em"/>
                            <p:card class="selected-option is-flex">
                                <p:outputLabel value="#{ArticulosController.newArticulo.codigoCabys.codigo} - #{ArticulosController.newArticulo.codigoCabys.descripcion} - #{ArticulosController.newArticulo.codigoCabys.impuesto} %"
                                               >
                                    <p:autoUpdate/>
                                </p:outputLabel>
                            </p:card>
                        </div> 
                        <div class="column is-full">
                            <p:messages showDetail="true" for="newUnidadMedida" showSummary="false" closable="true" />
                            <label class="label has-text-link" for="newUnidadMedida">Unidad de Medida:</label>
                            <p:selectOneMenu id="newUnidadMedida" value="#{ArticulosController.newArticulo.unidadMedida}"
                                             style="width: 100%">
                                <p:ajax listener="#{ArticulosController.createUnidadMedidaChanged}"/>
                                <f:selectItem itemLabel="Unid" itemValue="Unid"/>
                                <f:selectItem itemLabel="Otros" itemValue="Otros"/>
                                <f:selectItem itemLabel="g" itemValue="g"/>
                            </p:selectOneMenu>
                        </div> 
                        <div class="column is-full">
                            <p:messages showDetail="true" for="newUnidadMedidaComercial" showSummary="false" closable="true" />
                            <label class="label has-text-link" for="newUnidadMedidaComercial">Unidad de Medida Comercial:</label>
                            <p:selectOneMenu id="newUnidadMedidaComercial" value="#{ArticulosController.newArticulo.unidadMedidaComercial}"
                                             style="width: 100%">
                                <p:ajax listener="#{ArticulosController.createUnidadMedidaComercialChanged}"/>
                                <f:selectItem itemLabel="Botella" itemValue="BOT"/>
                                <f:selectItem itemLabel="Lata" itemValue="LT"/>
                                <f:selectItem itemLabel="SixPack" itemValue="ST"/>
                                <f:selectItem itemLabel="Pieza" itemValue="Pieza"/>
                                <f:selectItem itemLabel="Unidad" itemValue="Unid"/>
                                <f:selectItem itemLabel="Generico" itemValue=""/>
                            </p:selectOneMenu>
                        </div> 
                        <div class="column is-full">
                            <p:messages showDetail="true" for="newDepartamento" showSummary="false" closable="true" />
                            <label class="label has-text-link" for="newDepartamento">Departamento:</label>
                            <p:selectOneMenu id="newDepartamentoSelect" value="#{ArticulosController.departamentoID}"
                                             required="true" requiredMessage="El Departamento no puede estar vacío"
                                             widgetVar="newDepartamentoSelect" style="width: 100%">
                                <f:selectItem itemLabel="Seleccionar Departamento" itemValue="" />
                                <f:selectItems value="#{ArticulosController.departamentoOptions}" var="departamento"
                                               itemLabel="#{departamento.nombre}" itemValue="#{departamento.id}" />
                            </p:selectOneMenu>
                        </div> 
                        <div class="column is-full">
                            <p:messages showDetail="true" for="newFamilia" showSummary="false" closable="true" />
                            <label class="label has-text-link" for="newFamilia">Familia:</label>
                            <p:selectOneMenu id="newFamiliaSelect" value="#{ArticulosController.familiaID}"
                                             required="true" requiredMessage="La Familia no puede estar vacía"
                                             widgetVar="newFamiliaSelect" style="width: 100%">
                                <f:selectItem itemLabel="Seleccionar Familia" itemValue="" />
                                <f:selectItems value="#{ArticulosController.familiaOptions}" var="familia"
                                               itemLabel="#{familia.nombre}" itemValue="#{familia.id}" />
                            </p:selectOneMenu>
                        </div>


                        <div class="column is-full">
                            <p:messages showDetail="true" for="newPrecioCostoSinIVA" showSummary="false" closable="true" />
                            <label class="label has-text-link" for="newPrecioCostoSinIVA">Precio Costo sin IVA:</label>
                            <p:inputText id="newPrecioCostoSinIVA" type="number" value="#{ArticulosController.lastPrecioNew.precioCostoSinIVA}"
                                         required="true" requiredMessage="El Precio Costo sin IVA no puede estar vacío"
                                         style="width: 100%">
                                <p:ajax event="change" listener="#{ArticulosController.calcularPrecioConUtilidad(ArticulosController.lastPrecioNew)}"
                                        update="newPrecioCostoSinIVA newprecioConUtilidad newprecioFinal" process="@this"/>
                            </p:inputText>
                        </div> 
                        <div class="column is-full">
                            <p:messages showDetail="true" for="newPorcentajeUtilidad" showSummary="false" closable="true" />
                            <label class="label has-text-link" for="newPorcentajeUtilidad">Porcentaje de Utilidad:</label>
                            <p:inputText id="newPorcentajeUtilidad" type="number" value="#{ArticulosController.lastPrecioNew.porcentajeUtilidad}"
                                         required="true" requiredMessage="El Porcentaje de Utilidad no puede estar vacío"
                                         style="width: 100%">
                                <p:ajax event="change" listener="#{ArticulosController.calcularPrecioConUtilidad(ArticulosController.lastPrecioNew)}"
                                        update="newPrecioCostoSinIVA newprecioConUtilidad newprecioFinal"/>
                            </p:inputText>
                        </div> 
                        <div class="column is-full">
                            <p:messages showDetail="true" for="newprecioConUtilidad" showSummary="false" closable="true" />
                            <label class="label has-text-link" for="newprecioConUtilidad">Precio Final:</label>
                            <p:card>
                                <p:outputLabel id="newprecioConUtilidad" value="#{ArticulosController.lastPrecioNew.precioConUtilidad}"/>
                            </p:card>
                        </div> 
                        <div class="column is-full">
                            <p:messages showDetail="true" for="newprecioFinal" showSummary="false" closable="true"/>
                            <label class="label has-text-link" for="newprecioFinal" >Precio Final con IVA:</label>
                            <p:card>
                                <p:outputLabel id="newprecioFinal" value="#{ArticulosController.lastPrecioNew.precioFinal}">
                                    <p:autoUpdate/>
                                </p:outputLabel>
                            </p:card>
                        </div>

                        <div class="column is-full">
                            <p:commandLink value="Crear Artículo" update="@form Articulos:ArticulosActivos" process="@form"
                                             action="#{ArticulosController.createArticuloByDialog()}" style="width: 100%"
                                             styleClass="button is-rounded is-link is-fullwidth" />
                        </div>

                    </div> 
                </section> 
            </h:form>
        </p:outputPanel>
    </p:dialog>
</ui:composition>
