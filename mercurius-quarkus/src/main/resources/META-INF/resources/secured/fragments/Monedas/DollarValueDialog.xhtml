<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <h:body>
        <!-- Dialog for Tipo Cambio Dolares -->
        <p:dialog widgetVar="dollarValueDialog" id="dollarValueDialog"
                  fitViewport="true" blockScroll="true" responsive="true" dynamic="true" cache="false" 
                  modal="false" appendTo="@(body)"> 
            <section class="section">
                <div class="columns is-multiline has-text-centered">
                    <div class="column is-full">
                        <p class="title ">Tipo de Cambio USD</p>
                    </div>
                    <div class="column is-full">

                        <p:dataTable value="#{TipoCambioController.cambioActual}" id="dollarValueTable" 
                                     widgetVar="dollarValueTable" var="cambio" reflow="true">

                            <p:column styleClass="has-text-centered" headerText="Fecha">
                                <h:outputText value="#{cambio.fecha}"/>
                            </p:column>

                            <p:column styleClass="has-text-centered" headerText="Compra">
                                <h:outputText value="#{cambio.valorCompra}"/>
                            </p:column>

                            <p:column styleClass="has-text-centered" headerText="Venta">
                                <h:outputText value="#{cambio.valorVenta}"/>
                            </p:column>

                        </p:dataTable>

                        <br/>

                        <p:dataTable value="#{TipoCambioController.cambioActual}" id="dollarTable"
                                     widgetVar="dollarTable" var="cambio" reflow="true">

                            <p:column styleClass="has-text-centered" headerText="1$">
                                <h:outputText value="#{cambio.valorCompra}"/>
                            </p:column>

                            <p:column styleClass="has-text-centered" headerText="5$">
                                <h:outputText value="#{cambio.valorCompra*5}"/>
                            </p:column>

                            <p:column styleClass="has-text-centered" headerText="10$">
                                <h:outputText value="#{cambio.valorCompra*10}"/>
                            </p:column>

                            <p:column styleClass="has-text-centered" headerText="20$">
                                <h:outputText value="#{cambio.valorCompra*20}"/>
                            </p:column>    

                            <p:column styleClass="has-text-centered" headerText="50$">
                                <h:outputText value="#{cambio.valorCompra*50}"/>
                            </p:column>   

                        </p:dataTable> 
                    </div>

                    <div class="column is-full"> 
                        <div class="buttons"> 
                            <p:commandLink value="Recargar" class="button is-rounded is-warning is-fullwidth"  
                                           actionListener="#{TipoCambioController.recargar()}" update="dollarValueTable dollarTable"/>
                            
                            <p:commandLink value="Ok" class="button is-rounded is-primary is-fullwidth"  
                                           onsuccess="PF('dollarValueDialog').hide();" immediate="true"
                                           />
                        </div> 
                    </div>  
                </div> 
            </section> 
        </p:dialog>
    </h:body>

</ui:composition>
