<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <ui:include src="/secured/fragments/Inventario/PendientesRevision/ArticuloDialog.xhtml"/>  

    <h:head>
        <style>
            .revision-movimiento-dialog {
                max-width: 90vw;
                width: 800px;
            }

            .revision-movimiento-header {
                background: linear-gradient(135deg, var(--bulma-info) 0%, var(--bulma-primary) 100%);
                color: white;
                padding: 1rem;
                border-radius: 0.5rem 0.5rem 0 0;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }

            .revision-movimiento-content {
                padding: 1.5rem;
                background: var(--bulma-white);
            }

            .field-group {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 1rem;
                margin-bottom: 1rem;
            }

            .form-section {
                margin-bottom: 1.5rem;
            }

            .form-section-title {
                font-weight: 600;
                color: var(--bulma-primary);
                margin-bottom: 1rem;
                display: flex;
                align-items: center;
                gap: 0.5rem;
            }

            .required-field:after {
                content: " *";
                color: var(--bulma-danger);
                font-weight: bold;
            }

            .info-card {
                background: var(--bulma-light);
                border-radius: 0.5rem;
                padding: 1rem;
                border-left: 4px solid var(--bulma-primary);
            }

            @media (max-width: 768px) {
                .revision-movimiento-dialog {
                    max-width: 95vw;
                    width: 100%;
                }

                .field-group {
                    grid-template-columns: 1fr;
                }
            }
        </style>
    </h:head>

    <!-- Dialog for Revision de Movimiento -->
    <p:dialog header="Revision de Movimiento" widgetVar="RevisionMovimientoDialog"
              responsive="true" modal="true" dynamic="true" cache="false" fitViewport="true"
              styleClass="revision-movimiento-dialog">
        <p:outputPanel>
            <h:form id="RevisionMovimientoDialog">
                <p:outputPanel rendered="#{not empty InventarioController.selectedInventario}">
                    <div class="revision-movimiento-header">
                        <h4 class="title is-5 has-text-white">#{InventarioController.selectedInventario.articulo.nombre}</h4>
                    </div>

                    <div class="revision-movimiento-content">
                        <p:growl showDetail="true" showSummary="false"/>

                        <div class="form-section">
                            <h4 class="form-section-title">
                                <i class="pi pi-box"></i>
                                Información del Artículo
                            </h4>

                            <div class="field-group">
                                <div class="field">
                                    <label class="label">Artículo:</label>
                                    <div class="control">
                                        <p:inputText value="#{InventarioController.selectedInventario.articulo.nombre}" 
                                                     style="width: 100%" disabled="true" styleClass="input is-light"/>
                                    </div>
                                </div>

                                <div class="field">
                                    <label class="label" for="ArticuloSelectR">Artículo Seleccionado:</label>
                                    <p:messages showDetail="true" for="ArticuloSelectR" showSummary="false" closable="true" />
                                    <div class="control">
                                        <p:commandButton value="Seleccionar" styleClass="button is-primary is-fullwidth"
                                                        onclick="PF('ArticuloRevisionDialog').show();"/>
                                        <p:spacer height="0.5rem"/>
                                        <p:card styleClass="card" style="background: var(--bulma-light);">
                                            <p:outputLabel id="ArticuloSelectR" value="#{InventarioController.selectedInventario.articulo.nombre}">
                                                <p:autoUpdate/>
                                            </p:outputLabel>
                                        </p:card>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="form-section">
                            <h4 class="form-section-title">
                                <i class="pi pi-calculator"></i>
                                Cantidades
                            </h4>

                            <div class="field-group">
                                <div class="field">
                                    <label class="label" for="cantidadRecomendada">Cantidad Recomendada:</label>
                                    <p:messages for="cantidadRecomendada" showSummary="false" showDetail="true" closable="true" />
                                    <div class="control">
                                        <p:card styleClass="card" style="background: var(--bulma-info-light);">
                                            <p:outputLabel id="cantidadRecomendada" 
                                                           value="#{InventarioController.selectedInventario.unidadesRecomendadasFactura}"
                                                           styleClass="has-text-weight-bold has-text-info"/>
                                        </p:card>
                                    </div>
                                </div>


                            <div class="field-group">
                                <div class="field">
                                    <label class="label required-field" for="cantidad">Cantidad:</label>
                                    <p:messages for="cantidad" showSummary="false" showDetail="true" closable="true" />
                                    <div class="control">
                                        <p:inputText id="cantidad" value="#{InventarioController.selectedInventario.cantidad}"
                                            required="true" requiredMessage="La cantidad no puede estar vacía"
                                            style="width: 100%" styleClass="input"/>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="buttons is-centered mt-4">
                            <p:commandButton value="Actualizar datos" update="@form Inventarios:inventarioPendiente" process="@form"
                                             action="#{InventarioController.updateInventarioRevisionDialog()}"
                                             styleClass="button is-primary is-medium"
                                             icon="pi pi-check"/>
                        </div>
                    </div>
                    </div>
                </p:outputPanel>
                <p:outputPanel rendered="#{empty InventarioController.selectedInventario}">
                    <div class="has-text-centered p-4">
                        <p class="has-text-grey">No hay movimiento seleccionado</p>
                    </div>
                </p:outputPanel>
            </h:form>
        </p:outputPanel>
    </p:dialog>
    
</ui:composition>
