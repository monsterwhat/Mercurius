<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
    
    <p:dialog header="Crear Reporte Programado" widgetVar="CrearReporteDialog" dynamic="true" cache="false" 
        fitViewport="true" responsive="true" id="CrearReporteDialog" modal="true">
        <p:outputPanel rendered="#{not empty reportesProgramadosController.newReporte}">
            <h:form>
                <p:panel header="Crear una nuevo reporte programado" style="width: 100%;">
                    <p:growl showDetail="true" showSummary="false"/>
                    <p:panelGrid columns="1" style="width: 100%;">

                        <p:column>
                            <p:messages showDetail="true" for="name" showSummary="false" closable="true" />
                            <label class="label" for="name" style="color: var(--primary-color); text-align: left">Nombre:</label>
                            <p:inputText id="name" value="#{reportesProgramadosController.newReporte.perfil}" style="width: 100%"
                                        required="true" requiredMessage="El nombre no puede estar vacío"
                                    />
                        </p:column>
                        
                        <p:column>
                        <!-- TIPO (STRING LIST) -->
                        <p:messages showDetail="true" for="tipo" showSummary="false" closable="true" />
                        <h:outputLabel for="tipo" value="Frecuencia: " style="color: var(--primary-color); text-align: left"/>
                        <p:selectManyCheckbox id="tipo" value="#{reportesProgramadosController.newReporte.frecuencia}" style="width: 100%"
                                              layout="pageDirection">
                            <f:selectItem itemLabel="Diario" itemValue="Diario" />
                            <f:selectItem itemLabel="Semanal" itemValue="Semanal" />
                            <f:selectItem itemLabel="Quincenal" itemValue="Quincenal" />
                            <f:selectItem itemLabel="Mensual" itemValue="Mensual" />
                        </p:selectManyCheckbox>
                        </p:column>

                        <p:column>
                        <!-- Reportes (String list) -->
                        <p:messages showDetail="true" for="reportes" showSummary="false" closable="true" />
                        <h:outputLabel for="reportes" value="Reportes:" style="color: var(--primary-color); text-align: left"/>
                        <p:selectManyCheckbox id="reportes" value="#{reportesProgramadosController.newReporte.reportes}" layout="pageDirection">
                            <f:selectItem itemLabel="Movimientos" itemValue="MOVIMIENTOS" />
                            <f:selectItem itemLabel="Facturacion" itemValue="FACTURACION" />
                            <f:selectItem itemLabel="Articulos" itemValue="ARTICULOS" />
                            <f:selectItem itemLabel="Departamentos" itemValue="DEPARTAMENTOS" />
                            <f:selectItem itemLabel="Familias" itemValue="FAMILIAS" />
                            <f:selectItem itemLabel="Inventarios" itemValue="INVENTARIOS" />
                        </p:selectManyCheckbox>
                        </p:column>
                        
                        <p:column>
                        <!--Correos (String list)-->
                        <p:messages showDetail="true" for="correos" showSummary="false" closable="true" />
                        <h:outputLabel for="emails" value="Correos:" style="color: var(--primary-color); text-align: center"/>
                        <p:chips id="emails" value="#{reportesProgramadosController.newReporte.correos}" style="width: 100%" />
                        </p:column>

                        <p:commandButton value="Crear Reporte Programado" process="@form" styleClass="rounded-button ui-button-primary"
                                        update="@form Reportes" style="width: 100%"
                                        action="#{reportesProgramadosController.createReporteDialog}"/>
                    </p:panelGrid>
                </p:panel>
            </h:form>
        </p:outputPanel> 
    </p:dialog>
</ui:composition>
