<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
    <p:dialog widgetVar="CrearClienteDialog" dynamic="true" cache="false" 
              fitViewport="true" responsive="true" id="CrearClienteDialog" modal="true">
        <section class="section">
            <div class="columns is-multiline is-centered is-vcentered">
                <div class="column is-full">
                    <p class="title is-5 has-text-centered">
                        Crear un nuevo cliente
                    </p> 
                </div>
                <div class="column is-full">
                    <p:outputPanel rendered="#{not empty ClientsController.newClient}">
                        <h:form id="createClients">  
                            <p:growl showDetail="true" showSummary="false"/>

                            <div class="columns is-multiline is-centered is-vcentered">
                                <div class="column is-full">
                                    <p:messages showDetail="true" for="name" showSummary="false" closable="true" />

                                    <div class="columns">
                                        <div class="column is-narrow">
                                            <p class="title is-5 has-text-centered">
                                                Nombre:
                                            </p>
                                        </div>
                                        <div class="column">
                                            <div class="field">
                                                <p:inputText id="name" value="#{ClientsController.newClient.name}"
                                                             required="true" requiredMessage="El nombre no puede estar vacío"
                                                             style="width: 100%"/>
                                            </div>
                                        </div>
                                    </div> 
                                </div>
                                <div class="column is-full">
                                    <p:messages showDetail="true" for="address" showSummary="false" closable="true" />

                                    <div class="columns">
                                        <div class="column is-narrow">
                                            <p class="title is-5 has-text-centered">
                                                Dirección:
                                            </p>
                                        </div>
                                        <div class="column">
                                            <div class="field">
                                                <p:inputText id="address" value="#{ClientsController.newClient.address}"
                                                             required="true" requiredMessage="La dirección no puede estar vacía"
                                                             style="width: 100%"/>
                                            </div>
                                        </div>
                                    </div> 
                                </div>
                                <div class="column is-full">
                                    <p:messages showDetail="true" for="email" showSummary="false" closable="true" />
                                    <div class="columns">
                                        <div class="column is-narrow">
                                            <p class="title is-5 has-text-centered">
                                                Correo:
                                            </p>
                                        </div>
                                        <div class="column">
                                            <div class="field">
                                                <p:inputText id="email" value="#{ClientsController.newClient.email}"
                                                             required="true" requiredMessage="El correo no puede estar vacío"
                                                             style="width: 100%"/>
                                            </div>
                                        </div>
                                    </div> 
                                </div>  
                                <div class="column is-full">
                                    <p:messages showDetail="true" for="birthDate" showSummary="false" closable="true" />
                                    <div class="columns">
                                        <div class="column is-narrow">
                                            <p class="title is-5 has-text-centered">
                                                Fecha de Nacimiento:
                                            </p>
                                        </div>
                                        <div class="column">
                                            <div class="field">
                                                <p:calendar id="birthDate" value="#{ClientsController.newClient.birthDate}"
                                                            pattern="MM/dd/yyyy" required="true" requiredMessage="La fecha de nacimiento no puede estar vacía"
                                                            style="width: 100%"/>
                                            </div>
                                        </div>
                                    </div> 
                                </div>
                                <div class="column is-full">
                                    <p:messages showDetail="true" for="idType" showSummary="false" closable="true" />
                                    <div class="columns">
                                        <div class="column is-narrow">
                                            <p class="title is-5 has-text-centered">
                                                Tipo de Cédula:
                                            </p>
                                        </div>
                                        <div class="column">
                                            <div class="field">
                                                <p:inputText id="idType" value="#{ClientsController.newClient.idType}"
                                                             required="true" requiredMessage="El tipo de cédula no puede estar vacío"
                                                             style="width: 100%"/>
                                            </div>
                                        </div>
                                    </div> 
                                </div>
                                <div class="column is-full">
                                    <p:messages showDetail="true" for="idNumber" showSummary="false" closable="true" />
                                    <div class="columns">
                                        <div class="column is-narrow">
                                            <p class="title is-5 has-text-centered">
                                                Número de Cédula:
                                            </p>
                                        </div>
                                        <div class="column">
                                            <div class="field">
                                                <p:inputText id="idNumber" value="#{ClientsController.newClient.idNumber}"
                                                             required="true" requiredMessage="El número de cédula no puede estar vacío"
                                                             style="width: 100%"/>
                                            </div>
                                        </div>
                                    </div> 
                                </div>
                                <div class="column is-full">
                                    <p:messages showDetail="true" for="discount" showSummary="false" closable="true" />
                                    <div class="columns">
                                        <div class="column is-narrow">
                                            <p class="title is-5 has-text-centered">
                                                Descuento:
                                            </p>
                                        </div>
                                        <div class="column">
                                            <div class="field">
                                                <p:inputText id="discount" value="#{ClientsController.newClient.discount}"
                                                             required="true" requiredMessage="El descuento no puede estar vacío (debería ser 0)"
                                                             style="width: 100%"/>
                                            </div>
                                        </div>
                                    </div> 
                                </div>
                                <div class="column is-full">
                                    <p:messages showDetail="true" for="phoneNumber" showSummary="false" closable="true" />
                                    <div class="columns">
                                        <div class="column is-narrow">
                                            <p class="title is-5 has-text-centered">
                                                Número de Teléfono:
                                            </p>
                                        </div>
                                        <div class="column">
                                            <div class="field">
                                                <p:inputText id="phoneNumber" value="#{ClientsController.newClient.phoneNumber}"
                                                             required="true" requiredMessage="El número de teléfono no puede estar vacío"
                                                             style="width: 100%" />
                                            </div>
                                        </div>
                                    </div> 
                                </div>
                                <div class="column is-full">
                                    <p:messages showDetail="true" for="taxpayer" showSummary="false" closable="true" />
                                    <div class="columns">
                                        <div class="column is-narrow">
                                            <p class="title is-5 has-text-centered">
                                                Tributa:
                                            </p>
                                        </div>
                                        <div class="column">
                                            <div class="field">
                                                <p:selectBooleanCheckbox id="taxpayer" value="#{ClientsController.newClient.taxpayer}"
                                                                         />
                                            </div>
                                        </div>
                                    </div> 
                                </div>
                                <div class="column is-full">
                                    <p:messages showDetail="true" for="zoneCode" showSummary="false" closable="true" />
                                    <div class="columns">
                                        <div class="column is-narrow">
                                            <p class="title is-5 has-text-centered">
                                                Código de Zona:
                                            </p>
                                        </div>
                                        <div class="column">
                                            <div class="field">
                                                <p:inputText id="zoneCode" value="#{ClientsController.newClient.zoneCode}"
                                                             required="true" requiredMessage="El código de zona no puede estar vacío"
                                                             style="width: 100%"/>
                                            </div>
                                        </div>
                                    </div> 
                                </div>
                                <div class="column is-full">
                                    <p:messages showDetail="true" for="codigoActividad" showSummary="false" closable="true" />
                                    <div class="columns">
                                        <div class="column is-narrow">
                                            <p class="title is-5 has-text-centered">
                                                Código de Actividad Comercial:
                                            </p>
                                        </div>
                                        <div class="column">
                                            <div class="field">
                                                <p:inputText id="codigoActividad" value="#{ClientsController.newClient.codigoActividadComercial}"
                                                             required="true" requiredMessage="El código de actividad comercial no puede estar vacío"
                                                             style="width: 100%"/>
                                            </div>
                                        </div>
                                    </div> 
                                </div>
                                <div class="column is-full">
                                    <div class="buttons">
                                        <p:commandLink process="@form" update="@form clientesForm"
                                                       action="#{ClientsController.createClient}" 
                                                       class="button is-primary is-rounded is-fullwidth" >
                                            Crear Cliente
                                        </p:commandLink>
                                    </div> 
                                </div>
                            </div> 
                        </h:form>
                    </p:outputPanel>    
                </div>
            </div>
        </section> 
    </p:dialog>
</ui:composition>
