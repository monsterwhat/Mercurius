<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
    <p:dialog header="Crear Departamento" widgetVar="CrearDepartamentoDialog" dynamic="true" cache="false" 
        fitViewport="true" responsive="true" id="CrearDepartamentoDialog" modal="true">
        <p:outputPanel rendered="#{not empty DepartamentosController.newDepartamento}">
            <h:form>
                <p:panelGrid columns="1">
                    <p:panel header="Crear un nuevo departamento">
                        <p:growl id="growl" showDetail="true" showSummary="false">
                            <p:autoUpdate/>
                        </p:growl>
                            <p:column>
                                <p:messages showDetail="true" for="name" showSummary="false" closable="true" >
                                    <p:autoUpdate/>
                                </p:messages>
                                <label class="label" for="name" style="color: var(--primary-color); text-align: center">Nombre:</label>
                                <p:inputText id="name" value="#{DepartamentosController.newDepartamento.nombre}"
                                    required="true" requiredMessage="El nombre no puede estar vacío"
                                    style="width: 100%"/>
                            </p:column>
                            <p:column>
                                <label class="label" for="contactoNombre" style="color: var(--primary-color); text-align: center">Nombre Contacto:</label>
                                <p:inputText id="contactoNombre" value="#{DepartamentosController.newDepartamento.contactoNombre}" style="width: 100%"/>
                            </p:column>
                            <p:column>
                                <label class="label" for="contactoTelefono" style="color: var(--primary-color); text-align: center">Telefono Contacto:</label>
                                <p:inputText id="contactoTelefono" value="#{DepartamentosController.newDepartamento.contactoTelefono}" style="width: 100%"/>
                            </p:column>
                            <p:column>
                                <label class="label" for="contactoEmail" style="color: var(--primary-color); text-align: center">Email Contacto:</label>
                                <p:inputText id="contactoEmail" value="#{DepartamentosController.newDepartamento.contactoEmail}" style="width: 100%"/>
                            </p:column>
                            <p:column>
                                <label class="label" for="plazoPagoDias" style="color: var(--primary-color); text-align: center">Plazo Pago (dias):</label>
                                <p:inputNumber id="plazoPagoDias" value="#{DepartamentosController.newDepartamento.plazoPagoDias}" min="0" style="width: 100%"/>
                            </p:column>
                            <p:column>
                                <label class="label" for="tiempoEntregaDias" style="color: var(--primary-color); text-align: center">Tiempo Entrega (dias):</label>
                                <p:inputNumber id="tiempoEntregaDias" value="#{DepartamentosController.newDepartamento.tiempoEntregaDias}" min="0" style="width: 100%"/>
                            </p:column>
                            <p:column>
                                <label class="label" for="notas" style="color: var(--primary-color); text-align: center">Notas:</label>
                                <p:inputTextarea id="notas" value="#{DepartamentosController.newDepartamento.notas}" rows="3" style="width: 100%"/>
                            </p:column>
                            <p:spacer height="1em"/>
                            <p:column>
                                <p:commandButton value="Crear Departamento" process="@form" update="@form Categorias:departamentos"
                                                 action="#{DepartamentosController.createDepartamento}"
                                                 styleClass="button is-primary is-rounded is-fullwidth"
                                                 icon="pi pi-check"/>
                            </p:column>
                    </p:panel>
                </p:panelGrid>
            </h:form>
        </p:outputPanel>
    </p:dialog>
</ui:composition>
