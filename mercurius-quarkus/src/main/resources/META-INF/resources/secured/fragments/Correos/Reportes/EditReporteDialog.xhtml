<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
    
    <p:dialog header="Editar Reporte Programado" widgetVar="EditarReporteDialog" dynamic="true" cache="false" 
              fitViewport="true" responsive="true" id="EditarReporteDialog" modal="true">
        <p:outputPanel rendered="#{not empty reportesProgramadosController.selectedReporte}">
            <h:form id="editReporte">
                <p:panel header="Editar Reporte: #{reportesProgramadosController.selectedReporte.perfil}" style="width: 100%;">
                    <p:growl showDetail="true" showSummary="false"/>
                    <p:panelGrid columns="1" style="width: 100%;">

                        <p:column>
                            <p:messages showDetail="true" for="edit-name" showSummary="false" closable="true" />
                            <h:outputLabel for="edit-name" value="Nombre:" style="color: var(--primary-color); text-align: left"/>
                            <p:inputText id="edit-name" value="#{reportesProgramadosController.selectedReporte.perfil}" style="width: 100%"
                                         required="true" requiredMessage="El nombre no puede estar vacío"/>
                            <p:message for="edit-name"/>
                        </p:column>

                        <p:column>
                            <!-- TIPO (STRING LIST) -->
                            <p:messages showDetail="true" for="edit-tipo" showSummary="false" closable="true" />
                            <h:outputLabel for="edit-tipo" value="Frecuencia:" style="color: var(--primary-color); text-align: left"/>
                            <p:selectManyCheckbox id="edit-tipo" value="#{reportesProgramadosController.selectedReporte.frecuencia}" style="width: 100%"
                                                  layout="pageDirection">
                                <f:selectItem itemLabel="Diario" itemValue="Diario" />
                                <f:selectItem itemLabel="Semanal" itemValue="Semanal" />
                                <f:selectItem itemLabel="Quincenal" itemValue="Quincenal" />
                                <f:selectItem itemLabel="Mensual" itemValue="Mensual" />
                            </p:selectManyCheckbox>
                            <p:message for="edit-tipo"/>
                        </p:column>

                        <p:column>
                            <!-- Reportes (String list) -->
                            <p:messages showDetail="true" for="edit-reportes" showSummary="false" closable="true" />
                            <h:outputLabel for="edit-reportes" value="Reportes:" style="color: var(--primary-color); text-align: left"/>
                            <p:selectManyCheckbox id="edit-reportes" value="#{reportesProgramadosController.selectedReporte.reportes}" layout="pageDirection">
                                <f:selectItem itemLabel="Movimientos" itemValue="MOVIMIENTOS" />
                                <f:selectItem itemLabel="Facturacion" itemValue="FACTURACION" />
                                <f:selectItem itemLabel="Articulos" itemValue="ARTICULOS" />
                                <f:selectItem itemLabel="Departamentos" itemValue="DEPARTAMENTOS" />
                                <f:selectItem itemLabel="Familias" itemValue="FAMILIAS" />
                                <f:selectItem itemLabel="Inventarios" itemValue="INVENTARIOS" />
                            </p:selectManyCheckbox>
                            <p:message for="edit-reportes"/>
                        </p:column>

                        <p:column>
                            <!-- Correos (String list) -->
                            <p:messages showDetail="true" for="edit-correos" showSummary="false" closable="true" />
                            <h:outputLabel for="edit-correos" value="Correos:" style="color: var(--primary-color); text-align: left"/>
                            <p:chips id="edit-correos" value="#{reportesProgramadosController.selectedReporte.correos}" style="width: 100%" />
                            <p:message for="edit-correos"/>
                        </p:column>

                        <p:commandButton value="Actualizar Reporte" process="@form" styleClass="rounded-button ui-button-primary"
                                         update="@form Reportes" style="width: 100%"
                                         action="#{reportesProgramadosController.updateReporte}"/>
                    </p:panelGrid>
                </p:panel>
            </h:form>
        </p:outputPanel> 
    </p:dialog>
</ui:composition>
