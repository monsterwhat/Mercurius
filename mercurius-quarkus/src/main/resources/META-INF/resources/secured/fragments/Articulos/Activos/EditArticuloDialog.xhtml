<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <ui:include src="/secured/fragments/CaByS/CabysDialogEdit.xhtml"/>      
    <!-- Dialog for Edit Articulo -->
    <p:dialog header="Editar Artículo: #{ArticulosController.selectedArticulo.nombre}" dynamic="true" cache="false" 
              widgetVar="EditArticuloDialog" fitViewport="true" responsive="true" modal="true">
        <p:outputPanel id="EditArticuloDialog" rendered="#{not empty ArticulosController.selectedArticulo}">
            <h:form>
                <p:tabView dynamic="true" cache="false" style="width: 100%">
                    <p:tab title="Información">
                        <section class="section">
                            <p:growl showDetail="true" showSummary="false"/>
                            
                            <div class="columns is-multiline">
 
                                <div class="column is-full">
                                    <p:messages for="editName" showSummary="false" showDetail="true" closable="true" />
                                    <label class="label has-text-link" for="editName">Nombre:</label>
                                    <p:inputText id="editName" value="#{ArticulosController.selectedArticulo.nombre}"
                                                 required="true" requiredMessage="El nombre no puede estar vacío"
                                                 style="width: 100%"/>
                                </div>
                                 
                                <div class="column is-full">
                                    <p:messages showDetail="true" for="editCodigoBarra" showSummary="false" closable="true" />
                                    <label class="label has-text-link" for="editCodigoBarra">Codigo de Barra:</label>
                                    <p:inputText id="editCodigoBarra" value="#{ArticulosController.selectedArticulo.codigoBarra}"
                                                 required="true" requiredMessage="El codigo de barra no puede estar vacío"
                                                 style="width: 100%">
                                    </p:inputText>
                                </div>

                                <div class="column is-full">
                                    <p:messages showDetail="true" for="editDescripcion" showSummary="false" closable="true" />
                                    <label class="label has-text-link" for="editDescripcion">Descripción:</label>
                                    <p:inputTextarea id="editDescripcion" value="#{ArticulosController.selectedArticulo.descripcion}"
                                                     style="width: 100%" rows="3" maxlength="500"
                                                     placeholder="Descripción del artículo (opcional)"/>
                                </div>

                                <div class="column is-full">
                                    <p:messages showDetail="true" for="editRecomendacionCabys" showSummary="false" closable="true" />
                                    <label class="label has-text-link" for="editRecomendacionCabys">Recomendacion Cabys:</label>
                                    <p:card>
                                        <p:outputLabel id="editRecomendacionCabys" value="#{ArticulosController.selectedArticulo.recomendacionCabys}"/>
                                    </p:card>    

                                </div>
                                
                                <div class="column is-full">
                                    <p:messages showDetail="true" for="editCodigoCabys" showSummary="false" closable="true" />
                                    <label class="label has-text-link" for="editCodigoCabys">Código CABYS:</label>
                                    <p:commandLink value="Seleccionar" id="selectCabysEdit" styleClass="button is-primary is-rounded"
                                                     immediate="true" process="@this"
                                                     onclick="PF('codigoCabysDialogEdit').show();">
                                        <i class="pi pi-search"></i>
                                        <span>Seleccionar</span>
                                    </p:commandLink>
                                    <p:spacer height="1em"/>
                                    <p:card class="selected-option is-flex">
                                        <p:outputLabel id="codigoCabys" value="#{ArticulosController.selectedArticulo.codigoCabys.codigo} - #{ArticulosController.selectedArticulo.codigoCabys.descripcion} - #{ArticulosController.selectedArticulo.codigoCabys.impuesto} %"
                                                       styleClass="label">
                                        </p:outputLabel>
                                    </p:card>
                                </div>
                                
                                <div class="column is-full">
                                    <p:messages showDetail="true" for="editUnidadMedida" showSummary="false" closable="true" />
                                    <label class="label has-text-link" for="editUnidadMedida">Unidad de Medida:</label>
                                    <p:selectOneMenu id="editUnidadMedida" value="#{ArticulosController.selectedArticulo.unidadMedida}"
                                                     style="width: 100%">
                                        <p:ajax listener="#{ArticulosController.selectedUnidadMedidaChanged}"/>
                                        <f:selectItem itemLabel="Unid" itemValue="Unid"/>
                                        <f:selectItem itemLabel="Otros" itemValue="Otros"/>
                                        <f:selectItem itemLabel="g" itemValue="g"/>
                                    </p:selectOneMenu>
                                </div>
                                
                                <div class="column is-full">
                                    <p:messages showDetail="true" for="editUnidadMedidaComercial" showSummary="false" closable="true" />
                                    <label class="label has-text-link" for="editUnidadMedidaComercial">Unidad de Medida Comercial:</label>
                                    <p:selectOneMenu id="editUnidadMedidaComercial" value="#{ArticulosController.selectedArticulo.unidadMedidaComercial}"
                                                     style="width: 100%">
                                        <p:ajax listener="#{ArticulosController.selectedUnidadMedidaComercialChanged}"/>
                                        <f:selectItem itemLabel="Generico" itemValue=""/>
                                        <f:selectItem itemLabel="Unidad" itemValue="Unid"/>
                                        <f:selectItem itemLabel="Botella" itemValue="BOT"/>
                                        <f:selectItem itemLabel="Lata" itemValue="LT"/>
                                        <f:selectItem itemLabel="SixPack" itemValue="ST"/>
                                        <f:selectItem itemLabel="Pieza" itemValue="Pieza"/>
                                    </p:selectOneMenu>
                                </div>
                                
                                <div class="column is-full">
                                    <p:messages showDetail="true" for="editDepartamento" showSummary="false" closable="true" />
                                    <label class="label has-text-link" for="editDepartamento">Departamento:</label>
                                    <p:selectOneMenu id="editDepartamentoSelect" value="#{ArticulosController.departamentoID}"
                                                     required="true" requiredMessage="El Departamento no puede estar vacío"
                                                     styleClass="input" widgetVar="editDepartamentoSelect" 
                                                     style="width: 100%">
                                        <f:selectItem itemLabel="#{ArticulosController.selectedArticulo.departamento.nombre}" itemValue="#{ArticulosController.selectedArticulo.departamento.id}" />
                                        <f:selectItems value="#{ArticulosController.departamentoOptions}" var="departamento"
                                                       itemLabel="#{departamento.nombre}" itemValue="#{departamento.id}" />
                                    </p:selectOneMenu>
                                </div>
                                
                                <div class="column is-full">
                                    <p:messages showDetail="true" for="editFamilia" showSummary="false" closable="true" />
                                    <label class="label has-text-link" for="editFamilia">Familia:</label>
                                    <div style="display: flex; gap: 0.5rem; align-items: flex-end;">
                                        <p:selectOneMenu id="editFamiliaSelect" value="#{ArticulosController.familiaID}"
                                                         required="true" requiredMessage="La Familia no puede estar vacía"
                                                         widgetVar="editFamiliaSelect" 
                                                         style="flex: 1;">
                                            <f:selectItem itemLabel="Seleccionar Familia" itemValue="" />
                                            <f:selectItems value="#{ArticulosController.familiaOptions}" var="familia"
                                                           itemLabel="#{familia.nombre}" itemValue="#{familia.id}" />
                                        </p:selectOneMenu>
                                        <p:commandButton icon="pi pi-plus" 
                                                         styleClass="button is-primary is-rounded"
                                                         onclick="PF('CrearFamiliaFromEditDialog').show();"
                                                         process="@this"/>
                                    </div>
                                </div>
                                
                                <div class="column is-full">
                                    <p:messages showDetail="true" for="precioCostoSinIVA" showSummary="false" closable="true" />
                                    <label class="label has-text-link" for="precioCostoSinIVA">Precio Costo sin IVA:</label>
                                    <p:inputText id="precioCostoSinIVA" type="number" value="#{ArticulosController.lastPrecio.precioCostoSinIVA}"
                                                 required="true" requiredMessage="El Precio Costo sin IVA no puede estar vacío"
                                                 style="width: 100%">
                                        <p:ajax event="change" listener="#{ArticulosController.calcularPrecioConUtilidadEdit(ArticulosController.lastPrecio)}"
                                                update="precioCostoSinIVA precioConUtilidad precioFinal" process="@this"/>
                                    </p:inputText>
                                </div>
                                
                                <div class="column is-full">
                                    <p:messages showDetail="true" for="porcentajeUtilidad" showSummary="false" closable="true" />
                                    <label class="label has-text-link" for="porcentajeUtilidad">Porcentaje de Utilidad:</label>
                                    <p:inputText id="porcentajeUtilidad" type="number" value="#{ArticulosController.lastPrecio.porcentajeUtilidad}"
                                                 required="true" requiredMessage="El Porcentaje de Utilidad no puede estar vacío"
                                                 style="width: 100%">
                                        <p:ajax event="change" listener="#{ArticulosController.calcularPrecioConUtilidadEdit(ArticulosController.lastPrecio)}"
                                                update="precioCostoSinIVA precioConUtilidad precioFinal"/>
                                    </p:inputText>
                                </div>
                                
                                <div class="column is-full">
                                    <p:messages showDetail="true" for="precioConUtilidad" showSummary="false" closable="true" />
                                    <label class="label has-text-link" for="precioConUtilidad">Precio Final:</label>
                                    <p:card>
                                        <p:outputLabel id="precioConUtilidad" value="#{ArticulosController.lastPrecio.precioConUtilidad}"/>
                                    </p:card>
                                </div>
                                
                                <div class="column is-full">
                                    <p:messages showDetail="true" for="precioFinal" showSummary="false" closable="true"/>
                                    <label class="label has-text-link" for="precioFinal">Precio Final con IVA:</label>
                                    <p:card>
                                        <p:outputLabel id="precioFinal" value="#{ArticulosController.lastPrecio.precioFinal}">
                                            <p:autoUpdate/>
                                        </p:outputLabel>
                                    </p:card>
                                </div> 
                                
                                <!-- Stock Alert Configuration Section -->
                                <div class="column is-full">
                                    <hr/>
                                    <div class="field-row" style="display: flex; align-items: center; gap: 1rem;">
                                        <p:selectBooleanCheckbox id="editShowStockAlertConfig" 
                                                                 value="#{ArticulosController.showStockAlertConfig}">
                                            <p:ajax update="editStockAlertSection" process="@this"/>
                                        </p:selectBooleanCheckbox>
                                        <label class="label has-text-link" for="editShowStockAlertConfig" style="margin-bottom: 0;">Configuración de Alertas de Stock</label>
                                    </div>
                                </div>

                                <p:outputPanel id="editStockAlertSection" styleClass="#{ArticulosController.showStockAlertConfig ? '' : 'is-hidden'}">
                                    <div class="column is-full">
                                        <p:messages showDetail="true" for="editStockOptimo" showSummary="false" closable="true" />
                                        <label class="label has-text-link" for="editStockOptimo">Stock Óptimo:</label>
                                        <p:inputText id="editStockOptimo" type="number" 
                                                     value="#{ArticulosController.selectedArticulo.stockOptimo}"
                                                     style="width: 100%"
                                                     placeholder="Nivel de stock óptimo calculado automáticamente"/>
                                        <p:tooltip for="editStockOptimo" value="Nivel de stock ideal para este artículo. Se calcula automáticamente basado en velocidad de ventas." position="top"/>
                                    </div>

                                    <div class="column is-full">
                                        <p:messages showDetail="true" for="editDiasStockSeguridad" showSummary="false" closable="true" />
                                        <label class="label has-text-link" for="editDiasStockSeguridad">Días de Stock Seguridad:</label>
                                        <p:inputText id="editDiasStockSeguridad" type="number" 
                                                     value="#{ArticulosController.selectedArticulo.diasStockSeguridad}"
                                                     style="width: 100%"
                                                     placeholder="7 (por defecto)"/>
                                        <p:tooltip for="editDiasStockSeguridad" value="Días de inventario de seguridad. Valor por defecto: 7 días." position="top"/>
                                    </div>

                                    <div class="column is-full">
                                        <div class="field-row" style="display: flex; align-items: center; gap: 1rem;">
                                            <p:selectBooleanCheckbox id="editEstadoAlertas" 
                                                                     value="#{ArticulosController.selectedArticulo.estadoAlertas}"/>
                                            <label class="label has-text-link" for="editEstadoAlertas" style="margin-bottom: 0;">Alertas Automáticas Activas</label>
                                        </div>
                                        <p:tooltip for="editEstadoAlertas" value="Activar/desactivar alertas automáticas de stock para este artículo." position="top"/>
                                    </div>
                                </p:outputPanel>

                                <div class="column is-full">
                                    <hr/>
                                    <p class="title is-6 has-text-link">Exoneracion</p>
                                </div>

                                <div class="column is-full">
                                    <div class="field-row" style="display: flex; align-items: center; gap: 1rem;">
                                        <p:selectBooleanCheckbox id="editExento"
                                                                 value="#{ArticulosController.selectedArticulo.exento}">
                                            <p:ajax update="editExoneracionDataSection" process="@this"/>
                                        </p:selectBooleanCheckbox>
                                        <label class="label has-text-link" for="editExento" style="margin-bottom: 0;">Producto Exento (Exonerado)</label>
                                    </div>
                                    <p:tooltip for="editExento" value="Marcar si el producto esta exento de IVA (requiere documentos de exoneracion)." position="top"/>
                                </div>

                                <p:outputPanel id="editExoneracionDataSection" styleClass="#{ArticulosController.selectedArticulo.exento ? '' : 'is-hidden'}">
                                    <div class="column is-full">
                                        <div class="columns is-multiline" style="border: 1px solid #dbdbdb; border-radius: 6px; padding: 1rem;">
                                            <div class="column is-full">
                                                <p class="subtitle is-6">Datos de Exoneracion</p>
                                            </div>

                                            <div class="column is-half">
                                                <label class="label has-text-link" for="editTipoDocEX1">Tipo Documento EX1</label>
                                                <p:inputText id="editTipoDocEX1" value="#{ArticulosController.selectedExoneracion.tipoDocumentoEX1}"
                                                             style="width: 100%" maxlength="2" placeholder="01-07"/>
                                            </div>

                                            <div class="column is-half">
                                                <label class="label has-text-link" for="editTipoDocOtro">Tipo Documento Otro</label>
                                                <p:inputText id="editTipoDocOtro" value="#{ArticulosController.selectedExoneracion.tipoDocumentoOTRO}"
                                                             style="width: 100%" maxlength="2" placeholder="01-07"/>
                                            </div>

                                            <div class="column is-half">
                                                <label class="label has-text-link" for="editNumDocExoneracion">Numero Documento</label>
                                                <p:inputText id="editNumDocExoneracion" value="#{ArticulosController.selectedExoneracion.numeroDocumento}"
                                                             style="width: 100%" maxlength="20"/>
                                            </div>

                                            <div class="column is-half">
                                                <label class="label has-text-link" for="editNombreInstitucion">Nombre Institucion</label>
                                                <p:inputText id="editNombreInstitucion" value="#{ArticulosController.selectedExoneracion.nombreInstitucion}"
                                                             style="width: 100%" maxlength="255"/>
                                            </div>

                                            <div class="column is-half">
                                                <label class="label has-text-link" for="editFechaEmisionEX">Fecha Emision</label>
                                                <p:calendar id="editFechaEmisionEX" value="#{ArticulosController.selectedExoneracion.fechaEmisionEX}"
                                                            pattern="yyyy-MM-dd" style="width: 100%" mask="true"/>
                                            </div>

                                            <div class="column is-half">
                                                <label class="label has-text-link" for="editMontoExoneracion">Monto Exoneracion</label>
                                                <p:inputText id="editMontoExoneracion" type="number" value="#{ArticulosController.selectedExoneracion.montoExoneracion}"
                                                             style="width: 100%" converter="jakarta.faces.BigDecimal"/>
                                            </div>

                                            <div class="column is-half">
                                                <label class="label has-text-link" for="editTarifaExonerada">Tarifa Exonerada (%)</label>
                                                <p:inputText id="editTarifaExonerada" type="number" value="#{ArticulosController.selectedExoneracion.tarifaExonerada}"
                                                             style="width: 100%" converter="jakarta.faces.BigDecimal"/>
                                            </div>

                                            <div class="column is-half">
                                                <label class="label has-text-link" for="editNombreInstitucionOtros">Nombre Institucion Otros</label>
                                                <p:inputText id="editNombreInstitucionOtros" value="#{ArticulosController.selectedExoneracion.nombreInstitucionOtros}"
                                                             style="width: 100%" maxlength="255"/>
                                            </div>
                                        </div>
                                    </div>
                                </p:outputPanel>

                                <div class="column is-full">
                                    <p:commandLink value="Actualizar datos" update="@form Articulos:ArticulosActivos" process="@form"
                                                     action="#{ArticulosController.updateArticuloByDialog()}" 
                                                     styleClass="button is-rounded is-link is-fullwidth"/>
                                </div> 

                            </div>
                        </section>
                    </p:tab>
                </p:tabView>
            </h:form>
        </p:outputPanel>
    </p:dialog>
    
    <p:dialog header="Crear Familia" widgetVar="CrearFamiliaFromEditDialog" dynamic="true" cache="false" 
              fitViewport="true" responsive="true" id="CrearFamiliaFromEditDialog" modal="true">
        <p:outputPanel>
            <h:form id="crearFamiliaFromEditForm">
                <p:panelGrid columns="1">
                    <p:panel header="Crear una nueva familia">
                        <p:messages id="crearFamiliaMessages" showDetail="true" showSummary="false"/>
                        
                        <p:messages showDetail="true" for="newFamiliaNombre" showSummary="false" closable="true" />
                        <label class="label" for="newFamiliaNombre" style="color: var(--primary-color);">Nombre:</label>
                        <p:inputText id="newFamiliaNombre" value="#{ArticulosController.newFamiliaNombre}" style="width: 100%"
                                     required="true" requiredMessage="El nombre no puede estar vacío"/>
                        <p:spacer height="1em"/>
                        <div class="buttons">
                            <p:commandButton value="Crear Familia" process="@form" styleClass="button is-primary is-rounded is-fullwidth"
                                             icon="pi pi-check"
                                             update="@form editFamiliaSelect" 
                                             action="#{ArticulosController.createFamiliaFromDialog()}"
                                             oncomplete="if(!args.validationFailed) PF('CrearFamiliaFromEditDialog').hide();"/>
                        </div>
                    </p:panel>
                </p:panelGrid>
            </h:form>
        </p:outputPanel>
    </p:dialog>
</ui:composition>
