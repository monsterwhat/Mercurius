<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      data-theme="#{ThemeController.currentTheme}">

    <h:head>
        <title>Cierre de Caja</title>
        <meta charset="utf-8" name="viewport" content="width=device-width, initial-scale=1"/>
        <link rel="stylesheet" href="/Mercurius/resources/css/headers.css"/>
        <style>
            .caja-header {
                padding: 1rem;
                border-radius: 0.75rem;
                margin-bottom: 1.5rem;
                background: linear-gradient(135deg, #2d8a4e 0%, #1a5e32 100%);
            }
            .caja-header .title { color: white; margin-bottom: 1rem; }
            .caja-header .subtitle { color: rgba(255,255,255,0.8); }
            .form-card {
                background: var(--surface-card, white);
                border-radius: 0.75rem;
                padding: 1.5rem;
                margin-bottom: 1.5rem;
                box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            }
            .form-card h3 {
                margin-top: 0;
                margin-bottom: 1rem;
                color: var(--text-color, #333);
                border-bottom: 2px solid #2d8a4e;
                padding-bottom: 0.5rem;
            }
            .form-grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
                gap: 1rem;
            }
            .form-field label {
                display: block;
                font-size: 0.875rem;
                font-weight: 600;
                margin-bottom: 0.25rem;
                color: var(--text-color-secondary, #666);
            }
            .diferencia-positiva { color: #2d8a4e; font-weight: bold; }
            .diferencia-negativa { color: #dc3545; font-weight: bold; }
            .status-badge {
                display: inline-block;
                padding: 0.25rem 0.75rem;
                border-radius: 1rem;
                font-size: 0.875rem;
                font-weight: 600;
            }
            .status-abierto { background: #d4edda; color: #155724; }
            .status-cerrado { background: #f8d7da; color: #721c24; }
        </style>
    </h:head>

    <h:body>
        <h:form id="cajaForm">
            <ui:include src="/secured/fragments/userBar.xhtml" />
            <p:growl showDetail="true" showSummary="true" />

            <section class="section">
                <div class="caja-header">
                    <p class="title is-3 has-text-centered">Control de Caja</p>
                    <p class="subtitle has-text-centered">Apertura y cierre de sesion de caja</p>
                </div>

                <h:panelGroup rendered="#{!cierreCajaController.sesionAbierta}">
                    <div class="form-card">
                        <h3>Abrir Sesion de Caja</h3>
                        <div class="form-grid">
                            <div class="form-field">
                                <label for="montoApertura">Monto Inicial (CRC)</label>
                                <p:inputNumber id="montoApertura"
                                             value="#{cierreCajaController.montoApertura}"
                                             min="0"
                                             currency="CRC"
                                             required="true"
                                             style="width: 100%;" />
                            </div>
                        </div>
                        <p:commandButton value="Abrir Sesion"
                                       action="#{cierreCajaController.abrirSesion()}"
                                       update="cajaForm"
                                       styleClass="button is-success"
                                       icon="pi pi-lock-open"
                                       style="margin-top: 1rem;" />
                    </div>
                </h:panelGroup>

                <h:panelGroup rendered="#{cierreCajaController.sesionAbierta}">
                    <div class="form-card">
                        <h3>Sesion Activa
                            <span class="status-badge status-abierto" style="margin-left: 0.5rem;">Abierta</span>
                        </h3>
                        <div class="form-grid">
                            <div class="form-field">
                                <label>Monto Inicial</label>
                                <h:outputText value="#{cierreCajaController.sesionActual.montoInicial}">
                                    <f:convertNumber type="currency" currencySymbol="₡" />
                                </h:outputText>
                            </div>
                            <div class="form-field">
                                <label>Fecha Apertura</label>
                                <h:outputText value="#{cierreCajaController.sesionActual.fechaApertura}">
                                    <f:convertDateTime pattern="dd/MM/yyyy HH:mm" />
                                </h:outputText>
                            </div>
                        </div>
                    </div>

                    <div class="form-card">
                        <h3>Cerrar Sesion</h3>
                        <div class="form-grid">
                            <div class="form-field">
                                <label for="montoContadoEfectivo">Efectivo Contado (CRC)</label>
                                <p:inputNumber id="montoContadoEfectivo"
                                             value="#{cierreCajaController.montoContadoEfectivo}"
                                             min="0"
                                             currency="CRC"
                                             required="true"
                                             style="width: 100%;" />
                            </div>
                            <div class="form-field">
                                <label for="montoContadoSinpe">SINPE Contado (CRC)</label>
                                <p:inputNumber id="montoContadoSinpe"
                                             value="#{cierreCajaController.montoContadoSinpe}"
                                             min="0"
                                             currency="CRC"
                                             style="width: 100%;" />
                            </div>
                            <div class="form-field">
                                <label for="montoContadoTarjeta">Tarjeta Contado (CRC)</label>
                                <p:inputNumber id="montoContadoTarjeta"
                                             value="#{cierreCajaController.montoContadoTarjeta}"
                                             min="0"
                                             currency="CRC"
                                             style="width: 100%;" />
                            </div>
                            <div class="form-field" style="grid-column: 1 / -1;">
                                <label for="notasCierre">Notas</label>
                                <p:inputTextarea id="notasCierre"
                                               value="#{cierreCajaController.notasCierre}"
                                               rows="2"
                                               style="width: 100%;" />
                            </div>
                        </div>
                        <p:commandButton value="Cerrar Sesion"
                                       action="#{cierreCajaController.cerrarSesion()}"
                                       update="cajaForm"
                                       styleClass="button is-danger"
                                       icon="pi pi-lock"
                                       style="margin-top: 1rem;" />
                    </div>
                </h:panelGroup>

                <div class="form-card">
                    <h3>Historial de Cierres</h3>
                    <p:dataTable value="#{cierreCajaController.historial}"
                                 var="sesion"
                                 rows="10"
                                 paginator="true"
                                 paginatorPosition="bottom"
                                 emptyMessage="No hay sesiones registradas"
                                 styleClass="articulos-table"
                                 reflow="true">

                        <p:column headerText="Fecha Apertura" width="150">
                            <h:outputText value="#{sesion.fechaApertura}">
                                <f:convertDateTime pattern="dd/MM/yyyy HH:mm" />
                            </h:outputText>
                        </p:column>

                        <p:column headerText="Fecha Cierre" width="150">
                            <h:outputText value="#{sesion.fechaCierre}">
                                <f:convertDateTime pattern="dd/MM/yyyy HH:mm" />
                            </h:outputText>
                        </p:column>

                        <p:column headerText="Monto Inicial" width="120" styleClass="has-text-right">
                            <h:outputText value="#{sesion.montoInicial}">
                                <f:convertNumber type="currency" currencySymbol="₡" />
                            </h:outputText>
                        </p:column>

                        <p:column headerText="Efectivo" width="120" styleClass="has-text-right">
                            <h:outputText value="#{sesion.montoContadoEfectivo}">
                                <f:convertNumber type="currency" currencySymbol="₡" />
                            </h:outputText>
                        </p:column>

                        <p:column headerText="SINPE" width="120" styleClass="has-text-right">
                            <h:outputText value="#{sesion.montoContadoSinpe}">
                                <f:convertNumber type="currency" currencySymbol="₡" />
                            </h:outputText>
                        </p:column>

                        <p:column headerText="Tarjeta" width="120" styleClass="has-text-right">
                            <h:outputText value="#{sesion.montoContadoTarjeta}">
                                <f:convertNumber type="currency" currencySymbol="₡" />
                            </h:outputText>
                        </p:column>

                        <p:column headerText="Diferencia" width="120" styleClass="has-text-right">
                            <h:outputText value="#{sesion.diferencia}"
                                         styleClass="#{sesion.diferencia >= 0 ? 'diferencia-positiva' : 'diferencia-negativa'}">
                                <f:convertNumber type="currency" currencySymbol="₡" />
                            </h:outputText>
                        </p:column>

                        <p:column headerText="Estado" width="100" style="text-align: center;">
                            <span class="status-badge #{sesion.estado == 'abierto' ? 'status-abierto' : 'status-cerrado'}">
                                #{sesion.estado}
                            </span>
                        </p:column>
                    </p:dataTable>
                </div>
            </section>
        </h:form>
    </h:body>
</html>
