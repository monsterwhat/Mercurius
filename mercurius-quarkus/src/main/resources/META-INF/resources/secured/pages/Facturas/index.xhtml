<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      data-theme="#{ThemeController.currentTheme}">

    <h:head>
        <title>Menu Principal Facturas</title>
        <meta charset="utf-8" name="viewport" content="width=device-width, initial-scale=1"/>
        <h:outputStylesheet name="primefaces/themes/#{ThemeController.currentTheme}/theme.css" />
    </h:head>

    <h:body>
        <p:panelGrid columns="1" >
            <p:row>
                <p:column>
                    <ui:include src="/secured/fragments/userBar.xhtml" /> 
                </p:column>
            </p:row> 

            <p:growl showDetail="true" showSummary="true" />

            <p:row>
                <p:column>
                    <p:panel>

                        <p:column>
                            <p:commandButton icon="pi pi-upload" onclick="PF('facturasUpload').show();" value="Subir Factura" styleClass="button is-fullwidth"/>                            
                        </p:column>

                    </p:panel>
                </p:column>
            </p:row>
        </p:panelGrid>

        <ui:include src="/secured/fragments/Inventario/Activos/verDetallesDeAjuste.xhtml"/>
        <ui:include src="/secured/fragments/Inventario/Upload/subirFacturas.xhtml"/>

    </h:body>
</html>
