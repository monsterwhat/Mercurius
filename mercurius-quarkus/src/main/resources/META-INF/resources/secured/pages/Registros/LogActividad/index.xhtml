<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      data-theme="#{ThemeController.currentTheme}">

    <h:head>
        <title>Log de Actividades</title>
        <meta charset="utf-8" name="viewport" content="width=device-width, initial-scale=1"/> 
    </h:head>

    <h:body> 

        <ui:include src="/secured/fragments/userBar.xhtml" /> 

        <p:growl id="growl" showDetail="true" showSummary="true" />

        <section class="section">

            <div class="columns is-multiline has-text-centered">
                <div class="column is-full">
                    <p class="title is-3">Log de Actividades</p>
                    <p class="subtitle is-6">Auditoría de operaciones del sistema</p>
                </div>

                <div class="column is-full">
                    <div class="card">
                        <h:form id="logForm">

                            <!-- Filter Panel -->
                            <p:panel header="Filtros" toggleable="true" toggleOrientation="vertical">
                                <div class="columns is-multiline p-4">
                                    <div class="column is-one-quarter">
                                        <p:outputLabel for="fechaDesde" value="Fecha Desde"/>
                                        <p:calendar id="fechaDesde" 
                                                    value="#{logActividadController.fechaDesde}"
                                                    pattern="yyyy-MM-dd" showButtonBar="true"/>
                                    </div>
                                    <div class="column is-one-quarter">
                                        <p:outputLabel for="fechaHasta" value="Fecha Hasta"/>
                                        <p:calendar id="fechaHasta" 
                                                    value="#{logActividadController.fechaHasta}"
                                                    pattern="yyyy-MM-dd" showButtonBar="true"/>
                                    </div>
                                    <div class="column is-one-quarter">
                                        <p:outputLabel for="usuarioFilter" value="Usuario"/>
                                        <p:selectOneMenu id="usuarioFilter" 
                                                         value="#{logActividadController.selectedUser}"
                                                         converter="#{userConverter}"
                                                         filter="true" filterMatchMode="contains"
                                                         style="width: 100%">
                                            <f:selectItem itemLabel="Todos" itemValue="#{null}" noSelectionOption="true"/>
                                            <f:selectItems value="#{logActividadController.users}" 
                                                           var="u"
                                                           itemLabel="#{u.username}"
                                                           itemValue="#{u}"/>
                                        </p:selectOneMenu>
                                    </div>
                                    <div class="column is-one-quarter">
                                        <p:outputLabel for="tipoFilter" value="Tipo"/>
                                        <p:selectOneMenu id="tipoFilter" 
                                                         value="#{logActividadController.selectedTipo}"
                                                         filter="true" filterMatchMode="contains"
                                                         style="width: 100%">
                                            <f:selectItem itemLabel="Todos" itemValue="#{null}" noSelectionOption="true"/>
                                            <f:selectItems value="#{logActividadController.tiposDisponibles}"/>
                                        </p:selectOneMenu>
                                    </div>
                                    <div class="column is-one-quarter">
                                        <p:outputLabel for="sourceFilter" value="Origen"/>
                                        <p:selectOneMenu id="sourceFilter" 
                                                         value="#{logActividadController.sourceFilter}"
                                                         filter="true" filterMatchMode="contains"
                                                         style="width: 100%">
                                            <f:selectItem itemLabel="Todos" itemValue="#{null}" noSelectionOption="true"/>
                                            <f:selectItems value="#{logActividadController.sourcesDisponibles}"/>
                                        </p:selectOneMenu>
                                    </div>
                                    <div class="column is-full">
                                        <div class="buttons is-centered">
                                            <p:commandLink class="button is-rounded is-primary" 
                                                           actionListener="#{logActividadController.buscar()}"
                                                           update="logTable logForm" process="@this">
                                                <span class="icon">
                                                    <i class="pi pi-search"/>
                                                </span>
                                                <span>Buscar</span>
                                            </p:commandLink>
                                            <p:commandLink class="button is-rounded is-light" 
                                                           actionListener="#{logActividadController.limpiarFiltros()}"
                                                           update="logTable logForm" process="@this">
                                                <span class="icon">
                                                    <i class="pi pi-filter-slash"/>
                                                </span>
                                                <span>Limpiar Filtros</span>
                                            </p:commandLink>
                                        </div>
                                    </div>
                                </div>
                            </p:panel>

                            <p:spacer height="1em"/>

                            <p:dataTable id="logTable"
                                         value="#{logActividadController.registros}" var="registro"
                                         widgetVar="LogActividadTable"
                                         paginator="true" rows="20" paginatorPosition="bottom"
                                         emptyMessage="No se encontraron registros con los filtros seleccionados"
                                         lazy="false" reflow="true"
                                         rowKey="#{registro.codigo}"
                                         sortBy="#{registro.timestamp}" sortOrder="descending">

                                <f:facet name="header">
                                    <div class="columns is-vcentered">
                                        <div class="column is-half">
                                            <p class="title is-6 has-text-left">
                                                Total: #{logActividadController.totalRegistros} registro(s)
                                            </p>
                                        </div>
                                        <div class="column is-half has-text-right">
                                            <p:commandLink class="button is-rounded is-success is-small" ajax="false">
                                                <p:dataExporter type="xlsx" target=":logForm:logTable" 
                                                               fileName="Log-Actividades-Mercurius" />
                                                <span class="icon-text">
                                                    <span class="icon">
                                                        <i class="pi pi-file-excel"/>
                                                    </span>
                                                    <span>Exportar Excel</span>
                                                </span>
                                            </p:commandLink>
                                        </div>
                                    </div>
                                </f:facet>

                                <p:column headerText="Fecha/Hora" sortBy="#{registro.timestamp}" width="160">
                                    <h:outputText value="#{registro.timestampAsDate}">
                                        <f:convertDateTime pattern="yyyy-MM-dd HH:mm:ss"/>
                                    </h:outputText>
                                </p:column>
                                <p:column headerText="Tipo" sortBy="#{registro.tipo}" width="140">
                                    <h:outputText value="#{registro.tipo}"/>
                                </p:column>
                                <p:column headerText="Mensaje">
                                    <h:outputText value="#{registro.mensaje}"/>
                                </p:column>
                                <p:column headerText="Usuario" sortBy="#{registro.user.username}" width="120">
                                    <h:outputText value="#{registro.user != null ? registro.user.username : 'Sistema'}"/>
                                </p:column>
                                <p:column headerText="Origen" sortBy="#{registro.source}" width="200">
                                    <h:outputText value="#{registro.source}"/>
                                </p:column>
                                <p:column headerText="Valor Anterior" width="120">
                                    <h:outputText value="#{registro.antes}" rendered="#{registro.antes ne null}"/>
                                </p:column>
                                <p:column headerText="Valor Nuevo" width="120">
                                    <h:outputText value="#{registro.despues}" rendered="#{registro.despues ne null}"/>
                                </p:column>
                                <p:column headerText="Estado" width="120">
                                    <div class="buttons">
                                        <p:commandLink class="button is-rounded is-small" 
                                                       actionListener="#{logActividadController.toggleVista(registro)}" 
                                                       process="@this" 
                                                       update="logTable"
                                                       rendered="#{!registro.vista}">
                                            <span class="icon">
                                                <i class="pi pi-eye-slash"/>
                                            </span>
                                        </p:commandLink>
                                        <p:commandLink class="button is-rounded is-small is-success" 
                                                       actionListener="#{logActividadController.toggleVista(registro)}" 
                                                       process="@this" 
                                                       update="logTable"
                                                       rendered="#{registro.vista}">
                                            <span class="icon">
                                                <i class="pi pi-eye"/>
                                            </span>
                                        </p:commandLink>
                                        <p:commandButton class="button is-rounded is-small is-info"
                                                         actionListener="#{logActividadController.showDetails(registro)}"
                                                         process="@this" update="logDetailForm"
                                                         oncomplete="PF('logDetailDialog').show();"
                                                         title="Ver detalles">
                                            <span class="icon">
                                                <i class="pi pi-info-circle"/>
                                            </span>
                                        </p:commandButton>
                                    </div>
                                </p:column>
                            </p:dataTable>
                        </h:form>
                    </div> 
                </div> 
            </div> 
        </section>

        <p:dialog id="logDetailDialog" widgetVar="logDetailDialog" header="Detalle del Registro" 
                  modal="true" responsive="true" width="600" closable="true" styleClass="log-detail-dialog">
            <h:form id="logDetailForm">
                <p:panelGrid columns="2" styleClass="detail-grid" style="width: 100%">
                    <p><strong>Fecha/Hora:</strong></p>
                    <p>
                        <h:outputText value="#{logActividadController.selectedRegistro.timestampAsDate}">
                            <f:convertDateTime pattern="yyyy-MM-dd HH:mm:ss"/>
                        </h:outputText>
                    </p>

                    <p><strong>Tipo:</strong></p>
                    <p><h:outputText value="#{logActividadController.selectedRegistro.tipo}"/></p>

                    <p><strong>Código:</strong></p>
                    <p><h:outputText value="#{logActividadController.selectedRegistro.codigo}"/></p>

                    <p><strong>Usuario:</strong></p>
                    <p><h:outputText value="#{logActividadController.selectedRegistro.user != null ? logActividadController.selectedRegistro.user.username : 'Sistema'}"/></p>

                    <p><strong>Origen:</strong></p>
                    <p><h:outputText value="#{logActividadController.selectedRegistro.source}"/></p>

                    <p><strong>Estado:</strong></p>
                    <p><h:outputText value="#{logActividadController.selectedRegistro.vista ? 'Leído' : 'No leído'}"/></p>

                    <p><strong>Mensaje:</strong></p>
                    <p><h:outputText value="#{logActividadController.selectedRegistro.mensaje}" style="white-space: pre-wrap;"/></p>

                    <p:outputPanel rendered="#{logActividadController.selectedRegistro.antes ne null}">
                        <p><strong>Valor Anterior:</strong></p>
                    </p:outputPanel>
                    <p:outputPanel rendered="#{logActividadController.selectedRegistro.antes ne null}">
                        <pre style="font-size: 0.85em; background: var(--bulma-background-l); padding: 0.5rem; border-radius: 4px; white-space: pre-wrap; max-height: 200px; overflow: auto;"><h:outputText value="#{logActividadController.selectedRegistro.antes}"/></pre>
                    </p:outputPanel>

                    <p:outputPanel rendered="#{logActividadController.selectedRegistro.despues ne null}">
                        <p><strong>Valor Nuevo:</strong></p>
                    </p:outputPanel>
                    <p:outputPanel rendered="#{logActividadController.selectedRegistro.despues ne null}">
                        <pre style="font-size: 0.85em; background: var(--bulma-background-l); padding: 0.5rem; border-radius: 4px; white-space: pre-wrap; max-height: 200px; overflow: auto;"><h:outputText value="#{logActividadController.selectedRegistro.despues}"/></pre>
                    </p:outputPanel>
                </p:panelGrid>
            </h:form>
        </p:dialog>

    </h:body>
</html>
