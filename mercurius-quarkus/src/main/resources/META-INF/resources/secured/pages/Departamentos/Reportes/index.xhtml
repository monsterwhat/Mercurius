<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      data-theme="#{ThemeController.currentTheme}">

    <h:head>
        <title>Menu Principal Reportes de Departamentos</title>
        <meta charset="utf-8" name="viewport" content="width=device-width, initial-scale=1"/> 
    </h:head>

    <h:body>
        <p:growl id="growl" showDetail="true" showSummary="true" />

        <ui:include src="/secured/fragments/userBar.xhtml" />

        <section class="section">
            <div class="columns is-centered is-vcentered has-text-centered is-multiline">
                <div class="column is-full">
                    <p class="title has-text-centered">
                        Menu General de Departamentos
                    </p> 
                </div>
            </div>
            <div class="card"> 
                <div class="columns is-centered is-vcentered has-text-centered is-multiline">  
                    <div class="column mx-4">
                        <p:card style="border-radius: 15px; overflow: hidden;">
                            <p:tag styleClass="mr-2" severity="success" value="Departamentos Activos" rounded="true"></p:tag>
                            <p:badge value="#{DepartamentosController.departamentosActivosCount()}" severity="success">
                                <i class="pi pi-check-circle" style="font-size: 2rem"/>
                            </p:badge>
                        </p:card>
                    </div>
                    <div class="column mx-4">
                        <p:card style="border-radius: 15px; overflow: hidden;">
                            <p:tag styleClass="mr-2" severity="danger" value="Departamentos Inactivos" rounded="true"></p:tag>
                            <p:badge value="#{DepartamentosController.departamentosInactivosCount()}" severity="danger">
                                <i class="pi pi-times-circle" style="font-size: 2rem" />
                            </p:badge> 
                        </p:card>
                    </div>
                    <div class="column is-full">
                        <h:form id="departamentos">

                            <p:dataTable value="#{DepartamentosController.filteredDepartamentos}" var="departamento"  widgetVar="DepartamentosTable"
                                         paginator="true" rows="8" paginatorPosition="bottom" id="DepartamentosTableData"
                                         emptyMessage="No se encontraron departamentos con la critería proporcionada"
                                         globalFilterFunction="#{DepartamentosController.globalFilterFunction}"
                                         filterBy="#{DepartamentosController.filterBy}" reflow="true" selectionMode="single"
                                         selection="#{DepartamentosController.selectedDepartamento}" rowKey="#{departamento.id}">

                                <p:ajax event="rowSelect" update="@form"/>

                                <f:facet name="header">
                                    <p:inputText id="globalFilter" onkeyup="PF('DepartamentosTable').filter()" style="color: var(--primary-color); width: 100%"
                                                 placeholder="Búsqueda general de todos los campos" />
                                </f:facet>

                                <p:column exportable="false" width="5%"> 
                                    <p:chip id="ActiveChip" icon="pi pi-check" style="background: var(--green-500)" rendered="#{departamento.status}"/>
                                    <p:tooltip for="ActiveChip" value="Activa" position="top"/>

                                    <p:chip id="inActiveChip" icon="pi pi-times" style="background: var(--red-500);" rendered="#{!departamento.status}"/>
                                    <p:tooltip for="inActiveChip" value="Inactiva" position="top"/>
                                </p:column>

                                <p:column headerText="ID Departamento" visible="false">
                                    <h:outputText value="#{departamento.id}"/>
                                </p:column>
                                <p:column headerText="Nombre" sortBy="#{departamento.nombre}">
                                    <h:outputText value="#{departamento.nombre}"/>
                                </p:column>

                                <p:column headerText="Acciones" exportable="false" width="10%">
                                    <div class="buttons">
                                        <p:commandButton styleClass="rounded-button ui-button-success" icon="pi pi-pencil"
                                                         onclick="PF('EditarDepartamentoDialog').show();" process="@this" update="editDepartamento">
                                            <f:setPropertyActionListener value="#{departamento}" target="#{DepartamentosController.selectedDepartamento}" />
                                        </p:commandButton>
                                        <p:commandButton styleClass="rounded-button ui-button-warning" icon="pi pi-power-off" update="@form departamentos"
                                                         actionListener="#{DepartamentosController.deleteDepartamento()}" process="@this">
                                            <f:setPropertyActionListener value="#{departamento}" target="#{DepartamentosController.selectedDepartamento}" />
                                        </p:commandButton>
                                    </div>
                                </p:column>
                            </p:dataTable>

                            <p:commandLink actionListener="#{DepartamentosController.openNewDepartamento()}" 
                                             class="button is-fullwidth is-rounded is-success" onclick="PF('CrearDepartamentoDialog').show();">
                                <span class="icon-text">
                                    <span class="icon">
                                        <i class="pi pi-plus"></i>
                                    </span>
                                    <span>
                                        Crear Departamento
                                    </span>
                                </span> 
                            </p:commandLink>

                            <a href="/Mercurius/secured/pages/Departamentos/Reportes/Metricas/index.xhtml" 
                               class="button is-fullwidth is-rounded is-info mt-3">
                                <span class="icon-text">
                                    <span class="icon">
                                        <i class="pi pi-chart-bar"></i>
                                    </span>
                                    <span>
                                        Métricas de Proveedores
                                    </span>
                                </span>
                            </a>
                        </h:form>
                    </div> 
                </div>
            </div>
        </section>

        <ui:include src="/secured/fragments/Departamentos/CrearDepartamentoDialog.xhtml"/>
        <ui:include src="/secured/fragments/Departamentos/EditDepartamentoDialog.xhtml"/>

    </h:body>
</html>
