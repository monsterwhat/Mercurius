<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="jakarta.faces.facelets"
      class="#{ThemeController.currentTheme}">

    <h:head>
        <title>Menu Principal de la Aplicacion</title>

    </h:head>

    <h:body>

        <ui:include src="/secured/fragments/userBar.xhtml" /> 

        <section class="section">
            <div class="columns is-centered is-vcentered has-text-centered is-multiline">
                <div class="column is-full">
                    <p class="title has-text-centered">
                        Menu de Aplicacion
                    </p> 
                </div> 
            </div>
            <div class="columns is-centered is-vcentered has-text-centered is-multiline"> 
                <div class="column"> 
                    <div class="card">
                        <p:outputPanel id="mainPanel" >
                            <p:panel rendered="#{SettingsController.currentSettings.completedSteps lt 5}">
                                <p:steps activeIndex="#{SettingsController.currentSettings.completedSteps}">
                                    <p:menuitem value="Perfil" />
                                    <p:menuitem value="Logo" />
                                    <p:menuitem value="Correo" />
                                    <p:menuitem value="Tributacion" />
                                    <p:menuitem value="Confirmacion" />
                                </p:steps>
                            </p:panel>

                            <h:form rendered="#{SettingsController.pasoSeleccionNombre}">

                                <div class="columns is-multiline is-centered is-vcentered">
                                    <div class="column is-full">
                                        <p class="title is-5 has-text-centered">
                                            Configuracion de Aplicacion
                                        </p> 
                                    </div>
                                    <div class="column is-10">
                                        <div class="block">
                                            <p:growl showDetail="true" showSummary="true"/>
                                            <p:messages for="nombre"/>
                                            <div class="columns is-multiline">
                                                <div class="column is-full">
                                                    <p:outputLabel value="Nombre del perfil: " for="nombre" style="color: var(--primary-color);"/>
                                                </div>
                                                <div class="column is-full">
                                                    <p:inputText id="nombre" value="#{SettingsController.currentSettings.nombrePerfil}" required="true"
                                                                 style="width: 100%" requiredMessage="El nombre no puede estar vacio"/>
                                                </div>
                                                <div class="column is-full">
                                                    <p:commandLink actionListener="#{SettingsController.saveUsername()}" process="@form"
                                                                   class="button is-primary is-rounded is-fullwidth" update="@this mainPanel">
                                                        Guardar
                                                    </p:commandLink>
                                                </div> 
                                            </div> 
                                        </div>
                                    </div>
                                </div> 
                            </h:form>

                            <h:form enctype="multipart/form-data" id="LogoSelect" rendered="#{SettingsController.pasoSeleccionLogo}">
                                <div class="column is-vcentered">
                                    <p:fileUpload 
                                        listener="#{SettingsController.uploadLogo}" mode="advanced" update="mainPanel" process="@form"
                                        previewWidth="120" chooseButtonStyleClass="ui-button-primary rounded-button"
                                        uploadButtonStyleClass="ui-button-primary rounded-button"
                                        cancelLabel="Cancelar" cancelButtonStyleClass="ui-button-danger rounded-button"
                                        label="Seleccionar Logo" uploadLabel="Subir">
                                    </p:fileUpload>
                                </div> 
                            </h:form>

                            <h:form id="Correo" rendered="#{SettingsController.pasoSeleccionEmail}"  >
                                <div class="columns is-half is-centered is-mobile"> 
                                    <div class="card">
                                        <div class="column">
                                            <p:messages for="correo"/>
                                            <p:outputLabel value="Correo Electronico Principal: " for="correo" styleClass="has-text-link"/>
                                            <p:inputText id="correo" value="#{SettingsController.currentSettings.correoElectronico}"
                                                         required="true" requiredMessage="El correo electronico no puede estar vacío"
                                                         style="width: 100%"/>
                                        </div>
                                        <div class="column">
                                            <p:messages for="correoPass" />
                                            <p:outputLabel value="Contrasena Correo Electronico: " for="correoPass" styleClass="has-text-link"/>
                                            <p:inputText id="correoPass" value="#{SettingsController.currentSettings.contrasenaCorreo}"
                                                         required="true" requiredMessage="La contrasena no puede estar vacía"
                                                         style="width: 100%"/>
                                        </div>
                                        <div class="column">
                                            <div class="buttons">
                                                <p:commandLink class="button is-rounded is-primary is-fullwidth" process="@form" update="mainPanel"
                                                               actionListener="#{SettingsController.saveCorreo()}"  >
                                                    Guardar
                                                </p:commandLink>
                                            </div>
                                        </div> 
                                    </div> 
                                </div> 
                            </h:form>

                            <h:form id="Tributacion" rendered="#{SettingsController.pasoSeleccionTributacion}">
                                <div class="columns is-half is-centered is-mobile"> 
                                    <div class="card">
                                        <div class="column">
                                            <p:outputLabel value="Tipo de Identificación:" for="tipoIdentificacion" style="color: var(--primary-color);" />
                                            <p:selectOneMenu id="tipoIdentificacion" value="#{SettingsController.currentSettings.tipoIdentificacion}" required="true" 
                                                             requiredMessage="El tipo de identificación es obligatorio">
                                                <f:selectItem itemLabel="Seleccione..." itemValue="" noSelectionOption="true" />
                                                <f:selectItem itemLabel="Nacional" itemValue="1" />
                                                <f:selectItem itemLabel="Internacional" itemValue="2" />
                                            </p:selectOneMenu>
                                        </div>
                                        <div class="column">
                                            <p:outputLabel value="Identificación:" for="identificacion" style="color: var(--primary-color);" />
                                            <p:inputText id="identificacion" value="#{SettingsController.currentSettings.identificacion}" maxlength="12" required="true"
                                                         requiredMessage="La identificación es obligatoria y no puede tener más de 12 caracteres" />
                                        </div>
                                        <div class="column">
                                            <p:outputLabel value="Nombre:" for="nombre1" style="color: var(--primary-color);" />
                                            <p:inputText id="nombre1" value="#{SettingsController.currentSettings.nombre}" maxlength="100" required="true"
                                                         requiredMessage="El nombre es obligatorio y no puede tener más de 100 caracteres" />
                                        </div>
                                        <div class="column">
                                            <p:outputLabel value="Nombre del Negocio:" for="nombreNegocio" style="color: var(--primary-color);" />
                                            <p:inputText id="nombreNegocio" value="#{SettingsController.currentSettings.nombreNegocio}" maxlength="80" required="true"
                                                         requiredMessage="El nombre del negocio es obligatorio y no puede tener más de 80 caracteres" />
                                        </div>
                                        <div class="column">
                                            <p:outputLabel value="Código País:" for="codigoPais" style="color: var(--primary-color);" />
                                            <p:inputText id="codigoPais" value="#{SettingsController.currentSettings.codigoPais}" maxlength="3" required="true"
                                                         requiredMessage="El código del país es obligatorio y debe tener máximo 3 dígitos" />
                                        </div>
                                        <div class="column">
                                            <p:outputLabel value="Teléfono:" for="telefono" style="color: var(--primary-color);" />
                                            <p:inputText id="telefono" value="#{SettingsController.currentSettings.telefono}" maxlength="20" required="true"
                                                         requiredMessage="El teléfono es obligatorio y no puede tener más de 20 caracteres" />
                                        </div>
                                        <div class="column">
                                            <p:outputLabel value="Código País Fax:" for="codigoPaisFax" style="color: var(--primary-color);" />
                                            <p:inputText id="codigoPaisFax" value="#{SettingsController.currentSettings.codigoPaisFax}" maxlength="3" required="true"
                                                         requiredMessage="El código del país para fax es obligatorio y debe tener máximo 3 dígitos" />
                                        </div>
                                        <div class="column">
                                            <p:outputLabel value="Teléfono Fax:" for="telefonoFax" style="color: var(--primary-color);" />
                                            <p:inputText id="telefonoFax" value="#{SettingsController.currentSettings.telefonoFax}" maxlength="20" required="true"
                                                         requiredMessage="El teléfono de fax es obligatorio y no puede tener más de 20 caracteres" />
                                        </div>
                                        <div class="column">
                                            <p:outputLabel value="Correo Electrónico Tributación:" for="correoElectronicoTributacion" style="color: var(--primary-color);" />
                                            <p:inputText id="correoElectronicoTributacion" value="#{SettingsController.currentSettings.correoElectronicoTributacion}"
                                                         maxlength="160" required="true"
                                                         requiredMessage="El correo electrónico es obligatorio y no puede tener más de 160 caracteres" />
                                        </div>
                                        <div class="column">
                                            <p:outputLabel value="Provincia:" for="provincia" style="color: var(--primary-color);" />
                                            <p:selectOneMenu id="provincia" value="#{SettingsController.currentSettings.provincia}" required="true" 
                                                             requiredMessage="La provincia es obligatoria">
                                                <f:selectItem itemLabel="Seleccione la provincia" itemValue="" noSelectionOption="true" />
                                                <f:selectItem itemLabel="San José" itemValue="1" />
                                                <f:selectItem itemLabel="Alajuela" itemValue="2" />
                                                <f:selectItem itemLabel="Cartago" itemValue="3" />
                                                <f:selectItem itemLabel="Heredia" itemValue="4" />
                                                <f:selectItem itemLabel="Guanacaste" itemValue="5" />
                                                <f:selectItem itemLabel="Puntarenas" itemValue="6" />
                                                <f:selectItem itemLabel="Limón" itemValue="7" />
                                            </p:selectOneMenu>
                                        </div>
                                        <div class="column">
                                            <p:outputLabel value="Canton:" for="canton" style="color: var(--primary-color);" />
                                            <p:selectOneMenu id="canton" value="#{SettingsController.currentSettings.canton}" required="true" 
                                                             requiredMessage="El cantón es obligatorio">
                                                <f:selectItem itemLabel="Seleccione el cantón" itemValue="" noSelectionOption="true" />
                                                <!-- Add options based on selected Provincia, e.g. -->
                                                <f:selectItem itemLabel="Santa Cruz" itemValue="3" />
                                                <f:selectItem itemLabel="Cantón de Ejemplo 1" itemValue="1" /> 
                                                <f:selectItem itemLabel="Cantón de Ejemplo 2" itemValue="2" />
                                                <!-- Add more cantones as needed -->
                                            </p:selectOneMenu>
                                        </div>
                                        <div class="column">
                                            <p:outputLabel value="Distrito:" for="distrito" style="color: var(--primary-color);" />
                                            <p:selectOneMenu id="distrito" value="#{SettingsController.currentSettings.distrito}" required="true" 
                                                             requiredMessage="El distrito es obligatorio">
                                                <f:selectItem itemLabel="Seleccione el distrito" itemValue="" noSelectionOption="true" />
                                                <!-- Add options based on selected Canton, e.g. -->
                                                <f:selectItem itemLabel="Tamarindo" itemValue="9" />
                                                <f:selectItem itemLabel="Distrito de Ejemplo 1" itemValue="1" />
                                                <f:selectItem itemLabel="Distrito de Ejemplo 2" itemValue="2" />
                                                <!-- Add more distritos as needed -->
                                            </p:selectOneMenu>
                                        </div>
                                        <div class="column">
                                            <p:outputLabel value="Barrio:" for="barrio" style="color: var(--primary-color);" />
                                            <p:selectOneMenu id="barrio" value="#{SettingsController.currentSettings.barrio}" required="true" 
                                                             requiredMessage="El barrio es obligatorio">
                                                <f:selectItem itemLabel="Seleccione el barrio" itemValue="" noSelectionOption="true" />
                                                <!-- Add options based on selected Distrito, e.g. -->
                                                <f:selectItem itemLabel="Tamarindo" itemValue="15" />
                                                <f:selectItem itemLabel="Barrio de Ejemplo 1" itemValue="1" />
                                                <f:selectItem itemLabel="Barrio de Ejemplo 2" itemValue="2" />
                                                <!-- Add more barrios as needed -->
                                            </p:selectOneMenu>
                                        </div>
                                        <div class="column">
                                            <p:outputLabel value="Dirección Completa:" for="direccionCompleta" style="color: var(--primary-color);" />
                                            <p:inputTextarea id="direccionCompleta" value="#{SettingsController.currentSettings.direccionCompleta}" maxlength="250"
                                                             autoResize="true" required="true" requiredMessage="La dirección es obligatoria y no puede tener más de 250 caracteres" />
                                        </div>
                                        <div class="column">
                                            <p:outputLabel value="Razón Social:" for="razonSocial" style="color: var(--primary-color);" />
                                            <p:inputText id="razonSocial" value="#{SettingsController.currentSettings.razonSocial}" maxlength="100" 
                                                         required="false" placeholder="Puede dejarse vacío"
                                                         title="Razón social de la empresa, puede ser opcional" />
                                        </div>
                                        <div class="column">
                                            <p:outputLabel value="Provedor de Sistemas:" for="provedor" style="color: var(--primary-color);" />
                                            <p:inputText id="provedor" value="#{SettingsController.currentSettings.provedor}" maxlength="100" 
                                                         required="true" placeholder="MERCURIUS"
                                                         title="Debe escribir Mercurius a menos de que haya modificado el sistema." />
                                        </div>
                                        <div class="column">
                                            <p:outputLabel value="Codigo Actividad:" for="codigoActividad" style="color: var(--primary-color);" />
                                            <p:inputText id="codigoActividad" value="#{SettingsController.currentSettings.codigoActividad}" maxlength="100" 
                                                         required="true"
                                                         title="El codigo de Actividad vinculado a la actividad economica." />
                                        </div>
                                        <div class="column">
                                            <div class="buttons">
                                                <p:commandLink class="button is-primary is-rounded is-fullwidth" process="@form" update="mainPanel"
                                                               actionListener="#{SettingsController.saveTributacion()}"  >
                                                    Guardar
                                                </p:commandLink>
                                            </div>
                                        </div>
                                    </div>
                                </div> 
                            </h:form> 

                            <h:form id="Confirmacion" rendered="#{SettingsController.pasoSeleccionConfirmacion}">
                                <div class="columns is-half is-centered is-mobile"> 
                                    <p:card class="card">
                                        <div class="column">
                                            <p:outputLabel value="Nombre del perfil: #{SettingsController.currentSettings.nombrePerfil}" style="color: var(--primary-color);"/>
                                        </div>
                                        <div class="column">
                                            <h:form rendered="#{SettingsController.currentSettings.logo != null}">
                                                <p:outputLabel value="Logo: " style="color: var(--primary-color);"/>
                                                <p:graphicImage value="#{SettingsController.logo}" stream="false" height="100px" width="100px"/>
                                            </h:form>
                                        </div>
                                        <div class="column">
                                            <p:outputLabel value="Correo Electronico: #{SettingsController.currentSettings.correoElectronico}" style="color: var(--primary-color);"/>
                                        </div>
                                        <div class="column">
                                            <div class="buttons">
                                                <p:commandLink class="button is-primary is-rounded is-fullwidth" process="@form" update="mainPanel"
                                                               actionListener="#{SettingsController.saveProfile()}" >
                                                    Confirmar
                                                </p:commandLink> 
                                            </div> 
                                        </div>
                                    </p:card>
                                </div> 
                            </h:form>  

                            <h:form id="CurrentSettings" rendered="#{SettingsController.configuracionActual}">
                                <div class="columns is-centered is-mobile">
                                    <div class="column is-half"> 
                                        <div class="columns is-multiline has-text-centered px-3">
                                            <div class="column is-full">
                                                <p class="title is-5 has-text-centered">Perfil Actual</p>
                                            </div>
                                            <div class="column is-full">
                                                <div class="columns is-multiline px-3">
                                                    <div class="column is-full">
                                                        <p:outputLabel value="Nombre del perfil: #{SettingsController.currentSettings.nombrePerfil}" style="color: var(--primary-color);"/>
                                                    </div>
                                                    <div class="column is-full">
                                                        <h:form rendered="#{SettingsController.currentSettings.logo != null}">
                                                            <p:outputLabel value="Logo: " style="color: var(--primary-color);"/>
                                                            <p:graphicImage value="#{SettingsController.logo}" stream="false" height="100px" width="100px"/>
                                                        </h:form>
                                                    </div>
                                                    <div class="column is-full">
                                                        <p:outputLabel value="Correo Electronico: #{SettingsController.currentSettings.correoElectronico}" style="color: var(--primary-color);"/>
                                                    </div>
                                                </div> 
                                            </div>
                                            <div class="column is-full py-2">
                                                <div class="buttons">
                                                    <p:commandLink actionListener="#{SettingsController.seleccionar('nombre')}" value="Perfil" update="mainPanel"
                                                                   class="button is-rounded is-success "/>

                                                    <p:commandLink actionListener="#{SettingsController.seleccionar('logo')}" value="Logo" update="mainPanel"
                                                                   class="button is-rounded is-info "/>

                                                    <p:commandLink actionListener="#{SettingsController.seleccionar('correo')}" value="Correo" update="mainPanel"
                                                                   class="button is-rounded is-warning "/>

                                                    <p:commandLink actionListener="#{SettingsController.seleccionar('tributacion')}" value="Tributacion" update="mainPanel"
                                                                   class="button is-rounded is-link "/>
 
                                                </div>  
                                            </div>
                                        </div>
                                    </div>
                                </div> 
                            </h:form> 
                        </p:outputPanel>  
                    </div>
                </div>    
            </div>
        </section> 
    </h:body>
</html>
