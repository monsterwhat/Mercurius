<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      data-theme="#{ThemeController.currentTheme}">

    <h:head>
        <title>Menu Principal de Reportes por Correos</title>
        <meta charset="utf-8" name="viewport" content="width=device-width, initial-scale=1"/> 
    </h:head>

    <h:body>

        <ui:include src="/secured/fragments/userBar.xhtml" /> 

        <section class="section">
            <div class="columns is-centered is-vcentered has-text-centered is-multiline">
                <div class="column is-full">
                    <p class="title has-text-centered">
                        Reportes Programados X Correo Electronico
                    </p> 
                </div> 
            </div>
            <div class="card"> 
                <div class="columns is-centered is-vcentered has-text-centered is-multiline"> 
                    <div class="column mx-4">
                        <p:growl showDetail="true" showSummary="true" />
 
                        <h:form id="Reportes">
                            <p:dataTable value="#{reportesProgramadosController.filteredReportesProgramados}" var="reportes" widgetVar="ReportesTableData"
                                         paginator="true" rows="8" paginatorPosition="bottom" id="ReportesTableData"
                                         emptyMessage="No se encontraron reportes con la critería proporcionada"
                                         globalFilterFunction="#{reportesProgramadosController.globalFilterFunction}"
                                         filterBy="#{reportesProgramadosController.filterBy}" reflow="true" selectionMode="single"
                                         selection="#{reportesProgramadosController.selectedReporte}" rowKey="#{reportes.id}">

                                <p:ajax event="rowSelect" update="EditarReporteDialog"/>
                                <p:ajax event="rowUnselect" update="EditarReporteDialog"/>

                                <f:facet name="header">
                                    <p:commandButton value="Crear Reporte Programado" onclick="PF('CrearReporteDialog').show();" actionListener="#{reportesProgramadosController.openNewReporte()}" 
                                             styleClass="rounded-button ui-button-primary" style="width: 100%" process="@form"/>

                                    <p:spacer height="1em"/>

                                    <p:inputText id="globalFilter" onkeyup="PF('ReportesTableData').filter()"
                                                 placeholder="Búsqueda general de todos los campos" style="color: var(--primary-color); width: 100%"/>
                                </f:facet>

                                <p:column exportable="false">
                                    <p:chip id="activo" icon="pi pi-exclamation-circle" style="background: var(--green-500)" rendered="#{reportes.status}"/>
                                    <p:tooltip for="activo" value="Activo" position="top"/>                            
                                    <p:chip id="inactivo" icon="pi pi-times" style="background: var(--red-500);" rendered="#{!reportes.status}"/>
                                    <p:tooltip for="inactivo" value="Inactivo" position="top"/>
                                </p:column>

                                <p:column headerText="ID Reporte" visible="false">
                                    <h:outputText value="#{reportes.id}"/>
                                </p:column>
                                <p:column headerText="Nombre" sortBy="#{reportes.perfil}">
                                    <h:outputText value="#{reportes.perfil}" />
                                </p:column>
                                <p:column headerText="Correos" sortBy="#{reportes.correos}">
                                    <h:outputText value="#{reportes.correos}" />
                                </p:column>
                                <p:column headerText="Frecuencia" sortBy="#{reportes.frecuencia}">
                                    <h:outputText value="#{reportes.frecuencia}" />
                                </p:column>
                                <p:column headerText="Reportes" sortBy="#{reportes.reportes}">
                                    <h:outputText value="#{reportes.reportes}" />
                                </p:column>
                                <p:column headerText="Estado" visible="false" sortBy="#{reportes.status}">
                                    <h:outputText value="#{reportes.status}" />
                                </p:column>
                                <p:column headerText="Acciones" exportable="false">
                                    <div class="buttons">
                                        <p:commandButton styleClass="rounded-button ui-button-success" icon="pi pi-pencil"
                                                         process="@this" onclick="PF('EditarReporteDialog').show();">
                                            <f:setPropertyActionListener value="#{reportes}" target="#{reportesProgramadosController.selectedReporte}" />
                                        </p:commandButton>
                                        <p:commandButton styleClass="rounded-button ui-button-help" icon="pi pi-envelope"
                                                         actionListener="#{reportesProgramadosController.sendReporte()}" process="@this" update="Reportes">
                                            <f:setPropertyActionListener value="#{reportes}" target="#{reportesProgramadosController.selectedReporte}" />
                                        </p:commandButton>
                                        <p:commandButton styleClass="rounded-button ui-button-warning" icon="pi pi-power-off"
                                                         action="#{reportesProgramadosController.toggleReporte()}" process="@this" update="Reportes">
                                            <f:setPropertyActionListener value="#{reportes}" target="#{reportesProgramadosController.selectedReporte}" />
                                        </p:commandButton>
                                        <p:commandButton styleClass="rounded-button ui-button-danger" icon="pi pi-trash"
                                                         onclick="PF('deleteReporteDialog').show();" process="@this"
                                                         rendered="#{SessionController.admin}">
                                            <f:setPropertyActionListener value="#{reportes}" target="#{reportesProgramadosController.selectedReporte}" />
                                        </p:commandButton>
                                    </div>
                                </p:column>
                            </p:dataTable>
                         </h:form>  
                    </div>
                </div>
            </div>
        </section>
         
        <ui:include src="/secured/fragments/Correos/Reportes/CreateReporteDialog.xhtml" />
        <ui:include src="/secured/fragments/Correos/Reportes/EditReporteDialog.xhtml"  />

        <!-- Delete Confirmation Dialog -->
        <p:dialog header="Confirmar Eliminación" widgetVar="deleteReporteDialog" modal="true" resizable="false" width="400">
            <h:form id="deleteForm">
                <div class="field">
                    <p class="has-text-centered">
                        ¿Está seguro que desea eliminar este reporte programado?
                    </p>
                    <p class="has-text-centered has-text-danger">
                        Esta acción no se puede deshacer.
                    </p>
                </div>
                
                <div class="buttons is-centered" style="margin-top: 1.5rem;">
                    <p:commandButton value="Cancelar" styleClass="rounded-button" 
                                     onclick="PF('deleteReporteDialog').hide();" process="@this" />
                    <p:commandButton value="Eliminar" styleClass="rounded-button ui-button-danger" 
                                     action="#{reportesProgramadosController.deleteReporte()}" 
                                     update="Reportes" 
                                     oncomplete="PF('deleteReporteDialog').hide();" />
                </div>
            </h:form>
        </p:dialog>

    </h:body>
</html>
