<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="jakarta.faces.facelets"
      class="#{ThemeController.currentTheme}">

    <h:head>
        <title>Menu Principal Inventario</title>
        <meta charset="utf-8" name="viewport" content="width=device-width, initial-scale=1"/> 

        <script type="text/javascript">
            function printPDF(url) {
                var xhr = new XMLHttpRequest();
                xhr.open('GET', url, true);
                xhr.responseType = 'blob'; // Set the response type to blob
                xhr.onload = function () {
                    if (xhr.status === 200) {
                        var blob = xhr.response;
                        var fileReader = new FileReader();
                        fileReader.onload = function () {
                            var data = this.result;
                            // Create a new window for printing
                            var printWindow = window.open('', '_blank');
                            printWindow.document.write('<iframe width="100%" height="100%" src="data:application/pdf;base64,' + btoa(data) + '" frameborder="0" allowfullscreen="true"></iframe>');
                            printWindow.document.close();
                            printWindow.onload = function () {
                                printWindow.focus();
                                printWindow.print();
                                printWindow.close(); // Close the print window after printing
                            };
                        };
                        fileReader.readAsArrayBuffer(blob); // Read the blob as an ArrayBuffer
                    } else {
                        console.error('Failed to fetch PDF: ' + xhr.statusText);
                    }
                };
                xhr.onerror = function () {
                    console.error('Network error occurred while fetching the PDF.');
                };
                xhr.send();
            }
        </script>

    </h:head>

    <h:body>

        <ui:include src="/secured/fragments/userBar.xhtml" /> 

        <p:growl showDetail="true" showSummary="true" />

        <section class="section">
            <div class="columns is-multiline has-text-centered">
                <div class="column is-full">
                    <p class="title is-3">Inventarios </p> 
                </div>
                <div class="column">
                    <p:tabView id="Inventarios">
                        <p:tab title="Activos">
                            <div class="card">
                                <h:form id="AjustesActivos">

                                    <p:dataTable value="#{InventarioController.filteredInventario}" var="inventario"  widgetVar="InventarioTable"
                                                 paginator="true" rows="8" paginatorPosition="bottom" id="InventarioTableData"
                                                 emptyMessage="No se encontraron registros de inventario con la critería proporcionada"
                                                 globalFilterFunction="#{InventarioController.globalFilterFunction}"
                                                 filterBy="#{InventarioController.filterBy}" reflow="true" selectionMode="single"
                                                 selection="#{InventarioController.selectedInventario}" rowKey="#{inventario.codigo}">
                                        <p:autoUpdate/>
                                        <p:ajax event="rowSelect" update="selectedArticulo"/>

                                        <f:facet name="header">
                                            <div class="buttons">
                                                <p:commandLink action="#{InventarioController.exportPDF}" ajax="false" 
                                                               styleClass="button is-rounded is-info is-fullwidth" 
                                                               oncomplete="printPDF('#{InventarioController.contextPath}/jakarta.faces.resource/reporteAjustesActivos.pdf')">
                                                    <span class="icon-text">
                                                        <span class="icon">
                                                            <i class="pi pi-print"></i>
                                                        </span>
                                                        <span>
                                                            Imprimir
                                                        </span>
                                                    </span>
                                                </p:commandLink>

                                                <p:commandLink onclick="PF('CrearAjusteDialog').show();"  update="crearAjuste" 
                                                               styleClass="button is-rounded is-success is-fullwidth" >
                                                    <span class="icon-text">
                                                        <span class="icon">
                                                            <i class="pi pi-plus"></i>
                                                        </span>
                                                        <span>
                                                            Crear Ajuste
                                                        </span>
                                                    </span>   
                                                </p:commandLink>
                                            </div>

                                            <p:inputText id="globalFilter" onkeyup="PF('InventarioTable').filter()"
                                                         placeholder="Búsqueda general de todos los campos" style="color: var(--primary-color); width: 100%"/>
                                        </f:facet>

                                        <p:column exportable="false">
                                            <p:chip id="unprocessedChip" icon="pi pi-exclamation-circle" style="background: var(--yellow-500)" rendered="#{!inventario.processed}"/>
                                            <p:tooltip for="unprocessedChip" value="Sin Procesar" position="top"/>

                                            <p:chip id="processedChip" icon="pi pi-exclamation-circle" style="background: var(--green-500)" rendered="#{inventario.processed}"/>
                                            <p:tooltip for="processedChip" value="Procesada" position="top"/>

                                            <p:chip id="ActiveChip" icon="pi pi-check" style="background: var(--green-500)" rendered="#{inventario.status}"/>
                                            <p:tooltip for="ActiveChip" value="Activa" position="top"/>

                                            <p:chip id="inActiveChip" icon="pi pi-times" style="background: var(--red-500);" rendered="#{!inventario.status}"/>
                                            <p:tooltip for="inActiveChip" value="Inactiva" position="top"/>
                                        </p:column>

                                        <p:column exportable="false">
                                            <div class="buttons">
                                                <p:commandButton styleClass="rounded-button ui-button-info" icon="pi pi-eye" process="@this"
                                                                 onclick="PF('AjusteDetailsDialog').show();" update="selectedArticulo">
                                                    <f:setPropertyActionListener value="#{inventario}" target="#{InventarioController.selectedInventario}" />
                                                </p:commandButton>
                                            </div>
                                        </p:column>

                                        <p:column headerText="Código" visible="false">
                                            <h:outputText value="#{inventario.codigo}"/>
                                        </p:column>
                                        <p:column headerText="Artículo" sortBy="#{inventario.articulo.nombre}">
                                            <h:outputText value="#{inventario.articulo.nombre}"/>
                                        </p:column>
                                        <p:column headerText="Cantidad" sortBy="#{inventario.cantidad}">
                                            <h:outputText value="#{inventario.cantidad}"/>
                                        </p:column>
                                        <p:column headerText="Tipo Movimiento" sortBy="#{inventario.tipoMovimiento}">
                                            <h:outputText value="#{inventario.tipoMovimiento}"/>
                                        </p:column>
                                        <p:column headerText="Fecha Movimiento" sortBy="#{inventario.fechaMovimiento}">
                                            <h:outputText value="#{inventario.fechaMovimiento}"/>
                                        </p:column>
                                        <p:column headerText="Notas" visible="false">
                                            <h:outputText value="#{inventario.notas}"/>
                                        </p:column>
                                        <p:column headerText="Usuario" visible="false">
                                            <h:outputText value="#{inventario.usuario.username}"/>
                                        </p:column>

                                        <p:column exportable="false">
                                            <p:commandButton styleClass="rounded-button ui-button-warning" icon="pi pi-power-off"
                                                             actionListener="#{InventarioController.deleteInventario()}" rendered="#{SessionController.inventarios}" process="@this" update="InventarioTableData">
                                                <f:setPropertyActionListener value="#{inventario}" target="#{InventarioController.selectedInventario}" />
                                            </p:commandButton>
                                        </p:column>

                                    </p:dataTable> 
                                </h:form>
                            </div> 
                        </p:tab> 
                        <p:tab title="Inactivos">
                            <div class="card">
                                <h:form id="ajustesInactivos">

                                    <p:dataTable value="#{InventarioController.filteredInventarioInactivo}" var="movimiento"  widgetVar="InventarioInactivoTable"
                                                 paginator="true" rows="8" paginatorPosition="bottom" id="InventarioInactivoTableData"
                                                 emptyMessage="No se encontraron artículos con la critería proporcionada"
                                                 globalFilterFunction="#{InventarioController.globalFilterFunction}"
                                                 filterBy="#{InventarioController.filterBy}" reflow="true" selectionMode="single"
                                                 selection="#{InventarioController.selectedInventario}" rowKey="#{movimiento.codigo}">
                                        <p:autoUpdate/>


                                        <p:ajax event="rowSelect" update="selectedArticulo"/>

                                        <f:facet name="header">
                                            <p:inputText id="globalFilter" onkeyup="PF('InventarioInactivoTable').filter()"
                                                         placeholder="Búsqueda general de todos los campos" style="color: var(--primary-color); width: 100%"/>
                                        </f:facet>

                                        <p:column exportable="false">
                                            <p:chip id="sinProcesar" icon="pi pi-exclamation-circle"  style="background: var(--yellow-500)" rendered="#{!movimiento.processed}"/>
                                            <p:tooltip for="sinProcesar" value="Sin Procesar" position="top"/>                            
                                            <p:chip id="inactivo" icon="pi pi-times" style="background: var(--red-500);" rendered="#{!movimiento.status}"/>
                                            <p:tooltip for="inactivo" value="Inactiva" position="top"/>
                                        </p:column>

                                        <p:column headerText="Código" sortBy="#{movimiento.codigo}" visible="false">
                                            <h:outputText value="#{movimiento.codigo}"/>
                                        </p:column>
                                        <p:column headerText="Articulo" sortBy="#{movimiento.articulo.nombre}">
                                            <h:outputText value="#{movimiento.articulo.nombre}"/>
                                        </p:column>
                                        <p:column headerText="Codigo Barra" sortBy="#{movimiento.articulo.codigoBarra}">
                                            <h:outputText value="#{movimiento.articulo.codigoBarra}"/>
                                        </p:column>
                                        <p:column headerText="Cantidad" sortBy="#{movimiento.cantidad}">
                                            <h:outputText value="#{movimiento.cantidad}"/>
                                        </p:column>
                                        <p:column headerText="Fecha" sortBy="#{movimiento.fechaMovimiento}">
                                            <h:outputText value="#{movimiento.fechaMovimiento}"/>
                                        </p:column>

                                        <p:column exportable="false">
                                            <div class="buttons">
                                                <p:commandButton styleClass="rounded-button ui-button-info" icon="pi pi-eye" process="@this"
                                                                 onclick="PF('AjusteDetailsDialog').show();" update="selectedArticulo">
                                                    <f:setPropertyActionListener value="#{movimiento}" target="#{InventarioController.selectedInventario}" />
                                                </p:commandButton>
                                            </div>
                                        </p:column>
                                    </p:dataTable>

                                </h:form>
                            </div>

                        </p:tab>
                        <p:tab title="Procesados">
                            <div class="card">
                                <h:form id="ajustesActuales">

                                    <p:dataTable value="#{InventarioController.filteredInventarioActivoYProcesado}" var="movimiento"  widgetVar="InventarioActivoYProcesadoTable"
                                                 paginator="true" rows="8" paginatorPosition="bottom" id="InventarioActivoYProcesadoTableData"
                                                 emptyMessage="No se encontraron artículos con la critería proporcionada"
                                                 globalFilterFunction="#{InventarioController.globalFilterFunction}" reflow="true"
                                                 filterBy="#{InventarioController.filterBy}" selectionMode="single"
                                                 selection="#{InventarioController.selectedInventario}" rowKey="#{movimiento.codigo}">

                                        <f:facet name="header">
                                            <p:inputText id="globalFilter" onkeyup="PF('InventarioActivoYProcesadoTable').filter()"
                                                         placeholder="Búsqueda general de todos los campos" style="color: var(--primary-color); width: 100%"/>
                                        </f:facet>

                                        <p:ajax event="rowSelect" update="selectedArticulo"/>

                                        <p:column exportable="false" width="5%">
                                            <p:chip id="unprocessedChip" icon="pi pi-exclamation-circle" style="background: var(--red-500);" rendered="#{!movimiento.processed}"/>
                                            <p:tooltip for="unprocessedChip" value="Sin Procesar" position="top"/>

                                            <p:chip id="processedChip" icon="pi pi-exclamation-circle" style="background: var(--green-500)" rendered="#{movimiento.processed}"/>
                                            <p:tooltip for="processedChip" value="Procesada" position="top"/>

                                            <p:chip id="ActiveChip" icon="pi pi-check" style="background: var(--green-500)" rendered="#{movimiento.status}"/>
                                            <p:tooltip for="ActiveChip" value="Activa" position="top"/>

                                            <p:chip id="inActiveChip" icon="pi pi-times" style="background: var(--red-500);" rendered="#{!movimiento.status}"/>
                                            <p:tooltip for="inActiveChip" value="Inactiva" position="top"/>
                                        </p:column>

                                        <p:column exportable="false" width="5%">
                                            <div class="buttons">
                                                <p:commandButton styleClass="rounded-button ui-button-info" icon="pi pi-eye"
                                                                 process="@this" onclick="PF('AjusteDetailsDialog').show();" update="selectedArticulo">
                                                    <f:setPropertyActionListener value="#{articulo}" target="#{InventarioController.selectedInventario}" />
                                                </p:commandButton>
                                            </div>
                                        </p:column>

                                        <p:column headerText="Código" sortBy="#{movimiento.codigo}" visible="false">
                                            <h:outputText value="#{movimiento.codigo}"/>
                                        </p:column>
                                        <p:column headerText="Nombre" sortBy="#{movimiento.articulo.nombre}">
                                            <h:outputText value="#{movimiento.articulo.nombre}"/>
                                        </p:column>
                                        <p:column headerText="Codigo Barra" sortBy="#{movimiento.articulo.codigoBarra}">
                                            <h:outputText value="#{movimiento.articulo.codigoBarra}"/>
                                        </p:column>
                                        <p:column headerText="Cantidad" sortBy="#{movimiento.cantidad}">
                                            <h:outputText value="#{movimiento.cantidad}"/>
                                        </p:column>
                                        <p:column headerText="Fecha" sortBy="#{movimiento.fechaMovimiento}">
                                            <h:outputText value="#{movimiento.fechaMovimiento}"/>
                                        </p:column>

                                        <p:column exportable="false" width="5%">
                                            <div class="buttons">
                                                <p:commandButton styleClass="rounded-button ui-button-danger" icon="pi pi-undo" 
                                                                 process="@this"  update="selectedArticulo InventarioActivoYProcesadoTableData" actionListener="#{InventarioController.unprocess()}">
                                                    <f:setPropertyActionListener value="#{articulo}" target="#{InventarioController.selectedInventario}" />
                                                </p:commandButton>
                                            </div>
                                        </p:column>

                                    </p:dataTable>

                                </h:form>
                            </div> 
                        </p:tab>
                        <p:tab title="Pendientes">
                            <div class="card">
                                <h:form id="inventarioPendiente">

                                    <p:dataTable value="#{InventarioController.filteredInventarioSinProcesar}" var="movimiento"  widgetVar="InventariosPendientesTable"
                                                 paginator="true" rows="8" clientCache="true" lazy="true" id="InventariosPendientesTableData"
                                                 emptyMessage="No se encontraron artículos con la critería proporcionada" stripedRows="true"
                                                 globalFilterFunction="#{InventarioController.globalFilterFunction}" reflow="true"
                                                 filterBy="#{InventarioController.filterBy}" touchable="false" selectionMode="single"
                                                 selection="#{InventarioController.selectedInventario}" rowKey="#{movimiento.codigo}">

                                        <p:ajax event="rowSelect" update="RevisionMovimientoDialog"/>

                                        <f:facet name="header">

                                            <p:commandLink actionListener="#{InventarioController.procesadoRapido()}" 
                                                             styleClass="button is-success is-rounded is-fullwidth" update="RevisionMovimientoDialog"
                                                              onclick="PF('RevisionMovimientosDialog').show();" process="@this">
                                                <span class="icon-text">
                                                    <span class="icon">
                                                        <i class="pi pi-sync"></i>
                                                    </span>
                                                    <span>
                                                        Procesado Rapido
                                                    </span>
                                                </span>
                                            </p:commandLink>

                                            <p:spacer height="1em"/>

                                            <p:inputText id="globalFilter" onkeyup="PF('InventariosPendientesTable').filter()"
                                                         placeholder="Búsqueda general de todos los campos" style="color: var(--primary-color); width: 100%"/>

                                        </f:facet>

                                        <p:column exportable="false">
                                            <p:commandButton value="Procesar" styleClass="rounded-button ui-button-secondary" update="RevisionMovimientoDialog"
                                                             icon="pi pi-sync" onclick="PF('RevisionMovimientoDialog').show();" process="@this">
                                                <f:setPropertyActionListener value="#{movimiento}" target="#{InventarioController.selectedInventario}" />
                                            </p:commandButton>
                                        </p:column>

                                        <p:column headerText="Código" sortBy="#{movimiento.codigo}" visible="false">
                                            <h:outputText value="#{movimiento.codigo}"/>
                                        </p:column>
                                        <p:column headerText="Nombre" sortBy="#{movimiento.articulo.nombre}">
                                            <h:outputText value="#{movimiento.articulo.nombre}"/>
                                        </p:column>
                                        <p:column headerText="Codigo Barra" sortBy="#{movimiento.articulo.codigoBarra}" visible="false">
                                            <h:outputText value="#{movimiento.articulo.codigoBarra}"/>
                                        </p:column>
                                        <p:column headerText="Cantidad" sortBy="#{movimiento.cantidad}">
                                            <h:outputText value="#{movimiento.cantidad}"/>
                                        </p:column>
                                        <p:column headerText="Fecha" sortBy="#{movimiento.fechaMovimiento}">
                                            <h:outputText value="#{movimiento.fechaMovimiento}"/>
                                        </p:column>

                                    </p:dataTable>
                                </h:form>
                            </div>

                        </p:tab>
                    </p:tabView>
                </div>
            </div>
        </section> 

        <ui:include src="/secured/fragments/Inventario/Activos/verDetallesDeAjuste.xhtml"/>
        <ui:include src="/secured/fragments/Inventario/Activos/CreateMovimientoDialog.xhtml"/>    
        <ui:include src="/secured/fragments/Inventario/PendientesRevision/DialogoRevisionInventario.xhtml"/>
        <ui:include src="/secured/fragments/Inventario/PendientesRevision/DialogoRevisionInventarios.xhtml"/>

    </h:body>
</html>
