<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      class="#{ThemeController.currentTheme}">

    <h:head>
        <title>Menu Principal Catalago de Bienes y Servicios</title>
        <meta charset="utf-8" name="viewport" content="width=device-width, initial-scale=1"/> 
    </h:head>

    <h:body>

        <ui:include src="/secured/fragments/userBar.xhtml" /> 

        <p:growl showDetail="true" showSummary="true" />

        <section class="section">

            <div class="columns is-centered is-vcentered has-text-centered is-multiline">
                <div class="column is-full">
                    <p class="title has-text-centered">
                        Catalogo de Articulos, Bienes Y Servicios (CAByS)
                    </p> 
                </div>  
                <div class="card"> 
                    <div class="column is-full">
                        <h:form id="cabys">

                            <p:outputPanel rendered="#{empty CabysController.catalogo}">
                                <p:spacer height="1em"/>

                                <p:commandLink process="@this" update="CabysTable cabys cabysPanel"
                                               actionListener="#{CabysController.cabysListApi}" 
                                               class="button is-danger is-rounded is-fullwidth"
                                               >
                                    <span class="icon-text">
                                        <span class="icon">
                                            <i class="pi pi-cloud-download"></i>
                                        </span>
                                        <span>
                                            Cargar Catálogo de Bienes y Servicios
                                        </span>
                                    </span> 
                                </p:commandLink>

                                <p:spacer height="1em"/>

                            </p:outputPanel>

                            <p:outputPanel id="cabysPanel" rendered="#{not empty CabysController.catalogo}">
                                <div class="columns is-centered is-mobile">
                                    <div class="card">
                                        <div class="column is-full">
                                            <p class="is-primary">Seleccione las casillas que desee mostrar</p>

                                            <p:spacer height="1em"/>

                                            <div class="columns">
                                                <div class="column is-full">
                                                    <p:selectManyCheckbox id="ColumnPicker" value="#{CabysController.selectedOptions}"
                                                                          widgetVar="blub" >
                                                        <p:ajax listener="#{CabysController.selectedOptionsChanged}" update="cabys"/>
                                                        <f:selectItem itemLabel="Codigo" itemValue="codigo"/>
                                                        <f:selectItem itemLabel="Categoria" itemValue="categoria"/>
                                                        <f:selectItem itemLabel="Descripcion" itemValue="descripcion"/>
                                                        <f:selectItem itemLabel="Impuesto" itemValue="impuesto"/>
                                                    </p:selectManyCheckbox>
                                                </div> 
                                            </div>
                                        </div>
                                    </div> 
                                </div>

                                <div class="card">
                                    <p:dataTable value="#{CabysController.filteredCabys}" var="cabys"  widgetVar="CabysTable" clientCache="true"
                                                 paginator="true" rows="10" paginatorPosition="bottom" id="CabysTable" reflow="true"
                                                 emptyMessage="No se encontraron bienes ni servicios con la critería proporcionada"
                                                 globalFilterFunction="#{CabysController.globalFilterFunction}" draggableColumns="true"
                                                 filterBy="#{CabysController.filterBy}" scrollable="true" showGridlines="true" selectionMode="single"
                                                 selection="#{CabysController.selectedCabys}" rowKey="#{cabys.codigo}">

                                        <f:facet name="header">
                                            <p:commandLink class="button is-success is-rounded is-fullwidth" ajax="false">
                                                <p:dataExporter type="xlsx" target="CabysTable" fileName="Cabys-Mercurius" />
                                                <span class="icon-text">
                                                    <span class="icon">
                                                        <i class="pi pi-file-excel"></i>
                                                    </span>
                                                    <span>
                                                        Exportar Excel
                                                    </span>
                                                </span> 
                                            </p:commandLink>

                                            <p:spacer height="1em"/>

                                            <p:inputText id="globalFilter" onkeyup="PF('CabysTable').filter()"
                                                         placeholder="Búsqueda general de todos los campos" style="color: var(--primary-color); width: 100%"/>
                                        </f:facet>

                                        <p:column headerText="Código" sortBy="#{cabys.codigo}" rendered="#{not empty CabysController.selectedOptions and CabysController.isSelected('codigo')}">
                                            <h:outputText value="#{cabys.codigo}" />
                                        </p:column>
                                        <p:column headerText="Categoría" sortBy="#{cabys.categorias}" rendered="#{not empty CabysController.selectedOptions and CabysController.isSelected('categoria')}">
                                            <h:outputText value="#{cabys.categorias}" />
                                        </p:column>
                                        <p:column headerText="Descripción Categoría" sortBy="#{cabys.descripcion}" rendered="#{not empty CabysController.selectedOptions and CabysController.isSelected('descripcion')}">
                                            <h:outputText value="#{cabys.descripcion}" />
                                        </p:column>
                                        <p:column headerText="Impuesto" sortBy="#{cabys.impuesto}" rendered="#{not empty CabysController.selectedOptions and CabysController.isSelected('impuesto')}">
                                            <h:outputText value="#{cabys.impuesto}" />
                                        </p:column>
                                        <p:column headerText="Estado" sortBy="#{cabys.estado}" rendered="false">
                                            <h:outputText value="#{cabys.estado}" />
                                        </p:column>

                                    </p:dataTable>
                                </div>
                            </p:outputPanel> 
                        </h:form>
                    </div>
                </div>
            </div>
        </section> 

    </h:body>
</html>
