<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      class="#{ThemeController.currentTheme}">

    <h:head>
        <title>Reportes de Ventas X Departamentos</title>
        <meta charset="utf-8" name="viewport" content="width=device-width, initial-scale=1"/> 
        <script>
            PrimeFaces.locales['es'] = {
                monthNames: ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'],
                monthNamesShort: ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'],
                dayNames: ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'],
                dayNamesShort: ['Dom', 'Lun', 'Mar', 'Mie', 'Jue', 'Vie', 'Sab'],
                dayNamesMin: ['D', 'L', 'M', 'X', 'J', 'V', 'S'],
                weekHeader: 'Semana',
                firstDay: 1,
                isRTL: false,
                showMonthAfterYear: false,
                yearSuffix: '',
                timeOnlyTitle: 'Sólo hora',
                timeText: 'Tiempo',
                hourText: 'Hora',
                minuteText: 'Minuto',
                secondText: 'Segundo',
                millisecondText: 'Milisegundo',
                ampm: false,
                month: 'Mes',
                week: 'Semana',
                day: 'Día',
                allDayText: 'Todo el día',
                today: 'Hoy',
                now: 'Ahora',
                clear: 'Limpiar',
                aria: {
                    close: 'Cerrar',
                    previous: 'Anterior',
                    next: 'Siguiente',
                }
            };
        </script>
    </h:head>

    <h:body> 

        <ui:include src="/secured/fragments/userBar.xhtml" /> 

        <section class="section">

            <div class="columns is-multiline has-text-centered">
                <div class="column is-full">
                    <p class="title is-3">Reporte de ventas por departamentos</p> 
                </div>
                <div class="column">  
                    <div class="card"> 
                        <p:outputPanel id="grid">
                            <h:form rendered="#{!reportesDiariosController.status}">
                                <p:growl showDetail="true" showSummary="true" />
                                <p:messages/>

                                <p:card title="Seleccione el usuario y las fechas a consultar" style="width: 50%; display: inline-block; text-align: left;">
                                    <h:panelGrid columns="2" style="text-align: center; width: 100%">
                                        <p:selectOneMenu id="selectOneMenu" label="Seleccionar Usuarios" style="width: 100%"
                                                         value="#{reportesDiariosController.usuarioSelecionadoId}">
                                            <f:selectItems value="#{reportesDiariosController.usuarios}" itemValue="#{usuarios.id}" var="usuarios" itemLabel="#{usuarios.username}"/>
                                        </p:selectOneMenu>

                                        <p:datePicker id="datePicker" value="#{reportesDiariosController.range}" readonlyInput="true" selectionMode="range" showButtonBar="true" locale="es" 
                                                      monthNavigator="true" yearNavigator="true" showWeek="true" style="width: 100%"/>
                                    </h:panelGrid>
                                    <p:spacer height="1em"/>
                                    <h:panelGroup>
                                        <p:commandLink actionListener="#{reportesDiariosController.cargarVentasDepartamento()}"
                                                       update="grid" class="button is-fullwidth is-primary is-rounded">
                                            <span class="icon-text">
                                                <span class="icon">
                                                    <i class="pi pi-cloud-download"></i>
                                                </span>
                                                <span>
                                                    Cargar Reportes
                                                </span>
                                            </span> 
                                        </p:commandLink>
                                    </h:panelGroup>
                                </p:card>

                            </h:form>

                            <h:form rendered="#{reportesDiariosController.status}">

                                <p:commandLink class="button is-rounded is-fullwidth is-success" ajax="false">
                                    <p:dataExporter type="xlsx" target="reportes" fileName="Reportes-Mercurius" />
                                    <span class="icon-text">
                                        <span class="icon">
                                            <i class="pi pi-file-excel"></i>
                                        </span>
                                        <span>
                                            Exportar Excel
                                        </span>
                                    </span> 
                                </p:commandLink>
                                <!--TODO FIX THIS!! -->
                                <p:commandLink actionListener="#{reportesDiariosController.imprimirReporteDepartamentos()}"
                                                 class="button is-fullwidth is-success is-rounded" ajax="false">
                                    <span class="icon-text">
                                        <span class="icon">
                                            <i class="pi pi-print"></i>
                                        </span>
                                        <span>
                                            Imprimir
                                        </span>
                                    </span> 
                                </p:commandLink>

                                <p:spacer height="1em"/>
                                <p:dataTable id="reportes" showGridlines="true"  stripedRows="true" value="#{reportesDiariosController.reportes}" reflow="true" var="value">

                                    <f:facet name="header">
                                        <p:outputLabel  value="Reportes de #{reportesDiariosController.getFecha(0)} hasta #{reportesDiariosController.getFecha(1)}"/>
                                    </f:facet>

                                    <p:column headerText="Departamento" >
                                        <h:outputText value="#{value.nombre}" />
                                    </p:column>
                                    <p:column headerText="Total">
                                        <h:outputText value="#{value.cantidad}"/>
                                    </p:column>
                                    <p:column headerText="Porcentaje">
                                        <h:outputText value="#{value.porcentaje}"/>
                                    </p:column>

                                    <f:facet name="footer">
                                        <p:outputLabel  value="Total #{reportesDiariosController.totalReportes()}"/>
                                    </f:facet>

                                </p:dataTable>

                            </h:form>
                        </p:outputPanel>
                    </div> 
                </div>
            </div>
        </section> 
    </h:body>
</html>
