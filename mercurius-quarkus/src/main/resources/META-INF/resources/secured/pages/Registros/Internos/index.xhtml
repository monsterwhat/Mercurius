<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      data-theme="#{ThemeController.currentTheme}">

    <h:head>
        <title>Registros Internos</title>
        <meta charset="utf-8" name="viewport" content="width=device-width, initial-scale=1"/> 
    </h:head>

    <h:body> 

        <ui:include src="/secured/fragments/userBar.xhtml" /> 

        <p:growl id="growl" showDetail="true" showSummary="true" />

        <section class="section">

            <div class="columns is-multiline has-text-centered">
                <div class="column is-full">
                    <p class="title is-3">Registros Internos</p> 
                </div>
                <div class="column">  
                    <div class="card"> 

                        <h:form id="registrosInternos">

                            <p:growl showDetail="true" showSummary="true" />

                            <p:dataTable value="#{alertasController.alertas}" var="registro" widgetVar="RegistrosTableData"
                                        paginator="true" rows="20" paginatorPosition="bottom" id="RegistrosTableData"
                                        emptyMessage="No se encontraron registros"
                                        lazy="false" reflow="true"
                                        rowKey="#{registro.codigo}"
                                        sortBy="#{registro.timestamp}" sortOrder="descending"
                                        globalFilterFunction="#{alertasController.globalFilterFunction}"
                                        filterBy="#{alertasController.filterBy}">

                                <f:facet name="header"> 

                                    <p:commandLink class="button is-fullwidth is-rounded is-success" 
                                                   ajax="false">
                                        <p:dataExporter type="xlsx" target="RegistrosTableData" fileName="Registros-Internos-Mercurius-Excel" />
                                        <span class="icon-text">
                                            <span class="icon">
                                                <i class="pi pi-file-excel"></i>
                                            </span>
                                            <span>
                                                Exportar Excel
                                            </span>
                                        </span> 
                                    </p:commandLink>

                                    <p:spacer height="1em"/>

                                    <p:inputText id="globalFilter" onkeyup="PF('RegistrosTableData').filter()"
                                                 placeholder="Búsqueda general" style="color: var(--primary-color); width: 100%"/>

                                </f:facet>

                                <p:column headerText="Código" visible="false" >
                                    <h:outputText value="#{registro.codigo}"/>
                                </p:column>
                                <p:column headerText="Fecha/Hora" sortBy="#{registro.timestamp}" >
                                    <h:outputText value="#{registro.timestampAsDate}">
                                        <f:convertDateTime pattern="yyyy-MM-dd HH:mm:ss"/>
                                    </h:outputText>
                                </p:column>
                                <p:column headerText="Tipo" sortBy="#{registro.tipo}" filterBy="#{registro.tipo}">
                                    <h:outputText value="#{registro.tipo}"/>
                                </p:column>
                                <p:column headerText="Mensaje" filterBy="#{registro.mensaje}">
                                    <h:outputText value="#{registro.mensaje}"/>
                                </p:column>
                                <p:column headerText="Usuario" sortBy="#{registro.user.username}">
                                    <h:outputText value="#{registro.user != null ? registro.user.username : 'Sistema'}"/>
                                </p:column>
                                <p:column headerText="Origen" sortBy="#{registro.source}" filterBy="#{registro.source}">
                                    <h:outputText value="#{registro.source}"/>
                                </p:column>
                                <p:column headerText="Vista" width="80">
                                    <p:commandLink class="button is-rounded is-small" 
                                                   actionListener="#{alertasController.toggleVista(registro)}" 
                                                   process="@this" 
                                                   update="RegistrosTableData"
                                                   rendered="#{!registro.vista}">
                                        <span class="icon">
                                            <i class="pi pi-eye-slash"></i>
                                        </span>
                                    </p:commandLink>
                                    <p:commandLink class="button is-rounded is-small is-success" 
                                                   actionListener="#{alertasController.toggleVista(registro)}" 
                                                   process="@this" 
                                                   update="RegistrosTableData"
                                                   rendered="#{registro.vista}">
                                        <span class="icon">
                                            <i class="pi pi-eye"></i>
                                        </span>
                                    </p:commandLink>
                                </p:column>
                                <p:column headerText="Cambios" width="90" rendered="#{SessionController.admin}">
                                    <p:commandButton icon="pi pi-history" 
                                                     styleClass="rounded-button ui-button-info"
                                                     process="@this"
                                                     rendered="#{alertasController.hasDiff(registro)}"
                                                     actionListener="#{alertasController.openDiff(registro)}"
                                                     oncomplete="PF('DiffDialog').show()"
                                                     update="DiffDialog"/>
                                </p:column>
                            </p:dataTable>
                        </h:form>
                    </div> 
                </div> 
            </div> 
        </section>

        <p:dialog header="Detalle de Cambios" widgetVar="DiffDialog" modal="true" 
                  dynamic="true" cache="false" closable="true" fitViewport="true" 
                  responsive="true" width="700">
            <h:form id="diffForm">
                <p:outputPanel rendered="#{not empty alertasController.selectedAlerta}">
                    <div style="margin-bottom: 1rem;">
                        <p><strong>Tipo:</strong> #{alertasController.selectedAlerta.tipo}</p>
                        <p><strong>Mensaje:</strong> #{alertasController.selectedAlerta.mensaje}</p>
                        <p><strong>Fecha:</strong> 
                            <h:outputText value="#{alertasController.selectedAlerta.timestampAsDate}">
                                <f:convertDateTime pattern="yyyy-MM-dd HH:mm:ss"/>
                            </h:outputText>
                        </p>
                        <p><strong>Origen:</strong> #{alertasController.selectedAlerta.source}</p>
                    </div>

                    <p:dataTable value="#{alertasController.currentDiff.entrySet().toArray()}" 
                                 var="entry" emptyMessage="No hay cambios registrados"
                                 rendered="#{not empty alertasController.currentDiff}">
                        <p:column headerText="Campo" width="200">
                            <h:outputText value="#{alertasController.fieldLabel(entry.key)}" style="font-weight: bold;"/>
                        </p:column>
                        <p:column headerText="Antes" width="250">
                            <h:outputText value="#{entry.value[0]}" style="color: var(--red-500);"/>
                        </p:column>
                        <p:column headerText="Después" width="250">
                            <h:outputText value="#{entry.value[1]}" style="color: var(--green-500);"/>
                        </p:column>
                    </p:dataTable>

                    <p:outputPanel rendered="#{empty alertasController.currentDiff}">
                        <p class="has-text-centered has-text-grey" style="padding: 2rem;">
                            No hay cambios detallados disponibles para este registro.
                        </p>
                    </p:outputPanel>
                </p:outputPanel>
            </h:form>
        </p:dialog>

    </h:body>
</html>
