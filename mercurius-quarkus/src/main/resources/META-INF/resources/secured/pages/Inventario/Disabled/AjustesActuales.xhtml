<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<h:head>
    <title>Catalogo de Ajustes Actuales</title>
    <h:outputStylesheet name="primefaces/themes/#{ThemeController.currentTheme}/theme.css" />
</h:head>

<h:body>
    <p:panelGrid columns="1" layout="flex">
        <p:row>
            <p:column>
                <ui:include src="/secured/fragments/userBar.xhtml" /> 
            </p:column>
        </p:row> 
        
        <p:growl showDetail="true" showSummary="true" />

        <p:row>
            <p:column>
                <p:card>
                    <h:form id="ajustesActuales">
                        
                    <p:dataTable value="#{InventarioController.filteredInventarioActivoYProcesado}" var="movimiento"  widgetVar="InventarioActivoYProcesadoTable"
                                 paginator="true" rows="8" paginatorPosition="bottom" id="InventarioActivoYProcesadoTableData"
                                 emptyMessage="No se encontraron artículos con la critería proporcionada"
                                 globalFilterFunction="#{InventarioController.globalFilterFunction}" reflow="true"
                                 filterBy="#{InventarioController.filterBy}" selectionMode="single"
                                 selection="#{InventarioController.selectedInventario}" rowKey="#{movimiento.codigo}">

                        <f:facet name="header">
                            <p:inputText id="globalFilter" onkeyup="PF('InventarioActivoYProcesadoTable').filter()"
                                         placeholder="Búsqueda general de todos los campos" style="color: var(--primary-color); width: 100%"/>
                        </f:facet>
                        
                        <p:ajax event="rowSelect" update="selectedArticulo"/>

                        <p:column exportable="false" width="5%">
                            <p:chip id="unprocessedChip" icon="pi pi-exclamation-circle" style="background: var(--red-500);" rendered="#{!movimiento.processed}"/>
                            <p:tooltip for="unprocessedChip" value="Sin Procesar" position="top"/>

                            <p:chip id="processedChip" icon="pi pi-exclamation-circle" style="background: var(--green-500)" rendered="#{movimiento.processed}"/>
                            <p:tooltip for="processedChip" value="Procesada" position="top"/>

                            <p:chip id="ActiveChip" icon="pi pi-check" style="background: var(--green-500)" rendered="#{movimiento.status}"/>
                            <p:tooltip for="ActiveChip" value="Activa" position="top"/>

                            <p:chip id="inActiveChip" icon="pi pi-times" style="background: var(--red-500);" rendered="#{!movimiento.status}"/>
                            <p:tooltip for="inActiveChip" value="Inactiva" position="top"/>
                        </p:column>
                        
                        <p:column exportable="false" width="5%">
                            <div class="buttons">
                                <p:commandButton styleClass="rounded-button ui-button-info" icon="pi pi-eye"
                                process="@this" onclick="PF('AjusteDetailsDialog').show();" update="selectedArticulo">
                                    <f:setPropertyActionListener value="#{articulo}" target="#{InventarioController.selectedInventario}" />
                                </p:commandButton>
                            </div>
                        </p:column>

                        <p:column headerText="Código" sortBy="#{movimiento.codigo}" visible="false">
                            <h:outputText value="#{movimiento.codigo}"/>
                        </p:column>
                        <p:column headerText="Nombre" sortBy="#{movimiento.articulo.nombre}">
                            <h:outputText value="#{movimiento.articulo.nombre}"/>
                        </p:column>
                        <p:column headerText="Codigo Barra" sortBy="#{movimiento.articulo.codigoBarra}">
                            <h:outputText value="#{movimiento.articulo.codigoBarra}"/>
                        </p:column>
                        <p:column headerText="Cantidad" sortBy="#{movimiento.cantidad}">
                            <h:outputText value="#{movimiento.cantidad}"/>
                        </p:column>
                        <p:column headerText="Fecha" sortBy="#{movimiento.fechaMovimiento}">
                            <h:outputText value="#{movimiento.fechaMovimiento}"/>
                        </p:column>
                        
                        <p:column exportable="false" width="5%">
                            <div class="buttons">
                                <p:commandButton styleClass="rounded-button ui-button-danger" icon="pi pi-undo" 
                                                 process="@this"  update="selectedArticulo InventarioActivoYProcesadoTableData" actionListener="#{InventarioController.unprocess()}">
                                    <f:setPropertyActionListener value="#{articulo}" target="#{InventarioController.selectedInventario}" />
                                </p:commandButton>
                            </div>
                        </p:column>

                    </p:dataTable>
                        
                    </h:form>
                </p:card>
            </p:column>
        </p:row>
    </p:panelGrid>
        <ui:include src="/secured/fragments/Inventario/Activos/verDetallesDeAjuste.xhtml"/>
</h:body>
</html>
