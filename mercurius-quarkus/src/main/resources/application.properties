# Quarkus Configuration for Mercurius

# HTTP Configuration
quarkus.http.root-path=/Mercurius
quarkus.http.port=8081

# Database Configuration
quarkus.datasource.db-kind=mysql
quarkus.datasource.username=mercurius
quarkus.datasource.password=Mercurius@1!
quarkus.datasource.jdbc.url=jdbc:mysql://localhost:3306/mercurius?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Costa_Rica

# Hibernate ORM Configuration
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.sql-load-script=META-INF/startup-script.sql
  
# Suppress MyFaces verbose logging
org.apache.myfaces.LOG_WEB_CONTEXT_PARAMS=false 

# PrimeFaces Configuration
primefaces.theme=bootstrap
primefaces.cookiessamesite=Strict
primefaces.uploader=auto
primefaces.dir=ltr
primefaces.locale=en
primefaces.SUBMIT=partial
primefaces.MOVE_SCRIPTS_TO_BOTTOM=true
primefaces.THEME=bootstrap
primefaces.PUBLIC_KEY=null
 
# Logging Configuration
quarkus.log.level=INFO
quarkus.log.category."org.hibernate".level=WARN
quarkus.log.category."org.apache.myfaces".level=INFO
quarkus.log.category."io.quarkus".level=INFO

# Development Configuration
%dev.quarkus.hibernate-orm.schema-management.strategy=update
%dev.quarkus.log.level=INFO
%dev.quarkus.log.category."org.hibernate".level=WARN
%dev.quarkus.log.category."org.apache.myfaces".level=INFO

# Suppress MyFaces verbose logging in development
%dev.org.apache.myfaces.LOG_WEB_CONTEXT_PARAMS=false

# Test Configuration
%test.quarkus.hibernate-orm.schema-management.strategy=update
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:test;DB_CLOSE_DELAY=-1
%test.quarkus.datasource.db-kind=h2

# Suppress MyFaces verbose logging in tests
%test.org.apache.myfaces.LOG_WEB_CONTEXT_PARAMS=false

# Application Configuration
quarkus.application.name=Mercurius
quarkus.application.version=1.0-SNAPSHOT

# Java 25 compatibility
net.bytebuddy.experimental=true
quarkus.http.limits.max-body-size=100M
quarkus.http.limits.max-form-attribute-size=100M

# Email Configuration (for future use)
# quarkus.mailer.host=smtp.gmail.com
# quarkus.mailer.port=587
# quarkus.mailer.username=your-email@gmail.com
# quarkus.mailer.password=your-app-password
# quarkus.mailer.start-tls=true

# Scheduler Configuration
quarkus.scheduler.enabled=false

# Performance Configuration
quarkus.datasource.jdbc.max-size=20
quarkus.datasource.jdbc.min-size=5
quarkus.hibernate-orm.jdbc.statement-fetch-size=50
  
# JVM Memory Configuration (for production)
quarkus.jvm.args=-Xms512m -Xmx2g -XX:ReservedCodeCacheSize=256m -XX:+UseG1GC

# Java 25 compatibility
net.bytebuddy.experimental=true

# Completely disable dev UI
quarkus.dev-ui.enabled=false
%dev.quarkus.dev-ui.enabled=false
%test.quarkus.dev-ui.enabled=false

# AWT and System Configuration for Tray Icon (Windows only)
%dev.quarkus.jvm.args=-Djava.awt.headless=false
%prod.quarkus.jvm.args=-Djava.awt.headless=false

# MyFaces Configuration
myfaces.config.source=web-fragment

# Uber JAR Configuration 
quarkus.package.jar.enabled=true
quarkus.package.jar.type=uber-jar