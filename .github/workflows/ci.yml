name: Build

on:
  push:
    branches: [main, Master, master]
    paths:
      - 'mercurius-quarkus/**'
      - '.github/workflows/ci.yml'
      - '!**/*.md'
  pull_request:
    branches: [main, Master, master]
    paths:
      - 'mercurius-quarkus/**'
      - '.github/workflows/ci.yml'
      - '!**/*.md'

jobs:
  build:
    name: Build uber jar
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mercurius-quarkus

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Package
        run: mvn -B -ntp package -DskipTests

      - name: Stage artifact
        run: cp target/mercurius-quarkus-runner.jar Mercurius-runner.jar

      - name: Upload runnable uber jar
        uses: actions/upload-artifact@v5
        with:
          name: Mercurius-runner
          path: mercurius-quarkus/Mercurius-runner.jar
          if-no-files-found: error
          retention-days: 30
