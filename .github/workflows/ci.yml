name: Build

on:
  push:
    branches: [main, Master, master]
    paths:
      - 'app/**'
      - '.github/workflows/ci.yml'
      - '!**/*.md'
  pull_request:
    branches: [main, Master, master]
    paths:
      - 'app/**'
      - '.github/workflows/ci.yml'
      - '!**/*.md'

jobs:
  build:
    name: Build uber jar
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Package
        run: mvn -B -ntp package -DskipTests

      - name: Stage artifact
        run: cp target/mercurius-quarkus-runner.jar Mercurius-runner.jar

      - name: Upload runnable uber jar
        uses: actions/upload-artifact@v5
        with:
          name: Mercurius-runner
          path: app/Mercurius-runner.jar
          if-no-files-found: error
          retention-days: 30

  test:
    name: Test suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    # The suite is NOT self-contained. app/src/main/resources/application.properties
    # pins the %test datasource to jdbc:postgresql://localhost:5433/mercurius_test and
    # explicitly disables Dev Services (%test.quarkus.datasource.devservices.enabled=false),
    # so the database has to be provided here as a service container. Deliberately a
    # service container rather than a testcontainers/Dev Services opt-in: the properties
    # file turns Dev Services off for %test and the test job must exercise the same
    # connection contract the developers use locally.
    services:
      postgres:
        # Pinned to 16 on purpose. The suite has two tests that shell out to the real
        # pg_dump client and only skip when it is absent (support/PgDumpAvailability).
        # ubuntu-latest DOES ship postgresql-client, so they run for real here, and
        # pg_dump refuses to dump a server newer than the client ("server version
        # mismatch"). ubuntu-24.04 currently carries PG 16, so a 16 service matches.
        # PG 16 also satisfies the documented PostgreSQL 14+ requirement.
        image: postgres:16
        env:
          # POSTGRES_USER/POSTGRES_PASSWORD create the role AND its password, so no
          # step has to set it later. This role is a superuser of the container
          # cluster, which is more permissive than the local dev setup (README
          # creates a plain role and needs an explicit GRANT) - deliberate, so the
          # suite can never go red for a permissions-only reason.
          POSTGRES_USER: mercurius
          POSTGRES_PASSWORD: 'Mercurius@1!'
          # The stock image only ever creates ONE database. %test needs mercurius_test;
          # the app database mercurius is created by a step below.
          POSTGRES_DB: mercurius_test
        ports:
          # Host 5433 -> container 5432. The host side is NOT free choice: the %test
          # JDBC URL hardcodes localhost:5433.
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U mercurius -d mercurius_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # The Quarkus Web Bundler resolves its JS toolchain from the Node runtime of the
      # machine, and the build job has always relied on the one baked into the
      # ubuntu-latest image rather than a setup-node step or a frontend-maven-plugin
      # (neither exists in app/pom.xml). Same reliance here: augmentation runs during
      # `mvn test` too. This probe only turns a confusing bundler failure into a
      # legible one; it installs nothing.
      - name: Verify Node for the web bundler
        run: node --version

      # `docker exec` against the service container instead of the runner's psql: it
      # needs no client on the host, no password (the official image trusts local
      # socket connections) and no dependency on the port mapping. A stock image
      # creates only POSTGRES_DB, so the app database is created here.
      - name: Create the app database (mercurius)
        run: |
          docker exec "${{ job.services.postgres.id }}" \
            psql -v ON_ERROR_STOP=1 -U mercurius -d mercurius_test \
            -c "CREATE DATABASE mercurius OWNER mercurius;"

      # PostgreSQL 15+ revoked CREATE on schema public from everyone but the owner;
      # the local setup in README needs this GRANT for Hibernate to build the schema.
      # Here mercurius already owns both databases, so it is a no-op kept for parity
      # with the documented setup.
      - name: Grant public schema access on both databases
        run: |
          for db in mercurius mercurius_test; do
            docker exec "${{ job.services.postgres.id }}" \
              psql -v ON_ERROR_STOP=1 -U mercurius -d "$db" \
              -c "GRANT ALL ON SCHEMA public TO mercurius;"
          done

      # Fails in seconds, with a legible error, if the host port mapping or the
      # credentials are wrong - instead of after a full Maven download inside the
      # first Quarkus boot. Uses the host's psql on purpose: localhost:5433 is
      # exactly what the JVM will dial.
      - name: Verify the test datasource is reachable on localhost:5433
        run: |
          PGPASSWORD='Mercurius@1!' psql \
            -h localhost -p 5433 -U mercurius -d mercurius_test \
            -v ON_ERROR_STOP=1 -c "SELECT current_database(), current_user;"

      - name: Test
        run: mvn -B -ntp test

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: surefire-reports
          path: app/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # No dependency scanning existed anywhere in this repo, so a dependency
      # with a published CVE produced a green build indefinitely. This is a
      # gate, not a report: it fails the job on a HIGH/CRITICAL finding.
      #
      # Two things to know when reading a red run here:
      #  # The advisory database is fetched at run time, so the SAME commit can
      #  # go green today and red next week as new CVEs are published. That is
      #  # correct behaviour for an audit, but it means a red dependency-audit is
      #  # not necessarily caused by the change under review.
      #  # nvd-api-key adds rate limit headroom; without it OWASP Dependency-Check
      #  # can hit the NVD API limit and report "unable to check" for some
      #  # dependencies rather than "no vulnerabilities".
      - name: OWASP Dependency-Check (HIGH/CRITICAL gate)
        uses: dependency-check/Dependency-Check_Action@v4
        with:
          project: app/pom.xml
          format: SARIF
          fail-on-severity: HIGH
          output-format: table
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail on HIGH or CRITICAL findings
        run: |
          set -euo pipefail
          REPORT=app/dependency-check-report.json
          if [ ! -f "$REPORT" ]; then
            echo "::error::Dependency-Check produced no report"
            exit 1
          fi
          # Exit non-zero when any HIGH/CRITICAL is present, so the gate does not
          # depend on the action's own fail-on-severity behaviour.
          jq -e '
            [.vulnerabilities // [] | .[]
             | select((.cvssv3BaseScore // 0) >= 7.0
               or ((.cvssv2Score // 0) >= 7.0)
               or ((.cvssv3BaseScore // 0) == 0 and (.cvssv2Score // 0) == 0
                   and ((.severity // "") | ascii_upcase) == "HIGH"))
             | {name, severity, cvssv3BaseScore}] as $bad
            | if ($bad | length) == 0 then 0
              else ($bad[] | "::error::\(.severity) \(.name) (CVSS \(.cvssv3BaseScore))") | ., 1
              end
          ' "$REPORT"

      - name: Upload dependency report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: dependency-check-report
          path: |
            app/dependency-check-report.json
            app/dependency-check-report.sarif
          if-no-files-found: ignore
          retention-days: 14
