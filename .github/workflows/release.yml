name: Release

on:
  push:
    branches: [main, Master, master]
    paths:
      - 'app/**'
      - '.github/workflows/release.yml'
      - '!**/*.md'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Publish uber jar to GitHub Releases
    runs-on: ubuntu-latest
    # Gated on Build (ci.yml) via the two assertions below rather than
    # `needs:`. `needs:` only orders jobs inside ONE workflow run, and this
    # workflow is a separate run, so it cannot express the dependency. The
    # assertions query the Build run for this exact commit and fail the job
    # unless it concluded success. Before this, a release could be packaged
    # (-DskipTests) and published from a commit whose test job never ran or
    # failed, because nothing connected the two workflows.
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Wait for the Build workflow to succeed on this commit
        if: github.event_name == 'workflow_dispatch'
        env:
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A dispatch is not a push, so ci.yml may not have been triggered for
          # this commit. Dispatch it explicitly and wait for the conclusion.
          gh workflow run ci.yml --ref "${GITHUB_REF_NAME}"
          for _ in $(seq 1 60); do
            STATUS=$(gh run list --workflow ci.yml --commit "$SHA" --limit 1 \
                      --json conclusion --jq '.[0].conclusion // "queued"')
            echo "ci.yml status: $STATUS"
            case "$STATUS" in
              success) echo "Build succeeded"; exit 0 ;;
              failure|cancelled|timed_out) echo "::error::Build did not pass; refusing to release"; exit 1 ;;
            esac
            sleep 20
          done
          echo "::error::Timed out waiting for Build on $SHA; refusing to release"
          exit 1

      - name: Assert the last Build run on this commit succeeded
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # On a push/tag, ci.yml is triggered by the same commit. Refuse to
          # release if that run failed, was cancelled, or never happened.
          CONCLUSION=$(gh run list --workflow ci.yml --commit "${{ github.sha }}" --limit 1 \
                        --json conclusion --jq '.[0].conclusion // "none"')
          echo "ci.yml conclusion: $CONCLUSION"
          if [ "$CONCLUSION" != "success" ]; then
            echo "::error::The Build workflow for ${{ github.sha }} concluded '$CONCLUSION'; refusing to release"
            exit 1
          fi

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Resolve version from pom
        id: version
        run: echo "version=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)" >> "$GITHUB_OUTPUT"

      - name: Decide whether to release
        id: decide
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Tag push $GITHUB_REF -> releasing"
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "v$VERSION is already released -> skipping"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "v$VERSION is unreleased -> releasing"
          fi

      - name: Verify tag matches pom version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          expected="v${{ steps.version.outputs.version }}"
          actual="${GITHUB_REF#refs/tags/}"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Tag $actual does not match pom version $expected. Fix the tag or the pom."
            exit 1
          fi

      - name: Create missing tag
        if: steps.decide.outputs.release == 'true' && !startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Package uber jar
        if: steps.decide.outputs.release == 'true'
        run: mvn -B -ntp package -DskipTests

      - name: Stage release artifact
        if: steps.decide.outputs.release == 'true'
        run: cp target/mercurius-quarkus-runner.jar Mercurius-runner.jar

      # Integrity metadata. The release previously published a bare jar with no
      # checksum, so a downloader had no way to tell the artifact from a
      # tampered one. The digest here is over the exact bytes that get uploaded,
      # and the sha256 file is published alongside them.
      - name: Generate checksum for the release artifact
        if: steps.decide.outputs.release == 'true'
        run: sha256sum Mercurius-runner.jar > Mercurius-runner.jar.sha256

      - name: Publish GitHub Release
        if: steps.decide.outputs.release == 'true'
        permissions:
          contents: write
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Mercurius v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            app/Mercurius-runner.jar
            app/Mercurius-runner.jar.sha256
          body: |
            ## Verification

            Verify the downloaded artifact before running it:

            ```
            sha256sum -c Mercurius-runner.jar.sha256
            ```

            This release was published only after the `Build` workflow
            (which runs the full test suite against PostgreSQL) passed on the
            released commit.
